# Cloudflare Pages config — เมื่อมีไฟล์นี้ Cloudflare ใช้ค่าในไฟล์แทนค่าที่ตั้งใน dashboard (bindings + Text vars)
# ANTHROPIC_API_KEY เป็น Secret ใน dashboard เท่านั้น ห้ามใส่ในไฟล์นี้ (repo เป็นสาธารณะ)
# ห้ามเพิ่ม package.json ที่ root — Pages จะรัน npm install ทุก build
