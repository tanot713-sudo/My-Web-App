<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ข้อมูลและการซิงก์ — Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="data-import.js" defer></script>
<script src="drive-backup.js" defer></script>
<script src="data.js" defer></script>
<style>
.imp-key,.dt-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--ome-fs-sm);word-break:break-all}
.imp-pv{font-size:var(--ome-fs-sm);color:var(--ome-text-2);word-break:break-all;margin-top:4px}
.imp-pv span{color:var(--ome-text-3)}
.imp-result.ok,.dt-ok{color:var(--ome-ok-ink)}
.imp-result.err,.dt-err{color:var(--ome-err-ink)}
.dt-status:empty,#dtDriveFiles:empty{display:none}
</style>
</head>
<body data-layout="tool">
<main class="page stack">
  <div class="page-head"><h1>ข้อมูลและการซิงก์</h1></div>

  <section class="card stack" id="dtSync">
    <div class="card-head"><h2>ซิงก์</h2><button type="button" class="btn sm" id="dtSyncNow">ซิงก์ตอนนี้</button></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">สถานะ</div><div class="kpi-value" id="dtState">—</div></div>
      <div class="kpi"><div class="kpi-label">ซิงก์ล่าสุด</div><div class="kpi-value" id="dtLast">—</div></div>
      <div class="kpi"><div class="kpi-label">รอส่ง</div><div class="kpi-value" id="dtPending">—</div></div>
    </div>
    <div class="dt-status" id="dtSyncMsg" role="status"></div>
  </section>

  <section class="card stack">
    <div class="card-head"><h2>สำรองข้อมูล</h2></div>
    <div class="row">
      <button type="button" class="btn primary" id="dtDriveBackup">สำรองขึ้น Google Drive</button>
      <button type="button" class="btn" id="dtDriveList">กู้คืนจาก Google Drive</button>
      <button type="button" class="btn" id="dtDownload">ดาวน์โหลดไฟล์</button>
      <label class="btn" for="dtFile">นำเข้าจากไฟล์</label>
      <input type="file" id="dtFile" accept="application/json,.json" hidden>
      <a class="btn ghost" href="migrate.html">ย้ายข้อมูลจาก github.io</a>
    </div>
    <div class="dt-status" id="dtBackupMsg" role="status"></div>
    <div class="list" id="dtDriveFiles"></div>
  </section>

  <section class="card stack" id="dtPlan" hidden></section>

  <section class="card stack" id="dtHistoryCard" hidden>
    <div class="card-head"><h2>ค่าที่ถูกแทนด้วยข้อมูลจากเครื่องอื่น</h2></div>
    <div class="table-wrap"><table class="table"><tbody id="dtHistory"></tbody></table></div>
  </section>
</main>
</body>
</html>
