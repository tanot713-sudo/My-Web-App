<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางคำนวณ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- Luckysheet (สเปรดชีต) — MIT -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/css/pluginsCss.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/plugins.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/css/luckysheet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/assets/iconfont/iconfont.css">
<style>
/* กรอบหน้า (layout=app): หัว/ไฟล์/ริบบอนอยู่บน กริดเต็มพื้นที่ที่เหลือ — ตัวกริดเป็นของ Luckysheet ไม่แตะ */
.xl-app{overflow-y:auto;overflow-x:hidden}
.xl-top{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--ome-sp-2);padding:var(--ome-sp-3) var(--ome-sp-4) 0}
.xl-head{margin:0;gap:var(--ome-sp-3)}
.xl-head-ic{width:22px;height:22px;color:var(--ome-accent-strong)}
.xl-filebar .btn .ome-icon{width:15px;height:15px}
.xl-sp{flex:1}
.xl-status{display:flex;align-items:center;gap:7px;margin:0;min-height:0;font-weight:600;max-width:100%}
.xl-status.err{color:var(--ome-err-ink)}
.xl-status .spinner{margin-right:0}
.xl-sheetwrap{position:relative;flex:1 1 0;min-height:380px;margin:var(--ome-sp-3) var(--ome-sp-4) var(--ome-sp-4);background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);overflow:hidden;overscroll-behavior:contain}
/* ความสูงกริดกำหนดเป็นพิกเซลจริงผ่าน JS (กันการวาดซ้ำตอนแถบ URL ของ Safari ขยับ); ค่านี้เป็นแค่ fallback */
#luckysheet{width:100%;height:600px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.xl-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--ome-surface-1);color:var(--ome-text-2);z-index:5}
.xl-loading .spinner{width:34px;height:34px;border-width:3px}
.xl-loading.hide{display:none}
/* Luckysheet โหลด .btn แบบ bootstrap (ไม่อยู่ใน layer) มาทับปุ่มกลาง — คืนค่าปุ่มของหน้านี้ให้ตรงกับธีม */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border:1px solid var(--ome-border);
  border-radius:var(--ome-radius-md);background:var(--ome-surface-1);color:var(--ome-text-1);font-size:var(--ome-fs-sm);font-weight:600;line-height:1}
.btn:hover:not(:disabled){background:var(--ome-surface-2);border-color:var(--ome-border-strong);color:var(--ome-text-1)}
.btn.sm{height:30px;padding:0 10px;gap:6px;font-size:var(--ome-fs-xs);border-radius:var(--ome-radius-sm)}
.btn.primary,.btn.primary:hover:not(:disabled){background:var(--ome-accent);border-color:var(--ome-accent);color:var(--ome-on-accent)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb, var(--ome-accent) 86%, var(--ome-text-1))}
/* ── ริบบอนแบบ Excel (ปุ่มจริงของ Luckysheet ที่ย้ายเข้ามา) ── */
.xlr[hidden]{display:none}
.xlr-panels{padding:6px 8px;min-height:50px}
.xlr-panel{display:none;flex-wrap:wrap;align-items:center;gap:3px}
.xlr-panel.on{display:flex}
/* ปุ่ม Luckysheet ที่ย้ายเข้ามา — บังคับให้เรียงในแนวเดียวกัน (ยกเลิก float/absolute ของเดิม) */
.xlr-panel .luckysheet-toolbar-button,.xlr-panel .luckysheet-toolbar-select,.xlr-panel .luckysheet-toolbar-menu-button,
.xlr-panel [class*="luckysheet-toolbar"]{position:relative!important;top:auto!important;left:auto!important;float:none!important;
  display:inline-flex!important;align-items:center;vertical-align:middle;margin:1px 0!important}
.xlr-panel .luckysheet-toolbar-select .luckysheet-toolbar-menu-button-caret{position:static!important}
/* Luckysheet ตั้งสีไอคอน/ตัวหนังสือเป็น #333 ตายตัว → ในโหมดมืดมองไม่เห็นบนพื้นริบบอน ให้ตามสีตัวอักษรของธีม */
.xlr-panel [class*="luckysheet"]{color:var(--ome-text-1)}
[data-theme="dark"] .xlr-panel [class*="luckysheet-toolbar"]:hover{background-color:rgba(255,255,255,.1)}
/* ซ่อนแถบเครื่องมือเดิมของ Luckysheet หลังย้ายปุ่มออกแล้ว (ตั้งใน JS ด้วย เพื่อคงการวัด layout ตอน init) */
.luckysheet-wa-editor.xlr-moved{display:none!important}
/* ช่องพิมพ์ native ซ้อนบนเซลล์ (แก้ปัญหา Luckysheet พิมพ์ไทยตัวหาย) — อยู่บนเซลล์ จึงใช้สีพื้นเดียวกับกริดเสมอ */
#xlCellEditor{position:fixed;z-index:99999;display:none;box-sizing:border-box;margin:0;
  border:2px solid var(--ome-accent);border-radius:2px;padding:1px 4px;
  font-family:'TH Sarabun New','Sarabun','Prompt',sans-serif;font-size:15px;line-height:1.35;
  background:#fff;color:#111;resize:none;outline:none;overflow:hidden;white-space:pre;min-width:82px;
  box-shadow:var(--ome-shadow-2)}
/* ── วิเคราะห์ข้อมูล (Data Insights): สรุปอัตโนมัติ/รวมตัวสะกด/เส้นแนวโน้ม ── */
.di-popover{position:fixed;z-index:99998;background:var(--ome-surface-1);color:var(--ome-text-1);border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);
  box-shadow:var(--ome-shadow-3);padding:14px 16px;display:none;width:320px;max-width:calc(100vw - 24px)}
.di-popover.wide{width:460px}
.di-title{font-size:var(--ome-fs-base);font-weight:700;margin-bottom:10px}
.di-row{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.di-row label{display:flex;flex-direction:column;gap:4px;font-size:var(--ome-fs-xs);color:var(--ome-text-2);font-weight:600}
.di-row select,.di-textarea,.di-fuzzy-canon{font:inherit;font-size:var(--ome-fs-sm);padding:7px 9px;border-radius:var(--ome-radius-sm);
  border:1px solid var(--ome-border);color:var(--ome-text-1);background:var(--ome-surface-1)}
.di-textarea{width:100%;line-height:1.7;resize:vertical;min-height:90px}
.di-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.di-status{font-size:var(--ome-fs-xs);font-weight:600;color:var(--ome-ok-ink);min-height:15px}
.di-status.err{color:var(--ome-err-ink)}
.di-empty{font-size:var(--ome-fs-sm);color:var(--ome-text-2);text-align:center;padding:14px 4px}
.di-group{padding:9px 10px;background:var(--ome-surface-2);border-radius:var(--ome-radius-sm);margin-bottom:8px}
.di-group-values{font-size:var(--ome-fs-xs);margin-bottom:6px}
.di-group-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.di-group-row label{flex-direction:row!important;align-items:center;gap:6px;font-weight:400}
.di-list{max-height:300px;overflow:auto;margin-bottom:8px}
.di-chart-wrap{height:220px;margin:8px 0}
.dialog p{margin:0}
@media (max-width:640px){
  .xl-top{padding:var(--ome-sp-2) 10px 0}
  .xl-sheetwrap{margin:var(--ome-sp-2) 10px var(--ome-sp-3);min-height:420px}
}
</style>
</head>
<body data-layout="app" data-doctitle-key="docTitle">
<main class="page xl-app">
<div class="xl-top">
  <div class="page-head xl-head">
    <svg class="ome-icon xl-head-ic" aria-hidden="true"><use href="icons.svg#i-file-spreadsheet"/></svg>
    <h1 data-i18n="pageTitle">ตารางคำนวณ</h1>
    <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
      <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
    </button>
  </div>

  <div class="toolbar xl-filebar" id="fileBar">
    <button class="btn sm" id="newBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-plus"/></svg><span data-i18n="newBtn">ไฟล์ใหม่</span></button>
    <button class="btn sm" id="importBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-upload"/></svg><span data-i18n="importBtn">นำเข้า Excel/CSV</span></button>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
    <button class="btn sm primary" id="exportXlsxBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-download"/></svg><span data-i18n="exportXlsxBtn">ดาวน์โหลด .xlsx</span></button>
    <button class="btn sm" id="exportCsvBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-down"/></svg><span data-i18n="exportCsvBtn">ดาวน์โหลด .csv</span></button>
    <button class="btn sm" id="printBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-printer"/></svg><span data-i18n="printBtn">พิมพ์ / PDF</span></button>
    <span class="sep"></span>
    <button class="btn sm" id="diFuzzyBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-spell-check"/></svg><span data-i18n="diFuzzyBtn">ตรวจตัวสะกด</span></button>
    <button class="btn sm" id="diSummaryBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-sparkles"/></svg><span data-i18n="diSummaryBtn">สรุปอัตโนมัติ</span></button>
    <button class="btn sm" id="diTrendBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-trending-up"/></svg><span data-i18n="diTrendBtn">เส้นแนวโน้ม</span></button>
    <span class="xl-sp"></span>
    <span class="status xl-status" id="statusMsg" role="status" aria-live="polite"><span data-i18n="autosaveReady">พร้อมใช้งาน</span></span>
  </div>

  <!-- ริบบอนแบบ Excel: ย้ายปุ่มจริงของ Luckysheet มาจัดเป็นแท็บ/กลุ่ม (ปุ่มยังทำงาน + เมนูเด้งถูกที่) -->
  <div class="xlr" id="xlRibbon" hidden>
    <div class="tabs" id="xlrTabs" role="tablist">
      <button class="tab on" type="button" role="tab" data-rtab="home" data-i18n="rHome">หน้าแรก</button>
      <button class="tab" type="button" role="tab" data-rtab="insert" data-i18n="rInsert">แทรก</button>
      <button class="tab" type="button" role="tab" data-rtab="formulas" data-i18n="rFormulas">สูตร</button>
      <button class="tab" type="button" role="tab" data-rtab="data" data-i18n="rData">ข้อมูล</button>
      <button class="tab" type="button" role="tab" data-rtab="view" data-i18n="rView">มุมมอง</button>
    </div>
    <div class="toolbar xlr-panels" id="xlrPanels">
      <div class="xlr-panel on" data-rpanel="home"></div>
      <div class="xlr-panel" data-rpanel="insert"></div>
      <div class="xlr-panel" data-rpanel="formulas"></div>
      <div class="xlr-panel" data-rpanel="data"></div>
      <div class="xlr-panel" data-rpanel="view"></div>
    </div>
  </div>
</div>

<div class="xl-sheetwrap">
  <div id="luckysheet"></div>
  <div class="xl-loading" id="loading">
    <div class="spinner"></div>
    <div data-i18n="loadingSheet">กำลังโหลดตารางคำนวณ…</div>
  </div>
</div>
</main>

<!-- ช่องพิมพ์ของเราเอง (native) วางซ้อนบนเซลล์ตอนแก้ไข — รองรับไทย/ทุกภาษา 100% -->
<textarea id="xlCellEditor" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

<!-- ป็อปอัพกลางของฟีเจอร์ "วิเคราะห์ข้อมูล" (สรุปอัตโนมัติ/ตรวจตัวสะกด/เส้นแนวโน้ม) -->
<div class="di-popover" id="diPopover"></div>

<dialog class="dialog" id="confirmModal" aria-labelledby="confirmTitle">
  <div class="dialog-head"><h2 id="confirmTitle" data-i18n="newBtn">ไฟล์ใหม่</h2></div>
  <div class="dialog-body"><p id="confirmText"></p></div>
  <div class="dialog-foot">
    <button class="btn" id="confirmCancelBtn" type="button" data-i18n="modalCancel">ยกเลิก</button>
    <button class="btn primary" id="confirmOkBtn" type="button" data-i18n="newBtn">ไฟล์ใหม่</button>
  </div>
</dialog>

<!-- ไลบรารี: SheetJS (อ่าน/เขียน .xlsx/.csv), LuckyExcel (แปลง .xlsx→สเปรดชีต), Luckysheet (กริด/สูตร) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- LuckyExcel 1.0.1 vendor ไว้เอง (ไม่ใช้ CDN) แก้บั๊กจริงที่เจอ: ไฟล์ .xlsx ที่เคยผ่านการคัดลอก/วนใช้
     ข้ามไฟล์กันมานาน (พบใน production — สไตล์บางเซลล์อ้างอิง borderId ที่ไม่มีอยู่จริงใน styles.xml ของ
     ไฟล์ เช่นไฟล์ที่เคยผ่านการก็อปข้ามเวิร์กบุ๊กหลายรอบจนมี defined name ตกค้างเป็นหมื่นรายการ) ทำให้
     LuckyExcel เดิม (ต้นทาง) throw exception "Cannot read properties of undefined (reading
     'getInnerElements')" ตอนอ่านสไตล์ขอบเซลล์ ข้าง ๆ ล้มเงียบ ๆ อยู่ใน Promise ที่ไม่มีใครดัก error
     — ฝั่งเว็บเลยติดค้างที่ "กำลังนำเข้าไฟล์…" ตลอดไปไม่มีวันจบ (ดูเหมือนเบราว์เซอร์ค้าง) แก้ที่ต้นตอ
     โดย patch แค่บรรทัดเดียวใน luckyexcel.umd.js: เพิ่มเงื่อนไขเช็คว่า borders[borderIdNum] มีจริงก่อน
     ใช้งาน ถ้าไม่มีก็แค่ข้ามการใส่ขอบเซลล์นั้นไปเฉย ๆ (แทนที่จะพัง) — ทดสอบกับไฟล์จริงที่เจอปัญหาแล้ว
     นำเข้าสำเร็จภายในไม่กี่วินาที -->
<script src="vendor/luckyexcel/luckyexcel.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/plugins/js/plugin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/luckysheet@2.1.13/dist/luckysheet.umd.js"></script>
<!-- Chart.js (กราฟเส้นแนวโน้ม+พยากรณ์ ในฟีเจอร์วิเคราะห์ข้อมูล — แยกจากกราฟของ Luckysheet เอง) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- สร้าง PDF สะอาดเองแบบเดียวกับหน้าเอกสาร (Word) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="excel.js"></script>
</body>
</html>
