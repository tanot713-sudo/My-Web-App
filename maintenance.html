<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึกงานบำรุงรักษา | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- qrcode-generator 2.0.4 (MIT) · jsQR 1.4.0 (Apache-2.0, โหลดตอนสแกนครั้งแรกโดย mnt-qr.js) -->
<script src="vendor/qrcode-generator/qrcode.js" defer></script>
<script src="mnt-calc.js" defer></script>
<script src="mnt-qr.js" defer></script>
<script src="maintenance.js" defer></script>
<style>
.mnt-page{max-width:none}
.mnt-top{flex-shrink:0;padding:var(--ome-sp-4) 16px 0;background:var(--ome-surface-0)}
.mnt-top .page-head{align-items:center;margin-bottom:var(--ome-sp-3)}
.mnt-top .page-head h1{flex:1;margin:0}
.mnt-main{flex:1;min-height:0;overflow:auto;padding:var(--ome-sp-4) 16px calc(var(--ome-sp-6) + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.mnt-wrap{max-width:1080px;margin:0 auto}
.mnt-wrap > * + *{margin-top:var(--ome-sp-4)}
.mnt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mnt-bar .grow{flex:1 1 200px;min-width:0}
.mnt-bar select{width:auto;max-width:100%}
.mnt-filter{display:flex;flex-wrap:wrap;gap:8px}
.mnt-filter select{flex:1 1 120px;min-width:0}
.mnt-list .list-row{cursor:pointer}
.mnt-list .list-row .end{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mnt-list .list-row .pick{width:20px;height:20px;flex-shrink:0;cursor:pointer}
.mnt-list .list-row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.mnt-list .list-row{flex-wrap:wrap}.mnt-list .list-row .end{width:100%;justify-content:flex-start;padding-left:32px}}
.mnt-list .badge:empty{display:none}
.mnt-sub{display:flex;flex-direction:column;gap:var(--ome-sp-3)}
.mnt-sub .list-row{cursor:pointer}
.mnt-dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.mnt-dialog .dialog-body > * + *{margin-top:var(--ome-sp-3)}
.mnt-dialog .check{display:flex;gap:8px;align-items:center;font-size:var(--ome-fs-sm)}
.mnt-dialog .check input{width:auto;height:auto}
.mnt-msg{color:var(--ome-err-ink);font-size:var(--ome-fs-sm)}
.mnt-msg:empty{display:none}
.mnt-items{display:flex;flex-direction:column;gap:8px}
.mnt-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px;border:1px solid var(--ome-border);border-radius:var(--ome-radius-md)}
.mnt-item .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;grid-column:1 / -1}
.mnt-item .row2 input{width:72px}
.mnt-item .row2 input.unit{width:64px}
.mnt-item .acts{display:flex;gap:2px}
.mnt-view{max-width:720px}
.mnt-view .head{display:flex;align-items:center;gap:10px}
.mnt-view .head h2{margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.mnt-qrbox{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.mnt-qrbox .qr{width:132px;height:132px;background:#fff;border-radius:var(--ome-radius-md);padding:6px;flex-shrink:0}
.mnt-qrbox .qr svg{display:block;width:100%;height:100%}
.mnt-scan video{width:100%;max-height:50dvh;background:#000;border-radius:var(--ome-radius-md);object-fit:cover}
.mnt-scan .msg{min-height:1.4em;font-size:var(--ome-fs-sm);color:var(--ome-err-ink)}
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body.printing{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body.printing > *:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  #printArea .pg{display:grid;gap:0;break-after:page;page-break-after:always}
  #printArea .pg:last-child{break-after:auto;page-break-after:auto}
  #printArea .pg.g3x8{grid-template-columns:repeat(3,1fr);grid-auto-rows:35mm}
  #printArea .pg.g2x5{grid-template-columns:repeat(2,1fr);grid-auto-rows:56mm}
  #printArea .lbl{display:flex;align-items:center;gap:3mm;padding:2mm;border:.2mm dashed #999;overflow:hidden;color:#000;background:#fff;break-inside:avoid}
  #printArea .lbl .qr{flex-shrink:0;width:26mm;height:26mm}
  #printArea .g2x5 .lbl .qr{width:40mm;height:40mm}
  #printArea .lbl .qr svg{display:block;width:100%;height:100%}
  #printArea .lbl .tx{min-width:0;font-family:Prompt,sans-serif;line-height:1.25}
  #printArea .lbl .cd{font-size:13pt;font-weight:700;overflow-wrap:anywhere}
  #printArea .g2x5 .lbl .cd{font-size:18pt}
  #printArea .lbl .nm{font-size:9pt}
  #printArea .lbl .st{font-size:8pt;color:#333}
}
</style>
</head>
<body data-layout="app">
<script src="auth-gate.js"></script>
<main class="page mnt-page">
  <div class="mnt-top">
    <div class="page-head">
      <h1>บันทึกงานบำรุงรักษา</h1>
      <span class="badge warn" id="offBadge" hidden>ออฟไลน์</span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <div class="mnt-main" id="main">
    <div class="mnt-wrap" id="listView">
      <section id="tab-assets" role="tabpanel" aria-label="อุปกรณ์">
        <div class="mnt-bar">
          <input id="aSearch" class="input grow" type="search" placeholder="ค้นหา รหัส / ชื่อ / เลขเครื่อง" autocomplete="off" aria-label="ค้นหา">
          <button class="btn primary" type="button" id="aAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>เพิ่มอุปกรณ์</button>
          <button class="btn" type="button" id="aScan"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-scan-line"/></svg>สแกน</button>
          <button class="btn" type="button" id="aPrint"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-qr-code"/></svg>พิมพ์ป้าย QR</button>
        </div>
        <div class="mnt-filter" style="margin-top:var(--ome-sp-3)">
          <select id="fSite" class="select" aria-label="สถานที่"></select>
          <select id="fSystem" class="select" aria-label="ระบบ"></select>
          <select id="fType" class="select" aria-label="ประเภท"></select>
          <select id="fStatus" class="select" aria-label="สถานะ"></select>
        </div>
        <div class="mnt-list" id="aList" style="margin-top:var(--ome-sp-3)"></div>
        <div class="mnt-sub" style="margin-top:var(--ome-sp-4)">
          <details class="disclosure" id="dSites">
            <summary>สถานที่ <span class="badge" id="sCount"></span></summary>
            <div class="disclosure-body">
              <div class="row" style="margin-bottom:var(--ome-sp-3)"><button class="btn sm" type="button" id="sAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>เพิ่มสถานที่</button></div>
              <div id="sList"></div>
            </div>
          </details>
          <details class="disclosure" id="dPlans">
            <summary>แผน PM <span class="badge" id="pCount"></span></summary>
            <div class="disclosure-body">
              <div class="row" style="margin-bottom:var(--ome-sp-3)"><button class="btn sm" type="button" id="pAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>เพิ่มแผน</button></div>
              <div id="pList"></div>
            </div>
          </details>
        </div>
      </section>
      <!-- @tabs: แท็บอื่นเพิ่มตามขั้นงาน -->
    </div>

    <div class="mnt-wrap mnt-view" id="assetView" hidden></div>
  </div>
</main>

<dialog class="dialog mnt-dialog" id="dlgAsset" aria-labelledby="dlgAssetTitle">
  <form method="dialog" id="formAsset" novalidate>
    <div class="dialog-head"><h2 id="dlgAssetTitle">อุปกรณ์</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="eCode">รหัส</label><input id="eCode" type="text" maxlength="60" autocomplete="off"></div>
        <div class="field"><label for="eName">ชื่อ</label><input id="eName" type="text" maxlength="120" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="eType">ประเภท (code)</label><input id="eType" type="text" maxlength="40" list="typeList" autocomplete="off"><datalist id="typeList"></datalist></div>
        <div class="field"><label for="eSystem">ระบบ</label><input id="eSystem" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="eSite">สถานที่</label><select id="eSite"></select></div>
        <div class="field"><label for="eStatus">สถานะ</label><select id="eStatus"><option value="active">ใช้งาน</option><option value="retired">ปลดใช้งาน</option></select></div>
      </div>
      <div class="frow">
        <div class="field"><label for="eSerial">เลขเครื่อง</label><input id="eSerial" type="text" maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="eBrand">ยี่ห้อ</label><input id="eBrand" type="text" maxlength="60" autocomplete="off"></div>
        <div class="field"><label for="eModel">รุ่น</label><input id="eModel" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="eInstalled">วันที่ติดตั้ง</label><input id="eInstalled" type="date"></div>
        <div class="field"><label for="eLat">ละติจูด</label><input id="eLat" type="number" inputmode="decimal" step="any"></div>
        <div class="field"><label for="eLng">ลองจิจูด</label><input id="eLng" type="number" inputmode="decimal" step="any"></div>
        <button class="btn sm" type="button" id="eGeo"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-map-pin"/></svg>ตำแหน่งปัจจุบัน</button>
      </div>
      <div class="frow" id="phaseRow"></div>
      <div class="field"><label for="eNote">บันทึก</label><textarea id="eNote" rows="2" maxlength="500"></textarea></div>
      <p class="mnt-msg" id="eMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="eDel" style="margin-right:auto">ลบ</button>
      <button class="btn" type="button" id="eCancel">ยกเลิก</button>
      <button class="btn primary" type="submit">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog mnt-dialog" id="dlgSite" aria-labelledby="dlgSiteTitle">
  <form method="dialog" id="formSite" novalidate>
    <div class="dialog-head"><h2 id="dlgSiteTitle">สถานที่</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="sName">ชื่อ</label><input id="sName" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="sAbbr">ตัวย่อ</label><input id="sAbbr" type="text" maxlength="12" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="sLat">ละติจูด</label><input id="sLat" type="number" inputmode="decimal" step="any"></div>
        <div class="field"><label for="sLng">ลองจิจูด</label><input id="sLng" type="number" inputmode="decimal" step="any"></div>
      </div>
      <p class="mnt-msg" id="sMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="sDel" style="margin-right:auto">ลบ</button>
      <button class="btn" type="button" id="sCancel">ยกเลิก</button>
      <button class="btn primary" type="submit">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog mnt-dialog" id="dlgPlan" aria-labelledby="dlgPlanTitle">
  <form method="dialog" id="formPlan" novalidate>
    <div class="dialog-head"><h2 id="dlgPlanTitle">แผน PM</h2></div>
    <div class="dialog-body">
      <div class="frow" id="pNewRow">
        <div class="field"><label for="pType">ประเภท (code)</label><input id="pType" type="text" maxlength="40" list="typeList" autocomplete="off"></div>
        <div class="field"><label for="pTypeName">ชื่อประเภท</label><input id="pTypeName" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="pFreq">ความถี่</label><select id="pFreq"></select></div>
      </div>
      <div class="frow">
        <div class="field"><label for="pHours">ชม./รอบ/หน่วย</label><input id="pHours" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="pShift">กะ</label><select id="pShift"><option value="">—</option><option value="D">กลางวัน</option><option value="N">กลางคืน</option></select></div>
      </div>
      <div class="field"><label>รายการตรวจ</label><div class="mnt-items" id="pItems"></div>
        <div class="row"><button class="btn sm" type="button" id="pItemAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>เพิ่มข้อ</button></div></div>
      <p class="mnt-msg" id="pMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="pDel" style="margin-right:auto">ลบ</button>
      <button class="btn" type="button" id="pCancel">ยกเลิก</button>
      <button class="btn primary" type="submit">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog mnt-dialog mnt-scan" id="dlgScan" aria-labelledby="dlgScanTitle">
  <div class="dialog-head"><h2 id="dlgScanTitle">สแกน QR</h2></div>
  <div class="dialog-body">
    <video id="scanVideo" playsinline muted></video>
    <p class="msg" id="scanMsg" role="alert"></p>
    <div class="frow" style="margin-top:var(--ome-sp-3)">
      <div class="field"><label for="scanCode">รหัสอุปกรณ์</label><input id="scanCode" type="text" autocomplete="off"></div>
      <button class="btn" type="button" id="scanGo">เปิด</button>
    </div>
    <div class="row" style="margin-top:var(--ome-sp-3)">
      <button class="btn" type="button" id="scanPhoto"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-camera"/></svg>ถ่ายรูป QR</button>
      <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
    </div>
  </div>
  <div class="dialog-foot"><button class="btn" type="button" id="scanClose">ปิด</button></div>
</dialog>

<div id="printArea" aria-hidden="true"></div>
<div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
