<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สลาก — สถิติย้อนหลัง + ตรวจหวย + สุ่มเลข | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6C63D9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script>window.TANOT_NO_RELOAD_BAR = true;</script>
<script src="shell.js" defer></script>
<style>
.progress-bar{height:8px;border-radius:var(--ome-radius-sm);background:var(--ome-surface-2);overflow:hidden}
.progress-fill{height:100%;background:var(--ome-accent);width:0%;transition:width var(--ome-dur-2)}
.progress-text,.note-box{font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.note-box{color:var(--ome-warn-ink)}
.pos-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.pos-group{background:var(--ome-surface-2);border-radius:var(--ome-radius-md);padding:8px}
.pos-group .pos-label{font-size:var(--ome-fs-xs);color:var(--ome-text-2);font-weight:700;margin-bottom:5px;text-align:center}
.pos-bar-row{display:flex;align-items:center;gap:4px;font-size:10px;margin:2px 0}
.pos-bar-row .d{width:11px;color:var(--ome-text-2);font-weight:700}
.pos-bar-row .bar{flex:1;height:7px;background:var(--ome-border);border-radius:3px;overflow:hidden}
.pos-bar-row .bar i{display:block;height:100%;background:var(--ome-chart-7)}
.pos-bar-row .c{width:18px;text-align:right;color:var(--ome-text-2);font-size:9.5px}
.reels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.reel-digit{width:44px;height:60px;border-radius:var(--ome-radius-lg);background:var(--ome-surface-2);border:2px solid var(--ome-border);
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.reel-digit.spinning{color:var(--ome-text-2)}
.reel-digit.landed{border-color:var(--ome-chart-7);background:var(--ome-accent-soft);transition:border-color var(--ome-dur-3),background var(--ome-dur-3)}
.spin-derived{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.spin-derived .kpi{min-width:110px;text-align:center}
.tabs{margin-bottom:var(--ome-sp-4)}
.tabpanel[hidden]{display:none}
.tier-table td{text-align:left}
/* ช่องในตารางรางวัลไม่หดจนอ่าน/พิมพ์ไม่ได้บนจอแคบ — ตารางเลื่อนแนวนอนใน .table-wrap แทน */
.tier-table .t-label{min-width:10em}
.tier-table .input[type=number]{min-width:6.5em}
.draw-input{width:92px}
</style>
</head>
<body data-layout="tool" data-invest-key="lottery">

<nav class="subnav" id="ivNav"><div class="subnav-sub"><div class="subnav-row" id="ivSubRow"></div></div></nav>

<main class="page">
  <nav class="crumb"><a href="invest.html" data-i18n="navInvest">การลงทุน</a><span>›</span><span id="crumbHere">สลากกินแบ่งรัฐบาล</span></nav>

  <div class="page-head"><h1 id="pageTitleEl">สลากกินแบ่งรัฐบาล — สถิติย้อนหลัง + ตรวจหวย + สุ่มเลข 6 หลัก</h1></div>

  <div class="tabs" id="lotteryTabs"></div>

  <div class="stack tabpanel" id="panelSavings" hidden></div>

  <div class="stack tabpanel" id="panelGovt" hidden>

  <!-- ดึงข้อมูลย้อนหลัง -->
  <div class="card">
    <h2 data-i18n="loadTitle">ดึงข้อมูลย้อนหลัง</h2>
    <div class="frow">
      <div class="field"><label data-i18n="lblWindow">ช่วงย้อนหลัง</label>
        <select id="ltWindow">
          <option value="1" data-i18n="win1m">1 เดือน</option>
          <option value="3" selected data-i18n="win3m">3 เดือน</option>
          <option value="4" data-i18n="win4m">4 เดือน</option>
          <option value="6" data-i18n="win6m">6 เดือน</option>
          <option value="12" data-i18n="win1y">1 ปี</option>
          <option value="60" data-i18n="win5y">5 ปี</option>
          <option value="120" data-i18n="win10y">10 ปี</option>
          <option value="240" data-i18n="win20y">20 ปี</option>
          <option value="360" data-i18n="win30y">30 ปี</option>
        </select></div>
      <button class="btn primary" id="ltLoadBtn" type="button" data-i18n="loadBtn">ดึงข้อมูลย้อนหลัง</button>
      <button class="btn sm" id="ltStopBtn" type="button" hidden><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-square"/></svg><span data-i18n="stopBtn">หยุด</span></button>
      <button class="btn sm" id="ltClearCacheBtn" type="button" data-i18n="clearCacheBtn">ล้างแคช</button>
    </div>
    <div class="progress-wrap" id="ltProgressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="ltProgressFill"></div></div>
      <div class="progress-text" id="ltProgressText"></div>
    </div>
    <div class="note-box" id="ltRangeNote"></div>
  </div>

  <!-- สถิติความถี่ -->
  <div class="card">
    <h2 data-i18n="freqTitle">สถิติความถี่</h2>
    <div class="frow">
      <div class="field"><label data-i18n="lblTier">หมวด</label>
        <select id="ltStatTier">
          <option value="twoDigit" data-i18n="tierTwoDigit">เลขท้าย 2 ตัว</option>
          <option value="threeFirst" data-i18n="tierThreeFirst">เลขหน้า 3 ตัว</option>
          <option value="threeLast" data-i18n="tierThreeLast">เลขท้าย 3 ตัว</option>
          <option value="first" data-i18n="tierFirst">รางวัลที่ 1 (ความถี่รายหลัก)</option>
          <option value="second" data-i18n="tierSecond">รางวัลที่ 2 (ความถี่รายหลัก)</option>
          <option value="third" data-i18n="tierThird">รางวัลที่ 3 (ความถี่รายหลัก)</option>
        </select></div>
    </div>
    <div id="ltStatOut"><div class="log-empty"></div></div>
  </div>

  <!-- ตรวจหวย -->
  <div class="card">
    <h2 data-i18n="checkTitle">ตรวจหวย</h2>
    <div class="frow">
      <div class="field"><label data-i18n="lblTicket">เลขที่ซื้อ (6 หลัก)</label><input type="text" id="ltTicket" maxlength="6" inputmode="numeric" placeholder="เช่น 123456" data-i18n-placeholder="phTicket"></div>
      <button class="btn primary" id="ltCheckBtn" type="button" data-i18n="checkBtn">ตรวจกับงวดล่าสุด</button>
    </div>
    <div id="ltCheckStatus" class="progress-text"></div>
    <div id="ltCheckOut"></div>
  </div>

  <!-- สุ่มเลขไปซื้อ -->
  <div class="card">
    <h2 data-i18n="spinTitle">สุ่มเลขไปซื้อ</h2>
    <div class="reels" id="ltReels">
      <span class="reel-digit">0</span><span class="reel-digit">0</span><span class="reel-digit">0</span>
      <span class="reel-digit">0</span><span class="reel-digit">0</span><span class="reel-digit">0</span>
    </div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="ltSpinBtn" type="button" data-i18n="spinBtn">หมุน</button></div>
    <div class="spin-derived" id="ltSpinDerived" style="display:none">
      <div class="kpi"><div class="kpi-label" data-i18n="lblSpinFull">เลขเต็ม 6 หลัก</div><div class="kpi-value" id="ltSpinFull">—</div></div>
      <div class="kpi"><div class="kpi-label" data-i18n="lblSpinFront">เลขหน้า 3 ตัว</div><div class="kpi-value" id="ltSpinFront">—</div></div>
      <div class="kpi"><div class="kpi-label" data-i18n="lblSpinBack3">เลขท้าย 3 ตัว</div><div class="kpi-value" id="ltSpinBack3">—</div></div>
      <div class="kpi"><div class="kpi-label" data-i18n="lblSpinBack2">เลขท้าย 2 ตัว</div><div class="kpi-value" id="ltSpinBack2">—</div></div>
    </div>
    <div class="frow">
      <div class="field"><label data-i18n="lblBudget">งบซื้อสลากเดือนนี้ (เตือนตัวเอง)</label><input type="number" id="ltBudget" inputmode="numeric" placeholder="เช่น 800" data-i18n-placeholder="phBudget"></div>
    </div>
    <div id="ltSpinHistory"></div>
  </div>

  </div>
</main>

<script src="invest-calc.js" defer></script>
<script src="invest-core.js" defer></script>
<script src="invest-lottery.js" defer></script>
<script src="invest-savings-lottery.js" defer></script>
</body>
</html>
