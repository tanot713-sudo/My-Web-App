<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรียนทำอาหาร | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/crumb/สลับภาษา มาจาก theme.css (data-layout="reader") */
.ck-page{max-width:1160px}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.crumb-row .crumb{margin-bottom:0}
.ck-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.ck-head-icon .ome-icon{width:24px;height:24px}
.ck-page .page-head{margin-bottom:var(--ome-sp-4)}

/* ── แถบเกม: เลเวล/XP/สตรีค/เหรียญตรา ── */
.ck-gamebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:var(--ome-sp-4)}
.ck-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.ck-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ome-accent);color:var(--ome-on-accent);
  font-weight:700;font-size:var(--ome-fs-base);display:flex;align-items:center;justify-content:center}
.ck-level-info{flex:1;min-width:0}
.ck-level-title{font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:4px}
.ck-xp-track{height:6px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.ck-xp-fill{height:100%;width:0;background:var(--ome-accent);border-radius:inherit;transition:width var(--ome-dur-3) var(--ome-ease)}
.ck-streak-chip{display:flex;align-items:center;gap:5px;font-size:var(--ome-fs-base);font-weight:700;color:var(--ome-warn-ink);
  background:var(--ome-warn-soft);padding:6px 12px;border-radius:var(--ome-radius-pill);flex-shrink:0}
.ck-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1px solid var(--ome-border)}
.ck-badge{width:30px;height:30px;border-radius:var(--ome-radius-md);display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--ome-surface-2);border:1px solid var(--ome-border);opacity:.35;filter:grayscale(1);cursor:default}
.ck-badge.earned{opacity:1;filter:none;background:var(--ome-accent-soft);border-color:var(--ome-accent)}
@media(max-width:600px){.ck-gamebar{flex-direction:column;align-items:stretch}
  .ck-level-chip{flex:none}
  .ck-streak-chip{align-self:flex-start}
  .ck-badge-row{justify-content:center;border-left:0;padding-left:0;padding-top:10px;border-top:1px solid var(--ome-border)}}

.ck-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:var(--ome-z-toast);pointer-events:none;max-width:calc(100vw - 40px)}
.ck-toast{background:var(--ome-surface-1);border:1px solid var(--ome-accent);border-radius:var(--ome-radius-md);padding:10px 16px;font-size:var(--ome-fs-sm);
  font-weight:600;box-shadow:var(--ome-shadow-3);display:flex;align-items:center;gap:8px;max-width:280px;animation:ck-toast-in var(--ome-dur-3) var(--ome-ease)}
@keyframes ck-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.ck-toast.leaving{animation:ck-toast-out .3s ease forwards}
@keyframes ck-toast-out{to{transform:translateY(8px);opacity:0}}

.ck-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--ome-card-r);z-index:5}
.ck-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:ck-confetti-fall linear forwards}
@keyframes ck-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.ck-confetti{display:none}.ck-toast{animation:none}}

/* ── เมนูเลือกบทเรียน (แผงเลื่อนลง จัดกลุ่มตามหมวด) ── */
.ck-track-menu{position:relative;margin-bottom:var(--ome-sp-4)}
.ck-track-menu-btn{gap:10px}
.ck-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.ck-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:transform var(--ome-dur-2) var(--ome-ease),opacity var(--ome-dur-2)}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(2){opacity:0}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}
.ck-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:var(--ome-z-popover);min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-3);padding:10px}
.ck-track-menu-panel.open{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.ck-track-group-label{font-size:var(--ome-fs-xs);font-weight:700;letter-spacing:.05em;color:var(--ome-text-2);padding:10px 10px 6px}

/* ── แถบข้างรายการบทเรียน + พื้นที่เนื้อหา ── */
.ck-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.ck-layout{grid-template-columns:1fr}}
@media(min-width:821px){.ck-sidebar{position:sticky;top:calc(var(--ome-nav-h) + 16px);max-height:calc(100vh - var(--ome-nav-h) - 32px);overflow-y:auto}}
.ck-item-list{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.ck-item{gap:8px}
.ck-item .ome-icon{color:var(--ome-text-2)}
.ck-item.active .ome-icon{color:inherit}
.ck-lock-msg{display:none;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:8px}
.ck-main{position:relative;padding:22px}
.ck-item-heading{font-size:var(--ome-fs-lg);font-weight:700;margin-bottom:8px;color:var(--ome-accent-strong)}
.ck-instructions{margin-bottom:14px}
.ck-instructions p{margin:0 0 10px}
.ck-instructions p:last-child{margin-bottom:0}
.ck-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.ck-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:var(--ome-radius-md);font-size:var(--ome-fs-sm);font-weight:600}
.ck-result-banner.pass{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.ck-result-banner.fail{background:var(--ome-warn-soft);color:var(--ome-warn-ink)}
@media(max-width:600px){.ck-main{padding:16px}}

/* ── เฉพาะหน้านี้ ── */
.ck-track-menu{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ck-conv-wrap{position:relative}
.ck-conv-panel{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:var(--ome-z-popover);width:min(360px,calc(100vw - 40px));
  background:var(--ome-surface-1);border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-3);padding:14px}
.ck-conv-panel.open{display:block}
@media(max-width:700px){.ck-conv-wrap{position:static}.ck-conv-panel{left:0;right:0;width:auto}}
.ck-item-heading-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ck-heading-tools{display:flex;gap:8px;flex-wrap:wrap}
.ck-step-nav{display:none;align-items:center;gap:10px;margin:6px 0 14px;padding:10px 12px;background:var(--ome-surface-2);border-radius:var(--ome-radius-md)}
.ck-step-nav .ck-step-of{font-size:var(--ome-fs-sm);font-weight:700;color:var(--ome-accent-strong);flex:1;text-align:center}
/* ไดอะแกรม SVG เคลื่อนไหว — ห้ามใส่ opacity ใน keyframe (ทับ opacity="0.x" ของ presentation attribute) ใช้แค่ transform */
.ck-instructions svg{overflow:visible}
.ck-instructions svg>*{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.ck-instructions svg>:first-child{animation-name:ck-diagram-fade;animation-duration:.5s}
.ck-instructions svg>circle,.ck-instructions svg>rect,.ck-instructions svg>ellipse,
.ck-instructions svg>path,.ck-instructions svg>polygon:not(.ck-arrow-head),
.ck-instructions svg>line:not(.ck-arrow-line){
  animation-name:ck-diagram-pop;animation-duration:.42s;transform-box:fill-box;transform-origin:center}
.ck-instructions svg>text{animation-name:ck-diagram-rise;animation-duration:.42s}
@keyframes ck-diagram-fade{from{transform:scale(.96)}to{transform:scale(1)}}
@keyframes ck-diagram-pop{from{transform:scale(.82)}to{transform:scale(1)}}
@keyframes ck-diagram-rise{from{transform:translateY(5px)}to{transform:translateY(0)}}
@keyframes ck-arrow-draw{to{stroke-dashoffset:0}}
.ck-instructions svg>*:nth-child(1){animation-delay:0s}
.ck-instructions svg>*:nth-child(2){animation-delay:.02s}
.ck-instructions svg>*:nth-child(3){animation-delay:.04s}
.ck-instructions svg>*:nth-child(4){animation-delay:.06s}
.ck-instructions svg>*:nth-child(5){animation-delay:.08s}
.ck-instructions svg>*:nth-child(6){animation-delay:.1s}
.ck-instructions svg>*:nth-child(7){animation-delay:.12s}
.ck-instructions svg>*:nth-child(8){animation-delay:.14s}
.ck-instructions svg>*:nth-child(9){animation-delay:.16s}
.ck-instructions svg>*:nth-child(10){animation-delay:.18s}
.ck-instructions svg>*:nth-child(n+11){animation-delay:.2s}
.ck-instructions svg>.ck-arrow-line{stroke-dasharray:300;stroke-dashoffset:300;
  animation:ck-arrow-draw .5s cubic-bezier(.2,.8,.2,1) both}
.ck-instructions svg>.ck-arrow-head{animation:ck-diagram-fade .22s ease .38s both}
@media (prefers-reduced-motion: reduce){
  .ck-instructions svg>*,.ck-instructions svg>.ck-arrow-line,.ck-instructions svg>.ck-arrow-head{
    animation:none!important;transform:none!important;stroke-dashoffset:0!important}
}
.ck-timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ome-surface-2);border:1px solid var(--ome-accent);
  border-radius:var(--ome-radius-md);padding:10px 14px;margin:10px 0}
.ck-timer-label{font-size:var(--ome-fs-sm);font-weight:700;color:var(--ome-accent-strong);flex:1;min-width:120px}
.ck-timer-display{font-size:18px;font-weight:800;color:var(--ome-text-1);font-variant-numeric:tabular-nums;min-width:56px}
.ck-conv{display:flex;flex-direction:column;gap:10px}
.ck-conv-title{font-size:var(--ome-fs-sm);font-weight:800;color:var(--ome-accent-strong);margin-bottom:2px}
.ck-conv-row{display:flex;align-items:center;gap:var(--ome-sp-2);flex-wrap:wrap;font-size:var(--ome-fs-sm)}
.ck-conv-label{flex:1 1 100%;font-size:var(--ome-fs-sm);color:var(--ome-text-2);font-weight:600}
.ck-conv-input{width:84px}
.ck-conv-select{width:auto;min-width:0}
.ck-conv-eq{font-weight:800;color:var(--ome-text-2)}
.ck-conv-out{font-weight:800;color:var(--ome-accent-strong);min-width:50px;text-align:center}
.ck-conv-unit-fixed{font-weight:700;color:var(--ome-text-2)}
.ck-notes{margin-top:16px}
.ck-notes-label-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ck-notes-label{font-size:var(--ome-fs-sm);font-weight:700;color:var(--ome-text-2)}
.ck-notes-saved{font-size:var(--ome-fs-xs);font-weight:700;color:var(--ome-ok);opacity:0;transition:opacity .3s}
.ck-notes-box{min-height:64px}

/* ── ทำอาหาร stage 2: สูตร/แผนสัปดาห์/รายการซื้อของ (cooking-plan.js) ── */
.cp-tabs{margin-bottom:var(--ome-sp-4)}
.cp-view{display:flex;flex-direction:column;gap:var(--ome-sp-3)}
.cp-view[hidden]{display:none}
.cp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cp-bar .grow{flex:1 1 180px;min-width:0}
.cp-bar .input,.cp-bar .select{min-width:0}
.cp-bar .select{width:auto}
.cp-recipe{gap:12px;padding:10px 12px}
#cpList .list{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
#rPasteBox .field{margin:var(--ome-sp-2) 0}
#rPasteBox .cp-bar{margin-top:var(--ome-sp-2)}
.cp-thumb{width:44px;height:44px;border-radius:var(--ome-radius-md);object-fit:cover;flex-shrink:0;background:var(--ome-surface-2)}
.cp-main{flex:1;min-width:0}
.cp-name{font-weight:600}
.cp-meta{font-size:var(--ome-fs-xs);color:var(--ome-text-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.cp-week{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp-week-label{font-weight:600;min-width:150px;text-align:center}
.cp-grid{width:100%;min-width:560px;border-collapse:collapse}
.cp-grid th,.cp-grid td{padding:8px;border-top:1px solid var(--ome-border);vertical-align:top;text-align:left}
.cp-grid thead th{border-top:0;font-size:var(--ome-fs-xs);color:var(--ome-text-2);font-weight:700}
.cp-grid tbody th{white-space:nowrap;font-size:var(--ome-fs-sm)}
.cp-grid tr.today th{color:var(--ome-accent-strong)}
.cp-grid td{width:28%}
.cp-cell{display:flex;flex-direction:column;gap:var(--ome-sp-2);align-items:flex-start}
.cp-cell .cp-pick{justify-content:flex-start;padding:0 6px;margin-left:-6px;color:var(--ome-text-1);white-space:normal;height:auto;min-height:30px;text-align:left;line-height:1.35}
.cp-cell.done .cp-pick{text-decoration:line-through}
.cp-cell-actions{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:700px){
  /* ตาราง 7 วัน × 3 มื้อ → รายการตามวัน: แต่ละวันเป็นกล่อง หัวข้อวัน + 3 มื้อเรียงลง (ไม่เลื่อนข้าง) */
  .cp-view .table-wrap{border:0;background:transparent;overflow:visible}
  .cp-grid,.cp-grid tbody,.cp-grid tr,.cp-grid th,.cp-grid td{display:block;width:auto;min-width:0}
  .cp-grid thead{display:none}
  .cp-grid tr{margin-bottom:var(--ome-sp-3);border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);background:var(--ome-surface-1);overflow:hidden}
  .cp-grid tbody th{display:flex;align-items:baseline;gap:8px;padding:10px 12px;background:var(--ome-surface-2);border-top:0}
  .cp-grid tbody th .cp-meta{margin-top:0}
  .cp-grid td{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--ome-border)}
  .cp-grid td::before{content:attr(data-meal);font-size:var(--ome-fs-sm);color:var(--ome-text-2);font-weight:600}
  .cp-cell{flex-direction:row;flex-wrap:wrap;align-items:center;gap:var(--ome-sp-2) var(--ome-sp-3)}
  .cp-cell .cp-pick{min-height:40px}
}
.cp-group h3{font-size:var(--ome-fs-sm);margin:0 0 6px;color:var(--ome-text-2)}
.cp-line{display:flex;align-items:center;gap:10px;min-height:48px}
.cp-line input[type=checkbox]{width:20px;height:20px;flex-shrink:0;accent-color:var(--ome-accent)}
.cp-line .cp-name{flex:1;min-width:0}
.cp-line.checked .cp-name{text-decoration:line-through;color:var(--ome-text-2)}
.cp-price{width:96px;text-align:right}
.cp-add{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.cp-add .field{flex:1 1 110px}
.cp-total{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.cp-total strong{font-size:var(--ome-fs-lg)}
.cp-dialog{width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.cp-dialog .dialog-body > * + *{margin-top:var(--ome-sp-3)}
.cp-ing{display:grid;grid-template-columns:minmax(0,2fr) 70px minmax(0,1fr) minmax(0,1fr) auto;gap:var(--ome-sp-2);margin-bottom:var(--ome-sp-2)}
.cp-ing .input,.cp-ing .select{min-width:0}
@media(max-width:520px){.cp-ing{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr) auto}.cp-ing .cp-ing-cat{grid-column:1 / 4}}
.cp-msg{font-size:var(--ome-fs-sm);color:var(--ome-text-2);min-height:1.2em}
.cp-msg.err{color:var(--ome-err-ink)}
.cp-photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cp-photo img{width:72px;height:72px;border-radius:var(--ome-radius-md);object-fit:cover}
</style>
</head>
<body data-layout="reader">
<main class="page ck-page" id="cookingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbCooking">เรียนทำอาหาร</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" data-i18n-skip data-i18n-attr="aria-label:lang.toggle" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head">
  <span class="ck-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-chef-hat"/></svg></span>
  <h1 data-i18n="pageTitle">เรียนทำอาหาร</h1>
</div>

<div id="planTabs" class="cp-tabs"></div>
<div id="planRoot" class="cp-view" hidden></div>

<div id="lessonsView">
<div class="ck-gamebar card" id="gameBar">
  <div class="ck-level-chip">
    <div class="ck-level-num" id="levelNum">1</div>
    <div class="ck-level-info">
      <div class="ck-level-title" id="levelTitleEl">—</div>
      <div class="ck-xp-track"><div class="ck-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="ck-streak-chip" id="streakChip"><span id="streakCount">0</span></div>
  <div class="ck-badge-row" id="badgeRow"></div>
</div>

<div class="ck-track-menu">
  <button class="btn ck-track-menu-btn" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="ck-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="ck-track-menu-panel" id="trackMenuPanel" role="menu"></div>

  <div class="ck-conv-wrap">
    <button class="btn ck-track-menu-btn" id="convBtn" type="button" data-i18n="convBtn">แปลงหน่วยตวง</button>
    <div class="ck-conv-panel" id="convPanel"></div>
  </div>
</div>

<div class="ck-layout">
  <div class="ck-sidebar">
    <div class="ck-lock-msg" id="lockMsg"></div>
    <div class="ck-item-list" id="itemList"></div>
  </div>

  <div class="ck-main card">
    <div class="ck-confetti" id="confettiLayer"></div>
    <div class="ck-item-heading-row">
      <div class="ck-item-heading" id="itemHeading"></div>
      <div class="ck-heading-tools">
        <button class="btn sm ck-tool-btn" id="speakBtn" type="button" data-i18n="speakBtn">อ่านออกเสียง</button>
        <button class="btn sm ck-tool-btn" id="stepModeBtn" type="button" data-i18n="stepModeOn">ดูทีละขั้นตอน</button>
      </div>
    </div>

    <div class="ck-step-nav" id="stepNav">
      <button class="btn sm ck-tool-btn" id="stepPrevBtn" type="button" data-i18n="stepPrev">ก่อนหน้า</button>
      <span class="ck-step-of" id="stepOfEl"></span>
      <button class="btn sm ck-tool-btn" id="stepNextBtn" type="button" data-i18n="stepNext">ถัดไป</button>
    </div>

    <div class="ck-instructions prose" id="instructionsBox"></div>

    <div class="ck-notes">
      <div class="ck-notes-label-row">
        <span class="ck-notes-label" data-i18n="notesLabel">บันทึกของฉัน (เห็นเฉพาะคุณ)</span>
        <span class="ck-notes-saved" id="notesSavedEl"></span>
      </div>
      <textarea class="textarea ck-notes-box" id="notesBox" rows="2"></textarea>
    </div>

    <div class="ck-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="ck-result-banner" id="resultBanner"></div>
  </div>
</div>

</div>

<div class="ck-toast-wrap" id="toastWrap"></div>
</main>

<dialog class="dialog cp-dialog" id="rDlg" aria-labelledby="rDlgTitle">
  <form method="dialog" id="rForm" novalidate>
    <div class="dialog-head"><h2 id="rDlgTitle" data-t="recipe">สูตรอาหาร</h2></div>
    <div class="dialog-body">
      <details class="disclosure" id="rPasteBox">
        <summary data-t="paste">วางสูตรเป็นข้อความ</summary>
        <div class="field"><textarea id="rPaste" rows="6" maxlength="6000"></textarea></div>
        <div class="cp-bar"><button class="btn sm" type="button" id="rParse"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-sparkles"/></svg><span data-t="parse">แยกเป็นวัตถุดิบ/ขั้นตอน</span></button><span class="cp-msg" id="rParseMsg" role="status"></span></div>
      </details>
      <div class="frow">
        <div class="field"><label for="rName" data-t="name">ชื่อเมนู</label><input id="rName" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field" style="flex:0 1 110px"><label for="rServ" data-t="servings">จำนวนที่</label><input id="rServ" type="number" inputmode="numeric" min="1" max="50" step="1"></div>
      </div>
      <div class="field"><label data-t="ingredients">วัตถุดิบ</label><div id="rIngs"></div><div><button class="btn sm" type="button" id="rAddIng">+ <span data-t="addIng">เพิ่มวัตถุดิบ</span></button></div></div>
      <div class="field"><label for="rSteps" data-t="steps">ขั้นตอน (บรรทัดละขั้น)</label><textarea id="rSteps" rows="5" maxlength="8000"></textarea></div>
      <div class="field"><label for="rTags" data-t="tags">แท็ก (คั่นด้วยจุลภาค)</label><input id="rTags" type="text" maxlength="200" autocomplete="off"></div>
      <div class="cp-photo" id="rPhotoRow" hidden>
        <img id="rPhotoImg" alt="" hidden>
        <button class="btn sm" type="button" id="rPhotoBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-camera"/></svg><span data-t="photo">รูป</span></button>
        <button class="btn sm ghost" type="button" id="rPhotoDel" hidden data-t="photoDel">เอารูปออก</button>
        <input type="file" id="rPhotoInput" accept="image/*" hidden>
      </div>
      <p class="cp-msg err" id="rMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="rDel" style="margin-right:auto" data-t="del">ลบ</button>
      <button class="btn" type="button" id="rCancel" data-t="cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" id="rSave" data-t="save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog cp-dialog" id="sDlg" aria-labelledby="sDlgTitle" style="width:min(440px,calc(100vw - 24px))">
  <form method="dialog" id="sForm" novalidate>
    <div class="dialog-head"><h2 id="sDlgTitle"></h2></div>
    <div class="dialog-body">
      <div class="field"><label for="sRecipe" data-t="recipe">สูตรอาหาร</label><select id="sRecipe"></select></div>
      <div class="field"><label for="sServ" data-t="servings">จำนวนที่</label><input id="sServ" type="number" inputmode="numeric" min="1" max="50" step="1"></div>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="sClear" style="margin-right:auto" data-t="clear">ล้างช่อง</button>
      <button class="btn" type="button" id="sCancel" data-t="cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-t="save">บันทึก</button>
    </div>
  </form>
</dialog>
