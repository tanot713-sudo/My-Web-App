<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรียนทำอาหาร | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EA580C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* ══════════════════════════════════════════════════════════════════
   สไตล์ก็อป-แล้วปรับจาก sports.html (.sp-*) ให้สถาปัตยกรรม/ประสบการณ์ผู้ใช้เหมือนกันทั้งเว็บ
   เปลี่ยนโทนสีเป็นส้ม-แดง (ธีมครัว/ไฟ) กับ prefix คลาสเป็น .ck-*
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --ck:var(--ome-brand); --ck-dk:var(--ome-brand-dk); --ck-sf:var(--ome-brand-sf); --ck2:#DC2626;
  --ok:#17B26A; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto}

.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 0;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--ck);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}
.lang-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--line);border:none;border-radius:20px;
  padding:3px;cursor:pointer;font-family:var(--f);flex-shrink:0}
.lang-toggle span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;color:var(--muted);transition:.15s}
.lang-toggle span.active{background:var(--card);color:var(--ck-dk);box-shadow:0 1px 3px rgba(24,31,54,.08)}

.ck-head{display:flex;align-items:flex-start;gap:16px;margin-top:16px}
.ck-head-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--ck),var(--ck2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(234,88,12,.35);
  animation:ck-icon-glow 3.5s ease-in-out infinite;font-size:26px}
@keyframes ck-icon-glow{0%,100%{box-shadow:0 8px 22px rgba(234,88,12,.35)}50%{box-shadow:0 8px 26px rgba(220,38,38,.4)}}
.ck-head h1{font-size:clamp(21px,3.6vw,28px);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),var(--ck-dk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}

.ck-gamebar{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(24,31,54,.05);flex-wrap:wrap}
.ck-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.ck-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--ck),var(--ck2));
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(234,88,12,.3)}
.ck-level-info{flex:1;min-width:0}
.ck-level-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.ck-xp-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.ck-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--ck),var(--ck2));border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.ck-streak-chip{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:#B45309;background:#FFF3E0;
  padding:6px 12px;border-radius:20px;flex-shrink:0}
[data-theme="dark"] .ck-streak-chip{background:#3A2C10;color:#F5C36B}
.ck-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1.5px solid var(--line)}
.ck-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--bg);border:1.5px solid var(--line);opacity:.35;filter:grayscale(1);transition:.2s;cursor:default}
.ck-badge.earned{opacity:1;filter:none;background:linear-gradient(135deg,var(--ck-sf),var(--card));border-color:var(--ck);
  box-shadow:0 2px 6px rgba(234,88,12,.2)}
@media(max-width:600px){.ck-gamebar{flex-direction:column;align-items:stretch}
  .ck-badge-row{justify-content:center;border-left:none;padding-left:0;padding-top:10px;border-top:1.5px solid var(--line)}}

.ck-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}
.ck-toast{background:var(--card);border:1.5px solid var(--ck);border-radius:12px;padding:10px 16px;font-size:13.5px;
  font-weight:700;color:var(--ink);box-shadow:0 8px 24px rgba(24,31,54,.16);display:flex;align-items:center;gap:8px;
  animation:ck-toast-in .35s cubic-bezier(.2,.8,.2,1);max-width:280px}
@keyframes ck-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.ck-toast.leaving{animation:ck-toast-out .3s ease forwards}
@keyframes ck-toast-out{to{transform:translateY(8px);opacity:0}}

.ck-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--r);z-index:5}
.ck-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:ck-confetti-fall linear forwards}
@keyframes ck-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}

.ck-track-menu{position:relative;margin-top:22px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ck-track-menu-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f);font-size:13.5px;font-weight:700;
  padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  cursor:pointer;transition:.18s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(24,31,54,.05)}
.ck-track-menu-btn:hover{border-color:var(--ck);color:var(--ck-dk);box-shadow:0 6px 14px rgba(234,88,12,.14)}
.ck-track-menu-btn.open{border-color:var(--ck);background:linear-gradient(135deg,var(--ck-sf),var(--card));color:var(--ck-dk)}
.ck-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.ck-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:.25s cubic-bezier(.2,.8,.2,1)}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(2){opacity:0}
.ck-track-menu-btn.open .ck-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}

.ck-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,31,54,.16);padding:10px}
.ck-track-menu-panel.open{display:block;animation:ck-panel-in .18s cubic-bezier(.2,.8,.2,1)}
@keyframes ck-panel-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ck-track-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:10px 10px 6px}
.ck-track-menu-item{display:block;width:100%;text-align:left;font-family:var(--f);font-size:13.5px;font-weight:600;
  padding:9px 12px;border:none;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;transition:.15s}
.ck-track-menu-item:hover{background:var(--ck-sf);color:var(--ck-dk)}
.ck-track-menu-item.active{background:linear-gradient(135deg,var(--ck),var(--ck2));color:#fff;font-weight:700}

/* ปุ่มตัวแปลงหน่วยตวง — เปิดแผงลอย ใช้ได้จากทุกบทเรียนไม่ผูกกับ item ใดข้อหนึ่ง */
.ck-conv-wrap{position:relative}
.ck-conv-panel{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:60;width:min(360px,calc(100vw - 40px));
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,31,54,.16);padding:14px}
.ck-conv-panel.open{display:block;animation:ck-panel-in .18s cubic-bezier(.2,.8,.2,1)}

.ck-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:820px){.ck-layout{grid-template-columns:1fr}}
@media(min-width:821px){.ck-sidebar{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}}

.ck-item-list{display:flex;flex-direction:column;gap:6px}
.ck-item{display:flex;align-items:center;gap:8px;font-family:var(--f);text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink);
  transition:.18s cubic-bezier(.2,.8,.2,1)}
.ck-item:hover{border-color:var(--ck);transform:translateX(3px);box-shadow:0 4px 10px rgba(234,88,12,.1)}
.ck-item.active{border-color:transparent;background:linear-gradient(135deg,var(--ck-sf),var(--card));
  color:var(--ck-dk);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ck)}
.ck-item.locked{opacity:.55;cursor:not-allowed}
.ck-item.locked:hover{border-color:var(--line);transform:none;box-shadow:none}
.ck-lock-msg{display:none;background:#FFF3E0;color:#9A5A00;border-radius:10px;padding:8px 12px;font-size:12.5px;
  font-weight:600;margin-bottom:8px}
[data-theme="dark"] .ck-lock-msg{background:#3A2C10;color:#F5C36B}

.ck-main{background:var(--card);border-radius:var(--r);box-shadow:0 4px 10px rgba(24,31,54,.06),0 16px 32px rgba(234,88,12,.1);
  padding:22px;position:relative}
.ck-item-heading-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ck-item-heading{font-size:17px;font-weight:800;color:var(--ck-dk)}
.ck-heading-tools{display:flex;gap:8px;flex-wrap:wrap}
.ck-tool-btn{font-family:var(--f);font-size:12px;font-weight:700;padding:6px 12px;border:1.5px solid var(--line);
  border-radius:20px;cursor:pointer;background:var(--card);color:var(--ink);transition:.15s}
.ck-tool-btn:hover{border-color:var(--ck);color:var(--ck-dk)}
.ck-instructions{font-size:13.5px;color:var(--ink);line-height:1.8;margin-bottom:14px}
.ck-instructions p{margin-bottom:10px}
.ck-instructions p:last-child{margin-bottom:0}

.ck-step-nav{display:none;align-items:center;gap:10px;margin:6px 0 14px;padding:10px 12px;background:var(--ck-sf);border-radius:10px}
.ck-step-nav .ck-step-of{font-size:12.5px;font-weight:700;color:var(--ck-dk);flex:1;text-align:center}

/* ไดอะแกรม SVG เคลื่อนไหวตอนเปิดบทเรียน — เหมือนกฎที่ใช้ใน sports.html เป๊ะ (ดูหมายเหตุที่นั่น) */
.ck-instructions svg{overflow:visible}
.ck-instructions svg>*{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.ck-instructions svg>:first-child{animation-name:ck-diagram-fade;animation-duration:.5s}
.ck-instructions svg>circle,.ck-instructions svg>rect,.ck-instructions svg>ellipse,
.ck-instructions svg>path,.ck-instructions svg>polygon:not(.ck-arrow-head),
.ck-instructions svg>line:not(.ck-arrow-line){
  animation-name:ck-diagram-pop;animation-duration:.42s;transform-box:fill-box;transform-origin:center}
/* หมายเหตุ: ห้ามใส่ svg>g ในกฎ pop ด้านบนเด็ดขาด — ถ้าไดอะแกรมใช้ <g transform="translate(...)">
   วางตำแหน่งไอคอน (เช่น buildEquipmentIconsSvg) อนิเมชัน CSS ที่ตั้งค่า transform จะไปทับ/ลบ
   translate() ที่ตั้งใจไว้ทิ้งหมด ทำให้ทุกไอคอนไปกองซ้อนกันที่จุดเดียว (0,0) แทนที่จะกระจายแถว
   เจอบั๊กนี้ตอนทดสอบจริง — g ที่ใช้ SMIL animateTransform ของตัวเอง (เช่น มีดใน
   buildRockChopAnimSvg) ก็ไม่ควรให้ CSS animation มาแย่งคุม transform ซ้อนกันด้วยเหตุผลเดียวกัน */
.ck-instructions svg>text{animation-name:ck-diagram-rise;animation-duration:.42s}
@keyframes ck-diagram-fade{from{transform:scale(.96)}to{transform:scale(1)}}
@keyframes ck-diagram-pop{from{transform:scale(.82)}to{transform:scale(1)}}
@keyframes ck-diagram-rise{from{transform:translateY(5px)}to{transform:translateY(0)}}
@keyframes ck-arrow-draw{to{stroke-dashoffset:0}}
.ck-instructions svg>*:nth-child(1){animation-delay:0s}
.ck-instructions svg>*:nth-child(2){animation-delay:.02s}
.ck-instructions svg>*:nth-child(3){animation-delay:.04s}
.ck-instructions svg>*:nth-child(4){animation-delay:.06s}
.ck-instructions svg>*:nth-child(5){animation-delay:.08s}
.ck-instructions svg>*:nth-child(6){animation-delay:.1s}
.ck-instructions svg>*:nth-child(7){animation-delay:.12s}
.ck-instructions svg>*:nth-child(8){animation-delay:.14s}
.ck-instructions svg>*:nth-child(9){animation-delay:.16s}
.ck-instructions svg>*:nth-child(10){animation-delay:.18s}
.ck-instructions svg>*:nth-child(n+11){animation-delay:.2s}
.ck-instructions svg>.ck-arrow-line{stroke-dasharray:300;stroke-dashoffset:300;
  animation:ck-arrow-draw .5s cubic-bezier(.2,.8,.2,1) both}
.ck-instructions svg>.ck-arrow-head{animation:ck-diagram-fade .22s ease .38s both}
@media (prefers-reduced-motion: reduce){
  .ck-instructions svg>*,.ck-instructions svg>.ck-arrow-line,.ck-instructions svg>.ck-arrow-head{
    animation:none!important;transform:none!important;stroke-dashoffset:0!important}
}

/* ตัวจับเวลาที่ฝังในเนื้อหาบทเรียน */
.ck-timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ck-sf);border:1.5px solid var(--ck);
  border-radius:12px;padding:10px 14px;margin:10px 0}
.ck-timer-label{font-size:13px;font-weight:700;color:var(--ck-dk);flex:1;min-width:120px}
.ck-timer-display{font-size:18px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;min-width:56px}
.ck-timer-btn{font-family:var(--f);font-size:12px;font-weight:700;padding:6px 12px;border:1.5px solid var(--ck);
  border-radius:8px;cursor:pointer;background:var(--card);color:var(--ck-dk)}
.ck-timer-btn:hover{background:var(--ck);color:#fff}

/* ตัวแปลงหน่วยตวง (ใช้ทั้งแบบฝังในบทเรียนสุดท้าย และแบบแผงลอยจากปุ่มบนหัว) */
.ck-conv{display:flex;flex-direction:column;gap:10px}
.ck-conv-title{font-size:13.5px;font-weight:800;color:var(--ck-dk);margin-bottom:2px}
.ck-conv-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
.ck-conv-label{flex:1 1 100%;font-size:11.5px;color:var(--muted);font-weight:600}
.ck-conv-input{width:64px;font-family:var(--f);font-size:13px;padding:5px 7px;border:1.5px solid var(--line);border-radius:7px}
.ck-conv-select{font-family:var(--f);font-size:12px;padding:5px 4px;border:1.5px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.ck-conv-eq{font-weight:800;color:var(--muted)}
.ck-conv-out{font-weight:800;color:var(--ck-dk);min-width:50px;text-align:center}
.ck-conv-unit-fixed{font-weight:700;color:var(--muted)}

/* บันทึกส่วนตัว */
.ck-notes{margin-top:16px}
.ck-notes-label-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ck-notes-label{font-size:12.5px;font-weight:700;color:var(--muted)}
.ck-notes-saved{font-size:11.5px;font-weight:700;color:var(--ok);opacity:0;transition:opacity .3s}
.ck-notes-box{width:100%;min-height:64px;font-family:var(--f);font-size:13px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.ck-notes-box:focus{outline:none;border-color:var(--ck)}

.ck-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:14px;font-weight:600;padding:10px 18px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.btn:hover:not(:disabled){border-color:var(--ck);color:var(--ck-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(234,88,12,.14)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--ck),var(--ck2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(234,88,12,.32)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}

.ck-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:700}
.ck-result-banner.pass{background:#E7F9F0;color:#0F7A4E}
[data-theme="dark"] .ck-result-banner.pass{background:#12301F;color:#5EDCA0}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.ck-main{padding:16px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap" id="cookingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="documents.html" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbCooking">เรียนทำอาหาร</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="ck-head">
  <div class="ck-head-icon"></div>
  <div>
    <h1 data-i18n="pageTitle">เรียนทำอาหาร</h1>
  </div>
</div>

<div class="ck-gamebar" id="gameBar">
  <div class="ck-level-chip">
    <div class="ck-level-num" id="levelNum">1</div>
    <div class="ck-level-info">
      <div class="ck-level-title" id="levelTitleEl">—</div>
      <div class="ck-xp-track"><div class="ck-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="ck-streak-chip" id="streakChip"><span id="streakCount">0</span></div>
  <div class="ck-badge-row" id="badgeRow"></div>
</div>

<div class="ck-track-menu">
  <button class="ck-track-menu-btn" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="ck-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="ck-track-menu-panel" id="trackMenuPanel" role="menu"></div>

  <div class="ck-conv-wrap">
    <button class="ck-track-menu-btn" id="convBtn" type="button" data-i18n="convBtn">แปลงหน่วยตวง</button>
    <div class="ck-conv-panel" id="convPanel"></div>
  </div>
</div>

<div class="ck-layout">
  <div class="ck-sidebar">
    <div class="ck-lock-msg" id="lockMsg"></div>
    <div class="ck-item-list" id="itemList"></div>
  </div>

  <div class="ck-main">
    <div class="ck-confetti" id="confettiLayer"></div>
    <div class="ck-item-heading-row">
      <div class="ck-item-heading" id="itemHeading"></div>
      <div class="ck-heading-tools">
        <button class="ck-tool-btn" id="speakBtn" type="button" data-i18n="speakBtn">อ่านออกเสียง</button>
        <button class="ck-tool-btn" id="stepModeBtn" type="button" data-i18n="stepModeOn">ดูทีละขั้นตอน</button>
      </div>
    </div>

    <div class="ck-step-nav" id="stepNav">
      <button class="ck-tool-btn" id="stepPrevBtn" type="button" data-i18n="stepPrev">ก่อนหน้า</button>
      <span class="ck-step-of" id="stepOfEl"></span>
      <button class="ck-tool-btn" id="stepNextBtn" type="button" data-i18n="stepNext">ถัดไป</button>
    </div>

    <div class="ck-instructions" id="instructionsBox"></div>

    <div class="ck-notes">
      <div class="ck-notes-label-row">
        <span class="ck-notes-label" data-i18n="notesLabel">บันทึกของฉัน (เห็นเฉพาะคุณ)</span>
        <span class="ck-notes-saved" id="notesSavedEl"></span>
      </div>
      <textarea class="ck-notes-box" id="notesBox" rows="2"></textarea>
    </div>

    <div class="ck-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="ck-result-banner" id="resultBanner"></div>
  </div>
</div>

<div class="ck-toast-wrap" id="toastWrap"></div>
</div>
<script src="cooking.js"></script>
</body>
</html>
