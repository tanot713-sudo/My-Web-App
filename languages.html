        function mergeNotes(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const na = a && a[k], nb = b && b[k];
                if (!na) { out[k] = nb; return; }
                if (!nb) { out[k] = na; return; }
                out[k] = (na.updatedAt || 0) >= (nb.updatedAt || 0) ? na : nb;
            });
            return out;
        }

        // ── ตรวจคำตอบแบบใกล้เคียง (ไม่ต้องพิมพ์ตรง 100%) ───────────────────────
        function normalizeAnswer(s) {
            return String(s || '').toLowerCase().trim()
                .replace(/[.,!?;:'"“”‘’、。？！ๆ]/g, '')
                .replace(/\s+/g, ' ');
        }
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[n];
        }
        function gradeAnswer(typed, target) {
            const a = normalizeAnswer(typed), b = normalizeAnswer(target);
            if (!a) return 'wrong';
            if (a === b) return 'correct';
            const sim = 1 - levenshtein(a, b) / Math.max(a.length, b.length);
            return sim >= 0.9 ? 'correct' : sim >= 0.7 ? 'almost' : 'wrong';
        }

        // ── คิวคำที่ตอบผิด (โผล่บนหน้าสตรีมให้กลับมาฝึกซ้ำ) ─────────────────────

        function mergeWrong(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.count || 0) >= (vb.count || 0) ? va : vb);
            });
            return out;
        }

        // ── ระบบทวนคำศัพท์แบบเว้นช่วงเวลา (FSRS) — คัดลอกมาจาก classroom-law.js (คำนวณตรงตามต้นฉบับ
        // ทุกจุด ไม่ปรับ logic) เอนจินตัวเดียวกับที่ใช้ทวนหัวข้อ/มาตราวิชานิติกรรมสัญญาอยู่แล้ว ใช้สูตร
        // ความจำจริง R(t,S) = (1+t/(9S))⁻¹ ที่เป้าหมายการจำ 90% ทำให้ interval ทวนครั้งถัดไป = stability
        // พอดี (ดูอนุพันธ์เต็มได้ในคอมเมนต์ classroom-law.js) ─────────────────────────────────
        const DAY_MS = 86400000;
        function fsrsRetrievability(elapsedDays, stability) {
            if (!stability || stability <= 0) return 0;
            return Math.pow(1 + elapsedDays / (9 * stability), -1);
        }
        function fsrsSchedule(n, rating) { // rating: 1=Again 2=Hard 3=Good 4=Easy
            const now = Date.now();
            let difficulty = n.difficulty == null ? 5 : n.difficulty;
            let stability = n.stability;
            if (stability == null) {
                const initStability = { 1: 0.5, 2: 1, 3: 3, 4: 7 };
                stability = initStability[rating];
                difficulty = 5 - (rating - 3);
            } else {
                const elapsedDays = Math.max((now - (n.lastReview || now)) / DAY_MS, 0);
                const r = fsrsRetrievability(elapsedDays, stability);
                if (rating === 1) {
                    stability = Math.max(stability * 0.5 * (1 - difficulty / 20), 0.5);
                    difficulty += 1;
                } else {
                    const ratingMul = { 2: 0.5, 3: 1, 4: 1.6 }[rating];
                    const growth = 1 + ((11 - difficulty) / 10) * (1 - r) * ratingMul;
                    stability = stability * Math.max(growth, 1.05);
                    difficulty += (rating - 3) * -0.5;
                }
            }
            difficulty = Math.min(Math.max(difficulty, 1), 10);
            const FSRS_RETENTION = 0.9;
            const intervalDays = 9 * stability * (1 / FSRS_RETENTION - 1); // = stability พอดีที่เป้าหมาย 90%
            return {
                stability, difficulty,
                reps: (n.reps || 0) + (rating > 1 ? 1 : 0), lapses: (n.lapses || 0) + (rating === 1 ? 1 : 0),
                lastReview: now, dueAt: now + Math.max(intervalDays, 1 / 24) * DAY_MS,
                srsIdx: rating === 1 ? -1 : (n.srsIdx || 0) + 1,
            };
        }

        // ── สโตร์การ์ดทวนคำศัพท์ (คีย์รูปแบบเดียวกับ wrongKey: `${langId}::${cat}::${idx}` — ภาษาจีน
        // ใช้ `lang-cn::script::${i}` ผูกกับ ZH_SCRIPT.characters[i] แทน) ─────────────────────
        function loadSrs() {
            try { return JSON.parse(localStorage.getItem('lang-practice:srs') || '{}'); } catch { return {}; }
        }
        function saveSrs(v) { localStorage.setItem('lang-practice:srs', JSON.stringify(v)); }
        function mergeSrs(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.lastReview || 0) >= (vb.lastReview || 0) ? va : vb);
            });
            return out;
        }
        // รวมคำศัพท์ทุกคำของภาษาหนึ่งเป็นก้อนเดียว (จาก VOCAB ปกติ หรือ ZH_SCRIPT ถ้าเป็นภาษาจีน)
        // พร้อมคีย์ SRS ของแต่ละคำ ใช้เป็นแหล่งข้อมูลกลางให้ทั้งโหมดฝึกเขียนตัวอักษร/dictation/แต่งประโยค
        function vocabPool(langId) {
            if (langId === 'lang-cn') {
                const script = ZH_SCRIPT.characters.map((c, i) => ({ key: `lang-cn::script::${i}`, word: c.char, thai: c.meaningTh, extra: c }));
                // คำศัพท์ HSK1-3 ใช้ field shape เดียวกับ ZH_SCRIPT.characters (char/pinyin/meaningTh/set) —
                // ทำให้เข้าไปอยู่ใน pool เดียวกันได้เลย ไม่ต้องแก้ ScriptPanel/SrsDictationPanel/SrsComposePanel
                // แม้บางคำจะมีหลายตัวอักษร (เช่น 你好/出租车) ก็ใช้ได้ปกติ — StrokeOrderDiagram แยกวาดทีละตัวอักษรเอง
                const hsk = [];
                ['1', '2', '3'].forEach(lvl => {
                    (HSK_VOCAB[`hsk${lvl}`] || []).forEach((w, i) => {
                        hsk.push({
                            key: `lang-cn::hsk${lvl}::${i}`, word: w.word, thai: w.thai,
                            extra: { char: w.word, pinyin: w.pinyin, meaningTh: w.thai, set: `HSK${lvl}` },
                        });
                    });
                });
                return script.concat(hsk);
            }
            const out = [];
            const cats = VOCAB[langId] || {};
            Object.keys(cats).forEach(cat => {
                (cats[cat] || []).forEach((w, i) => out.push({ key: `${langId}::vocab-${cat}::${i}`, word: w.word, thai: w.thai }));
            });
            return out;
        }
        function dueVocab(langId, srs) {
            const now = Date.now();
            return vocabPool(langId).filter(item => {
                const rec = srs[item.key];
                return !rec || (rec.dueAt || 0) <= now;
            });
        }

        // ══════════════════════════════════════════════════════════════════════════════════
        // ข้อสอบ HSK (จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ HSK 2.0 ทางการจริง (ตรวจสอบผ่านเว็บ
        // แล้ว ไม่ได้เดาเอง): HSK1 = ฟัง 20 + อ่าน 20 (รวม 40, ผ่าน 120/200 = 60%),
        // HSK2 = ฟัง 35 + อ่าน 25 (รวม 60, ผ่าน 120/200 = 60%),
        // HSK3 = ฟัง 40 + อ่าน 30 + เขียน 10 (รวม 80, ผ่าน 180/300 = 60% — เกณฑ์ผ่านทุกระดับเท่ากับ 60%)
        // ข้อจำกัดที่ตั้งใจปรับ: ข้อสอบจริงมีข้อแบบ "ฟัง/อ่านแล้วจับคู่รูปภาพ" อยู่หลายข้อ แต่เว็บนี้ไม่มี
        // คลังรูปภาพ จึงแทนที่ด้วยข้อแบบจับคู่ความหมายไทยแทน (ทดสอบทักษะเดียวกันคือฟัง/อ่านแล้วเข้าใจ
        // ความหมาย) — และเป็นเนื้อหาที่สร้างจากคลังคำศัพท์ HSK ของเว็บเอง ไม่ใช่ข้อสอบจริงที่หลุดออกมา
        // ══════════════════════════════════════════════════════════════════════════════════
        function shuffleArr(arr) { return [...arr].sort(() => Math.random() - 0.5); }

        // ประโยคง่ายๆ สำหรับข้อ "เรียงคำ" (完成句子) ในส่วนเขียนของ HSK3 — คิด/ตรวจไวยากรณ์เองทุกประโยค
        // ให้ถูกต้องแน่นอน (ไม่ได้ดึงจากที่ไหน) แบ่งเป็นชิ้นคำที่มีความหมายชัดเจน ไม่ใช่ตัวอักษรเดี่ยวๆ
        const HSK_WRITE_SENTENCES = [
            { chunks: ['我', '喜欢', '学习', '中文。'], thai: 'ฉันชอบเรียนภาษาจีน' },
            { chunks: ['他', '每天', '去', '学校。'], thai: 'เขาไปโรงเรียนทุกวัน' },
            { chunks: ['这个苹果', '很', '好吃。'], thai: 'แอปเปิลลูกนี้อร่อยมาก' },
            { chunks: ['我朋友', '住在', '北京。'], thai: 'เพื่อนของฉันอาศัยอยู่ที่ปักกิ่ง' },
            { chunks: ['你', '今天', '忙不忙？'], thai: 'วันนี้คุณยุ่งไหม' },
            { chunks: ['我们', '一起', '去看电影吧。'], thai: 'พวกเราไปดูหนังด้วยกันเถอะ' },
            { chunks: ['她', '在图书馆', '看书。'], thai: 'เธออ่านหนังสือที่ห้องสมุด' },
            { chunks: ['现在', '几点', '了？'], thai: 'ตอนนี้กี่โมงแล้ว' },
            { chunks: ['我', '想', '喝一杯咖啡。'], thai: 'ฉันอยากดื่มกาแฟสักแก้ว' },
            { chunks: ['他', '会说', '三种语言。'], thai: 'เขาพูดได้สามภาษา' },
            { chunks: ['外面', '正在', '下雨。'], thai: 'ข้างนอกกำลังฝนตก' },
            { chunks: ['请', '把门', '关上。'], thai: 'กรุณาปิดประตูด้วย' },
        ];

        // ── ตัวสร้างโจทย์แต่ละแบบ (แต่ละแบบคืน array ของ question object ที่มี field `type` กำกับ
        //    ไว้ให้ตัว renderer เลือก UI ให้ถูก) ─────────────────────────────────────────────
        function genMcFromWord(pool, count, type) {
            // type: 'listen-mc' (ฟังเสียงแล้วเลือกความหมาย) หรือ 'read-mc' (อ่านคำแล้วเลือกความหมาย)
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.word !== item.word)).slice(0, 3);
                const choices = shuffleArr([item.thai, ...distractors.map(d => d.thai)]);
                return { type, word: item.word, pinyin: item.pinyin, correct: item.thai, choices };
            });
        }
        function genMcReverse(pool, count) {
            // 'read-mc-reverse' — โชว์ความหมายไทย ให้เลือกคำจีนที่ถูกต้อง (ฝึกจำอีกทิศทาง)
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.word !== item.word)).slice(0, 3);
                const choices = shuffleArr([item.word, ...distractors.map(d => d.word)]);
                return { type: 'read-mc-reverse', thai: item.thai, pinyin: item.pinyin, correct: item.word, choices };
            });
        }
        function genTf(pool, count, type) {
            // type: 'listen-tf' หรือ 'read-tf' — ครึ่งหนึ่งโชว์ความหมายถูก ครึ่งหนึ่งโชว์ความหมายของคำอื่น
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map((item, i) => {
                const showCorrect = i % 2 === 0;
                let shownThai = item.thai;
                if (!showCorrect) {
                    const others = pool.filter(p => p.word !== item.word);
                    shownThai = others[Math.floor(Math.random() * others.length)].thai;
                }
                return { type, word: item.word, pinyin: item.pinyin, shownThai, answer: showCorrect };
            });
        }
        function genWriteOrder(count) {
            const picked = shuffleArr(HSK_WRITE_SENTENCES).slice(0, Math.min(count, HSK_WRITE_SENTENCES.length));
            return picked.map(s => ({ type: 'write-order', chunks: s.chunks, thai: s.thai, scrambled: shuffleArr(s.chunks) }));
        }
        function genWritePinyinChar(pool, count) {
            // 看拼音写汉字 (แบบย่อ: ให้พินอิน+ความหมายไทย เลือกตัวอักษรจีนที่ถูกต้องจาก 4 ตัวเลือก
            // แทนการเขียนจริง — ผู้เรียนที่อยากฝึกเขียนจริงมีปุ่ม "ลองเขียนเอง" แยกในหน้าฝึกเขียนอยู่แล้ว)
            return genMcReverse(pool, count).map(q => ({ ...q, type: 'write-pinyin-char' }));
        }

        // ── ประกอบเป็นข้อสอบเต็มชุด ตามโครงสร้างทางการของแต่ละระดับ ─────────────────────────
        function buildHskExam(level) {
            const pool = HSK_VOCAB[`hsk${level}`] || [];
            if (level === 1) {
                return {
                    level, passPct: 60,
                    sections: [
                        { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 10, 'listen-tf'), ...genMcFromWord(pool, 10, 'listen-mc')] },
                        { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 10, 'read-mc'), ...genMcReverse(pool, 10)] },
                    ],
                };
            }
            if (level === 2) {
                return {
                    level, passPct: 60,
                    sections: [
                        { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 15, 'listen-tf'), ...genMcFromWord(pool, 20, 'listen-mc')] },
                        { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 10, 'read-mc'), ...genMcReverse(pool, 10), ...genTf(pool, 5, 'read-tf')] },
                    ],
                };
            }
            // level 3
            return {
                level, passPct: 60,
                sections: [
                    { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 15, 'listen-tf'), ...genMcFromWord(pool, 25, 'listen-mc')] },
                    { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 15, 'read-mc'), ...genMcReverse(pool, 15)] },
                    { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: [...genWriteOrder(5), ...genWritePinyinChar(pool, 5)] },
                ],
            };
        }

        // ── ประวัติการส่งงาน "ฝึกเขียน" (แต่งประโยค/แปล/dictation) — array จำกัด 200 รายการล่าสุด
        // กันขนาด payload ตอนซิงก์ Google Drive บวมเกินไป ──────────────────────────────────
        const WRITING_HISTORY_CAP = 200;
        function loadWriting() {
            try { return JSON.parse(localStorage.getItem('lang-practice:writing') || '[]'); } catch { return []; }
        }
        function saveWriting(v) { localStorage.setItem('lang-practice:writing', JSON.stringify(v)); }
        function mergeWriting(a, b) {
            const byId = new Map();
            [...(a || []), ...(b || [])].forEach(rec => { if (rec && rec.id) byId.set(rec.id, rec); });
            return Array.from(byId.values()).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)).slice(0, WRITING_HISTORY_CAP);
        }

        // ── ตัวช่วย AI (แชร์ระหว่างโหมดแต่งประโยค+ตรวจแก้ / แปลประโยค+ตรวจให้คะแนน) — คัดลอก pattern
        // มาจาก ai-chat-widget.js (isIOS/friendlyChatError) ตามธรรมเนียมโปรเจกต์ที่ clone-and-adapt
        // แทน shared abstraction ข้ามหน้า ─────────────────────────────────────────────────
        function isIOS() {
            if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) return true;
            return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        }
        function friendlyChatError(rawMessage) {
            const msg = rawMessage || '';
            if (/bad_alloc|Can't create a session|out of memory/i.test(msg)) {
                return 'โหลดโมเดล AI ไม่สำเร็จ เพราะหน่วยความจำที่เบราว์เซอร์เหลือให้ใช้ไม่พอ (มักเกิดถ้าเปิดแท็บ/' +
                    'โปรแกรมอื่นพร้อมกันเยอะ) ลองปิดแท็บ/โปรแกรมอื่นแล้วลองใหม่อีกครั้ง';
            }
            return msg;
        }
        let writingWorker = null;
        function getWritingWorker() {
            if (!writingWorker) writingWorker = new Worker('./ai-chat-worker.js', { type: 'module' });
            return writingWorker;
        }

        const ANNOUNCEMENTS = [
            { date: 'วันนี้', text: 'ยินดีต้อนรับสู่ Language Practice — เลือกภาษาที่สนใจในแท็บ "ฝึกฝน" แล้วเริ่มพิมพ์คำแปลได้เลย' },
            { date: 'เร็วๆ นี้', text: 'จะทยอยเพิ่มหมวดวลีใหม่ๆ และภาษาเพิ่มเติมเรื่อยๆ' },
            { date: 'เคล็ดลับ', text: 'กดปุ่มลำโพงเพื่อฟังเสียงอ่านประโยคต้นฉบับ ช่วยจำสำเนียงได้ดีขึ้น' },
        ];

        // ── Google Drive sync (ไม่บังคับ) — ซิงก์ XP/ความคืบหน้าข้ามอุปกรณ์ ──────────
        const DRIVE_CLIENT_ID = '497048581273-akpavakt6m34lhqbjf1irg3m8vl6u27u.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const DRIVE_FOLDER_NAME = 'OME_Progress';
        const DRIVE_FILE_NAME = 'language-progress.json';

        const DriveSync = {
            tokenClient: null,
            accessToken: null,
            folderId: null,
            ensureAuth() {
                return new Promise((resolve, reject) => {
                    if (!window.google || !google.accounts || !google.accounts.oauth2) {
                        reject(new Error('โหลด Google Identity Services ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'));
                        return;
                    }
                    if (!this.tokenClient) {
                        this.tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: DRIVE_CLIENT_ID,
                            scope: DRIVE_SCOPE,
                            callback: (resp) => {
                                if (resp.error) { reject(new Error(resp.error)); return; }
                                this.accessToken = resp.access_token;
                                resolve(this.accessToken);
                            },
                        });
                    }
                    this.tokenClient.requestAccessToken({ prompt: this.accessToken ? '' : 'consent' });
                });
            },
            async ensureFolder() {
                if (this.folderId) return this.folderId;
                const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                if (data.files && data.files.length) { this.folderId = data.files[0].id; return this.folderId; }
                const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
                });
                if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
                const createData = await createRes.json();
                this.folderId = createData.id;
                return this.folderId;
            },
            async findFile(name, folderId) {
                const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาไฟล์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },
            async downloadFile(fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
            async uploadFile(name, folderId, existingId, obj) {
                const form = new FormData();
                const metadata = existingId ? {} : { name, parents: [folderId] };
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
                const url = existingId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const res = await fetch(url, { method: existingId ? 'PATCH' : 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken }, body: form });
                if (!res.ok) throw new Error('บันทึกขึ้น Drive ไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
        };

        function mergeProgress(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const la = (a && a[k]) || [], lb = (b && b[k]) || [];
                const len = Math.max(la.length, lb.length);
                const arr = [];
                for (let i = 0; i < len; i++) arr[i] = !!(la[i] || lb[i]);
                out[k] = arr;
            });
            return out;
        }

        // ══════════════════════════════════════════════════════════════════
        // "ฝึกเขียน" (view === 'writing') — 5 โหมดย่อย ใช้โครงสร้างที่มีอยู่แล้วให้มากที่สุด
        // (FSRS/gradeAnswer/speak ด้านบน, AI worker เดียวกับวิดเจ็ตแชทลอยแต่เรียกตรงจากหน้านี้)
        // ══════════════════════════════════════════════════════════════════

        const COMPOSE_SYSTEM_PROMPT = (langTitle) =>
            `คุณเป็นครูสอนภาษา${langTitle}ให้คนไทย ตรวจแก้ไวยากรณ์ประโยคที่ผู้เรียนเขียนเป็นภาษา${langTitle}\n` +
            `ตอบเป็นภาษาไทยเสมอ รูปแบบคำตอบต้องมี 3 ส่วนตามลำดับนี้เท่านั้น (ห้ามเพิ่มส่วนอื่น):\n` +
            `1) "ประโยคที่แก้แล้ว:" ตามด้วยประโยคภาษา${langTitle}ที่ถูกต้อง\n` +
            `2) "จุดที่แก้ไข:" อธิบายเป็นข้อๆ สั้นๆ ว่าแก้ตรงไหน เพราะอะไร (ภาษาไทย)\n` +
            `3) "คะแนนความถูกต้อง:" ให้คะแนนเป็นตัวเลข 1-5 (5=ถูกสมบูรณ์ ไม่ต้องแก้เลย)\n` +
            `ถ้าประโยคถูกต้องอยู่แล้วให้บอกตรงๆ ว่าไม่ต้องแก้ไข ห้ามแต่งจุดแก้ไขเพิ่มเติมทั้งที่ไม่มีจุดผิดจริง`;
        const COMPOSE_REMINDER =
            'ย้ำ: ตรวจประโยคล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น ตอบตามรูปแบบ 3 ส่วนที่กำหนดไว้เป๊ะๆ ' +
            '(ประโยคที่แก้แล้ว / จุดที่แก้ไข / คะแนนความถูกต้อง) ห้ามข้ามส่วนไหน และห้ามตอบเป็นภาษาอื่นนอกจากไทย';
        const TRANSLATE_SYSTEM_PROMPT = (langTitle) =>
            `คุณเป็นครูสอนภาษา${langTitle}ให้คนไทย หน้าที่ของคุณคือตรวจคำแปลที่ผู้เรียนแปลจากภาษาไทยเป็นภาษา${langTitle}\n` +
            'คุณจะได้รับ 3 อย่าง: ประโยคภาษาไทยต้นฉบับ, คำแปลอ้างอิงที่ถูกต้อง (เป็นแค่ตัวอย่างหนึ่งในหลายคำตอบที่ถูกได้ ไม่ใช่คำตอบเดียวที่ยอมรับ), ' +
            'และคำแปลของผู้เรียน ตอบเป็นภาษาไทยเสมอ ตัดสินว่าคำแปลของผู้เรียน "ถูกต้อง" ได้แม้ถ้อยคำไม่ตรงคำแปลอ้างอิงเป๊ะ ' +
            'ตราบใดที่ความหมายและไวยากรณ์ถูกต้อง รูปแบบคำตอบต้องมี 2 ส่วนเท่านั้น:\n' +
            '1) "ผลการตรวจ:" ตามด้วยคำเดียว "ถูกต้อง" หรือ "ยังไม่ถูกต้อง"\n' +
            '2) "คำอธิบาย:" อธิบายสั้นๆ เป็นภาษาไทยว่าทำไมถูก/ผิด และถ้าผิดควรแก้อย่างไร';
        const TRANSLATE_REMINDER =
            'ย้ำ: ตรวจเฉพาะคำแปลล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น เริ่มคำตอบด้วย "ผลการตรวจ:" ตามด้วย "ถูกต้อง" หรือ "ยังไม่ถูกต้อง" เท่านั้น ' +
            '(ห้ามใช้คำอื่น) แล้วตามด้วย "คำอธิบาย:" ห้ามตอบเป็นภาษาอื่นนอกจากไทย';

        function AiFeedbackErrorNote({ children }) {
            return <p className="text-sm text-red-600 mt-3">❌ {children}</p>;
        }

        // ── กระดานเขียนด้วยลายมือ (รองรับนิ้ว/สไตลัส/Apple Pencil บน iPad ผ่าน Pointer Events —
        //    Safari ส่ง Apple Pencil มาเป็น pointerType 'pen' ให้ฟรีอยู่แล้วไม่ต้องเขียนโค้ดแยกเคส)
        //    ใช้ร่วมกันทั้งโน้ตของฉันและโหมด "แต่งประโยคอิสระ" ในฝึกเขียน — พื้นฐานคือ canvas ธรรมดา
        //    บันทึกภาพเป็น PNG data URL ผ่าน onChange ทุกครั้งที่ยกปากกา ไม่ได้แปลงเป็นข้อความในตัวเอง
        //    (ปุ่ม "แปลงเป็นข้อความ" อยู่ที่ผู้เรียกใช้แต่ละจุดแทน เพราะแต่ละจุดจัดการผลลัพธ์ต่างกัน) ──
        function HandwritingCanvas({ value, onChange, onReady, height }) {
            const canvasRef = useRef(null);
            const drawingRef = useRef(false);
            const lastPointRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2); // กัน PNG บวมเกินไปบนจอ DPR สูง
                const w = canvas.clientWidth, h = canvas.clientHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.4;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
                if (value) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, w, h);
                    img.src = value;
                }
                if (onReady) onReady(canvas);
            }, []);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };
            const start = (e) => {
                e.preventDefault();
                canvasRef.current.setPointerCapture(e.pointerId);
                drawingRef.current = true;
                lastPointRef.current = getPos(e);
            };
            const move = (e) => {
                if (!drawingRef.current) return;
                e.preventDefault();
                const ctx = canvasRef.current.getContext('2d');
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastPointRef.current.x, lastPointRef.current.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                lastPointRef.current = p;
            };
            const finish = () => {
                if (!drawingRef.current) return;
                drawingRef.current = false;
                if (onChange) onChange(canvasRef.current.toDataURL('image/png'));
            };
            const clear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
                if (onChange) onChange('');
            };

            return (
                <div>
                    <canvas ref={canvasRef}
                        style={{ width: '100%', height: (height || 220) + 'px', touchAction: 'none', background: '#fff', borderRadius: '12px', border: '2px solid #e5e7eb', display: 'block' }}
                        onPointerDown={start} onPointerMove={move} onPointerUp={finish} onPointerLeave={finish} onPointerCancel={finish}
                    />
                    <button type="button" onClick={clear} className="mt-1.5 text-xs font-semibold text-gray-400 hover:text-gray-600">ล้างกระดาน</button>
                </div>
            );
        }

        // ── แผนภาพ/แบบฝึกลำดับขีดตัวอักษรจีน ใช้ไลบรารี hanzi-writer (ข้อมูลลำดับขีดจริงจากโปรเจกต์
        //    Make Me a Hanzi ตรวจสอบแล้ว) — ตอนแรกลองสร้างแผนภาพลำดับขีดเองด้วยมือสำหรับ 60 ตัวอักษร
        //    แต่พอเช็คย้อนกลับกับจำนวนขีดจริงพบว่าผิดไปกว่าครึ่ง (32/60) จึงเปลี่ยนมาใช้ไลบรารีที่มีข้อมูล
        //    ตรวจสอบแล้วแทน ปลอดภัยกว่าข้อมูลที่เดาเองมาก — มีทั้งโหมดดูภาพเคลื่อนไหวและโหมดลองลากเอง (quiz)
        //    ซึ่งรองรับนิ้ว/สไตลัส/Apple Pencil ผ่าน pointer/touch events อยู่แล้วในตัวไลบรารี
        //    hanzi-writer สร้างได้ทีละ "ตัวอักษรเดียว" เท่านั้น (ไม่รองรับคำหลายตัวอักษรในเรียกเดียว) —
        //    ตอนนี้มีคำศัพท์ HSK เข้ามาผสม (หลายตัวเป็นคำ 2-4 ตัวอักษร เช่น 你好/出租车) จึงแยก
        //    ตัวอักษรทีละตัวแล้ววาง SingleCharStrokeDiagram เรียงกันเป็นแถว แทนที่จะสร้างตัวเดียวยาวๆ
        function SingleCharStrokeDiagram({ char, size }) {
            const containerRef = useRef(null);
            const writerRef = useRef(null);
            const [mode, setMode] = useState('view'); // 'view' | 'quiz'
            const [quizMsg, setQuizMsg] = useState('');
            const [libErr, setLibErr] = useState(false);
            const dim = size || 220;

            useEffect(() => {
                if (!containerRef.current) return;
                if (!window.HanziWriter) { setLibErr(true); return; }
                setLibErr(false);
                containerRef.current.innerHTML = '';
                setQuizMsg('');
                setMode('view');
                writerRef.current = window.HanziWriter.create(containerRef.current, char, {
                    width: dim, height: dim, padding: Math.round(dim * 0.06),
                    showOutline: true,
                    strokeColor: '#0f766e',
                    highlightColor: '#facc15',
                    drawingWidth: Math.max(18, Math.round(dim * 0.15)),
                });
            }, [char]);

            const playAnimation = () => {
                setMode('view'); setQuizMsg('');
                writerRef.current && writerRef.current.animateCharacter();
            };
            const startQuiz = () => {
                setMode('quiz');
                setQuizMsg(`ลองลากตาม ${char} ดูสิ`);
                writerRef.current && writerRef.current.quiz({
                    onCorrectStroke: (info) => setQuizMsg(`✅ ถูกต้อง (ขีดที่ ${info.strokeNum + 1})`),
                    onMistake: () => setQuizMsg('❌ ยังไม่ตรง ลองดูเส้นจางๆ แล้วลากตามอีกครั้ง'),
                    onComplete: (summary) => setQuizMsg(summary.totalMistakes === 0 ? '🎉 ถูกทุกขีดเลย!' : `🎉 พลาด ${summary.totalMistakes} ครั้งระหว่างทาง`),
                });
            };

            if (libErr) return <p className="text-xs text-gray-400 mt-2">โหลดแผนภาพลำดับขีดไม่สำเร็จ ลองรีเฟรชหน้าใหม่</p>;

            return (
                <div>
                    <div ref={containerRef} className="mx-auto rounded-xl border-2 border-gray-100 bg-white" style={{ width: dim, height: dim }}></div>
                    <div className="flex items-center justify-center gap-1.5 mt-1.5 flex-wrap">
                        <button type="button" onClick={playAnimation}
                            className={`text-[11px] font-semibold px-2.5 py-1 rounded-full border transition ${mode === 'view' ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>▶ ดู</button>
                        <button type="button" onClick={startQuiz}
                            className={`text-[11px] font-semibold px-2.5 py-1 rounded-full border transition ${mode === 'quiz' ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>✏️ ลองเขียน</button>
                    </div>
                    {quizMsg && <p className="text-[11px] text-center text-gray-500 mt-1 max-w-[140px]">{quizMsg}</p>}
                </div>
            );
        }

        // ตัวห่อระดับ "คำ" — แยกเป็นตัวอักษรเดี่ยวๆ (รองรับ surrogate pair ผ่าน Array.from) แล้ววาง
        // การ์ดลำดับขีดของแต่ละตัวเรียงกัน ตัวเดียวก็ใช้ได้ปกติ (ไซซ์เต็ม 220px) หลายตัวจะย่อขนาดลง
        function StrokeOrderDiagram({ char }) {
            const chars = useMemo(() => Array.from(char || ''), [char]);
            if (!chars.length) return null;
            const size = chars.length > 1 ? 150 : 220;
            return (
                <div className="mt-3 flex items-start justify-center gap-2 flex-wrap">
                    {chars.map((ch, i) => <SingleCharStrokeDiagram key={`${char}-${i}`} char={ch} size={size} />)}
                </div>
            );
        }

        // ── โหมด 1: ฝึกเขียนตัวอักษรจีน (ตอนนี้มีแค่ lang-cn — ดูตัวอักษร+ราก+จำนวนขีด, ฟังเสียง,
        //    พิมพ์ pinyin ให้ gradeAnswer ตรวจ, แล้ว self-rate ขับเคลื่อน FSRS) ──────────────────
        function ScriptPanel({ srs, recordSrs, awardXp }) {
            const langId = 'lang-cn';
            const queue = useMemo(() => {
                const due = dueVocab(langId, srs);
                return due.length ? due : vocabPool(langId).slice(0, 10);
            }, [srs]);
            const [qIdx, setQIdx] = useState(0);
            const [revealed, setRevealed] = useState(false);
            const [pinyinTyped, setPinyinTyped] = useState('');
            const [pinyinResult, setPinyinResult] = useState(null);

            if (!queue.length) return <p className="text-sm text-gray-400">ยังไม่มีตัวอักษรให้ฝึก</p>;
            const item = queue[qIdx % queue.length];
            const c = item.extra;

            const checkPinyin = () => setPinyinResult(gradeAnswer(pinyinTyped, c.pinyin));
            const next = () => { setQIdx(i => i + 1); setRevealed(false); setPinyinTyped(''); setPinyinResult(null); };
            const rate = (rating) => { recordSrs(item.key, rating); if (rating >= 3) awardXp(10); next(); };

            return (
                <div>
                    <div className="text-xs font-bold text-gray-400 uppercase mb-3">{c.set} · ค้างทวน {queue.length} ตัว</div>
                    <div className="text-center py-6">
                        <div className="text-7xl font-bold text-gray-900 mb-4">{c.char}</div>
                        {!revealed ? (
                            <button onClick={() => { setRevealed(true); speak(c.char, 'zh'); }}
                                className="px-5 py-2.5 rounded-xl bg-brandLight text-brand font-bold text-sm hover:opacity-80">
                                แตะเพื่อดูคำอ่าน/ความหมาย
                            </button>
                        ) : (
                            <div className="space-y-1">
                                <p className="text-xl font-bold text-gray-800">{c.pinyin}</p>
                                <p className="text-gray-500">{c.meaningTh}</p>
                                {c.radical && <p className="text-xs text-gray-400 mt-2">ราก: {c.radical} ({c.radicalMeaningTh}) · {c.strokeCount} ขีด</p>}
                                <button onClick={() => speak(c.char, 'zh')} className="mt-2 inline-flex items-center gap-1 text-xs text-brand font-semibold">
                                    <Volume2 /> ฟังอีกครั้ง
                                </button>
                                <StrokeOrderDiagram char={c.char} />
                            </div>
                        )}
                    </div>

                    {revealed && (
                        <>
                            <div className="border-t border-gray-100 pt-4 mt-2">
                                <p className="text-sm font-semibold text-gray-700 mb-2">พิมพ์คำอ่าน (pinyin) ของตัวนี้:</p>
                                <div className="flex gap-2">
                                    <input value={pinyinTyped} onChange={e => setPinyinTyped(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && !pinyinResult && checkPinyin()}
                                        disabled={!!pinyinResult} placeholder="เช่น nǐ"
                                        className="flex-1 border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-2.5 text-base disabled:bg-gray-50" />
                                    {!pinyinResult && (
                                        <button onClick={checkPinyin} disabled={!pinyinTyped.trim()}
                                            className="px-4 rounded-xl font-bold bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจ</button>
                                    )}
                                </div>
                                {pinyinResult && (
                                    <p className={`text-sm mt-2 font-semibold ${pinyinResult === 'correct' ? 'text-green-600' : pinyinResult === 'almost' ? 'text-amber-600' : 'text-red-600'}`}>
                                        {pinyinResult === 'correct' ? '✅ ถูกต้อง' : pinyinResult === 'almost' ? '🟡 เกือบถูก' : `❌ ที่ถูกคือ ${c.pinyin}`}
                                    </p>
                                )}
                            </div>

                            <div className="mt-6">
                                <p className="text-xs text-gray-400 mb-2">จำตัวนี้ได้แค่ไหน? (กำหนดว่าจะเจอตัวนี้อีกครั้งเมื่อไหร่)</p>
                                <div className="grid grid-cols-4 gap-2">
                                    <button onClick={() => rate(1)} className="py-2.5 rounded-xl font-bold text-xs bg-red-100 text-red-700">ลืมแล้ว</button>
                                    <button onClick={() => rate(2)} className="py-2.5 rounded-xl font-bold text-xs bg-orange-100 text-orange-700">ยาก</button>
                                    <button onClick={() => rate(3)} className="py-2.5 rounded-xl font-bold text-xs bg-green-100 text-green-700">จำได้ (+10)</button>
                                    <button onClick={() => rate(4)} className="py-2.5 rounded-xl font-bold text-xs bg-teal-100 text-teal-700">ง่ายมาก (+10)</button>
                                </div>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        // ── โหมด 2: แต่งประโยคอิสระ + AI ตรวจแก้ ──────────────────────────────────────────
        function ComposePanel({ langId, lang, awardXp, addWritingRecord }) {
            const [text, setText] = useState('');
            const [feedback, setFeedback] = useState('');
            const [status, setStatus] = useState(''); // '' | 'loading' | 'done' | 'error'
            const [errMsg, setErrMsg] = useState('');
            const [inputMode, setInputMode] = useState('type'); // 'type' | 'write' — โหมดเขียนด้วยมือ (iPad ฯลฯ)
            const [canvasEl, setCanvasEl] = useState(null);
            const [ocrStatus, setOcrStatus] = useState('');

            const runOcr = () => {
                if (!canvasEl) return;
                if (!window.Tesseract) { setOcrStatus('❌ โหลด Tesseract.js ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'); return; }
                setOcrStatus('⏳ กำลังอ่านลายมือ...');
                window.Tesseract.recognize(canvasEl, 'eng+tha').then(r => {
                    const t = (r.data.text || '').trim();
                    if (t) { setText(prev => (prev ? prev + ' ' : '') + t); setInputMode('type'); setOcrStatus('✅ แปลงเป็นข้อความแล้ว — ตรวจทานความถูกต้องก่อนส่งตรวจ'); }
                    else setOcrStatus('⚠️ อ่านลายมือไม่ออก ลองเขียนให้ชัดขึ้นแล้วลองใหม่');
                }).catch(e => setOcrStatus('❌ แปลงไม่สำเร็จ: ' + (e && e.message ? e.message : e)));
            };

            const submit = () => {
                if (!text.trim()) return;
                if (isIOS()) { setStatus('error'); setErrMsg('ฟีเจอร์ตรวจไวยากรณ์ด้วย AI ยังไม่รองรับ iPhone/iPad ในตอนนี้ (ปัญหาหน่วยความจำของเบราว์เซอร์ iOS)'); return; }
                setStatus('loading'); setFeedback(''); setErrMsg('');
                const w = getWritingWorker();
                const jobId = 'compose-' + Date.now();
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'model-progress') {
                        const pct = msg.progress != null ? Math.round(msg.progress) + '%' : '';
                        setFeedback('⏳ กำลังโหลดโมเดล (ครั้งแรกเท่านั้น) ' + msg.file + ' ' + pct);
                    } else if (msg.type === 'fallback') {
                        setFeedback('⚠️ ' + msg.message);
                    } else if (msg.type === 'token') {
                        acc += msg.token; setFeedback(acc);
                    } else if (msg.type === 'done') {
                        cleanup(); setStatus('done'); awardXp(15);
                        addWritingRecord({ langId, subMode: 'compose', prompt: '', userText: text, feedback: acc, grade: null, xpAwarded: 15 });
                    } else if (msg.type === 'error') {
                        cleanup(); setStatus('error'); setErrMsg(friendlyChatError(msg.message));
                    }
                }
                function onErr(e) { cleanup(); setStatus('error'); setErrMsg(friendlyChatError(e.message || 'ไม่ทราบสาเหตุ')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 320,
                    messages: [
                        { role: 'system', content: COMPOSE_SYSTEM_PROMPT(lang.title) },
                        { role: 'user', content: text },
                        { role: 'system', content: COMPOSE_REMINDER },
                    ],
                });
            };

            return (
                <div>
                    <h3 className="text-lg font-semibold text-gray-800 mb-1">แต่งประโยคภาษา{lang.title}อะไรก็ได้ แล้วให้ AI ช่วยตรวจ</h3>
                    <p className="text-xs text-gray-400 mb-3">เขียนสั้นๆ 1-3 ประโยคก็พอ — AI จะช่วยแก้ไวยากรณ์และอธิบายจุดที่แก้ให้เป็นภาษาไทย</p>

                    <div className="flex rounded-full border border-gray-200 overflow-hidden w-fit mb-2">
                        <button type="button" onClick={() => setInputMode('type')} title="พิมพ์" aria-label="พิมพ์"
                            className={`p-2 ${inputMode === 'type' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><KeyboardIcon /></button>
                        <button type="button" onClick={() => setInputMode('write')} title="เขียนด้วยมือ" aria-label="เขียนด้วยมือ"
                            className={`p-2 ${inputMode === 'write' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><PencilSmallIcon /></button>
                    </div>

                    {inputMode === 'type' ? (
                        <textarea value={text} onChange={e => setText(e.target.value)} rows={4}
                            placeholder={`เขียนเป็นภาษา${lang.title}ตรงนี้...`}
                            className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-sm resize-y" />
                    ) : (
                        <div>
                            <HandwritingCanvas onReady={setCanvasEl} height={200} />
                            <div className="flex items-center gap-3 mt-2 flex-wrap">
                                <button type="button" onClick={runOcr} className="text-xs font-semibold text-brand hover:opacity-80">✨ แปลงเป็นข้อความ</button>
                                {ocrStatus && <span className="text-xs text-gray-400">{ocrStatus}</span>}
                            </div>
                            <p className="text-[11px] text-gray-400 mt-1">รองรับเขียนด้วยนิ้ว/สไตลัส/Apple Pencil บน iPad — OCR แม่นสุดกับภาษาละติน/ไทย ภาษาอื่น (จีน/ญี่ปุ่น/เกาหลี/อาหรับ ฯลฯ) อาจอ่านไม่ออกหรือผิดเยอะ ควรตรวจทานเสมอ</p>
                            {text && <p className="text-xs text-gray-500 mt-2">ข้อความล่าสุด: "{text}"</p>}
                        </div>
                    )}

                    <button onClick={submit} disabled={!text.trim() || status === 'loading'}
                        className="mt-3 px-5 py-2.5 rounded-xl font-bold text-sm bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">
                        {status === 'loading' ? 'กำลังตรวจ...' : 'ส่งให้ AI ตรวจ (+15 XP)'}
                    </button>
                    {status === 'error' && <AiFeedbackErrorNote>{errMsg}</AiFeedbackErrorNote>}
                    {feedback && (
                        <div className="mt-4 p-4 rounded-xl bg-gray-50 border border-gray-100 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{feedback}</div>
                    )}
                </div>
            );
        }

        // ── โหมด 3: แต่งประโยคจากคำศัพท์ที่กำลังทวน ────────────────────────────────────────
        function SrsComposePanel({ langId, lang, srs, recordSrs, awardXp, addWritingRecord }) {
            const words = useMemo(() => dueVocab(langId, srs).slice(0, 5), [langId, srs]);
            const [text, setText] = useState('');
            const [checked, setChecked] = useState(null);
            const [aiFeedback, setAiFeedback] = useState('');
            const [aiStatus, setAiStatus] = useState('');

            useEffect(() => { setText(''); setChecked(null); setAiFeedback(''); setAiStatus(''); }, [langId]);

            if (!words.length) return <p className="text-sm text-gray-400">ยังไม่มีคำศัพท์ให้ทวนตอนนี้ — ลองไปฝึกโหมดอื่นก่อน คำจะเริ่มมีให้ทวนเมื่อครบกำหนด</p>;

            const checkUsage = () => {
                const norm = normalizeAnswer(text);
                const results = words.map(w => ({ ...w, used: norm.includes(normalizeAnswer(w.word)) }));
                setChecked(results);
                results.forEach(r => { if (r.used) recordSrs(r.key, 3); });
                const usedCount = results.filter(r => r.used).length;
                if (usedCount > 0) awardXp(usedCount * 5);
            };

            const checkWithAi = () => {
                if (isIOS()) { setAiStatus('error'); setAiFeedback('โหมดนี้ยังไม่รองรับ iPhone/iPad'); return; }
                setAiStatus('loading'); setAiFeedback('');
                const w = getWritingWorker();
                const jobId = 'srscompose-' + Date.now();
                const userMsg = `คำที่ต้องใช้: ${words.map(w2 => w2.word).join(', ')}. ประโยคของฉัน: ${text}`;
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setAiFeedback(acc); }
                    else if (msg.type === 'done') {
                        cleanup(); setAiStatus('done');
                        addWritingRecord({ langId, subMode: 'srsCompose', prompt: userMsg, userText: text, feedback: acc, grade: null, xpAwarded: 0 });
                    } else if (msg.type === 'error') { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 320,
                    messages: [
                        { role: 'system', content: COMPOSE_SYSTEM_PROMPT(lang.title) },
                        { role: 'user', content: userMsg },
                        { role: 'system', content: COMPOSE_REMINDER },
                    ],
                });
            };

            return (
                <div>
                    <h3 className="text-lg font-semibold text-gray-800 mb-1">แต่งประโยคภาษา{lang.title} โดยใช้คำเหล่านี้ให้ได้มากที่สุด</h3>
                    <div className="flex flex-wrap gap-2 my-3">
                        {words.map(w => {
                            const used = checked && checked.find(c => c.key === w.key);
                            return (
                                <span key={w.key} className={`px-3 py-1 rounded-full text-sm font-semibold border ${used && used.used ? 'bg-green-50 border-green-200 text-green-700' : 'bg-brandLight border-brand text-brand'}`}>
                                    {w.word} <span className="opacity-60">({w.thai})</span>
                                </span>
                            );
                        })}
                    </div>
                    <textarea value={text} onChange={e => setText(e.target.value)} rows={3}
                        placeholder={`แต่งประโยคภาษา${lang.title}ที่นี่...`}
                        className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-sm resize-y" />
                    <div className="flex flex-wrap gap-2 mt-3">
                        <button onClick={checkUsage} disabled={!text.trim()}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจว่าใช้คำครบไหม</button>
                        <button onClick={checkWithAi} disabled={!text.trim() || aiStatus === 'loading'}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm border-2 border-brand text-brand disabled:opacity-40">
                            {aiStatus === 'loading' ? 'กำลังตรวจ...' : 'ตรวจไวยากรณ์ด้วย AI'}
                        </button>
                    </div>
                    {checked && (
                        <p className="text-sm mt-3 font-semibold text-gray-700">
                            ใช้คำครบ {checked.filter(c => c.used).length}/{checked.length} คำ {checked.every(c => c.used) ? '🎉 ครบทุกคำ!' : ''}
                        </p>
                    )}
                    {aiFeedback && <div className="mt-3 p-4 rounded-xl bg-gray-50 border border-gray-100 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{aiFeedback}</div>}
                </div>
            );
        }

        // ── โหมด 4: เขียนตามคำบอกจากคำที่กำลังทวน (Dictation, SRS-sourced) ─────────────────
        function SrsDictationPanel({ langId, lang, srs, recordSrs, awardXp }) {
            const words = useMemo(() => dueVocab(langId, srs), [langId, srs]);
            const [qIdx, setQIdx] = useState(0);
            const [typed, setTyped] = useState('');
            const [result, setResult] = useState(null);

            useEffect(() => { setQIdx(0); setTyped(''); setResult(null); }, [langId]);

            if (!words.length) return <p className="text-sm text-gray-400">ยังไม่มีคำศัพท์ให้ทวนตอนนี้</p>;
            const item = words[qIdx % words.length];

            const check = () => {
                const grade = gradeAnswer(typed, item.word);
                setResult(grade);
                recordSrs(item.key, { correct: 3, almost: 2, wrong: 1 }[grade]);
                if (grade === 'correct') awardXp(15);
                else if (grade === 'almost') awardXp(8);
            };
            const next = () => { setQIdx(i => i + 1); setTyped(''); setResult(null); };

            return (
                <div>
                    <h3 className="text-lg font-semibold text-gray-800 mb-2">ฟังเสียงแล้วพิมพ์เป็นภาษา{lang.title} ตามที่ได้ยิน:</h3>
                    <button onClick={() => speak(item.word, lang.code)}
                        className="flex items-center gap-2 px-5 py-3 mb-4 rounded-xl bg-brandLight text-brand font-bold text-sm hover:opacity-80">
                        <Volume2 /> กดฟังเสียง (ฟังซ้ำได้)
                    </button>
                    <input value={typed} onChange={e => setTyped(e.target.value)} onKeyDown={e => e.key === 'Enter' && !result && check()}
                        disabled={!!result} placeholder="พิมพ์คำที่ได้ยิน..."
                        className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-3 text-base disabled:bg-gray-50" />
                    {result && (
                        <div className={`mt-4 p-4 rounded-xl border ${result === 'correct' ? 'bg-green-50 border-green-100' : result === 'almost' ? 'bg-amber-50 border-amber-100' : 'bg-red-50 border-red-100'}`}>
                            <p className="text-sm text-gray-700">คำตอบที่ถูกต้องคือ <strong>{item.word}</strong> ({item.thai})</p>
                        </div>
                    )}
                    {!result ? (
                        <button onClick={check} disabled={!typed.trim()}
                            className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจคำตอบ</button>
                    ) : (
                        <button onClick={next} className="mt-4 w-full py-3 rounded-xl font-bold bg-brand text-white">ข้อต่อไป</button>
                    )}
                </div>
            );
        }

        // ── โหมด 5: แปลประโยค ไทย → ภาษาที่เรียน ──────────────────────────────────────────
        function TranslatePanel({ langId, lang, awardXp, addWritingRecord }) {
            const allPhrases = useMemo(() => Object.values(lang.phrases).flat(), [lang]);
            const [qIdx, setQIdx] = useState(() => Math.floor(Math.random() * allPhrases.length));
            const [typed, setTyped] = useState('');
            const [heuristicResult, setHeuristicResult] = useState(null);
            const [aiFeedback, setAiFeedback] = useState('');
            const [aiStatus, setAiStatus] = useState('');
            const [aiVerdict, setAiVerdict] = useState(null);

            const item = allPhrases[qIdx % allPhrases.length];

            const checkHeuristic = () => {
                const grade = gradeAnswer(typed, item.target);
                setHeuristicResult(grade);
                if (grade === 'correct') awardXp(10);
            };

            const checkWithAi = () => {
                if (isIOS()) { setAiStatus('error'); setAiFeedback('โหมดนี้ยังไม่รองรับ iPhone/iPad'); return; }
                setAiStatus('loading'); setAiFeedback(''); setAiVerdict(null);
                const w = getWritingWorker();
                const jobId = 'translate-' + Date.now();
                const userMsg = `ประโยคไทยต้นฉบับ: ${item.thai}\nคำแปลอ้างอิง: ${item.target}\nคำแปลของผู้เรียน: ${typed}`;
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setAiFeedback(acc); }
                    else if (msg.type === 'done') {
                        cleanup(); setAiStatus('done');
                        const m = acc.match(/ผลการตรวจ:\s*(ถูกต้อง|ยังไม่ถูกต้อง)/);
                        let grade = null;
                        if (m) {
                            const ok = m[1] === 'ถูกต้อง';
                            setAiVerdict(ok ? 'correct' : 'wrong');
                            grade = ok ? 'correct' : 'wrong';
                            if (ok) awardXp(15);
                        }
                        addWritingRecord({ langId, subMode: 'translate', prompt: userMsg, userText: typed, feedback: acc, grade, xpAwarded: grade === 'correct' ? 15 : 0 });
                    } else if (msg.type === 'error') { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 300,
                    messages: [
                        { role: 'system', content: TRANSLATE_SYSTEM_PROMPT(lang.title) },
                        { role: 'user', content: userMsg },
                        { role: 'system', content: TRANSLATE_REMINDER },
                    ],
                });
            };

            const next = () => {
                setQIdx(Math.floor(Math.random() * allPhrases.length));
                setTyped(''); setHeuristicResult(null); setAiFeedback(''); setAiStatus(''); setAiVerdict(null);
            };

            return (
                <div>
                    <h3 className="text-lg font-semibold text-gray-800 mb-2">แปลประโยคนี้เป็นภาษา{lang.title}:</h3>
                    <p className="text-xl font-bold text-gray-900 mb-4">{item.thai}</p>
                    <textarea value={typed} onChange={e => setTyped(e.target.value)} rows={2}
                        placeholder={`พิมพ์คำแปลภาษา${lang.title}...`}
                        className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-base resize-y" />
                    <div className="flex flex-wrap gap-2 mt-3">
                        <button onClick={checkHeuristic} disabled={!typed.trim()}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจแบบเร็ว</button>
                        <button onClick={checkWithAi} disabled={!typed.trim() || aiStatus === 'loading'}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm border-2 border-brand text-brand disabled:opacity-40">
                            {aiStatus === 'loading' ? 'กำลังตรวจ...' : 'ตรวจด้วย AI (แม่นกว่า)'}
                        </button>
                        <button onClick={next} className="px-4 py-2.5 rounded-xl font-bold text-sm text-gray-500 hover:text-gray-700">ข้าม/ข้อใหม่</button>
                    </div>
                    {heuristicResult && (
                        <p className={`text-sm mt-3 font-semibold ${heuristicResult === 'correct' ? 'text-green-600' : heuristicResult === 'almost' ? 'text-amber-600' : 'text-red-600'}`}>
                            {heuristicResult === 'correct' ? '✅ ตรงตัวอย่างอ้างอิง (+10 XP)' : heuristicResult === 'almost' ? '🟡 ใกล้เคียง' : '❌ ไม่ตรงตัวอย่างอ้างอิง'}
                            <span className="block text-gray-400 font-normal mt-1">
                                ตัวอย่างคำแปล: {item.target} — (ยังไม่ใช้ AI เช็คแค่ตรงตัวอย่างนี้เป๊ะๆ อาจฟ้องผิดทั้งที่ความหมายถูกได้ ลองกด "ตรวจด้วย AI" เพื่อความแม่นยำกว่า)
                            </span>
                        </p>
                    )}
                    {aiFeedback && (
                        <div className={`mt-3 p-4 rounded-xl border text-sm whitespace-pre-wrap leading-relaxed ${aiVerdict === 'correct' ? 'bg-green-50 border-green-100 text-green-800' : aiVerdict === 'wrong' ? 'bg-red-50 border-red-100 text-red-800' : 'bg-gray-50 border-gray-100 text-gray-700'}`}>
                            {aiFeedback}
                        </div>
                    )}
                </div>
            );
        }

        // ── shell ของหน้า "ฝึกเขียน" — เลือกภาษา + สลับโหมดย่อย 5 แบบ ──────────────────────
        function WritingView({ langId, setLangId, xp, setXp, srs, setSrs, writing, setWriting, dueCounts }) {
            const lang = LANGS[langId];
            const hasScript = langId === 'lang-cn';
            const SUB_MODES = [
                ...(hasScript ? [{ key: 'script', label: 'ฝึกเขียนตัวอักษร', Icon: BrushIcon }] : []),
                { key: 'compose', label: 'แต่งประโยคอิสระ', Icon: PenToolIcon },
                { key: 'srsCompose', label: 'แต่งจากคำที่ทวน', Icon: ShuffleIcon },
                { key: 'dictation', label: 'ฟังแล้วเขียน', Icon: HeadphonesIcon },
                { key: 'translate', label: 'แปลไทย→ภาษา', Icon: LanguagesSmallIcon },
            ];
            const [subMode, setSubMode] = useState(hasScript ? 'script' : 'compose');
            // เดิมหน้านี้มีแถวปุ่มเลือกภาษาของตัวเอง (14 ปุ่มโชว์ตลอด) ซึ่งซ้ำกับปุ่มดินสอที่แถบข้าง
            // ตอนนี้พาเข้ามาแบบเลือกภาษาไว้แล้ว เลยยุบเป็น chip + ปุ่ม "เปลี่ยนภาษา" แทน กางออกเฉพาะตอนต้องใช้จริง
            const [langPickerOpen, setLangPickerOpen] = useState(false);
            // แจ้งเตือนตอนสลับภาษาแล้วโหมด "ฝึกเขียนตัวอักษร" หายไปเงียบๆ (มีแค่ lang-cn) — กันงงว่าทำไมโหมดหาย
            const [modeNotice, setModeNotice] = useState('');

            useEffect(() => {
                if (subMode === 'script' && !hasScript) {
                    setSubMode('compose');
                    setModeNotice(`ภาษา${lang.title}ยังไม่มีโหมด "ฝึกเขียนตัวอักษร" (ตอนนี้มีแค่ภาษาจีน) — สลับไปโหมด "แต่งประโยคอิสระ" ให้แล้ว`);
                }
            }, [langId]);

            useEffect(() => {
                if (!modeNotice) return;
                const t = setTimeout(() => setModeNotice(''), 6000);
                return () => clearTimeout(t);
            }, [modeNotice]);

            const awardXp = (amt) => setXp(x => x + amt);
            const recordSrs = (key, rating) => setSrs(s => ({ ...s, [key]: fsrsSchedule(s[key] || {}, rating) }));
            const addWritingRecord = (rec) => setWriting(w => mergeWriting(w, [{
                id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                createdAt: Date.now(), ...rec,
            }]));

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
                        <div>
                            <div className="flex items-center justify-between gap-3 flex-wrap">
                                <div className="flex items-center gap-2 min-w-0">
                                    <span className="text-xs text-gray-400 font-semibold shrink-0">กำลังฝึกเขียน:</span>
                                    <span className="px-3 py-1.5 rounded-full text-sm font-bold bg-brandLight text-brand truncate">{lang.title}</span>
                                </div>
                                <button type="button" onClick={() => setLangPickerOpen(o => !o)}
                                    className="shrink-0 text-xs font-semibold text-gray-500 hover:text-brand border border-gray-200 hover:border-brand rounded-full px-3 py-1.5 transition">
                                    {langPickerOpen ? 'ปิด' : 'เปลี่ยนภาษา'}
                                </button>
                            </div>
                            {langPickerOpen && (
                                <div className="flex flex-wrap gap-2 mt-3 p-3 bg-white border border-gray-200 rounded-xl">
                                    {LANG_IDS.map(id => (
                                        <button key={id} onClick={() => { setLangId(id); setLangPickerOpen(false); }}
                                            className={`relative px-3 py-1.5 rounded-full text-xs font-semibold border transition ${langId === id ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>
                                            {LANGS[id].title}
                                            {dueCounts && dueCounts[id] > 0 && (
                                                <span className={`ml-1.5 inline-flex items-center justify-center min-w-[15px] h-[15px] px-0.5 rounded-full text-[9px] font-bold leading-none ${langId === id ? 'bg-white/25 text-white' : 'bg-red-500 text-white'}`}>
                                                    {dueCounts[id] > 9 ? '9+' : dueCounts[id]}
                                                </span>
                                            )}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        {modeNotice && (
                            <div className="flex items-center justify-between gap-3 text-xs bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-3 py-2">
                                <span>ℹ️ {modeNotice}</span>
                                <button type="button" onClick={() => setModeNotice('')} className="text-amber-500 hover:text-amber-700 font-bold shrink-0">✕</button>
                            </div>
                        )}

                        <div className="flex rounded-full border border-gray-200 overflow-hidden text-xs font-bold w-fit flex-wrap bg-white">
                            {SUB_MODES.map(m => (
                                <button key={m.key} onClick={() => setSubMode(m.key)}
                                    className={`px-3 py-1.5 flex items-center gap-1.5 ${subMode === m.key ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}>
                                    <m.Icon /> {m.label}
                                </button>
                            ))}
                        </div>

                        <div className="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
                            {subMode === 'script' && hasScript && <ScriptPanel srs={srs} recordSrs={recordSrs} awardXp={awardXp} />}
                            {subMode === 'compose' && <ComposePanel langId={langId} lang={lang} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                            {subMode === 'srsCompose' && <SrsComposePanel langId={langId} lang={lang} srs={srs} recordSrs={recordSrs} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                            {subMode === 'dictation' && <SrsDictationPanel langId={langId} lang={lang} srs={srs} recordSrs={recordSrs} awardXp={awardXp} />}
                            {subMode === 'translate' && <TranslatePanel langId={langId} lang={lang} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                        </div>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════════════════
        // ข้อสอบ BCT (Business Chinese Test, จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ BCT ทางการ
        // (ตรวจสอบผ่านเว็บแล้ว): BCT-A (ระดับต้น อ้างอิงคำศัพท์ ~600 คำ) = ฟัง 30 + อ่าน 30 + เขียน 10
        // (รวม 70 ข้อ, ~60 นาที), BCT-B (ระดับกลาง-สูง อ้างอิงคำศัพท์ ~4000 คำ) = ฟัง 50 + อ่าน 40 +
        // เขียน 2 (รวม 92 ข้อ, ~135 นาที — ส่วนเขียนของ B เป็นข้อเขียนอีเมล/รายงานธุรกิจแบบเปิดยาว
        // ไม่ใช่ปรนัย จึงใช้ AI ตรวจให้ feedback แทนแบบเดียวกับโหมด "แต่งประโยคอิสระ" ในฝึกเขียน)
        // หมายเหตุความแม่นยำ: รายละเอียดการแบ่งย่อยภายในแต่ละส่วน (เช่นฟังแบ่งเป็นกี่พาร์ทย่อย) แหล่งข้อมูล
        // ที่หาได้ไม่ได้ระบุครบทุกจุด จึงออกแบบสัดส่วนเองให้สมเหตุสมผล (ระบุไว้ตรงนี้อย่างตรงไปตรงมา) —
        // แต่ "จำนวนข้อรวมต่อส่วน" (ฟัง/อ่าน/เขียน) และ "จำนวนข้อรวมทั้งฉบับ" ตรงกับที่ตรวจสอบมา
        // ══════════════════════════════════════════════════════════════════════════════════

        // คำศัพท์ธุรกิจ ~50 คำ — คิด/ตรวจสอบเองทุกคำ (ไม่มีแพ็กเกจข้อมูล BCT ที่ตรวจสอบแล้วให้ดึงเหมือน HSK)
        // เป็นคำธุรกิจพื้นฐานที่พบบ่อยมาก ความเสี่ยงผิดต่ำกว่าลำดับขีด/คำหายากมาก แต่ยังไม่ได้ผ่านการตรวจ
        // ไขว้กับพจนานุกรมเหมือนคำ HSK — บอกไว้ตรงๆ ในหน้าเลือกข้อสอบด้วย
        const BCT_VOCAB = [
            { word: '会议', pinyin: 'huìyì', thai: 'การประชุม' }, { word: '合同', pinyin: 'hétong', thai: 'สัญญา' },
            { word: '谈判', pinyin: 'tánpàn', thai: 'การเจรจาต่อรอง' }, { word: '客户', pinyin: 'kèhù', thai: 'ลูกค้า' },
            { word: '发票', pinyin: 'fāpiào', thai: 'ใบกำกับภาษี/ใบเสร็จ' }, { word: '预算', pinyin: 'yùsuàn', thai: 'งบประมาณ' },
            { word: '利润', pinyin: 'lìrùn', thai: 'กำไร' }, { word: '成本', pinyin: 'chéngběn', thai: 'ต้นทุน' },
            { word: '投资', pinyin: 'tóuzī', thai: 'การลงทุน' }, { word: '市场', pinyin: 'shìchǎng', thai: 'ตลาด' },
            { word: '产品', pinyin: 'chǎnpǐn', thai: 'สินค้า/ผลิตภัณฑ์' }, { word: '服务', pinyin: 'fúwù', thai: 'บริการ' },
            { word: '老板', pinyin: 'lǎobǎn', thai: 'เจ้านาย' }, { word: '员工', pinyin: 'yuángōng', thai: 'พนักงาน' },
            { word: '部门', pinyin: 'bùmén', thai: 'แผนก' }, { word: '项目', pinyin: 'xiàngmù', thai: 'โครงการ' },
            { word: '报告', pinyin: 'bàogào', thai: 'รายงาน' }, { word: '签字', pinyin: 'qiānzì', thai: 'เซ็นชื่อ' },
            { word: '账户', pinyin: 'zhànghù', thai: 'บัญชี' }, { word: '汇率', pinyin: 'huìlǜ', thai: 'อัตราแลกเปลี่ยน' },
            { word: '税', pinyin: 'shuì', thai: 'ภาษี' }, { word: '出口', pinyin: 'chūkǒu', thai: 'ส่งออก' },
            { word: '进口', pinyin: 'jìnkǒu', thai: 'นำเข้า' }, { word: '订单', pinyin: 'dìngdān', thai: 'ใบสั่งซื้อ' },
            { word: '库存', pinyin: 'kùcún', thai: 'สต๊อกสินค้า' }, { word: '物流', pinyin: 'wùliú', thai: 'โลจิสติกส์' },
            { word: '邮件', pinyin: 'yóujiàn', thai: 'อีเมล/จดหมาย' }, { word: '名片', pinyin: 'míngpiàn', thai: 'นามบัตร' },
            { word: '简历', pinyin: 'jiǎnlì', thai: 'เรซูเม่' }, { word: '面试', pinyin: 'miànshì', thai: 'สัมภาษณ์งาน' },
            { word: '工资', pinyin: 'gōngzī', thai: 'เงินเดือน' }, { word: '奖金', pinyin: 'jiǎngjīn', thai: 'โบนัส' },
            { word: '加班', pinyin: 'jiābān', thai: 'ทำงานล่วงเวลา' }, { word: '辞职', pinyin: 'cízhí', thai: 'ลาออก' },
            { word: '升职', pinyin: 'shēngzhí', thai: 'เลื่อนตำแหน่ง' }, { word: '出差', pinyin: 'chūchāi', thai: 'ไปทำงานต่างที่ (ทริปธุรกิจ)' },
            { word: '合作', pinyin: 'hézuò', thai: 'ร่วมมือ' }, { word: '竞争', pinyin: 'jìngzhēng', thai: 'แข่งขัน' },
            { word: '广告', pinyin: 'guǎnggào', thai: 'โฆษณา' }, { word: '品牌', pinyin: 'pǐnpái', thai: 'แบรนด์' },
            { word: '质量', pinyin: 'zhìliàng', thai: 'คุณภาพ' }, { word: '价格', pinyin: 'jiàgé', thai: 'ราคา' },
            { word: '折扣', pinyin: 'zhékòu', thai: 'ส่วนลด' }, { word: '付款', pinyin: 'fùkuǎn', thai: 'ชำระเงิน' },
            { word: '退货', pinyin: 'tuìhuò', thai: 'คืนสินค้า' }, { word: '保修', pinyin: 'bǎoxiū', thai: 'รับประกัน' },
            { word: '电话会议', pinyin: 'diànhuà huìyì', thai: 'ประชุมทางโทรศัพท์' }, { word: '同事', pinyin: 'tóngshì', thai: 'เพื่อนร่วมงาน' },
            { word: '签证', pinyin: 'qiānzhèng', thai: 'วีซ่า' }, { word: '预约', pinyin: 'yùyuē', thai: 'นัดหมาย' },
        ];
        // รวมคลังคำ HSK2-3 (ตรวจสอบแล้ว) เข้ากับคำธุรกิจ (ข้างบน) เป็น pool เดียว — คล้ายสัดส่วนที่
        // BCT ทางการบอกว่าคำศัพท์ทับซ้อนกับ HSK อยู่มาก มีคำเฉพาะธุรกิจเสริมเข้ามา (ตัดคำซ้ำออก)
        function bctPool() {
            const base = [...HSK_VOCAB.hsk2, ...HSK_VOCAB.hsk3];
            const existing = new Set(base.map(w => w.word));
            const extra = BCT_VOCAB.filter(w => !existing.has(w.word));
            return [...base, ...extra];
        }

        // ประโยคบริบทธุรกิจง่ายๆ สำหรับข้อ "เรียงคำ" ของ BCT-A (คิด/ตรวจไวยากรณ์เองทุกประโยค)
        const BCT_A_WRITE_SENTENCES = [
            { chunks: ['我们', '明天', '开会。'], thai: 'พวกเราจะประชุมกันพรุ่งนี้' },
            { chunks: ['请', '把合同', '签好。'], thai: 'กรุณาเซ็นสัญญาให้เรียบร้อย' },
            { chunks: ['这个产品', '很', '受欢迎。'], thai: 'สินค้านี้เป็นที่นิยมมาก' },
            { chunks: ['客户', '想', '降低价格。'], thai: 'ลูกค้าอยากให้ลดราคา' },
            { chunks: ['我', '需要', '一份报告。'], thai: 'ฉันต้องการรายงานหนึ่งฉบับ' },
            { chunks: ['会议', '定在', '下午三点。'], thai: 'การประชุมกำหนดไว้บ่ายสามโมง' },
            { chunks: ['他', '负责', '市场营销。'], thai: 'เขารับผิดชอบด้านการตลาด' },
            { chunks: ['请', '尽快', '回复邮件。'], thai: 'กรุณาตอบอีเมลโดยเร็วที่สุด' },
            { chunks: ['公司', '上个月', '招聘了新员工。'], thai: 'บริษัทรับพนักงานใหม่เมื่อเดือนที่แล้ว' },
            { chunks: ['这份合同', '下周', '到期。'], thai: 'สัญญาฉบับนี้จะหมดอายุสัปดาห์หน้า' },
            { chunks: ['我们', '需要', '提高产品质量。'], thai: 'เราต้องยกระดับคุณภาพสินค้า' },
            { chunks: ['请', '把账单', '发给我。'], thai: 'กรุณาส่งใบแจ้งหนี้มาให้ฉัน' },
        ];
        // โจทย์เขียนแบบเปิด (BCT-B) — จำลอง "เขียนอีเมล/รายงานธุรกิจ" ของข้อสอบจริง ตรวจด้วย AI
        const BCT_B_WRITE_PROMPTS = [
            { context: 'อีเมลแจ้งเลื่อนนัดประชุม', prompt: 'เขียนอีเมลสั้นๆ (2-3 ประโยค) แจ้งลูกค้าว่าจะเลื่อนนัดประชุมออกไปเป็นสัปดาห์หน้า' },
            { context: 'ข้อความแจ้งขาดประชุม', prompt: 'เขียนข้อความสั้นๆ แจ้งเพื่อนร่วมงานว่าจะขาดประชุมวันนี้เพราะติดธุระ' },
            { context: 'รายงานความคืบหน้าโครงการ', prompt: 'เขียนสรุปสั้นๆ (2-3 ประโยค) รายงานความคืบหน้าของโครงการให้หัวหน้า' },
            { context: 'อีเมลขอบคุณลูกค้า', prompt: 'เขียนอีเมลสั้นๆ ขอบคุณลูกค้าที่สั่งซื้อสินค้า' },
            { context: 'สอบถามราคาสินค้า', prompt: 'เขียนข้อความสั้นๆ สอบถามราคาสินค้าจากซัพพลายเออร์' },
            { context: 'แจ้งเลื่อนกำหนดส่งมอบ', prompt: 'เขียนอีเมลสั้นๆ แจ้งขอเลื่อนกำหนดส่งมอบสินค้า' },
        ];
        const BCT_WRITE_SYSTEM_PROMPT = (contextTh) =>
            `คุณเป็นครูสอนภาษาจีนธุรกิจให้คนไทย ผู้เรียนกำลังฝึกเขียน "${contextTh}" เป็นภาษาจีน\n` +
            `ตรวจสิ่งที่ผู้เรียนเขียนมา ตอบเป็นภาษาไทยเสมอ รูปแบบคำตอบต้องมี 3 ส่วนตามลำดับนี้เท่านั้น:\n` +
            `1) "ตัวอย่างที่ปรับปรุงแล้ว:" ตามด้วยข้อความภาษาจีนที่ถูกต้องและเหมาะสมกับบริบทธุรกิจ\n` +
            `2) "จุดที่แก้ไข:" อธิบายเป็นข้อๆ สั้นๆ ว่าแก้ตรงไหน เพราะอะไร (ทั้งไวยากรณ์และความเหมาะสมเชิงธุรกิจ)\n` +
            `3) "คะแนนความเหมาะสม:" ให้คะแนนเป็นตัวเลข 1-5\n` +
            `ถ้าเขียนดีอยู่แล้วให้บอกตรงๆ ว่าไม่ต้องแก้ไข`;
        const BCT_WRITE_REMINDER =
            'ย้ำ: ตรวจข้อความล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น ตอบตามรูปแบบ 3 ส่วนที่กำหนดไว้เป๊ะๆ ห้ามข้ามส่วนไหน ' +
            'และห้ามตอบเป็นภาษาอื่นนอกจากไทย';

        function buildBctExam(level) {
            const pool = bctPool();
            if (level === 'A') {
                return {
                    kind: 'bct', level, passPct: 60,
                    sections: [
                        { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 15, 'listen-tf'), ...genMcFromWord(pool, 15, 'listen-mc')] },
                        { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 15, 'read-mc'), ...genMcReverse(pool, 15)] },
                        { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteOrder(10) },
                    ],
                };
            }
            // level 'B'
            return {
                kind: 'bct', level, passPct: 60,
                sections: [
                    { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 20, 'listen-tf'), ...genMcFromWord(pool, 30, 'listen-mc')] },
                    { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 20, 'read-mc'), ...genMcReverse(pool, 20)] },
                    { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteEssay(2) },
                ],
            };
        }
        function genBctWriteOrder(count) {
            const picked = shuffleArr(BCT_A_WRITE_SENTENCES).slice(0, Math.min(count, BCT_A_WRITE_SENTENCES.length));
            return picked.map(s => ({ type: 'write-order', chunks: s.chunks, thai: s.thai, scrambled: shuffleArr(s.chunks) }));
        }
        function genBctWriteEssay(count) {
            const picked = shuffleArr(BCT_B_WRITE_PROMPTS).slice(0, Math.min(count, BCT_B_WRITE_PROMPTS.length));
            return picked.map(p => ({ type: 'write-essay', context: p.context, prompt: p.prompt }));
        }

        // ── ปุ่มตัวเลือกปรนัยใช้ร่วมกันหลายชนิดโจทย์ (listen-mc/read-mc/read-mc-reverse/write-pinyin-char)
        function McChoices({ choices, correct, selected, onPick }) {
            return (
                <div className="grid grid-cols-1 gap-2">
                    {choices.map((c, i) => {
                        const isCorrect = c === correct;
                        const isPicked = c === selected;
                        let cls = 'border-gray-200 hover:border-brand text-gray-700 bg-white';
                        if (selected != null) {
                            if (isCorrect) cls = 'border-green-400 bg-green-50 text-green-700';
                            else if (isPicked) cls = 'border-red-300 bg-red-50 text-red-600';
                        }
                        return (
                            <button key={i} onClick={() => onPick(c)} disabled={selected != null}
                                className={`text-left px-4 py-3 rounded-xl border-2 font-medium text-sm transition ${cls}`}>{c}</button>
                        );
                    })}
                </div>
            );
        }

        // ── ข้อสอบ HSK (จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ HSK 2.0 ทางการ (ดูหมายเหตุที่
        //    buildHskExam ด้านบน) เนื้อหาสร้างจากคลังคำศัพท์ HSK_VOCAB ที่ตรวจสอบแล้ว รองรับเฉพาะ
        //    ภาษาจีนตอนนี้ — ถ้า langId ไม่ใช่ lang-cn (เผื่อผู้ใช้สลับภาษาที่แถบข้างระหว่างอยู่โหมดนี้)
        //    ให้ขึ้นข้อความชวนสลับกลับแทนที่จะพังเงียบๆ
        function HskExamView({ langId, setLangId, setXp }) {
            const [examType, setExamType] = useState(null); // 'hsk' | 'bct' — เลือกก่อนเลือกระดับ
            const [level, setLevel] = useState(null); // HSK: 1|2|3, BCT: 'A'|'B'
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true); // หน้าแนะนำก่อนเริ่มแต่ละส่วน
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null); // string | boolean | ขึ้นกับชนิดโจทย์
            const [placedIdx, setPlacedIdx] = useState([]); // สำหรับ write-order เท่านั้น
            const [essayText, setEssayText] = useState(''); // สำหรับ write-essay (BCT-B) เท่านั้น
            const [essayFeedback, setEssayFeedback] = useState('');
            const [essayStatus, setEssayStatus] = useState(''); // '' | 'loading' | 'done' | 'error'
            const [sectionResults, setSectionResults] = useState([]); // [{key,title,correct,total}]
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => {
                setAnswered(false); setUserAnswer(null); setPlacedIdx([]);
                setEssayText(''); setEssayFeedback(''); setEssayStatus('');
            };

            const start = (type, lvl) => {
                const built = type === 'bct' ? buildBctExam(lvl) : buildHskExam(lvl);
                setExamType(type); setLevel(lvl); setExam(built);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            const examLabel = examType === 'bct' ? `BCT (${level})` : `HSK${level}`;

            if (langId !== 'lang-cn') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบ HSK/BCT รองรับเฉพาะภาษาจีนตอนนี้</p>
                            <button onClick={() => setLangId('lang-cn')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาจีน</button>
                        </div>
                    </div>
                );
            }

            // ── ขั้นที่ 1: เลือกประเภทข้อสอบ ──────────────────────────────────────────────
            if (!examType) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบภาษาจีน (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">เลือกประเภทข้อสอบก่อน:</p>
