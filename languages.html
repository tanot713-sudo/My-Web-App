        }

        // 듣기 — 즉시 응답 (quick response) ประโยคเดียว + เลือกคำตอบที่เหมาะสมจาก 3 ตัวเลือก
        const KR_RESPONSES = [
            { phrase: "실례합니다, 지금 몇 시예요?", choices: ["세 시예요.", "네, 맞아요.", "감사합니다."], correct: "세 시예요." },
            { phrase: "요즘 어떻게 지내세요?", choices: ["잘 지내요.", "세 시예요.", "한국 사람이에요."], correct: "잘 지내요." },
            { phrase: "이 가방은 얼마예요?", choices: ["천 원이에요.", "학교예요.", "내일이에요."], correct: "천 원이에요." },
            { phrase: "제가 도와드릴까요?", choices: ["네, 부탁해요.", "세 시예요.", "그렇군요."], correct: "네, 부탁해요." },
            { phrase: "실례지만, 성함이 어떻게 되세요?", choices: ["김민수예요.", "잘 지내요.", "여기예요."], correct: "김민수예요." },
            { phrase: "커피 한잔 하시겠어요?", choices: ["네, 좋아요.", "아니요, 김민수예요.", "그래요?"], correct: "네, 좋아요." },
            { phrase: "숙제를 벌써 했어요?", choices: ["네, 했어요.", "네, 가요.", "아니요, 잘 지내요."], correct: "네, 했어요." },
            { phrase: "내일 또 만나요.", choices: ["네, 내일 봐요.", "네, 부탁해요.", "아니요, 괜찮아요."], correct: "네, 내일 봐요." },
        ];
        function genKrResponseMc(count) {
            const picked = shuffleArr(KR_RESPONSES).slice(0, Math.min(count, KR_RESPONSES.length));
            return picked.map((r, ri) => ({ type: 'kr-response-mc', phrase: r.phrase, choices: shuffleArr(r.choices), correct: r.correct, voiceSlot: ri }));
        }

        // 듣기 — 짧은 대화 (short dialogue) บทสนทนาสั้น 2-3 ประโยค + คำถาม 1 ข้อ/บท
        const KR_DIALOGUES = [
            { lines: [{ speaker: "A", text: "여보세요, 지금 어디예요?" }, { speaker: "B", text: "저는 지금 집이에요." }, { speaker: "A", text: "알겠어요, 이따가 전화할게요." }], q: "B는 지금 어디에 있어요?", choices: ["집", "학교", "회사"], correct: "집" },
            { lines: [{ speaker: "A", text: "이 사과는 얼마예요?" }, { speaker: "B", text: "천 원이에요." }, { speaker: "A", text: "두 개 주세요." }], q: "사과 한 개는 얼마예요?", choices: ["천 원", "이천 원", "오백 원"], correct: "천 원" },
            { lines: [{ speaker: "A", text: "오늘 저녁에 시간 있어요?" }, { speaker: "B", text: "네, 있어요. 왜요?" }, { speaker: "A", text: "같이 영화 볼래요?" }, { speaker: "B", text: "좋아요!" }], q: "두 사람은 오늘 저녁에 뭐 할 거예요?", choices: ["영화를 봐요", "저녁을 먹어요", "공부해요"], correct: "영화를 봐요" },
            { lines: [{ speaker: "A", text: "오늘 날씨가 어때요?" }, { speaker: "B", text: "아주 추워요. 눈도 와요." }, { speaker: "A", text: "그럼 따뜻하게 입으세요." }], q: "오늘 날씨는 어때요?", choices: ["춥고 눈이 와요", "덥고 맑아요", "비가 와요"], correct: "춥고 눈이 와요" },
            { lines: [{ speaker: "A", text: "민수 씨, 이제 뭐 할 거예요?" }, { speaker: "B", text: "도서관에서 책을 빌리고 집에 갈 거예요." }, { speaker: "A", text: "저도 같이 가요." }], q: "민수 씨는 도서관에서 뭐 할 거예요?", choices: ["책을 빌려요", "밥을 먹어요", "잠을 자요"], correct: "책을 빌려요" },
            { lines: [{ speaker: "A", text: "실례합니다, 지하철역이 어디예요?" }, { speaker: "B", text: "이 길로 쭉 가세요." }, { speaker: "A", text: "감사합니다." }], q: "지하철역에 어떻게 가요?", choices: ["이 길로 쭉 가요", "오른쪽으로 가요", "버스를 타요"], correct: "이 길로 쭉 가요" },
            { lines: [{ speaker: "A", text: "내일 몇 시에 만날까요?" }, { speaker: "B", text: "아홉 시 어때요?" }, { speaker: "A", text: "좋아요, 아홉 시에 봐요." }], q: "두 사람은 내일 몇 시에 만나요?", choices: ["아홉 시", "여덟 시", "열 시"], correct: "아홉 시" },
            { lines: [{ speaker: "A", text: "뭐 드시겠어요?" }, { speaker: "B", text: "저는 비빔밥 주세요." }, { speaker: "A", text: "네, 잠시만 기다려 주세요." }], q: "B는 뭘 주문했어요?", choices: ["비빔밥", "김치찌개", "냉면"], correct: "비빔밥" },
            { lines: [{ speaker: "A", text: "어디가 아파요?" }, { speaker: "B", text: "머리가 아프고 열이 나요." }, { speaker: "A", text: "약을 먹고 쉬세요." }], q: "B는 어디가 아파요?", choices: ["머리", "배", "다리"], correct: "머리" },
            { lines: [{ speaker: "A", text: "주말에 뭐 했어요?" }, { speaker: "B", text: "친구하고 등산했어요." }, { speaker: "A", text: "재미있었겠어요." }], q: "B는 주말에 뭐 했어요?", choices: ["등산했어요", "영화를 봤어요", "집에서 쉬었어요"], correct: "등산했어요" },
            { lines: [{ speaker: "A", text: "가족이 몇 명이에요?" }, { speaker: "B", text: "저까지 네 명이에요. 부모님하고 언니가 있어요." }, { speaker: "A", text: "저도 언니가 있어요." }], q: "B의 가족은 몇 명이에요?", choices: ["네 명", "세 명", "다섯 명"], correct: "네 명" },
            { lines: [{ speaker: "A", text: "요즘 무슨 일 하세요?" }, { speaker: "B", text: "회사에 다녀요. 회사원이에요." }, { speaker: "A", text: "그렇군요." }], q: "B는 무슨 일을 해요?", choices: ["회사원이에요", "학생이에요", "의사예요"], correct: "회사원이에요" },
            { lines: [{ speaker: "A", text: "여름 방학에 어디에 갈 거예요?" }, { speaker: "B", text: "부산에 갈 거예요. 바다를 보고 싶어요." }, { speaker: "A", text: "좋겠어요." }], q: "B는 여름 방학에 어디에 갈 거예요?", choices: ["부산", "제주도", "서울"], correct: "부산" },
            { lines: [{ speaker: "A", text: "취미가 뭐예요?" }, { speaker: "B", text: "저는 음악 듣는 걸 좋아해요." }, { speaker: "A", text: "저도 음악을 좋아해요." }], q: "B의 취미는 뭐예요?", choices: ["음악 듣기", "운동하기", "요리하기"], correct: "음악 듣기" },
        ];
        function genKrDialogueMc(count) {
            const picked = shuffleArr(KR_DIALOGUES).slice(0, Math.min(count, KR_DIALOGUES.length));
            return picked.map((d, di) => ({ type: 'kr-dialogue-mc', lines: d.lines, q: d.q, choices: shuffleArr(d.choices), correct: d.correct, dialogueSlot: di }));
        }

        // 듣기 — 긴 이야기 (talk) บทพูดสั้นคนเดียว + คำถาม 2 ข้อ/บท
        const KR_TALKS = [
            { text: "안녕하세요, 저는 마이클입니다. 저는 미국에서 왔습니다. 지금 한국어를 배우고 있습니다. 한국 음식도 아주 좋아합니다. 특히 김치를 제일 좋아합니다.", questions: [
                { q: "마이클 씨는 어느 나라에서 왔어요?", choices: ["미국", "한국", "일본"], correct: "미국" },
                { q: "마이클 씨는 무슨 음식을 제일 좋아해요?", choices: ["김치", "라면", "비빔밥"], correct: "김치" },
            ] },
            { text: "오늘은 제 생일입니다. 저녁에 가족들과 식당에서 밥을 먹을 겁니다. 그리고 케이크도 먹을 겁니다. 아주 기대됩니다.", questions: [
                { q: "오늘은 무슨 날이에요?", choices: ["생일", "방학", "시험"], correct: "생일" },
                { q: "저녁에 무엇을 할 거예요?", choices: ["가족과 식당에 가요", "학교에 가요", "잠을 자요"], correct: "가족과 식당에 가요" },
            ] },
            { text: "저는 매일 아침 일곱 시에 일어납니다. 그리고 삼십 분 동안 운동을 합니다. 아침을 먹고 회사에 갑니다. 회사는 집에서 가깝습니다.", questions: [
                { q: "몇 시에 일어나요?", choices: ["일곱 시", "여섯 시", "여덟 시"], correct: "일곱 시" },
                { q: "회사는 집에서 어때요?", choices: ["가까워요", "멀어요", "아주 커요"], correct: "가까워요" },
            ] },
            { text: "내일은 날씨가 안 좋습니다. 비가 오고 바람도 붑니다. 그래서 밖에 나가지 않는 것이 좋습니다.", questions: [
                { q: "내일 날씨는 어때요?", choices: ["비가 오고 바람이 불어요", "맑고 따뜻해요", "눈이 와요"], correct: "비가 오고 바람이 불어요" },
                { q: "내일은 어떻게 하는 것이 좋아요?", choices: ["밖에 나가지 않아요", "산에 가요", "수영해요"], correct: "밖에 나가지 않아요" },
            ] },
        ];
        function genKrTalkMc(count) {
            const picked = shuffleArr(KR_TALKS).slice(0, Math.min(count, KR_TALKS.length));
            const out = [];
            picked.forEach((t, ti) => { t.questions.forEach(q => out.push({ type: 'kr-talk-mc', text: t.text, q: q.q, choices: shuffleArr(q.choices), correct: q.correct, voiceSlot: ti })); });
            return out;
        }

        function buildTopikExam() {
            const pool = krVocabPool();
            return {
                kind: 'topik',
                sections: [
                    { key: 'listening', title: '듣기 (ฟัง)', icon: '🎧',
                        questions: [...genKrResponseMc(8), ...genKrDialogueMc(14), ...genKrTalkMc(4)] },
                    { key: 'reading', title: '읽기 (อ่าน)', icon: '📖',
                        questions: [...genKrWordMeaningMc(pool, 15), ...genGrammarMc(KR_GRAMMAR, 10), ...genKrPassageMc(KR_READING_SHORT, 10), ...genKrPassageMc(KR_READING_LONG, 5)] },
                ],
            };
        }

        // ── ข้อสอบภาษาเกาหลี (จำลอง) — โคลนโครงสร้าง state machine มาจาก JpExamView แบบเป๊ะๆ (ไม่มี
        //    ส่วนเขียน/พูดเหมือนกัน) ไม่มีขั้น "เลือกประเภทข้อสอบ" เพราะตอนนี้มีแค่ TOPIK I ชุดเดียว
        //    (TOPIK II ที่มีส่วนเขียนเรียงความ เป็น follow-up ในอนาคต)
        function KrExamView({ langId, setLangId, setXp }) {
            const [started, setStarted] = useState(false);
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true);
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null);
            const [sectionResults, setSectionResults] = useState([]);
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => { setAnswered(false); setUserAnswer(null); };
            const start = () => {
                setExam(buildTopikExam());
                setStarted(true);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            // ── เล่นเสียงอัตโนมัติทันทีที่เข้าโจทย์ฟังข้อใหม่ (듣기 เท่านั้น) — ต้องอยู่ก่อน early
            //    return ทุกอันเพราะเป็น hook ──
            useEffect(() => {
                if (!exam || showIntro || finished) return;
                const sec = exam.sections[sectionIdx];
                const question = sec && sec.questions[qIdx];
                if (!question) return;
                const timers = [];
                const t0 = setTimeout(() => {
                    if (question.type === 'kr-dialogue-mc') {
                        question.lines.forEach((ln, i) => timers.push(setTimeout(() => speakVoice(ln.text, 'ko', question.dialogueSlot * 2 + (i % 2)), i * 1800)));
                    } else if (question.type === 'kr-response-mc') {
                        speakVoice(question.phrase, 'ko', question.voiceSlot);
                    } else if (question.type === 'kr-talk-mc') {
                        speakVoice(question.text, 'ko', question.voiceSlot);
                    }
                }, 400);
                return () => { clearTimeout(t0); timers.forEach(clearTimeout); };
            }, [exam, sectionIdx, qIdx, showIntro]);

            if (langId !== 'lang-kr') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบชุดนี้รองรับเฉพาะภาษาเกาหลี</p>
                            <button onClick={() => setLangId('lang-kr')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาเกาหลี</button>
                        </div>
                    </div>
                );
            }

            if (!started) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบ TOPIK I (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">วัดระดับภาษาเกาหลีขั้นต้น (TOPIK I ระดับ 1-2) — 2 วิชาตามโครงสร้างจริง</p>
                            <button onClick={start} className="w-full p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white mb-5">
                                <div className="text-lg font-bold text-brand mb-1">เริ่มสอบ TOPIK I</div>
                                <div className="text-xs text-gray-500">듣기 (ฟัง) 30 + 읽기 (อ่าน) 40 = 70 ข้อ ตามโครงสร้างจริง</div>
                            </button>
                            <p className="text-xs text-gray-400 leading-relaxed text-left">
                                หมายเหตุ: เป็นแบบทดสอบจำลองที่แต่งเนื้อหาเองทั้งหมด ไม่ใช่ข้อสอบทางการที่หลุดออกมา จำนวนข้อรวมเท่าโครงสร้างจริง
                                (ฟัง 30 + อ่าน 40 = 70) TOPIK I จริงให้คะแนนแยกเป็นคะแนนดิบต่อวิชาและมีเกณฑ์ผ่านขั้นต่ำตามระดับ (1/2) ไม่ใช่
                                คะแนนรวมแบบนี้ เว็บนี้เลยแสดงผลเป็นคะแนนดิบ (ถูกกี่ข้อ) แทน<br />
                                <b>ความแตกต่างจากข้อสอบจริง</b>: 듣기 (ฟัง) แสดงบทพูดเป็นตัวอักษรคู่กับเสียงด้วย (ข้อสอบจริงมีแต่เสียงล้วน
                                ฟังได้ครั้งเดียว ไม่มีตัวอักษรให้อ่านและฟังซ้ำได้) เพื่อช่วยผู้เริ่มต้นตามทัน — TOPIK I ไม่มีส่วนเขียน (TOPIK II
                                ถึงจะมีส่วนเขียนเรียงความ ยังไม่รองรับตอนนี้)
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = start;
            const backToStart = () => { setStarted(false); setExam(null); };

            if (finished) {
                const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = sectionResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลสอบ TOPIK I</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง (คะแนนดิบ — TOPIK I จริงให้คะแนนแยกวิชาและมีเกณฑ์ผ่านขั้นต่ำตามระดับ ไม่ใช่คะแนนรวมแบบนี้)</p>
                            <div className="grid grid-cols-2 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.correct}/{r.total}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">สอบใหม่ (สุ่มโจทย์ใหม่)</button>
                                <button onClick={backToStart} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">กลับหน้าเลือกสอบ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">TOPIK I · ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

            const q = section.questions[qIdx];

            const finishSection = () => {
                const results = [...sectionResults, { key: section.key, title: section.title, correct: correctInSection, total: section.questions.length }];
                setSectionResults(results);
                if (sectionIdx + 1 >= exam.sections.length) {
                    setFinished(true);
                } else {
                    setSectionIdx(i => i + 1);
                    setShowIntro(true);
                    setQIdx(0);
                    resetPerQuestion();
                    setCorrectInSection(0);
                }
            };
            const nextQuestion = () => {
                if (qIdx + 1 >= section.questions.length) { finishSection(); return; }
                setQIdx(i => i + 1); resetPerQuestion();
            };
            const recordAnswer = (isCorrect, wrongEntry) => {
                setAnswered(true);
                if (isCorrect) { setCorrectInSection(c => c + 1); setXp(x => x + 2); }
                else if (wrongEntry) setAllWrong(w => [...w, wrongEntry]);
            };
            const pickMc = (choice) => {
                if (answered) return;
                setUserAnswer(choice);
                const isCorrect = choice === q.correct;
                const leftLabel = q.word || q.sentence || q.phrase || q.q || q.thai;
                recordAnswer(isCorrect, isCorrect ? null : { left: leftLabel || 'ข้อนี้', right: q.correct });
            };

            const progressLabel = `${section.title} · ข้อ ${qIdx + 1}/${section.questions.length}`;

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-xl mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-4">
                            <span className="text-xs font-bold text-gray-400 uppercase">TOPIK I · {progressLabel}</span>
                            <span className="text-xs font-bold text-brand">ถูก {correctInSection} ข้อ</span>
                        </div>

                        {q.type === 'kr-word-meaning-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-3xl font-bold text-gray-900 mb-1">{q.word}</div>
                                    <div className="text-sm text-gray-400 mb-2">{q.romaja}</div>
                                    <button onClick={() => speak(q.word, 'ko')} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังเสียง</button>
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกความหมายภาษาไทยที่ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'grammar-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-lg font-semibold text-gray-900">{q.sentence}</div>
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกคำที่เติมในช่องว่าง（＿）ได้ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'passage-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                                    <p className="text-sm text-gray-700 leading-relaxed">{q.text}</p>
                                </div>
                                <p className="text-gray-700 font-semibold mb-3">{q.q}</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'kr-response-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <p className="text-xs text-gray-400 mb-3">🎧 ฟังประโยค แล้วเลือกคำตอบที่เหมาะสมที่สุด</p>
                                    <div className="text-lg font-semibold text-gray-900 mb-2">{q.phrase}</div>
                                    <button onClick={() => speakVoice(q.phrase, 'ko', q.voiceSlot)} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังอีกครั้ง</button>
                                </div>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'kr-dialogue-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                                    <p className="text-[10px] font-bold text-gray-400 uppercase mb-2">🎧 บทสนทนา (สลับผู้พูด 2 คน)</p>
                                    <div className="space-y-1">
                                        {q.lines.map((ln, i) => <p key={i} className="text-sm text-gray-700"><b>{ln.speaker}:</b> {ln.text}</p>)}
                                    </div>
                                    <button onClick={() => q.lines.forEach((ln, i) => setTimeout(() => speakVoice(ln.text, 'ko', q.dialogueSlot * 2 + (i % 2)), i * 1800))}
                                        className="mt-2 inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังบทสนทนาอีกครั้ง</button>
                                </div>
                                <p className="text-gray-700 font-semibold mb-3">{q.q}</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'kr-talk-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                                    <p className="text-[10px] font-bold text-gray-400 uppercase mb-2">🎧 บทพูดสั้น</p>
                                    <p className="text-sm text-gray-700 leading-relaxed">{q.text}</p>
                                    <button onClick={() => speakVoice(q.text, 'ko', q.voiceSlot)} className="mt-2 inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังบทพูดอีกครั้ง</button>
                                </div>
                                <p className="text-gray-700 font-semibold mb-3">{q.q}</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {answered && (
                            <button onClick={nextQuestion} className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white">
                                {qIdx + 1 >= section.questions.length ? (sectionIdx + 1 >= exam.sections.length ? 'ดูผลสอบ' : 'ไปส่วนต่อไป') : 'ข้อต่อไป'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }


        // ══════════════════════════════════════════════════════════════════════════════════
        // แบบทดสอบความเข้าใจภาษาจีนกวางตุ้ง — ต่างจาก HSK/TOEIC/IELTS/JLPT/TOPIK ตรงที่ "ไม่ได้จำลอง
        // ข้อสอบทางการชุดใดชุดหนึ่ง" เพราะค้นหาแล้วไม่พบข้อสอบวัดระดับภาษากวางตุ้งที่เป็นมาตรฐานสากล
        // เปิดเผยโครงสร้างชัดเจนแบบ HSK/TOPIK เลย (มีแต่ LPAT ซึ่งเป็นข้อสอบครูในฮ่องกงโดยเฉพาะ, CRAT
        // ซึ่งวัดแค่การออกเสียง/สำเนียง ไม่ใช่ฟัง-อ่าน-ไวยากรณ์, หรือข้อสอบเฉพาะของแต่ละสถาบัน) — จึงออกแบบ
        // โครงสร้างเองทั้งหมด (ไม่อ้างว่าจำลองของจริง) เป็นแบบทดสอบความเข้าใจทั่วไป 2 ส่วน (ฟัง+อ่าน)
        // เนื้อหาทั้งหมดแต่งเอง ใช้คำ/ไวยากรณ์กวางตุ้งแท้ (ไม่ใช่จีนกลางสวมตัวอักษร) — คำศัพท์ส่วนคำศัพท์
        // ดึงจาก vocab-data ภาษากวางตุ้ง (Stage 1)
        // ══════════════════════════════════════════════════════════════════════════════════

        // คำศัพท์เฉพาะทาง (กฎหมาย/วิศวกรรม/ธุรกิจ) ไม่ควรหลุดเข้าไปในคลังคำศัพท์แบบทดสอบความเข้าใจข้างบน
        // (ระดับพื้นฐานทั่วไป) — กันไว้เหมือน KR_SPECIALTY_CATS/JP_SPECIALTY_CATS คำกลุ่มนี้ยังคงโผล่ใน
        // โหมด SRS ทั่วไป (ฝึกเขียน/dictation/compose) ตามปกติ เพราะ vocabPool() (คนละฟังก์ชัน) ไม่กรองออก
        const YUE_SPECIALTY_CATS = ['กฎหมาย (Legal Cantonese)', 'วิศวกรรม (Engineering Cantonese)', 'ธุรกิจเชิงลึก (Business Cantonese)'];
        function yueVocabPool() {
            const out = [];
            const cats = VOCAB['lang-yue'] || {};
            Object.keys(cats).forEach(cat => {
                if (YUE_SPECIALTY_CATS.includes(cat)) return;
                (cats[cat] || []).forEach((w, i) => {
                    if (!w.jyutping) return;
                    out.push({ key: `lang-yue::vocab-${cat}::${i}`, word: w.word, jyutping: w.jyutping, thai: w.thai });
                });
            });
            return out;
        }
        function genYueWordMeaningMc(pool, count) {
            // 詞彙 (คำศัพท์) — โชว์คำ+jyutping ให้เลือกความหมายไทยที่ถูกต้อง
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.word !== item.word)).slice(0, 3);
                const choices = shuffleArr([item.thai, ...distractors.map(d => d.thai)]);
                return { type: 'yue-word-meaning-mc', word: item.word, jyutping: item.jyutping, correct: item.thai, choices };
            });
        }

        // 語法 (grammar-mc ใช้ renderer ร่วมกับ TOEIC Part 5/JLPT文法/TOPIK 조사 ได้เลย) — ครอบคลุมจุดที่
        // เป็นเอกลักษณ์ของไวยากรณ์กวางตุ้ง (唔 ปฏิเสธกริยา/คุณศัพท์ vs 冇 ปฏิเสธการมี, 咗/緊/過 คำเสริม
        // แสดงกาล/ลักษณะ (aspect markers), 嘅 คำแสดงความเป็นเจ้าของ, 喺 บอกสถานที่, 定 แปลว่า "หรือ", 同 แปลว่า "กับ")
        const YUE_GRAMMAR = [
            { sentence: "我___鍾意食辣嘢。", choices: ["唔", "冇", "咗", "緊"], correct: "唔" },
            { sentence: "佢已經食___飯喇。", choices: ["咗", "緊", "過", "添"], correct: "咗" },
            { sentence: "我而家做___功課。", choices: ["緊", "咗", "過", "喇"], correct: "緊" },
            { sentence: "呢個係我___書。", choices: ["嘅", "嘅嘢", "個", "啲"], correct: "嘅" },
            { sentence: "我___屋企食飯。", choices: ["喺", "係", "去", "響"], correct: "喺" },
            { sentence: "你想食飯___想食麵？", choices: ["定", "同", "話", "都"], correct: "定" },
            { sentence: "我___朋友一齊去。", choices: ["同", "定", "喺", "嘅"], correct: "同" },
            { sentence: "你食___飯未呀？", choices: ["咗", "緊", "過", "得"], correct: "咗" },
            { sentence: "我去___日本旅行。", choices: ["過", "咗", "緊", "添"], correct: "過" },
            { sentence: "我___錢喇，唔可以買嘢。", choices: ["冇", "唔", "未", "無"], correct: "冇" },
        ];

        // 閱讀 — บทความสั้น 1 คำถาม/บท เขียนเป็นภาษากวางตุ้งพูด/เขียนแบบไม่เป็นทางการจริง
        const YUE_READING = [
            { text: "我叫Tanot，我而家喺香港學廣東話。廣東話同普通話唔同，發音同詞彙都有好多分別，不過我覺得好好玩。我每日都會聽多啲廣東歌，仲會睇多啲香港嘅電視劇，希望可以講得流利啲。", questions: [
                { q: "我而家喺邊度學廣東話？", choices: ["香港", "北京", "曼谷"], correct: "香港" },
            ] },
            { text: "尋日我去咗超級市場買嘢。我買咗生果、麵包同埋牛奶。落雨嘅時候我冇帶遮，所以返到屋企個時，全身都濕晒。", questions: [
                { q: "尋日落雨嘅時候，我點呀？", choices: ["全身濕晒", "冇事", "好開心"], correct: "全身濕晒" },
            ] },
            { text: "我屋企就喺地鐵站附近，行路去返工只需要十分鐘。呢度嘅交通好方便，附近仲有好多餐廳同埋商場，平時買嘢食嘢都好近。", questions: [
                { q: "由屋企去返工要幾耐？", choices: ["十分鐘", "一個鐘", "半個鐘"], correct: "十分鐘" },
            ] },
            { text: "我阿哥喺一間銀行做嘢，佢每日都好忙，成日要開會。雖然咁樣，佢都幾鍾意份工，因為同事都好好人，而且人工都幾唔錯。", questions: [
                { q: "我阿哥做咩工作？", choices: ["喺銀行做嘢", "做老師", "做醫生"], correct: "喺銀行做嘢" },
            ] },
            { text: "舊年聖誕節，我同屋企人一齊去日本旅行。嗰度落緊雪，天氣好凍，不過風景真係靚到爆。我哋影咗好多相，仲食咗好多好食嘅嘢。", questions: [
                { q: "我哋舊年聖誕節去咗邊度？", choices: ["日本", "韓國", "台灣"], correct: "日本" },
            ] },
        ];
        function genYuePassageMc(dataset, count) {
            const picked = shuffleArr(dataset).slice(0, Math.min(count, dataset.length));
            const out = [];
            picked.forEach(p => { p.questions.forEach(q => out.push({ type: 'passage-mc', text: p.text, q: q.q, choices: shuffleArr(q.choices), correct: q.correct })); });
            return out;
        }

        // 聽力 — 即時回應 (quick response) ประโยคเดียว + เลือกคำตอบที่เหมาะสมจาก 3 ตัวเลือก
        const YUE_RESPONSES = [
            { phrase: "而家幾點呀？", choices: ["而家三點。", "係呀，啱嘅。", "多謝晒。"], correct: "而家三點。" },
            { phrase: "你食咗飯未呀？", choices: ["食咗喇。", "而家三點。", "我叫Tanot。"], correct: "食咗喇。" },
            { phrase: "呢件衫幾多錢呀？", choices: ["一百蚊。", "好食呀。", "聽日見。"], correct: "一百蚊。" },
            { phrase: "唔該幫我叫架的士。", choices: ["好，等我幫你叫。", "多謝晒。", "我唔識。"], correct: "好，等我幫你叫。" },
            { phrase: "你叫咩名呀？", choices: ["我叫Tanot。", "而家三點。", "好凍呀。"], correct: "我叫Tanot。" },
            { phrase: "聽日見唔見面呀？", choices: ["好呀，聽日見。", "唔該晒。", "幾多錢呀。"], correct: "好呀，聽日見。" },
        ];
        function genYueResponseMc(count) {
            const picked = shuffleArr(YUE_RESPONSES).slice(0, Math.min(count, YUE_RESPONSES.length));
            return picked.map((r, ri) => ({ type: 'yue-response-mc', phrase: r.phrase, choices: shuffleArr(r.choices), correct: r.correct, voiceSlot: ri }));
        }

        // 聽力 — 短對話 (short dialogue) บทสนทนาสั้น 2-4 ประโยค + คำถาม 1 ข้อ/บท
        const YUE_DIALOGUES = [
            { lines: [{ speaker: "A", text: "你而家做緊乜嘢呀？" }, { speaker: "B", text: "我做緊功課。" }], q: "B做緊乜嘢？", choices: ["做緊功課", "食緊飯", "瞓緊覺"], correct: "做緊功課" },
            { lines: [{ speaker: "A", text: "呢個幾多錢呀？" }, { speaker: "B", text: "五十蚊。" }, { speaker: "A", text: "平啲得唔得呀？" }, { speaker: "B", text: "好，四十蚊俾你。" }], q: "最後幾多錢？", choices: ["四十蚊", "五十蚊", "三十蚊"], correct: "四十蚊" },
            { lines: [{ speaker: "A", text: "你聽日得唔得閒呀？" }, { speaker: "B", text: "得閒，做咩呀？" }, { speaker: "A", text: "一齊去睇戲好唔好？" }, { speaker: "B", text: "好呀！" }], q: "佢哋聽日會做乜嘢？", choices: ["去睇戲", "去食飯", "去返工"], correct: "去睇戲" },
            { lines: [{ speaker: "A", text: "今日天氣點呀？" }, { speaker: "B", text: "好熱呀，仲落緊雨添。" }], q: "今日天氣點呀？", choices: ["好熱又落雨", "好凍", "好晴"], correct: "好熱又落雨" },
            { lines: [{ speaker: "A", text: "你識唔識講廣東話呀？" }, { speaker: "B", text: "識少少，仲學緊。" }], q: "B廣東話講得點呀？", choices: ["識少少，仲學緊", "講得好流利", "完全唔識"], correct: "識少少，仲學緊" },
            { lines: [{ speaker: "A", text: "呢度有冇廁所呀？" }, { speaker: "B", text: "有呀，喺嗰邊。" }, { speaker: "A", text: "多謝晒。" }], q: "廁所喺邊度？", choices: ["喺嗰邊", "喺呢度", "冇廁所"], correct: "喺嗰邊" },
            { lines: [{ speaker: "A", text: "你今日幾點返工呀？" }, { speaker: "B", text: "九點。" }, { speaker: "A", text: "咁遲呀？" }, { speaker: "B", text: "唔遲呀，我哋公司九點開門㗎嘛。" }], q: "B幾點返工？", choices: ["九點", "八點", "十點"], correct: "九點" },
            { lines: [{ speaker: "A", text: "你屋企有幾多人呀？" }, { speaker: "B", text: "四個人，爸爸媽媽同我細佬。" }], q: "B屋企有幾多人？", choices: ["四個人", "三個人", "五個人"], correct: "四個人" },
        ];
        function genYueDialogueMc(count) {
            const picked = shuffleArr(YUE_DIALOGUES).slice(0, Math.min(count, YUE_DIALOGUES.length));
            return picked.map((d, di) => ({ type: 'yue-dialogue-mc', lines: d.lines, q: d.q, choices: shuffleArr(d.choices), correct: d.correct, dialogueSlot: di }));
        }

        function buildYueExam() {
            const pool = yueVocabPool();
            return {
                kind: 'yue-comprehension',
                sections: [
                    { key: 'listening', title: '聽力 (ฟัง)', icon: '🎧',
                        questions: [...genYueResponseMc(6), ...genYueDialogueMc(8)] },
                    { key: 'reading', title: '閱讀 (อ่าน)', icon: '📖',
                        questions: [...genYueWordMeaningMc(pool, 15), ...genGrammarMc(YUE_GRAMMAR, 10), ...genYuePassageMc(YUE_READING, 5)] },
                ],
            };
        }

        // ── แบบทดสอบความเข้าใจภาษาจีนกวางตุ้ง — โคลนโครงสร้าง state machine มาจาก KrExamView (ไม่มีส่วนเขียน
        //    เหมือนกัน) ไม่มีขั้น "เลือกประเภทข้อสอบ" เพราะมีแบบทดสอบเดียว
        function YueExamView({ langId, setLangId, setXp }) {
            const [started, setStarted] = useState(false);
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true);
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null);
            const [sectionResults, setSectionResults] = useState([]);
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => { setAnswered(false); setUserAnswer(null); };
            const start = () => {
                setExam(buildYueExam());
                setStarted(true);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            // ── เล่นเสียงอัตโนมัติทันทีที่เข้าโจทย์ฟังข้อใหม่ (聽力 เท่านั้น) — ต้องอยู่ก่อน early
            //    return ทุกอันเพราะเป็น hook ──
            useEffect(() => {
                if (!exam || showIntro || finished) return;
                const sec = exam.sections[sectionIdx];
                const question = sec && sec.questions[qIdx];
                if (!question) return;
                const timers = [];
                const t0 = setTimeout(() => {
                    if (question.type === 'yue-dialogue-mc') {
                        question.lines.forEach((ln, i) => timers.push(setTimeout(() => speakVoice(ln.text, 'zh-HK', question.dialogueSlot * 2 + (i % 2)), i * 1800)));
                    } else if (question.type === 'yue-response-mc') {
                        speakVoice(question.phrase, 'zh-HK', question.voiceSlot);
                    }
                }, 400);
                return () => { clearTimeout(t0); timers.forEach(clearTimeout); };
            }, [exam, sectionIdx, qIdx, showIntro]);

            if (langId !== 'lang-yue') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">แบบทดสอบชุดนี้รองรับเฉพาะภาษาจีนกวางตุ้ง</p>
                            <button onClick={() => setLangId('lang-yue')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาจีนกวางตุ้ง</button>
                        </div>
                    </div>
                );
            }

            if (!started) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">แบบทดสอบความเข้าใจภาษาจีนกวางตุ้ง</h2>
                            <p className="text-sm text-gray-500 mb-5">วัดความเข้าใจพื้นฐาน — 2 ส่วน (ฟัง+อ่าน)</p>
                            <button onClick={start} className="w-full p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white mb-5">
                                <div className="text-lg font-bold text-brand mb-1">เริ่มทำแบบทดสอบ</div>
                                <div className="text-xs text-gray-500">聽力 (ฟัง) 14 + 閱讀 (อ่าน) 30 = 44 ข้อ</div>
                            </button>
                            <p className="text-xs text-gray-400 leading-relaxed text-left">
                                <b>หมายเหตุสำคัญ</b>: ต่างจากข้อสอบ HSK/TOEIC/IELTS/JLPT/TOPIK ในเว็บนี้ตรงที่แบบทดสอบชุดนี้
                                <b>ไม่ได้จำลองข้อสอบทางการชุดใดชุดหนึ่ง</b> — เพราะภาษาจีนกวางตุ้งไม่มีข้อสอบวัดระดับที่เป็นมาตรฐานสากล
                                เปิดเผยโครงสร้างชัดเจนแบบ HSK/TOPIK ให้อ้างอิง (มีแต่ LPAT ซึ่งเป็นข้อสอบครูในฮ่องกงโดยเฉพาะ และ CRAT
                                ซึ่งวัดแค่การออกเสียง/สำเนียง) จึงออกแบบโครงสร้างและเนื้อหาเองทั้งหมดเป็นแบบทดสอบความเข้าใจทั่วไป
                                ใช้คำ/ไวยากรณ์กวางตุ้งแท้ (ไม่ใช่จีนกลางสวมตัวอักษร)<br />
                                <b>ความแตกต่างจากข้อสอบจริง</b>: 聽力 (ฟัง) แสดงบทพูดเป็นตัวอักษรคู่กับเสียงด้วยเพื่อช่วยผู้เริ่มต้นตามทัน
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = start;
            const backToStart = () => { setStarted(false); setExam(null); };

            if (finished) {
                const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = sectionResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลแบบทดสอบ</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง</p>
                            <div className="grid grid-cols-2 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.correct}/{r.total}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">ทำใหม่ (สุ่มโจทย์ใหม่)</button>
                                <button onClick={backToStart} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">กลับหน้าเริ่มต้น</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

            const q = section.questions[qIdx];

            const finishSection = () => {
                const results = [...sectionResults, { key: section.key, title: section.title, correct: correctInSection, total: section.questions.length }];
                setSectionResults(results);
                if (sectionIdx + 1 >= exam.sections.length) {
                    setFinished(true);
                } else {
                    setSectionIdx(i => i + 1);
                    setShowIntro(true);
                    setQIdx(0);
                    resetPerQuestion();
                    setCorrectInSection(0);
                }
            };
            const nextQuestion = () => {
                if (qIdx + 1 >= section.questions.length) { finishSection(); return; }
                setQIdx(i => i + 1); resetPerQuestion();
            };
            const recordAnswer = (isCorrect, wrongEntry) => {
                setAnswered(true);
                if (isCorrect) { setCorrectInSection(c => c + 1); setXp(x => x + 2); }
                else if (wrongEntry) setAllWrong(w => [...w, wrongEntry]);
            };
            const pickMc = (choice) => {
                if (answered) return;
                setUserAnswer(choice);
                const isCorrect = choice === q.correct;
                const leftLabel = q.word || q.sentence || q.phrase || q.q || q.thai;
                recordAnswer(isCorrect, isCorrect ? null : { left: leftLabel || 'ข้อนี้', right: q.correct });
            };

            const progressLabel = `${section.title} · ข้อ ${qIdx + 1}/${section.questions.length}`;

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-xl mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-4">
                            <span className="text-xs font-bold text-gray-400 uppercase">{progressLabel}</span>
                            <span className="text-xs font-bold text-brand">ถูก {correctInSection} ข้อ</span>
                        </div>

                        {q.type === 'yue-word-meaning-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-3xl font-bold text-gray-900 mb-1">{q.word}</div>
                                    <div className="text-sm text-gray-400 mb-2">{q.jyutping}</div>
                                    <button onClick={() => speak(q.word, 'zh-HK')} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังเสียง</button>
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกความหมายภาษาไทยที่ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'grammar-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-lg font-semibold text-gray-900">{q.sentence}</div>
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกคำที่เติมในช่องว่าง（＿）ได้ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'passage-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                                    <p className="text-sm text-gray-700 leading-relaxed">{q.text}</p>
                                </div>
                                <p className="text-gray-700 font-semibold mb-3">{q.q}</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'yue-response-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <p className="text-xs text-gray-400 mb-3">🎧 ฟังประโยค แล้วเลือกคำตอบที่เหมาะสมที่สุด</p>
                                    <div className="text-lg font-semibold text-gray-900 mb-2">{q.phrase}</div>
                                    <button onClick={() => speakVoice(q.phrase, 'zh-HK', q.voiceSlot)} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังอีกครั้ง</button>
                                </div>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'yue-dialogue-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                                    <p className="text-[10px] font-bold text-gray-400 uppercase mb-2">🎧 บทสนทนา (สลับผู้พูด 2 คน)</p>
                                    <div className="space-y-1">
                                        {q.lines.map((ln, i) => <p key={i} className="text-sm text-gray-700"><b>{ln.speaker}:</b> {ln.text}</p>)}
                                    </div>
                                    <button onClick={() => q.lines.forEach((ln, i) => setTimeout(() => speakVoice(ln.text, 'zh-HK', q.dialogueSlot * 2 + (i % 2)), i * 1800))}
                                        className="mt-2 inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังบทสนทนาอีกครั้ง</button>
                                </div>
                                <p className="text-gray-700 font-semibold mb-3">{q.q}</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {answered && (
                            <button onClick={nextQuestion} className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white">
                                {qIdx + 1 >= section.questions.length ? (sectionIdx + 1 >= exam.sections.length ? 'ดูผลสอบ' : 'ไปส่วนต่อไป') : 'ข้อต่อไป'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }


        // ══════════════════════════════════════════════════════════════════════════════════
        // "ฟัง-พูด" (view === 'listen') — ฟังเรื่องสั้นแบบ extensive listening + พูดตาม/บันทึกเสียง
        // เทียบ (shadowing) รองรับเฉพาะภาษาจีนตอนนี้ (เนื้อหาต้องแต่งเองทีละภาษา เริ่มจากจีนตามที่ขอ
        // เน้นมาตลอดเซสชันนี้) ใช้ของเดิมที่มีอยู่แล้วทั้งหมด: speak() (TTS), gradeAnswer() (ตรวจคำตอบ),
        // asr-worker.js (ถอดเสียงพูดเป็นข้อความ — clone แพทเทิร์นอัดเสียง/resample มาจาก ai-chat-widget.js
        // โหมด "เปิดไมค์คุย" ตามธรรมเนียม clone-and-adapt ของโปรเจกต์)
        // ══════════════════════════════════════════════════════════════════════════════════

        // บทฟังสั้นๆ ระดับ HSK1-3 (คิด/ตรวจไวยากรณ์เอง ใช้คำศัพท์พื้นฐานที่คุ้นเคย) ระดับละ 2 เรื่อง
        const LISTENING_PASSAGES = [
            {
                level: 1, title: 'รับโทรศัพท์',
                lines: [
                    { speaker: 'A', target: '喂，你好！', thai: 'ฮัลโหล สวัสดี' },
                    { speaker: 'B', target: '你好，我是丽丽。', thai: 'สวัสดี ฉันชื่อลี่ลี่' },
                    { speaker: 'A', target: '你在哪儿？', thai: 'คุณอยู่ที่ไหน' },
                    { speaker: 'B', target: '我在家。', thai: 'ฉันอยู่บ้าน' },
                ],
                questions: [
                    { q: 'ลี่ลี่อยู่ที่ไหน?', choices: ['อยู่บ้าน', 'อยู่โรงเรียน', 'อยู่ร้านค้า'], correct: 'อยู่บ้าน' },
                    { q: 'คนที่พูดว่า "我是丽丽" ชื่ออะไร?', choices: ['ลี่ลี่', 'หวังลี่', 'ไม่บอกชื่อ'], correct: 'ลี่ลี่' },
                ],
            },
            {
                level: 1, title: 'ซื้อของ',
                lines: [
                    { speaker: 'A', target: '这个苹果多少钱？', thai: 'แอปเปิลลูกนี้ราคาเท่าไหร่' },
                    { speaker: 'B', target: '十块钱。', thai: 'สิบหยวน' },
                    { speaker: 'A', target: '太贵了，便宜一点吧。', thai: 'แพงไปนะ ลดหน่อยได้ไหม' },
                    { speaker: 'B', target: '好的，八块钱。', thai: 'ได้ค่ะ แปดหยวน' },
                ],
                questions: [
                    { q: 'ตอนแรกแอปเปิลราคาเท่าไหร่?', choices: ['สิบหยวน', 'แปดหยวน', 'ห้าหยวน'], correct: 'สิบหยวน' },
                    { q: 'สุดท้ายซื้อแอปเปิลราคาเท่าไหร่?', choices: ['สิบหยวน', 'แปดหยวน', 'ห้าหยวน'], correct: 'แปดหยวน' },
                ],
            },
            {
                level: 2, title: 'นัดเพื่อน',
                lines: [
                    { speaker: 'A', target: '你今天晚上有空吗？', thai: 'คืนนี้คุณว่างไหม' },
                    { speaker: 'B', target: '有空，怎么了？', thai: 'ว่างสิ มีอะไรเหรอ' },
                    { speaker: 'A', target: '我们一起去看电影，好吗？', thai: 'ไปดูหนังด้วยกันไหม' },
                    { speaker: 'B', target: '好啊！几点见面？', thai: 'ดีเลย! นัดกี่โมงดี' },
                    { speaker: 'A', target: '晚上七点，在电影院门口。', thai: 'สองทุ่ม ที่หน้าโรงหนัง' },

        // ── การอัดเสียง/ถอดเสียงพูด clone มาจาก ai-chat-widget.js โหมด "เปิดไมค์คุย" (asr-worker.js
        //    ตัวเดียวกันเป๊ะ) ต่างกันแค่ lang: 'chinese' (ของเดิมบังคับ 'thai') และไม่ได้ต่อกับแชท AI ──
        let asrWorker = null;
        function getAsrWorker() {
            if (!asrWorker) asrWorker = new Worker('./asr-worker.js', { type: 'module' });
            return asrWorker;
        }
        function resampleTo16kMono(audioBuffer) {
            const targetRate = 16000;
            const OfflineCtx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            const offlineCtx = new OfflineCtx(1, Math.ceil(audioBuffer.duration * targetRate), targetRate);
            const source = offlineCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineCtx.destination);
            source.start(0);
            return offlineCtx.startRendering().then(rendered => rendered.getChannelData(0));
        }
        function decodeBlobToPcm(blob) {
            return blob.arrayBuffer().then(buf => {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();
                return ctx.decodeAudioData(buf).then(audioBuffer => {
                    ctx.close();
                    return resampleTo16kMono(audioBuffer);
                }, () => { ctx.close(); throw new Error('ถอดเสียงที่อัดไม่ได้ ลองอัดใหม่อีกครั้ง'); });
            });
        }
        // langName: ชื่อภาษาเต็ม (lowercase) ตามที่ asr-worker.js (Whisper) รับ — ผ่านตรงเป็น
        // opts.language ไม่มีการแปลง/ตรวจสอบเพิ่มในตัว worker เอง
        // หมายเหตุ lang-yue: Whisper (asr-worker.js) ไม่มีตัวเลือกภาษา "cantonese" แยกต่างหากในรายชื่อ
        // ภาษาทางการ 99 ภาษา ใช้ 'chinese' แทน (ใกล้เคียงที่สุดที่มี แม่นยำน้อยกว่าภาษาที่มีในรายชื่อจริง
        // — ผู้ใช้ควรตรวจทานข้อความที่ถอดออกมาเองเสมอ เหมือนที่ระบบเตือนไว้อยู่แล้วทั่วไป)
        const ASR_LANG_NAME = { 'lang-cn': 'chinese', 'lang-en': 'english', 'lang-jp': 'japanese', 'lang-kr': 'korean', 'lang-yue': 'chinese' };
        function transcribeSpeech(pcm, langName) {
            return new Promise((resolve, reject) => {
                const w = getAsrWorker();
                const jobId = 'shadow-' + Date.now();
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'result') { cleanup(); resolve(msg.text); }
                    else if (msg.type === 'error') { cleanup(); reject(new Error(msg.message)); }
                }
                function onErr(e) { cleanup(); reject(new Error(e.message || 'Web Worker error')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({ type: 'transcribe', jobId, pcm, lang: langName }, [pcm.buffer]);
            });
        }

        function ShadowingPanel({ awardXp, langId }) {
            const langCode = LANGS[langId].code;
            const asrLangName = ASR_LANG_NAME[langId] || 'english';
            const pool = useMemo(() => {
                const cats = LANGS[langId].phrases;
                const out = [];
                Object.keys(cats).forEach(cat => cats[cat].forEach(p => out.push(p)));
                return out;
            }, [langId]);
            const [idx, setIdx] = useState(0);
            const [isRecording, setIsRecording] = useState(false);
            const [status, setStatus] = useState(''); // '' | 'recording' | 'transcribing' | 'done' | 'error'
            const [transcript, setTranscript] = useState('');
            const [grade, setGrade] = useState(null);
            const [recordedUrl, setRecordedUrl] = useState('');
            const mediaRef = useRef(null);
            const chunksRef = useRef([]);
            const streamRef = useRef(null);

            useEffect(() => { setIdx(0); }, [langId]);

            const current = pool[idx % pool.length];
            const reset = () => { setStatus(''); setTranscript(''); setGrade(null); setRecordedUrl(''); };
            const next = () => { setIdx(i => i + 1); reset(); };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    streamRef.current = stream;
                    chunksRef.current = [];
                    const rec = new MediaRecorder(stream);
                    rec.addEventListener('dataavailable', e => { if (e.data && e.data.size) chunksRef.current.push(e.data); });
                    mediaRef.current = rec;
                    rec.start();
                    setIsRecording(true);
                    setStatus('recording');
                } catch (e) {
                    setStatus('error'); setTranscript('เปิดไมค์ไม่สำเร็จ — ตรวจสอบว่าอนุญาตให้เว็บนี้ใช้ไมโครโฟนแล้ว');
                }
            };

            const stopRecording = () => {
                if (!mediaRef.current) return;
                mediaRef.current.addEventListener('stop', async () => {
                    streamRef.current.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunksRef.current, { type: mediaRef.current.mimeType || 'audio/webm' });
                    setRecordedUrl(URL.createObjectURL(blob));
                    setIsRecording(false);
                    // ตัดขั้นถอดเสียงอัตโนมัติบน iOS ไปเลย (เหมือน ai-chat-widget.js) — อัดเสียง/ฟังย้อนได้ปกติ
                    // แค่ไม่ auto-grade เพราะ WASM AI บน Safari iOS เคยมีรายงานแท็บแครชจริงมาก่อน
                    if (isIOS()) {
                        setStatus('error');
                        setTranscript('ฟีเจอร์ถอดเสียงอัตโนมัติยังไม่รองรับ iPhone/iPad — ลองฟังเสียงที่อัดเทียบกับต้นฉบับด้วยหูแทนได้');
                        return;
                    }
                    setStatus('transcribing');
                    try {
                        const pcm = await decodeBlobToPcm(blob);
                        const text = await transcribeSpeech(pcm, asrLangName);
                        setTranscript(text);
                        const g = gradeAnswer(text, current.target);
                        setGrade(g);
                        setStatus('done');
                        if (g === 'correct') awardXp(15); else if (g === 'almost') awardXp(8);

                }, { once: true });
                mediaRef.current.stop();

                    </div>

                    {recordedUrl && (

                    {status === 'done' && (
                        <div className={`p-4 rounded-xl border mb-4 ${grade === 'correct' ? 'bg-green-50 border-green-100' : grade === 'almost' ? 'bg-amber-50 border-amber-100' : 'bg-red-50 border-red-100'}`}>
                            <p className="text-xs text-gray-400 mb-1">ระบบได้ยินว่า:</p>

                            </p>
                        </div>

                    {status === 'error' && <p className="text-sm text-red-600 mb-4">❌ {transcript}</p>}

        function buildNdQueue(catKey, dataset) {
            const data = dataset || NUMBERS_DATES;
            const pool = catKey === 'all'
                ? Object.keys(data).flatMap(cat => data[cat].map(it => ({ ...it, cat })))
                : data[catKey].map(it => ({ ...it, cat: catKey }));
            const picked = shuffleArr(pool).slice(0, Math.min(NDQ_LEN, pool.length));
            return picked.map(item => {
                const samePool = data[item.cat];
                const distractors = shuffleArr(samePool.filter(it => it.target !== item.target)).slice(0, 3);
                const fmt = it => it.phonetic ? `${it.target} (${it.phonetic})` : it.target;
                const choices = shuffleArr([item, ...distractors]).map(fmt);
                return { ...item, choices, correct: fmt(item) };
            });

            const dueCounts = useMemo(() => {
                const m = {};

            }, [srs]);
            const totalDue = useMemo(() => Object.values(dueCounts).reduce((a, b) => a + b, 0), [dueCounts]);
            const [syncing, setSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');

            const [langFilter, setLangFilter] = useState(''); // ช่องค้นหาภาษาที่แถบข้าง (14 ภาษาเริ่มยาว)
            const filteredLangIds = useMemo(() => {

            const [noteMode, setNoteMode] = useState('type'); // 'type' | 'write' — โน้ตของฉัน: พิมพ์/เขียนด้วยมือ

            const updateNote = (text) => setNotes(n => ({ ...n, [langId]: { ...(n[langId] || {}), text, updatedAt: Date.now() } }));

                window.Tesseract.recognize(noteCanvasEl, 'eng+tha').then(r => {
                    const t = (r.data.text || '').trim();
