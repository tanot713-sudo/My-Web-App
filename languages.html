    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LANGS = JSON.parse(document.getElementById('lang-data').textContent);
        const LANG_IDS = Object.keys(LANGS);

        const Brain = () => <i data-lucide="brain" className="w-5 h-5"></i>;
        const BookOpen = () => <i data-lucide="book-open" className="w-5 h-5"></i>;
        const Volume2 = () => <i data-lucide="volume-2" className="w-4 h-4"></i>;
        const CheckCircle = () => <i data-lucide="check-circle-2" className="w-5 h-5 text-green-500"></i>;
        const XCircle = () => <i data-lucide="x-circle" className="w-5 h-5 text-red-500"></i>;
        const Languages = () => <i data-lucide="languages" className="w-4 h-4"></i>;
        const Menu = () => <i data-lucide="menu" className="w-5 h-5"></i>;
        const CloseIcon = () => <i data-lucide="x" className="w-5 h-5"></i>;
        const NotebookIcon = () => <i data-lucide="notebook-pen" className="w-4 h-4"></i>;

        function speak(text, langCode) {
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = langCode;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function loadXp() {
            try { return JSON.parse(localStorage.getItem('lang-practice:xp') || '0'); } catch { return 0; }
        }
        function saveXp(v) { localStorage.setItem('lang-practice:xp', JSON.stringify(v)); }

        function loadProgress() {
            try { return JSON.parse(localStorage.getItem('lang-practice:progress') || '{}'); } catch { return {}; }
        }
        function saveProgress(v) { localStorage.setItem('lang-practice:progress', JSON.stringify(v)); }

        function loadNotes() {
            try { return JSON.parse(localStorage.getItem('lang-practice:notes') || '{}'); } catch { return {}; }
        }
        function saveNotes(v) { localStorage.setItem('lang-practice:notes', JSON.stringify(v)); }

        function mergeNotes(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const na = a && a[k], nb = b && b[k];
                if (!na) { out[k] = nb; return; }
                if (!nb) { out[k] = na; return; }
                out[k] = (na.updatedAt || 0) >= (nb.updatedAt || 0) ? na : nb;
            });
            return out;
        }

        // ── ตรวจคำตอบแบบใกล้เคียง (ไม่ต้องพิมพ์ตรง 100%) ───────────────────────
        function normalizeAnswer(s) {
            return String(s || '').toLowerCase().trim()
                .replace(/[.,!?;:'"“”‘’、。？！ๆ]/g, '')
                .replace(/\s+/g, ' ');
        }
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[n];
        }
        function gradeAnswer(typed, target) {
            const a = normalizeAnswer(typed), b = normalizeAnswer(target);
            if (!a) return 'wrong';
            if (a === b) return 'correct';
            const sim = 1 - levenshtein(a, b) / Math.max(a.length, b.length);
            return sim >= 0.9 ? 'correct' : sim >= 0.7 ? 'almost' : 'wrong';
        }

        // ── คิวคำที่ตอบผิด (โผล่บนหน้าสตรีมให้กลับมาฝึกซ้ำ) ─────────────────────
        function loadWrong() {
            try { return JSON.parse(localStorage.getItem('lang-practice:wrong') || '{}'); } catch { return {}; }
        }
        function saveWrong(v) { localStorage.setItem('lang-practice:wrong', JSON.stringify(v)); }
        function mergeWrong(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.count || 0) >= (vb.count || 0) ? va : vb);
            });
            return out;
        }

        const ANNOUNCEMENTS = [
            { date: 'วันนี้', text: 'ยินดีต้อนรับสู่ Language Practice — เลือกภาษาที่สนใจในแท็บ "ฝึกฝน" แล้วเริ่มพิมพ์คำแปลได้เลย' },
            { date: 'เร็วๆ นี้', text: 'จะทยอยเพิ่มหมวดวลีใหม่ๆ และภาษาเพิ่มเติมเรื่อยๆ' },
            { date: 'เคล็ดลับ', text: 'กดปุ่มลำโพงเพื่อฟังเสียงอ่านประโยคต้นฉบับ ช่วยจำสำเนียงได้ดีขึ้น' },
        ];

        // ── Google Drive sync (ไม่บังคับ) — ซิงก์ XP/ความคืบหน้าข้ามอุปกรณ์ ──────────
        const DRIVE_CLIENT_ID = '497048581273-akpavakt6m34lhqbjf1irg3m8vl6u27u.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const DRIVE_FOLDER_NAME = 'OME_Progress';
        const DRIVE_FILE_NAME = 'language-progress.json';

        const DriveSync = {
            tokenClient: null,
            accessToken: null,
            folderId: null,
            ensureAuth() {
                return new Promise((resolve, reject) => {
                    if (!window.google || !google.accounts || !google.accounts.oauth2) {
                        reject(new Error('โหลด Google Identity Services ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'));
                        return;
                    }
                    if (!this.tokenClient) {
                        this.tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: DRIVE_CLIENT_ID,
                            scope: DRIVE_SCOPE,
                            callback: (resp) => {
                                if (resp.error) { reject(new Error(resp.error)); return; }
                                this.accessToken = resp.access_token;
                                resolve(this.accessToken);
                            },
                        });
                    }
                    this.tokenClient.requestAccessToken({ prompt: this.accessToken ? '' : 'consent' });
                });
            },
            async ensureFolder() {
                if (this.folderId) return this.folderId;
                const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                if (data.files && data.files.length) { this.folderId = data.files[0].id; return this.folderId; }
                const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
                });
                if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
                const createData = await createRes.json();
                this.folderId = createData.id;
                return this.folderId;
            },
            async findFile(name, folderId) {
                const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาไฟล์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },
            async downloadFile(fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
            async uploadFile(name, folderId, existingId, obj) {
                const form = new FormData();
                const metadata = existingId ? {} : { name, parents: [folderId] };
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
                const url = existingId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const res = await fetch(url, { method: existingId ? 'PATCH' : 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken }, body: form });
                if (!res.ok) throw new Error('บันทึกขึ้น Drive ไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
        };

        function mergeProgress(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const la = (a && a[k]) || [], lb = (b && b[k]) || [];
                const len = Math.max(la.length, lb.length);
                const arr = [];
                for (let i = 0; i < len; i++) arr[i] = !!(la[i] || lb[i]);
                out[k] = arr;
            });
            return out;
        }

            const [wrong, setWrong] = useState(loadWrong());
            const [syncing, setSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');

            useEffect(() => { saveNotes(notes); }, [notes]);
            useEffect(() => { saveWrong(wrong); }, [wrong]);

            const updateNote = (text) => setNotes(n => ({ ...n, [langId]: { text, updatedAt: Date.now() } }));

            const syncNow = async () => {
                setSyncing(true);
                setSyncStatus('กำลังเชื่อมต่อ Google...');
                try {
                    await DriveSync.ensureAuth();
                    setSyncStatus('กำลังซิงก์...');
                    const folderId = await DriveSync.ensureFolder();
                    const existing = await DriveSync.findFile(DRIVE_FILE_NAME, folderId);
                    const remote = existing ? await DriveSync.downloadFile(existing.id) : null;

                    const mergedXp = Math.max(xp, remote?.xp || 0);
                    const mergedProgress = mergeProgress(remote?.progress, progress);
                    const mergedNotes = mergeNotes(remote?.notes, notes);
                    const mergedWrong = mergeWrong(remote?.wrong, wrong);

                    setXp(mergedXp);
                    setProgress(mergedProgress);
                    setNotes(mergedNotes);
                    setWrong(mergedWrong);

                    await DriveSync.uploadFile(DRIVE_FILE_NAME, folderId, existing?.id,
                        { xp: mergedXp, progress: mergedProgress, notes: mergedNotes, wrong: mergedWrong, savedAt: new Date().toISOString() });
                    setSyncStatus('✅ ซิงก์สำเร็จ');

                                                    <>
                                                        <p className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3">แตะการ์ดเพื่อดูคำตอบ</p>
                                                        <p className="text-2xl font-bold text-gray-900">{current.thai}</p>
                                                    </>
                                                ) : (
                                                    <>
                                                        <p className="text-2xl font-bold text-gray-900 mb-2">{current.target}</p>
                                                        <p className="text-sm text-gray-500">{current.thai}</p>
                                                    </>
                                                )}
                                            </button>
                                            {flashFlipped && (
                                                <div className="flex items-center gap-3 mt-6">
                                                    <button onClick={() => speak(current.target, lang.code)} className="shrink-0 p-3 rounded-xl border-2 border-gray-200 text-brand hover:border-brand"><Volume2 /></button>
                                                    <button onClick={() => markFlashcard(true)} className="flex-1 py-3 rounded-xl font-bold bg-green-500 text-white shadow-sm">จำได้ (+10 XP)</button>
                                                    <button onClick={() => markFlashcard(false)} className="flex-1 py-3 rounded-xl font-bold bg-gray-200 text-gray-600">ยังไม่ได้</button>
                                                </div>
                                            )}
                                        </>
                                    ) : (
                                        <>
                                            {mode === 'translate' ? (
                                                <>
                                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 leading-snug">
                                                        แปลประโยคนี้เป็นภาษา{lang.title}:
                                                    </h3>
                                                    <p className="text-2xl font-bold text-gray-900 mb-6">{current.thai}</p>
                                                </>
                                            ) : (
                                                <>
                                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 leading-snug">
                                                        ฟังเสียงแล้วพิมพ์เป็นภาษา{lang.title} ตามที่ได้ยิน:
                                                    </h3>
                                                    <button onClick={() => speak(current.target, lang.code)}
                                                        className="flex items-center gap-2 px-5 py-3 mb-6 rounded-xl bg-brandLight text-brand font-bold text-sm hover:opacity-80">
                                                        <Volume2 /> กดฟังเสียง (ฟังซ้ำได้)
                                                    </button>
                                                </>
                                            )}

                                            <div className="flex items-center gap-3 mb-2">
                                                <input
                                                    ref={inputRef}
                                                    type="text"
                                                    value={typed}
                                                    onChange={e => setTyped(e.target.value)}
                                                    onKeyDown={e => e.key === 'Enter' && !result && checkAnswer()}
                                                    disabled={result !== null}
                                                    placeholder={`พิมพ์คำตอบเป็นภาษา${lang.title}...`}
                                                    className="flex-1 border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-3 text-base disabled:bg-gray-50"
                                                />
                                                {mode === 'translate' && (
                                                    <button onClick={() => speak(current.target, lang.code)} className="shrink-0 p-3 rounded-xl border-2 border-gray-200 text-brand hover:border-brand">
                                                        <Volume2 />
                                                    </button>
                                                )}
                                            </div>

                                            {result && (
                                                <div className={`mt-6 p-5 rounded-xl border ${result === 'correct' ? 'bg-green-50 border-green-100' : result === 'almost' ? 'bg-amber-50 border-amber-100' : 'bg-red-50 border-red-100'}`}>
                                                    <h4 className={`font-bold mb-2 flex items-center gap-2 ${result === 'correct' ? 'text-green-700' : result === 'almost' ? 'text-amber-700' : 'text-red-700'}`}>
                                                        {result === 'correct' ? <CheckCircle /> : result === 'almost' ? <CheckCircle /> : <XCircle />}
                                                        {result === 'correct' ? 'ถูกต้อง! (+20 XP)' : result === 'almost' ? 'เกือบถูก! ต่างแค่นิดเดียว (+10 XP)' : 'ยังไม่ถูก — คำนี้จะไปอยู่ในลิสต์ทบทวน'}
                                                    </h4>
                                                    <p className="text-sm text-gray-700 leading-relaxed">
                                                        <strong>คำตอบที่ถูกต้องคือ:</strong> {current.target}
                                                        {mode === 'dictation' && <span className="block text-gray-500 mt-1">ความหมาย: {current.thai}</span>}
                                                    </p>
                                                </div>
                                            )}

                                            {!result ? (
                                                <button
                                                    onClick={checkAnswer}
                                                    disabled={!typed.trim()}
                                                    className={`mt-8 w-full py-3 rounded-xl font-bold transition-all shadow-sm ${typed.trim() ? 'bg-gray-900 text-white hover:bg-black' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                                >
                                                    ตรวจคำตอบ
                                                </button>
                                            ) : (
                                                <button onClick={nextPhrase} className="mt-6 w-full py-3 rounded-xl font-bold bg-brand text-white hover:bg-teal-700 transition-all shadow-sm">
                                                    ข้อต่อไป
                                                </button>
                                            )}
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
