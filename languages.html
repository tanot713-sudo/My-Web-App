                            className={`p-2 disabled:opacity-40 ${inputMode === 'type' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><KeyboardIcon /></button>
                        <button type="button" onClick={() => setInputMode('write')} disabled={!!result} title="เขียนด้วยมือ" aria-label="เขียนด้วยมือ"
                            className={`p-2 disabled:opacity-40 ${inputMode === 'write' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><PencilSmallIcon /></button>
                    </div>

                    {inputMode === 'type' ? (
                        <input value={typed} onChange={e => setTyped(e.target.value)} onKeyDown={e => e.key === 'Enter' && !result && check()}
                            disabled={!!result} placeholder="พิมพ์คำที่ได้ยิน..."
                            className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-3 text-base disabled:bg-gray-50" />
                    ) : (
                        <div>
                            <HandwritingCanvas onReady={setCanvasEl} height={200} />
                            <div className="flex items-center gap-3 mt-2 flex-wrap">
                                <button type="button" onClick={runOcr} className="text-xs font-semibold text-brand hover:opacity-80">✨ แปลงเป็นข้อความ</button>
                                {ocrStatus && <span className="text-xs text-gray-400">{ocrStatus}</span>}
                            </div>
                            <p className="text-[11px] text-gray-400 mt-1">รองรับเขียนด้วยนิ้ว/สไตลัส/Apple Pencil บน iPad — OCR แม่นสุดกับภาษาละติน/ไทย ภาษาอื่น (จีน/ญี่ปุ่น/เกาหลี/อาหรับ ฯลฯ) อาจอ่านไม่ออกหรือผิดเยอะ ควรตรวจทานเสมอ</p>
                            {typed && <p className="text-xs text-gray-500 mt-2">ข้อความล่าสุด: "{typed}"</p>}
                        </div>
                    )}
                    {result && (
                        <div className={`mt-4 p-4 rounded-xl border ${result === 'correct' ? 'bg-green-50 border-green-100' : result === 'almost' ? 'bg-amber-50 border-amber-100' : 'bg-red-50 border-red-100'}`}>
                            <p className="text-sm text-gray-700">คำตอบที่ถูกต้องคือ <strong>{item.word}</strong> ({item.thai})</p>
                            {result !== 'correct' && <SpellDiff typed={typed} correct={item.word} />}
                        </div>
                    )}
                    {!result ? (
                        <button onClick={check} disabled={!typed.trim()}
                            className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจคำตอบ</button>
                    ) : (
                        <button onClick={next} className="mt-4 w-full py-3 rounded-xl font-bold bg-brand text-white">ข้อต่อไป</button>
                    )}
                </div>
            );
        }

        // ── โหมด 5: แปลประโยค ไทย → ภาษาที่เรียน ──────────────────────────────────────────
        function TranslatePanel({ langId, lang, awardXp, addWritingRecord }) {
            const allPhrases = useMemo(() => Object.values(lang.phrases).flat(), [lang]);
            const [qIdx, setQIdx] = useState(() => Math.floor(Math.random() * allPhrases.length));
            const [typed, setTyped] = useState('');
            const [heuristicResult, setHeuristicResult] = useState(null);
            const [aiFeedback, setAiFeedback] = useState('');
            const [aiStatus, setAiStatus] = useState('');
            const [aiVerdict, setAiVerdict] = useState(null);
            // โหมดเขียนด้วยมือ (iPad ฯลฯ) — แพทเทิร์นเดียวกับ ComposePanel/SrsDictationPanel
            const [inputMode, setInputMode] = useState('type'); // 'type' | 'write'
            const [canvasEl, setCanvasEl] = useState(null);
            const [ocrStatus, setOcrStatus] = useState('');

            const item = allPhrases[qIdx % allPhrases.length];

            const runOcr = () => {
                if (!canvasEl) return;
                if (!window.Tesseract) { setOcrStatus('❌ โหลด Tesseract.js ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'); return; }
                setOcrStatus('⏳ กำลังอ่านลายมือ...');
                window.Tesseract.recognize(canvasEl, 'eng+tha').then(r => {
                    const t = (r.data.text || '').trim();
                    if (t) { setTyped(prev => (prev ? prev + ' ' : '') + t); setInputMode('type'); setOcrStatus('✅ แปลงเป็นข้อความแล้ว — ตรวจทานความถูกต้องก่อนกดตรวจ'); }
                    else setOcrStatus('⚠️ อ่านลายมือไม่ออก ลองเขียนให้ชัดขึ้นแล้วลองใหม่');
                }).catch(e => setOcrStatus('❌ แปลงไม่สำเร็จ: ' + (e && e.message ? e.message : e)));
            };

            const checkHeuristic = () => {
                const grade = gradeAnswer(typed, item.target);
                setHeuristicResult(grade);
                if (grade === 'correct') awardXp(10);
            };

            const checkWithAi = () => {
                if (isIOS()) { setAiStatus('error'); setAiFeedback('โหมดนี้ยังไม่รองรับ iPhone/iPad'); return; }
                setAiStatus('loading'); setAiFeedback(''); setAiVerdict(null);
                const w = getWritingWorker();
                const jobId = 'translate-' + Date.now();
                const userMsg = `ประโยคไทยต้นฉบับ: ${item.thai}\nคำแปลอ้างอิง: ${item.target}\nคำแปลของผู้เรียน: ${typed}`;
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setAiFeedback(acc); }
                    else if (msg.type === 'done') {
                        cleanup(); setAiStatus('done');
                        const m = acc.match(/ผลการตรวจ:\s*(ถูกต้อง|ยังไม่ถูกต้อง)/);
                        let grade = null;
                        if (m) {
                            const ok = m[1] === 'ถูกต้อง';
                            setAiVerdict(ok ? 'correct' : 'wrong');
                            grade = ok ? 'correct' : 'wrong';
                            if (ok) awardXp(15);
                        }
                        addWritingRecord({ langId, subMode: 'translate', prompt: userMsg, userText: typed, feedback: acc, grade, xpAwarded: grade === 'correct' ? 15 : 0 });
                    } else if (msg.type === 'error') { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setAiStatus('error'); setAiFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 300,
                    messages: [
                        { role: 'system', content: TRANSLATE_SYSTEM_PROMPT(lang.title) },
                        { role: 'user', content: userMsg },
                        { role: 'system', content: TRANSLATE_REMINDER },
                    ],
                });
            };

            const next = () => {
                setQIdx(Math.floor(Math.random() * allPhrases.length));
                setTyped(''); setHeuristicResult(null); setAiFeedback(''); setAiStatus(''); setAiVerdict(null);
                setInputMode('type'); setOcrStatus('');
            };

            return (
                <div>
                    <h3 className="text-lg font-semibold text-gray-800 mb-2">แปลประโยคนี้เป็นภาษา{lang.title}:</h3>
                    <p className="text-xl font-bold text-gray-900 mb-4">{item.thai}</p>

                    <div className="flex rounded-full border border-gray-200 overflow-hidden w-fit mb-2">
                        <button type="button" onClick={() => setInputMode('type')} title="พิมพ์" aria-label="พิมพ์"
                            className={`p-2 ${inputMode === 'type' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><KeyboardIcon /></button>
                        <button type="button" onClick={() => setInputMode('write')} title="เขียนด้วยมือ" aria-label="เขียนด้วยมือ"
                            className={`p-2 ${inputMode === 'write' ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}><PencilSmallIcon /></button>
                    </div>

                    {inputMode === 'type' ? (
                        <textarea value={typed} onChange={e => setTyped(e.target.value)} rows={2}
                            placeholder={`พิมพ์คำแปลภาษา${lang.title}...`}
                            className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-base resize-y" />
                    ) : (
                        <div>
                            <HandwritingCanvas onReady={setCanvasEl} height={200} />
                            <div className="flex items-center gap-3 mt-2 flex-wrap">
                                <button type="button" onClick={runOcr} className="text-xs font-semibold text-brand hover:opacity-80">✨ แปลงเป็นข้อความ</button>
                                {ocrStatus && <span className="text-xs text-gray-400">{ocrStatus}</span>}
                            </div>
                            <p className="text-[11px] text-gray-400 mt-1">รองรับเขียนด้วยนิ้ว/สไตลัส/Apple Pencil บน iPad — OCR แม่นสุดกับภาษาละติน/ไทย ภาษาอื่น (จีน/ญี่ปุ่น/เกาหลี/อาหรับ ฯลฯ) อาจอ่านไม่ออกหรือผิดเยอะ ควรตรวจทานเสมอ</p>
                            {typed && <p className="text-xs text-gray-500 mt-2">ข้อความล่าสุด: "{typed}"</p>}
                        </div>
                    )}
                    <div className="flex flex-wrap gap-2 mt-3">
                        <button onClick={checkHeuristic} disabled={!typed.trim()}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจแบบเร็ว</button>
                        <button onClick={checkWithAi} disabled={!typed.trim() || aiStatus === 'loading'}
                            className="px-4 py-2.5 rounded-xl font-bold text-sm border-2 border-brand text-brand disabled:opacity-40">
                            {aiStatus === 'loading' ? 'กำลังตรวจ...' : 'ตรวจด้วย AI (แม่นกว่า)'}
                        </button>
                        <button onClick={next} className="px-4 py-2.5 rounded-xl font-bold text-sm text-gray-500 hover:text-gray-700">ข้าม/ข้อใหม่</button>
                    </div>
                    {heuristicResult && (
                        <p className={`text-sm mt-3 font-semibold ${heuristicResult === 'correct' ? 'text-green-600' : heuristicResult === 'almost' ? 'text-amber-600' : 'text-red-600'}`}>
                            {heuristicResult === 'correct' ? '✅ ตรงตัวอย่างอ้างอิง (+10 XP)' : heuristicResult === 'almost' ? '🟡 ใกล้เคียง' : '❌ ไม่ตรงตัวอย่างอ้างอิง'}
                            <span className="block text-gray-400 font-normal mt-1">
                                ตัวอย่างคำแปล: {item.target} — (ยังไม่ใช้ AI เช็คแค่ตรงตัวอย่างนี้เป๊ะๆ อาจฟ้องผิดทั้งที่ความหมายถูกได้ ลองกด "ตรวจด้วย AI" เพื่อความแม่นยำกว่า)
                            </span>
                        </p>
                    )}
                    {aiFeedback && (
                        <div className={`mt-3 p-4 rounded-xl border text-sm whitespace-pre-wrap leading-relaxed ${aiVerdict === 'correct' ? 'bg-green-50 border-green-100 text-green-800' : aiVerdict === 'wrong' ? 'bg-red-50 border-red-100 text-red-800' : 'bg-gray-50 border-gray-100 text-gray-700'}`}>
                            {aiFeedback}
                        </div>
                    )}
                </div>
            );
        }

        // ── shell ของหน้า "ฝึกเขียน" — เลือกภาษา + สลับโหมดย่อย 5 แบบ ──────────────────────
        function WritingView({ langId, setLangId, xp, setXp, srs, setSrs, writing, setWriting, dueCounts }) {
            const lang = LANGS[langId];
            const hasScript = langId === 'lang-cn' || langId === 'lang-jp' || langId === 'lang-kr' || langId === 'lang-en' || langId === 'lang-yue';
            // srsBased: true = โหมดนี้ดึงคิวจาก dueVocab(langId, srs) เหมือนกันหมด (ใช้ pool เดียวกันจริงๆ
            // ไม่ได้แยกคิวกันคนละโหมด — ทวนคำไหนในโหมดไหนก็ตัดออกจากคิวของอีก 2 โหมดด้วย) เลยโชว์
            // due-badge ตัวเลขเดียวกันได้ทั้ง 3 ปุ่มอย่างถูกต้อง ไม่ใช่ค่าคนละชุดที่บังเอิญเท่ากัน
            const SUB_MODES = [
                ...(hasScript ? [{ key: 'script', label: 'ฝึกเขียนตัวอักษร', Icon: BrushIcon, srsBased: true }] : []),
                { key: 'compose', label: 'แต่งประโยคอิสระ', Icon: PenToolIcon },
                { key: 'srsCompose', label: 'แต่งจากคำที่ทวน', Icon: ShuffleIcon, srsBased: true },
                { key: 'dictation', label: 'ฟังแล้วเขียน', Icon: EarIcon, srsBased: true },
                { key: 'translate', label: 'แปลไทย→ภาษา', Icon: LanguagesSmallIcon },
            ];
            const langDue = (dueCounts && dueCounts[langId]) || 0;
            const [subMode, setSubMode] = useState(hasScript ? 'script' : 'compose');
            // เดิมหน้านี้มีแถวปุ่มเลือกภาษาของตัวเอง (14 ปุ่มโชว์ตลอด) ซึ่งซ้ำกับปุ่มดินสอที่แถบข้าง
            // ตอนนี้พาเข้ามาแบบเลือกภาษาไว้แล้ว เลยยุบเป็น chip + ปุ่ม "เปลี่ยนภาษา" แทน กางออกเฉพาะตอนต้องใช้จริง
            const [langPickerOpen, setLangPickerOpen] = useState(false);
            // แจ้งเตือนตอนสลับภาษาแล้วโหมด "ฝึกเขียนตัวอักษร" หายไปเงียบๆ (มีแค่ lang-cn/lang-jp) — กันงงว่าทำไมโหมดหาย
            const [modeNotice, setModeNotice] = useState('');

            useEffect(() => {
                if (subMode === 'script' && !hasScript) {
                    setSubMode('compose');
                    setModeNotice(`ภาษา${lang.title}ยังไม่มีโหมด "ฝึกเขียนตัวอักษร" (ตอนนี้มีแค่ภาษาจีน ญี่ปุ่น เกาหลี และอังกฤษ) — สลับไปโหมด "แต่งประโยคอิสระ" ให้แล้ว`);
                }
            }, [langId]);

            useEffect(() => {
                if (!modeNotice) return;
                const t = setTimeout(() => setModeNotice(''), 6000);
                return () => clearTimeout(t);
            }, [modeNotice]);

            const awardXp = (amt) => setXp(x => x + amt);
            const recordSrs = (key, rating) => setSrs(s => ({ ...s, [key]: fsrsSchedule(s[key] || {}, rating) }));
            const addWritingRecord = (rec) => setWriting(w => mergeWriting(w, [{
                id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
                createdAt: Date.now(), ...rec,
            }]));

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
                        <div>
                            <div className="flex items-center justify-between gap-3 flex-wrap">
                                <div className="flex items-center gap-2 min-w-0">
                                    <span className="text-xs text-gray-400 font-semibold shrink-0">กำลังฝึกเขียน:</span>
                                    <span className="px-3 py-1.5 rounded-full text-sm font-bold bg-brandLight text-brand truncate">{lang.title}</span>
                                </div>
                                <button type="button" onClick={() => setLangPickerOpen(o => !o)}
                                    className="shrink-0 text-xs font-semibold text-gray-500 hover:text-brand border border-gray-200 hover:border-brand rounded-full px-3 py-1.5 transition">
                                    {langPickerOpen ? 'ปิด' : 'เปลี่ยนภาษา'}
                                </button>
                            </div>
                            {langPickerOpen && (
                                <div className="flex flex-wrap gap-2 mt-3 p-3 bg-white border border-gray-200 rounded-xl">
                                    {LANG_IDS.map(id => (
                                        <button key={id} onClick={() => { setLangId(id); setLangPickerOpen(false); }}
                                            className={`relative px-3 py-1.5 rounded-full text-xs font-semibold border transition ${langId === id ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>
                                            {LANGS[id].title}
                                            {dueCounts && dueCounts[id] > 0 && (
                                                <span className={`ml-1.5 inline-flex items-center justify-center min-w-[15px] h-[15px] px-0.5 rounded-full text-[9px] font-bold leading-none ${langId === id ? 'bg-white/25 text-white' : 'bg-red-500 text-white'}`}>
                                                    {dueCounts[id] > 9 ? '9+' : dueCounts[id]}
                                                </span>
                                            )}
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>

                        {modeNotice && (
                            <div className="flex items-center justify-between gap-3 text-xs bg-amber-50 border border-amber-200 text-amber-700 rounded-lg px-3 py-2">
                                <span>ℹ️ {modeNotice}</span>
                                <button type="button" onClick={() => setModeNotice('')} className="text-amber-500 hover:text-amber-700 font-bold shrink-0">✕</button>
                            </div>
                        )}

                        <div className="flex rounded-full border border-gray-200 overflow-hidden text-xs font-bold w-fit flex-wrap bg-white">
                            {SUB_MODES.map(m => (
                                <button key={m.key} onClick={() => setSubMode(m.key)}
                                    className={`px-3 py-1.5 flex items-center gap-1.5 ${subMode === m.key ? 'bg-brand text-white' : 'text-gray-500 hover:bg-gray-50'}`}>
                                    <m.Icon /> {m.label}
                                    {m.srsBased && langDue > 0 && (
                                        <span className={`text-[9px] font-bold rounded-full min-w-[15px] h-[15px] flex items-center justify-center px-0.5 leading-none ${subMode === m.key ? 'bg-white/25 text-white' : 'bg-red-500 text-white'}`}>
                                            {langDue > 99 ? '99+' : langDue}
                                        </span>
                                    )}
                                </button>
                            ))}
                        </div>

                        <div className="bg-white rounded-xl border border-gray-200 p-5 sm:p-6">
                            {subMode === 'script' && hasScript && (
                                (langId === 'lang-kr' || langId === 'lang-en')
                                    ? <LetterPanel srs={srs} recordSrs={recordSrs} awardXp={awardXp} langId={langId} />
                                    : <ScriptPanel srs={srs} recordSrs={recordSrs} awardXp={awardXp} langId={langId} />
                            )}
                            {subMode === 'compose' && <ComposePanel langId={langId} lang={lang} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                            {subMode === 'srsCompose' && <SrsComposePanel langId={langId} lang={lang} srs={srs} recordSrs={recordSrs} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                            {subMode === 'dictation' && <SrsDictationPanel langId={langId} lang={lang} srs={srs} recordSrs={recordSrs} awardXp={awardXp} />}
                            {subMode === 'translate' && <TranslatePanel langId={langId} lang={lang} awardXp={awardXp} addWritingRecord={addWritingRecord} />}
                        </div>
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════════════════
        // ข้อสอบ BCT (Business Chinese Test, จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ BCT ทางการ
        // (ตรวจสอบผ่านเว็บแล้ว): BCT-A (ระดับต้น อ้างอิงคำศัพท์ ~600 คำ) = ฟัง 30 + อ่าน 30 + เขียน 10
        // (รวม 70 ข้อ, ~60 นาที), BCT-B (ระดับกลาง-สูง อ้างอิงคำศัพท์ ~4000 คำ) = ฟัง 50 + อ่าน 40 +
        // เขียน 2 (รวม 92 ข้อ, ~135 นาที — ส่วนเขียนของ B เป็นข้อเขียนอีเมล/รายงานธุรกิจแบบเปิดยาว
        // ไม่ใช่ปรนัย จึงใช้ AI ตรวจให้ feedback แทนแบบเดียวกับโหมด "แต่งประโยคอิสระ" ในฝึกเขียน)
        // หมายเหตุความแม่นยำ: รายละเอียดการแบ่งย่อยภายในแต่ละส่วน (เช่นฟังแบ่งเป็นกี่พาร์ทย่อย) แหล่งข้อมูล
        // ที่หาได้ไม่ได้ระบุครบทุกจุด จึงออกแบบสัดส่วนเองให้สมเหตุสมผล (ระบุไว้ตรงนี้อย่างตรงไปตรงมา) —
        // แต่ "จำนวนข้อรวมต่อส่วน" (ฟัง/อ่าน/เขียน) และ "จำนวนข้อรวมทั้งฉบับ" ตรงกับที่ตรวจสอบมา
        // ══════════════════════════════════════════════════════════════════════════════════

        // คำศัพท์ธุรกิจ ~50 คำ — คิด/ตรวจสอบเองทุกคำ (ไม่มีแพ็กเกจข้อมูล BCT ที่ตรวจสอบแล้วให้ดึงเหมือน HSK)
        // เป็นคำธุรกิจพื้นฐานที่พบบ่อยมาก ความเสี่ยงผิดต่ำกว่าลำดับขีด/คำหายากมาก แต่ยังไม่ได้ผ่านการตรวจ
        // ไขว้กับพจนานุกรมเหมือนคำ HSK — บอกไว้ตรงๆ ในหน้าเลือกข้อสอบด้วย
        const BCT_VOCAB = [
            { word: '会议', pinyin: 'huìyì', thai: 'การประชุม' }, { word: '合同', pinyin: 'hétong', thai: 'สัญญา' },
            { word: '谈判', pinyin: 'tánpàn', thai: 'การเจรจาต่อรอง' }, { word: '客户', pinyin: 'kèhù', thai: 'ลูกค้า' },
            { word: '发票', pinyin: 'fāpiào', thai: 'ใบกำกับภาษี/ใบเสร็จ' }, { word: '预算', pinyin: 'yùsuàn', thai: 'งบประมาณ' },
            { word: '利润', pinyin: 'lìrùn', thai: 'กำไร' }, { word: '成本', pinyin: 'chéngběn', thai: 'ต้นทุน' },
            { word: '投资', pinyin: 'tóuzī', thai: 'การลงทุน' }, { word: '市场', pinyin: 'shìchǎng', thai: 'ตลาด' },
            { word: '产品', pinyin: 'chǎnpǐn', thai: 'สินค้า/ผลิตภัณฑ์' }, { word: '服务', pinyin: 'fúwù', thai: 'บริการ' },
            { word: '老板', pinyin: 'lǎobǎn', thai: 'เจ้านาย' }, { word: '员工', pinyin: 'yuángōng', thai: 'พนักงาน' },
            { word: '部门', pinyin: 'bùmén', thai: 'แผนก' }, { word: '项目', pinyin: 'xiàngmù', thai: 'โครงการ' },
            { word: '报告', pinyin: 'bàogào', thai: 'รายงาน' }, { word: '签字', pinyin: 'qiānzì', thai: 'เซ็นชื่อ' },
            { word: '账户', pinyin: 'zhànghù', thai: 'บัญชี' }, { word: '汇率', pinyin: 'huìlǜ', thai: 'อัตราแลกเปลี่ยน' },
            { word: '税', pinyin: 'shuì', thai: 'ภาษี' }, { word: '出口', pinyin: 'chūkǒu', thai: 'ส่งออก' },
            { word: '进口', pinyin: 'jìnkǒu', thai: 'นำเข้า' }, { word: '订单', pinyin: 'dìngdān', thai: 'ใบสั่งซื้อ' },
            { word: '库存', pinyin: 'kùcún', thai: 'สต๊อกสินค้า' }, { word: '物流', pinyin: 'wùliú', thai: 'โลจิสติกส์' },
            { word: '邮件', pinyin: 'yóujiàn', thai: 'อีเมล/จดหมาย' }, { word: '名片', pinyin: 'míngpiàn', thai: 'นามบัตร' },
            { word: '简历', pinyin: 'jiǎnlì', thai: 'เรซูเม่' }, { word: '面试', pinyin: 'miànshì', thai: 'สัมภาษณ์งาน' },
            { word: '工资', pinyin: 'gōngzī', thai: 'เงินเดือน' }, { word: '奖金', pinyin: 'jiǎngjīn', thai: 'โบนัส' },
            { word: '加班', pinyin: 'jiābān', thai: 'ทำงานล่วงเวลา' }, { word: '辞职', pinyin: 'cízhí', thai: 'ลาออก' },
            { word: '升职', pinyin: 'shēngzhí', thai: 'เลื่อนตำแหน่ง' }, { word: '出差', pinyin: 'chūchāi', thai: 'ไปทำงานต่างที่ (ทริปธุรกิจ)' },
            { word: '合作', pinyin: 'hézuò', thai: 'ร่วมมือ' }, { word: '竞争', pinyin: 'jìngzhēng', thai: 'แข่งขัน' },
            { word: '广告', pinyin: 'guǎnggào', thai: 'โฆษณา' }, { word: '品牌', pinyin: 'pǐnpái', thai: 'แบรนด์' },
            { word: '质量', pinyin: 'zhìliàng', thai: 'คุณภาพ' }, { word: '价格', pinyin: 'jiàgé', thai: 'ราคา' },
            { word: '折扣', pinyin: 'zhékòu', thai: 'ส่วนลด' }, { word: '付款', pinyin: 'fùkuǎn', thai: 'ชำระเงิน' },
            { word: '退货', pinyin: 'tuìhuò', thai: 'คืนสินค้า' }, { word: '保修', pinyin: 'bǎoxiū', thai: 'รับประกัน' },
            { word: '电话会议', pinyin: 'diànhuà huìyì', thai: 'ประชุมทางโทรศัพท์' }, { word: '同事', pinyin: 'tóngshì', thai: 'เพื่อนร่วมงาน' },
            { word: '签证', pinyin: 'qiānzhèng', thai: 'วีซ่า' }, { word: '预约', pinyin: 'yùyuē', thai: 'นัดหมาย' },
        ];
        // รวมคลังคำ HSK2-3 (ตรวจสอบแล้ว) เข้ากับคำธุรกิจ (ข้างบน) เป็น pool เดียว — คล้ายสัดส่วนที่
        // BCT ทางการบอกว่าคำศัพท์ทับซ้อนกับ HSK อยู่มาก มีคำเฉพาะธุรกิจเสริมเข้ามา (ตัดคำซ้ำออก)
        function bctPool() {
            const base = [...HSK_VOCAB.hsk2, ...HSK_VOCAB.hsk3];
            const existing = new Set(base.map(w => w.word));
            const extra = BCT_VOCAB.filter(w => !existing.has(w.word));
            return [...base, ...extra];
        }

        // ประโยคบริบทธุรกิจง่ายๆ สำหรับข้อ "เรียงคำ" ของ BCT-A (คิด/ตรวจไวยากรณ์เองทุกประโยค)
        const BCT_A_WRITE_SENTENCES = [
            { chunks: ['我们', '明天', '开会。'], thai: 'พวกเราจะประชุมกันพรุ่งนี้' },
            { chunks: ['请', '把合同', '签好。'], thai: 'กรุณาเซ็นสัญญาให้เรียบร้อย' },
            { chunks: ['这个产品', '很', '受欢迎。'], thai: 'สินค้านี้เป็นที่นิยมมาก' },
            { chunks: ['客户', '想', '降低价格。'], thai: 'ลูกค้าอยากให้ลดราคา' },
            { chunks: ['我', '需要', '一份报告。'], thai: 'ฉันต้องการรายงานหนึ่งฉบับ' },
            { chunks: ['会议', '定在', '下午三点。'], thai: 'การประชุมกำหนดไว้บ่ายสามโมง' },
            { chunks: ['他', '负责', '市场营销。'], thai: 'เขารับผิดชอบด้านการตลาด' },
            { chunks: ['请', '尽快', '回复邮件。'], thai: 'กรุณาตอบอีเมลโดยเร็วที่สุด' },
            { chunks: ['公司', '上个月', '招聘了新员工。'], thai: 'บริษัทรับพนักงานใหม่เมื่อเดือนที่แล้ว' },
            { chunks: ['这份合同', '下周', '到期。'], thai: 'สัญญาฉบับนี้จะหมดอายุสัปดาห์หน้า' },
            { chunks: ['我们', '需要', '提高产品质量。'], thai: 'เราต้องยกระดับคุณภาพสินค้า' },
            { chunks: ['请', '把账单', '发给我。'], thai: 'กรุณาส่งใบแจ้งหนี้มาให้ฉัน' },
        ];
        // โจทย์เขียนแบบเปิด (BCT-B) — จำลอง "เขียนอีเมล/รายงานธุรกิจ" ของข้อสอบจริง ตรวจด้วย AI
        const BCT_B_WRITE_PROMPTS = [
            { context: 'อีเมลแจ้งเลื่อนนัดประชุม', prompt: 'เขียนอีเมลสั้นๆ (2-3 ประโยค) แจ้งลูกค้าว่าจะเลื่อนนัดประชุมออกไปเป็นสัปดาห์หน้า' },
            { context: 'ข้อความแจ้งขาดประชุม', prompt: 'เขียนข้อความสั้นๆ แจ้งเพื่อนร่วมงานว่าจะขาดประชุมวันนี้เพราะติดธุระ' },
            { context: 'รายงานความคืบหน้าโครงการ', prompt: 'เขียนสรุปสั้นๆ (2-3 ประโยค) รายงานความคืบหน้าของโครงการให้หัวหน้า' },
            { context: 'อีเมลขอบคุณลูกค้า', prompt: 'เขียนอีเมลสั้นๆ ขอบคุณลูกค้าที่สั่งซื้อสินค้า' },
            { context: 'สอบถามราคาสินค้า', prompt: 'เขียนข้อความสั้นๆ สอบถามราคาสินค้าจากซัพพลายเออร์' },
            { context: 'แจ้งเลื่อนกำหนดส่งมอบ', prompt: 'เขียนอีเมลสั้นๆ แจ้งขอเลื่อนกำหนดส่งมอบสินค้า' },
        ];
        const BCT_WRITE_SYSTEM_PROMPT = (contextTh) =>
            `คุณเป็นครูสอนภาษาจีนธุรกิจให้คนไทย ผู้เรียนกำลังฝึกเขียน "${contextTh}" เป็นภาษาจีน\n` +
            `ตรวจสิ่งที่ผู้เรียนเขียนมา ตอบเป็นภาษาไทยเสมอ รูปแบบคำตอบต้องมี 3 ส่วนตามลำดับนี้เท่านั้น:\n` +
            `1) "ตัวอย่างที่ปรับปรุงแล้ว:" ตามด้วยข้อความภาษาจีนที่ถูกต้องและเหมาะสมกับบริบทธุรกิจ\n` +
            `2) "จุดที่แก้ไข:" อธิบายเป็นข้อๆ สั้นๆ ว่าแก้ตรงไหน เพราะอะไร (ทั้งไวยากรณ์และความเหมาะสมเชิงธุรกิจ)\n` +
            `3) "คะแนนความเหมาะสม:" ให้คะแนนเป็นตัวเลข 1-5\n` +
            `ถ้าเขียนดีอยู่แล้วให้บอกตรงๆ ว่าไม่ต้องแก้ไข`;
        const BCT_WRITE_REMINDER =
            'ย้ำ: ตรวจข้อความล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น ตอบตามรูปแบบ 3 ส่วนที่กำหนดไว้เป๊ะๆ ห้ามข้ามส่วนไหน ' +
            'และห้ามตอบเป็นภาษาอื่นนอกจากไทย';

        function buildBctExam(level) {
            const pool = bctPool();
            if (level === 'A') {
                return {
                    kind: 'bct', level, passPct: 60,
                    sections: [
                        { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 15, 'listen-tf'), ...genMcFromWord(pool, 15, 'listen-mc')] },
                        { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 15, 'read-mc'), ...genMcReverse(pool, 15)] },
                        { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteOrder(10) },
                    ],
                };
            }
            // level 'B'
            return {
                kind: 'bct', level, passPct: 60,
                sections: [
                    { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 20, 'listen-tf'), ...genMcFromWord(pool, 30, 'listen-mc')] },
                    { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 20, 'read-mc'), ...genMcReverse(pool, 20)] },
                    { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteEssay(2) },
                ],
            };
        }
        function genBctWriteOrder(count) {
            const picked = shuffleArr(BCT_A_WRITE_SENTENCES).slice(0, Math.min(count, BCT_A_WRITE_SENTENCES.length));
            return picked.map(s => ({ type: 'write-order', chunks: s.chunks, thai: s.thai, scrambled: shuffleArr(s.chunks) }));
        }
        function genBctWriteEssay(count) {
            const picked = shuffleArr(BCT_B_WRITE_PROMPTS).slice(0, Math.min(count, BCT_B_WRITE_PROMPTS.length));
            return picked.map(p => ({ type: 'write-essay', context: p.context, prompt: p.prompt }));
        }

        // ── ปุ่มตัวเลือกปรนัยใช้ร่วมกันหลายชนิดโจทย์ (listen-mc/read-mc/read-mc-reverse/write-pinyin-char)
        function McChoices({ choices, correct, selected, onPick }) {
            return (
                <div className="grid grid-cols-1 gap-2">
                    {choices.map((c, i) => {
                        const isCorrect = c === correct;
                        const isPicked = c === selected;
                        let cls = 'border-gray-200 hover:border-brand text-gray-700 bg-white';
                        if (selected != null) {
                            if (isCorrect) cls = 'border-green-400 bg-green-50 text-green-700';
                            else if (isPicked) cls = 'border-red-300 bg-red-50 text-red-600';
                        }
                        return (
                            <button key={i} onClick={() => onPick(c)} disabled={selected != null}
                                className={`text-left px-4 py-3 rounded-xl border-2 font-medium text-sm transition ${cls}`}>{c}</button>
                        );
                    })}
                </div>
            );
        }

        // ── ภาพประกอบ TOEIC Part 1 (Photo Description) — ไม่มีคลังรูปถ่ายจริงให้ใช้ในสภาพแวดล้อมนี้
        //    และดึงรูปจากอินเทอร์เน็ตทั่วไป (Pexels/Unsplash/Pixabay/Wikimedia ฯลฯ) ไม่ได้เลย เพราะ
        //    เครือข่ายของสภาพแวดล้อมที่ใช้พัฒนาบล็อกโดเมนโฮสต์รูปภาพ/CDN ทั่วไปไว้ — ใช้ภาพประกอบจาก
        //    unDraw (ใบอนุญาตให้ใช้งานได้อิสระ ไม่ต้องให้เครดิต) แทน ดึงมาผ่าน npm package "undraw-svg"
        //    (โดเมน registry.npmjs.org ใช้งานได้ปกติ) เก็บไฟล์ไว้ในเครื่อง images/toeic/ ดูรายละเอียด
        //    แหล่งที่มาที่ images/toeic/README.md — ผู้เรียนต้องตีความภาพเองเหมือนข้อสอบจริง ไม่มี
        //    label ภาษาไทยบอกใบ้เนื้อหาบนภาพ
        function ToeicPhotoIllustration({ id }) {
            return (
                <img src={`./images/toeic/${id}.svg`} alt=""
                    className="w-full h-40 sm:h-52 object-contain" draggable="false" />
            );
        }

        // ── ข้อสอบ HSK (จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ HSK 2.0 ทางการ (ดูหมายเหตุที่
        //    buildHskExam ด้านบน) เนื้อหาสร้างจากคลังคำศัพท์ HSK_VOCAB ที่ตรวจสอบแล้ว รองรับเฉพาะ
        //    ภาษาจีนตอนนี้ — ถ้า langId ไม่ใช่ lang-cn (เผื่อผู้ใช้สลับภาษาที่แถบข้างระหว่างอยู่โหมดนี้)
        //    ให้ขึ้นข้อความชวนสลับกลับแทนที่จะพังเงียบๆ
        function HskExamView({ langId, setLangId, setXp }) {
            const [examType, setExamType] = useState(null); // 'hsk' | 'bct' — เลือกก่อนเลือกระดับ
            const [level, setLevel] = useState(null); // HSK: 1|2|3, BCT: 'A'|'B'
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true); // หน้าแนะนำก่อนเริ่มแต่ละส่วน
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null); // string | boolean | ขึ้นกับชนิดโจทย์
            const [placedIdx, setPlacedIdx] = useState([]); // สำหรับ write-order เท่านั้น
            const [essayText, setEssayText] = useState(''); // สำหรับ write-essay (BCT-B) เท่านั้น
            const [essayFeedback, setEssayFeedback] = useState('');
            const [essayStatus, setEssayStatus] = useState(''); // '' | 'loading' | 'done' | 'error'
            const [sectionResults, setSectionResults] = useState([]); // [{key,title,correct,total}]
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => {
                setAnswered(false); setUserAnswer(null); setPlacedIdx([]);
                setEssayText(''); setEssayFeedback(''); setEssayStatus('');
            };

            const start = (type, lvl) => {
                const built = type === 'bct' ? buildBctExam(lvl) : buildHskExam(lvl);
                setExamType(type); setLevel(lvl); setExam(built);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            // ── เล่นเสียงอัตโนมัติทันทีที่เข้าโจทย์ฟังข้อใหม่ (听力 เท่านั้น) — เหมือนที่ทำกับ TOEIC/
            //    JLPT ปุ่ม "ฟังเสียง" เดิมยังอยู่ให้กดฟังซ้ำได้ตามปกติ ต้องอยู่ก่อน early return ทุก
            //    อันเพราะเป็น hook (HSK/BCT ใช้คำเดี่ยวๆ ไม่ใช่บทสนทนาแบบ TOEIC/JLPT เลยแค่ speak()
            //    ครั้งเดียวพอ ไม่ต้องมีหลายเสียง/หลาย timer แบบนั้น) ──
            useEffect(() => {
                if (!exam || showIntro || finished) return;
                const sec = exam.sections[sectionIdx];
                const question = sec && sec.questions[qIdx];
                if (!question) return;
                if (question.type !== 'listen-tf' && question.type !== 'listen-mc') return;
                const t0 = setTimeout(() => speak(question.word, 'zh'), 400);
                return () => clearTimeout(t0);
            }, [exam, sectionIdx, qIdx, showIntro]);

            const examLabel = examType === 'bct' ? `BCT (${level})` : `HSK${level}`;

            if (langId !== 'lang-cn') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบ HSK/BCT รองรับเฉพาะภาษาจีนตอนนี้</p>
                            <button onClick={() => setLangId('lang-cn')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาจีน</button>
                        </div>
                    </div>
                );
            }

            // ── ขั้นที่ 1: เลือกประเภทข้อสอบ ──────────────────────────────────────────────
            if (!examType) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบภาษาจีน (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">เลือกประเภทข้อสอบก่อน:</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onClick={() => setExamType('hsk')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">HSK</div>
                                    <div className="text-xs text-gray-500">วัดระดับภาษาจีนทั่วไป ใช้สมัครเรียนต่อ/ยื่นวีซ่าทำงานในจีน — มี 3 ระดับ</div>
                                </button>
                                <button onClick={() => setExamType('bct')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">BCT</div>
                                    <div className="text-xs text-gray-500">ภาษาจีนธุรกิจ (ประชุม/อีเมล/เจรจา) เหมาะกับคนทำงานสายติดต่อธุรกิจกับจีน — มี 2 ระดับ</div>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ขั้นที่ 2: เลือกระดับ ────────────────────────────────────────────────────
            if (!level || !exam) {
                const hskLevels = [
                    { lvl: 1, info: 'ฟัง 20 + อ่าน 20 = 40 ข้อ' },
                    { lvl: 2, info: 'ฟัง 35 + อ่าน 25 = 60 ข้อ' },
                    { lvl: 3, info: 'ฟัง 40 + อ่าน 30 + เขียน 10 = 80 ข้อ' },
                ];
                const bctLevels = [
                    { lvl: 'A', info: 'ระดับต้น · ฟัง 30 + อ่าน 30 + เขียน 10 = 70 ข้อ' },
                    { lvl: 'B', info: 'ระดับกลาง-สูง · ฟัง 50 + อ่าน 40 + เขียนอีเมล 2 ข้อ = 92 ข้อ' },
                ];
                const levels = examType === 'bct' ? bctLevels : hskLevels;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <button onClick={() => setExamType(null)} className="text-xs font-semibold text-gray-400 hover:text-gray-700 mb-3">← เปลี่ยนประเภทข้อสอบ</button>
                            <h2 className="text-xl font-bold text-gray-800 mb-1">{examType === 'bct' ? 'ข้อสอบ BCT (จำลอง)' : 'ข้อสอบ HSK (จำลอง)'}</h2>
                            <p className="text-sm text-gray-500 mb-5">โครงสร้าง/จำนวนข้อยึดตามข้อสอบ{examType === 'bct' ? ' BCT' : ' HSK 2.0'} ทางการจริง เลือกระดับที่จะทดสอบ:</p>
                            <div className={`grid grid-cols-1 ${examType === 'bct' ? 'sm:grid-cols-2' : 'sm:grid-cols-3'} gap-3`}>
                                {levels.map(({ lvl, info }) => (
                                    <button key={lvl} onClick={() => start(examType, lvl)}
                                        className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-center transition bg-white">
                                        <div className="text-2xl font-bold text-brand mb-1">{examType === 'bct' ? `BCT (${lvl})` : `HSK${lvl}`}</div>
                                        <div className="text-xs text-gray-400">{info}</div>
                                    </button>
                                ))}
                            </div>
                            <p className="text-xs text-gray-400 mt-5 leading-relaxed">
                                หมายเหตุ: เป็นแบบทดสอบจำลองที่สร้างจากคลังคำศัพท์ของเว็บนี้เอง ไม่ใช่ข้อสอบทางการที่หลุดออกมา —
                                ข้อสอบจริงมีโจทย์ให้จับคู่รูปภาพหลายข้อ แต่เว็บนี้ไม่มีคลังรูปภาพ จึงแทนที่ด้วยโจทย์จับคู่ความหมายไทยแทน
                                (ทดสอบทักษะเดียวกัน) เกณฑ์ผ่านทางการคือ 60% ทุกระดับ
                                {examType === 'bct' && ' คำศัพท์ธุรกิจที่ใช้เป็นคำที่คิด/ตรวจสอบเองความหมายพื้นฐาน ยังไม่ได้ตรวจไขว้กับพจนานุกรมเหมือนคำ HSK'}
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = () => start(examType, level);
            const backToLevels = () => { setLevel(null); setExam(null); };
            const backToType = () => { setExamType(null); setLevel(null); setExam(null); };

            if (finished) {
                const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = sectionResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลสอบ {examLabel}</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง{pct >= exam.passPct ? ` — ผ่านเกณฑ์ทางการ (≥${exam.passPct}%) 🎉` : ` — ยังไม่ถึงเกณฑ์ทางการ (${exam.passPct}%) ลองฝึกเพิ่ม`}</p>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.correct}/{r.total}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">สอบใหม่ระดับเดิม</button>
                                <button onClick={backToLevels} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">เลือกระดับใหม่</button>
                                <button onClick={backToType} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">เปลี่ยนเป็น{examType === 'bct' ? ' HSK' : ' BCT'}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">{examLabel} · ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

            const q = section.questions[qIdx];

            const finishSection = () => {
                const results = [...sectionResults, { key: section.key, title: section.title, correct: correctInSection, total: section.questions.length }];
                setSectionResults(results);
                if (sectionIdx + 1 >= exam.sections.length) {
                    setFinished(true);
                } else {
                    setSectionIdx(i => i + 1);
                    setShowIntro(true);
                    setQIdx(0);
                    resetPerQuestion();
                    setCorrectInSection(0);
                }
            };

            const nextQuestion = () => {
                if (qIdx + 1 >= section.questions.length) { finishSection(); return; }
                setQIdx(i => i + 1); resetPerQuestion();
            };

            const recordAnswer = (isCorrect, wrongEntry) => {
                setAnswered(true);
                if (isCorrect) { setCorrectInSection(c => c + 1); setXp(x => x + 2); }
                else if (wrongEntry) setAllWrong(w => [...w, wrongEntry]);
            };

            const pickMc = (choice) => {
                if (answered) return;
                setUserAnswer(choice);
                const isCorrect = choice === q.correct;
                recordAnswer(isCorrect, isCorrect ? null : { left: q.word || q.thai, right: q.correct });
            };

            const pickTf = (val) => {
                if (answered) return;
                setUserAnswer(val);
                const isCorrect = val === q.answer;
                recordAnswer(isCorrect, isCorrect ? null : { left: `${q.word} = ${q.shownThai}`, right: q.answer ? 'ถูก' : 'ผิด' });
            };

            const tapChunk = (idx) => {
                if (answered) return;
                setPlacedIdx(p => [...p, idx]);
            };
            const undoChunk = () => { if (!answered) setPlacedIdx(p => p.slice(0, -1)); };
            const submitOrder = () => {
                if (answered || placedIdx.length !== q.chunks.length) return;
                const built = placedIdx.map(i => q.scrambled[i]);
                const isCorrect = built.join('') === q.chunks.join('');
                recordAnswer(isCorrect, isCorrect ? null : { left: q.thai, right: q.chunks.join('') });
            };

            // write-essay (BCT-B เท่านั้น) — ข้อเขียนเปิด ให้ AI ตรวจแบบเดียวกับโหมด "แต่งประโยคอิสระ"
            // ในหน้าฝึกเขียน ไม่ gate ถูก/ผิดตามคำตัดสินของ AI (โมเดลเล็กไม่น่าเชื่อถือพอสำหรับ auto-grade)
            // แค่ให้ครบ flow + XP เมื่อส่งสำเร็จ ไม่นับเข้ารายการ "ข้อที่ตอบผิด" เพราะไม่มีคำตอบเดียวที่ถูก
            const submitEssay = () => {
                if (!essayText.trim() || essayStatus === 'loading') return;
                if (isIOS()) {
                    setEssayStatus('error');
                    setEssayFeedback('ฟีเจอร์ตรวจด้วย AI ยังไม่รองรับ iPhone/iPad ในตอนนี้ — กด "ข้ามข้อนี้" เพื่อไปต่อได้เลย');
                    return;
                }
                setEssayStatus('loading'); setEssayFeedback('');
                const w = getWritingWorker();
                const jobId = 'bctessay-' + Date.now();
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setEssayFeedback(acc); }
                    else if (msg.type === 'done') { cleanup(); setEssayStatus('done'); setAnswered(true); setXp(x => x + 2); }
                    else if (msg.type === 'error') { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 320,
                    messages: [
                        { role: 'system', content: BCT_WRITE_SYSTEM_PROMPT(q.context) },
                        { role: 'user', content: essayText },
                        { role: 'system', content: BCT_WRITE_REMINDER },
                    ],
                });
            };
            const skipEssay = () => { setAnswered(true); };

            const progressLabel = `${section.title} · ข้อ ${qIdx + 1}/${section.questions.length}`;

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-xl mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-4">
                            <span className="text-xs font-bold text-gray-400 uppercase">{examLabel} · {progressLabel}</span>
                            <span className="text-xs font-bold text-brand">ถูก {correctInSection} ข้อ</span>
                        </div>

                        {/* ── listen-tf / listen-mc: มีปุ่มฟังเสียงแทนการโชว์ตัวอักษรจีนตรงๆ (จำลองส่วนฟัง) ── */}
                        {(q.type === 'listen-tf' || q.type === 'listen-mc') && (
                            <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                <p className="text-xs text-gray-400 mb-3">🎧 กดฟังแล้วตอบ</p>
                                <button onClick={() => speak(q.word, 'zh')} className="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-brandLight text-brand font-bold text-sm hover:opacity-80">
                                    <Volume2 /> ฟังเสียง (ฟังซ้ำได้)
                                </button>
                            </div>
                        )}

                        {q.type === 'listen-tf' && (
                            <>
                                <p className="text-center text-gray-700 mb-4">ความหมายคือ <span className="font-bold">"{q.shownThai}"</span> ใช่หรือไม่?</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => pickTf(true)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === true ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === true ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>✅ ถูก</button>
                                    <button onClick={() => pickTf(false)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === false ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === false ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>❌ ผิด</button>
                                </div>
                            </>
                        )}

                        {q.type === 'read-tf' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-4xl font-bold text-gray-900 mb-2">{q.word}</div>
                                    <div className="text-sm text-gray-400">{q.pinyin}</div>
                                </div>
                                <p className="text-center text-gray-700 mb-4">ความหมายคือ <span className="font-bold">"{q.shownThai}"</span> ใช่หรือไม่?</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => pickTf(true)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === true ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === true ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>✅ ถูก</button>
                                    <button onClick={() => pickTf(false)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === false ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === false ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>❌ ผิด</button>
                                </div>
                            </>
                        )}

                        {q.type === 'listen-mc' && (
                            <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                        )}

                        {q.type === 'read-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-5xl font-bold text-gray-900 mb-2">{q.word}</div>
                                    <button onClick={() => speak(q.word, 'zh')} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังเสียง</button>
                                </div>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {(q.type === 'read-mc-reverse' || q.type === 'write-pinyin-char') && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-2xl font-bold text-gray-900 mb-1">{q.thai}</div>
                                    {q.type === 'write-pinyin-char' && <div className="text-sm text-gray-400">พินอิน: {q.pinyin}</div>}
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกตัวอักษรจีนที่ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'write-order' && (
                            <>
                                <p className="text-center text-gray-700 mb-1">เรียงคำให้เป็นประโยคที่แปลว่า:</p>
                                <p className="text-center font-bold text-gray-900 mb-4">"{q.thai}"</p>
                                <div className="min-h-[64px] bg-white rounded-xl border-2 border-dashed border-gray-200 p-3 mb-3 flex flex-wrap gap-2 items-center">
                                    {placedIdx.length === 0 && <span className="text-xs text-gray-300">แตะคำด้านล่างเพื่อเรียงประโยคที่นี่</span>}
                                    {placedIdx.map((idx, i) => (

                                </div>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {q.scrambled.map((chunk, idx) => (
                                        !placedIdx.includes(idx) && (
                                            <button key={idx} onClick={() => tapChunk(idx)} disabled={answered}
                                                className="px-3 py-1.5 rounded-lg border-2 border-gray-200 hover:border-brand text-sm font-semibold text-gray-700 bg-white">{chunk}</button>
                                        )
                                    ))}
                                </div>
                                <div className="flex gap-2 mb-2">
                                    <button onClick={undoChunk} disabled={answered || !placedIdx.length} className="px-4 py-2 rounded-xl border-2 border-gray-200 text-gray-500 text-xs font-semibold disabled:opacity-40">ย้อนกลับ 1 คำ</button>
                                    <button onClick={submitOrder} disabled={answered || placedIdx.length !== q.chunks.length}
                                        className="flex-1 py-2 rounded-xl bg-gray-900 text-white text-sm font-bold disabled:bg-gray-200 disabled:text-gray-400">ตรวจคำตอบ</button>
                                </div>
                                {answered && (
                                    <p className={`text-sm text-center font-semibold ${placedIdx.map(i => q.scrambled[i]).join('') === q.chunks.join('') ? 'text-green-600' : 'text-red-600'}`}>

                                    </p>
                                )}
                            </>
                        )}

                        {q.type === 'write-essay' && (
                            <>
                                <p className="text-xs text-gray-400 mb-1">{q.context}</p>
                                <p className="text-gray-700 font-semibold mb-3">{q.prompt}</p>
                                <textarea value={essayText} onChange={e => setEssayText(e.target.value)} rows={4} disabled={answered}
                                    placeholder="เขียนเป็นภาษาจีนตรงนี้..."
                                    className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-sm resize-y disabled:bg-gray-50 mb-3" />
                                {!answered && (
                                    <div className="flex gap-2 mb-3">
                                        <button onClick={submitEssay} disabled={!essayText.trim() || essayStatus === 'loading'}
                                            className="flex-1 py-2.5 rounded-xl bg-gray-900 text-white text-sm font-bold disabled:bg-gray-200 disabled:text-gray-400">
                                            {essayStatus === 'loading' ? 'กำลังตรวจ...' : 'ส่งให้ AI ตรวจ'}
                                        </button>
                                        <button onClick={skipEssay} className="px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-500 text-xs font-semibold">ข้ามข้อนี้</button>
                                    </div>
                                )}
                                {essayFeedback && <div className="p-4 rounded-xl bg-white border border-gray-200 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{essayFeedback}</div>}
                            </>
                        )}

                        {answered && (
                            <button onClick={nextQuestion} className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white">
                                {qIdx + 1 >= section.questions.length ? (sectionIdx + 1 >= exam.sections.length ? 'ดูผลสอบ' : 'ไปส่วนต่อไป') : 'ข้อต่อไป'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // Part 5 (Incomplete Sentences) ของ TOEIC — โจทย์ไวยากรณ์บริบทธุรกิจ เขียน/ตรวจเองทุกข้อ
        const TOEIC_GRAMMAR = [
            { sentence: 'The meeting has been ___ to next Monday.', choices: ['postponed', 'postpone', 'postponing', 'posts'], correct: 'postponed' },
            { sentence: 'She is responsible ___ managing the sales team.', choices: ['for', 'to', 'at', 'in'], correct: 'for' },
            { sentence: 'By the time you arrive, we ___ the presentation.', choices: ['will have finished', 'finish', 'finished', 'are finishing'], correct: 'will have finished' },
            { sentence: 'The report needs to be submitted ___ Friday.', choices: ['by', 'until', 'since', 'during'], correct: 'by' },
            { sentence: 'Neither the manager nor the employees ___ satisfied with the results.', choices: ['are', 'is', 'was', 'be'], correct: 'are' },
            { sentence: 'This is the best proposal we ___ received so far.', choices: ['have', 'has', 'had', 'having'], correct: 'have' },
            { sentence: 'The company ___ its profits significantly last year.', choices: ['increased', 'increases', 'increasing', 'has increase'], correct: 'increased' },
            { sentence: 'Please make sure all documents are labeled ___.', choices: ['correctly', 'correct', 'correctness', 'correcting'], correct: 'correctly' },
            { sentence: 'If the client ___ any questions, please contact us.', choices: ['has', 'have', 'having', 'had'], correct: 'has' },
            { sentence: 'The new policy will affect ___ department in the company.', choices: ['every', 'all', 'each of', 'most'], correct: 'every' },
            { sentence: 'We look forward ___ from you soon.', choices: ['to hearing', 'to hear', 'hearing', 'heard'], correct: 'to hearing' },
            { sentence: 'The budget was reduced ___ 10 percent this quarter.', choices: ['by', 'with', 'at', 'for'], correct: 'by' },
            { sentence: 'Employees who arrive late ___ required to sign in at the front desk.', choices: ['are', 'is', 'was', 'be'], correct: 'are' },
            { sentence: 'The conference room is currently ___ use.', choices: ['in', 'on', 'at', 'by'], correct: 'in' },
            { sentence: 'Our new product line is more efficient ___ the previous one.', choices: ['than', 'that', 'then', 'as'], correct: 'than' },
            { sentence: 'The manager asked her assistant ___ the files before the meeting.', choices: ['to organize', 'organizing', 'organize', 'organized'], correct: 'to organize' },
            { sentence: 'All visitors must register ___ the reception desk.', choices: ['at', 'in', 'on', 'to'], correct: 'at' },
            { sentence: 'The shipment was delayed due ___ bad weather.', choices: ['to', 'for', 'of', 'with'], correct: 'to' },
            { sentence: 'This model is one of the ___ selling products this year.', choices: ['best', 'better', 'good', 'best-'], correct: 'best' },
            { sentence: 'The team ___ working on this project since March.', choices: ['has been', 'have been', 'is', 'was'], correct: 'has been' },
            { sentence: "The new employees must complete their training ___ the end of the month.", choices: ["before", "until", "since", "during"], correct: "before" },
            { sentence: "The report was written ___ the marketing department.", choices: ["by", "from", "of", "with"], correct: "by" },
            { sentence: "Customers can return items ___ 30 days of purchase.", choices: ["within", "during", "for", "since"], correct: "within" },
            { sentence: "The CEO gave a speech ___ inspired all the staff.", choices: ["that", "who", "whom", "whose"], correct: "that" },
            { sentence: "We need someone ___ can speak both English and Chinese.", choices: ["who", "which", "whom", "whose"], correct: "who" },
            { sentence: "The factory produces ___ than 500 units per day.", choices: ["more", "much", "many", "most"], correct: "more" },
            { sentence: "Despite ___ the deadline, the team completed the project successfully.", choices: ["missing", "miss", "missed", "to miss"], correct: "missing" },
            { sentence: "The invoice should be paid ___ receipt.", choices: ["upon", "at", "in", "on"], correct: "upon" },
            { sentence: "Employees are encouraged to give ___ feedback about the new system.", choices: ["honest", "honestly", "honesty", "honester"], correct: "honest" },
            { sentence: "The company's revenue has increased significantly ___ last year.", choices: ["since", "from", "at", "of"], correct: "since" },
        ];
        function genGrammarMc(bank, count) {
            const picked = shuffleArr(bank).slice(0, Math.min(count, bank.length));
            return picked.map(item => ({ type: 'grammar-mc', sentence: item.sentence, choices: shuffleArr(item.choices), correct: item.correct }));
        }
