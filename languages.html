    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const LANGS = JSON.parse(document.getElementById('lang-data').textContent);
        const LANG_IDS = Object.keys(LANGS);
        // คำศัพท์เดี่ยวสำหรับโหมด "ฝึกเขียน" (ทวนคำศัพท์แบบ SRS) — แยกจาก lang-data เพื่อให้เพิ่ม/แก้
        // คำศัพท์ได้โดยไม่ต้องแตะ JSON ก้อนใหญ่ของวลี — ภาษาจีน (lang-cn) ไม่มีในนี้ เพราะใช้ชุดตัวอักษร
        // จาก zh-script-data แทน (ตัวอักษรแต่ละตัวทำหน้าที่เป็นทั้งการ์ดฝึกเขียนและคำศัพท์ทวนในตัว)

        }

        function mergeNotes(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const na = a && a[k], nb = b && b[k];
                if (!na) { out[k] = nb; return; }
                if (!nb) { out[k] = na; return; }
                out[k] = (na.updatedAt || 0) >= (nb.updatedAt || 0) ? na : nb;
            });
            return out;
        }

        // ── ตรวจคำตอบแบบใกล้เคียง (ไม่ต้องพิมพ์ตรง 100%) ───────────────────────
        function normalizeAnswer(s) {
            return String(s || '').toLowerCase().trim()
                .replace(/[.,!?;:'"“”‘’、。？！ๆ]/g, '')
                .replace(/\s+/g, ' ');
        }
        function levenshtein(a, b) {
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = Array.from({ length: n + 1 }, (_, i) => i);
            for (let i = 1; i <= m; i++) {
                const cur = [i];
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                prev = cur;
            }
            return prev[n];
        }
        function gradeAnswer(typed, target) {
            const a = normalizeAnswer(typed), b = normalizeAnswer(target);
            if (!a) return 'wrong';
            if (a === b) return 'correct';
            const sim = 1 - levenshtein(a, b) / Math.max(a.length, b.length);
            return sim >= 0.9 ? 'correct' : sim >= 0.7 ? 'almost' : 'wrong';
        }

        // ── คิวคำที่ตอบผิด (โผล่บนหน้าสตรีมให้กลับมาฝึกซ้ำ) ─────────────────────
        function loadWrong() {
            try { return JSON.parse(localStorage.getItem('lang-practice:wrong') || '{}'); } catch { return {}; }
        }
        function saveWrong(v) { localStorage.setItem('lang-practice:wrong', JSON.stringify(v)); }
        function mergeWrong(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.count || 0) >= (vb.count || 0) ? va : vb);
            });
            return out;
        }

        // ── ระบบทวนคำศัพท์แบบเว้นช่วงเวลา (FSRS) — คัดลอกมาจาก classroom-law.js (คำนวณตรงตามต้นฉบับ
        // ทุกจุด ไม่ปรับ logic) เอนจินตัวเดียวกับที่ใช้ทวนหัวข้อ/มาตราวิชานิติกรรมสัญญาอยู่แล้ว ใช้สูตร
        // ความจำจริง R(t,S) = (1+t/(9S))⁻¹ ที่เป้าหมายการจำ 90% ทำให้ interval ทวนครั้งถัดไป = stability
        // พอดี (ดูอนุพันธ์เต็มได้ในคอมเมนต์ classroom-law.js) ─────────────────────────────────
        const DAY_MS = 86400000;
        function fsrsRetrievability(elapsedDays, stability) {
            if (!stability || stability <= 0) return 0;
            return Math.pow(1 + elapsedDays / (9 * stability), -1);
        }
        function fsrsSchedule(n, rating) { // rating: 1=Again 2=Hard 3=Good 4=Easy
            const now = Date.now();
            let difficulty = n.difficulty == null ? 5 : n.difficulty;
            let stability = n.stability;
            if (stability == null) {
                const initStability = { 1: 0.5, 2: 1, 3: 3, 4: 7 };
                stability = initStability[rating];
                difficulty = 5 - (rating - 3);
            } else {
                const elapsedDays = Math.max((now - (n.lastReview || now)) / DAY_MS, 0);
                const r = fsrsRetrievability(elapsedDays, stability);
                if (rating === 1) {
                    stability = Math.max(stability * 0.5 * (1 - difficulty / 20), 0.5);
                    difficulty += 1;
                } else {
                    const ratingMul = { 2: 0.5, 3: 1, 4: 1.6 }[rating];
                    const growth = 1 + ((11 - difficulty) / 10) * (1 - r) * ratingMul;
                    stability = stability * Math.max(growth, 1.05);
                    difficulty += (rating - 3) * -0.5;
                }
            }
            difficulty = Math.min(Math.max(difficulty, 1), 10);
            const FSRS_RETENTION = 0.9;
            const intervalDays = 9 * stability * (1 / FSRS_RETENTION - 1); // = stability พอดีที่เป้าหมาย 90%
            return {
                stability, difficulty,
                reps: (n.reps || 0) + (rating > 1 ? 1 : 0), lapses: (n.lapses || 0) + (rating === 1 ? 1 : 0),
                lastReview: now, dueAt: now + Math.max(intervalDays, 1 / 24) * DAY_MS,
                srsIdx: rating === 1 ? -1 : (n.srsIdx || 0) + 1,
            };
        }

        // ── สโตร์การ์ดทวนคำศัพท์ (คีย์รูปแบบเดียวกับ wrongKey: `${langId}::${cat}::${idx}` — ภาษาจีน
        // ใช้ `lang-cn::script::${i}` ผูกกับ ZH_SCRIPT.characters[i] แทน) ─────────────────────
        function loadSrs() {
            try { return JSON.parse(localStorage.getItem('lang-practice:srs') || '{}'); } catch { return {}; }
        }
        function saveSrs(v) { localStorage.setItem('lang-practice:srs', JSON.stringify(v)); }
        function mergeSrs(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.lastReview || 0) >= (vb.lastReview || 0) ? va : vb);
            });
            return out;
        }
        // รวมคำศัพท์ทุกคำของภาษาหนึ่งเป็นก้อนเดียว (จาก VOCAB ปกติ หรือ ZH_SCRIPT ถ้าเป็นภาษาจีน)
        // พร้อมคีย์ SRS ของแต่ละคำ ใช้เป็นแหล่งข้อมูลกลางให้ทั้งโหมดฝึกเขียนตัวอักษร/dictation/แต่งประโยค
        function vocabPool(langId) {
            if (langId === 'lang-cn') {
                return ZH_SCRIPT.characters.map((c, i) => ({ key: `lang-cn::script::${i}`, word: c.char, thai: c.meaningTh, extra: c }));
            }
            const out = [];
            const cats = VOCAB[langId] || {};
            Object.keys(cats).forEach(cat => {
                (cats[cat] || []).forEach((w, i) => out.push({ key: `${langId}::vocab-${cat}::${i}`, word: w.word, thai: w.thai }));
            });
            return out;
        }
        function dueVocab(langId, srs) {
            const now = Date.now();
            return vocabPool(langId).filter(item => {
                const rec = srs[item.key];
                return !rec || (rec.dueAt || 0) <= now;
            });
        }

        // ── ประวัติการส่งงาน "ฝึกเขียน" (แต่งประโยค/แปล/dictation) — array จำกัด 200 รายการล่าสุด
        // กันขนาด payload ตอนซิงก์ Google Drive บวมเกินไป ──────────────────────────────────
        const WRITING_HISTORY_CAP = 200;

            return Array.from(byId.values()).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0)).slice(0, WRITING_HISTORY_CAP);

                            scope: DRIVE_SCOPE,
                            callback: (resp) => {
                                if (resp.error) { reject(new Error(resp.error)); return; }
                                this.accessToken = resp.access_token;
                                resolve(this.accessToken);
                            },
                        });
                    }
                    this.tokenClient.requestAccessToken({ prompt: this.accessToken ? '' : 'consent' });
                });
            },
            async ensureFolder() {
                if (this.folderId) return this.folderId;
                const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                if (data.files && data.files.length) { this.folderId = data.files[0].id; return this.folderId; }
                const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
                });
                if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
                const createData = await createRes.json();
                this.folderId = createData.id;
                return this.folderId;
            },
            async findFile(name, folderId) {
                const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาไฟล์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },
            async downloadFile(fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
            async uploadFile(name, folderId, existingId, obj) {
                const form = new FormData();
                const metadata = existingId ? {} : { name, parents: [folderId] };
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
                const url = existingId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const res = await fetch(url, { method: existingId ? 'PATCH' : 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken }, body: form });
                if (!res.ok) throw new Error('บันทึกขึ้น Drive ไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
        };

        function mergeProgress(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const la = (a && a[k]) || [], lb = (b && b[k]) || [];
                const len = Math.max(la.length, lb.length);
                const arr = [];
                for (let i = 0; i < len; i++) arr[i] = !!(la[i] || lb[i]);
                out[k] = arr;
            });
            return out;
        }

        // ── กระดานเขียนด้วยลายมือ (รองรับนิ้ว/สไตลัส/Apple Pencil บน iPad ผ่าน Pointer Events —
        //    Safari ส่ง Apple Pencil มาเป็น pointerType 'pen' ให้ฟรีอยู่แล้วไม่ต้องเขียนโค้ดแยกเคส)
        //    ใช้ร่วมกันทั้งโน้ตของฉันและโหมด "แต่งประโยคอิสระ" ในฝึกเขียน — พื้นฐานคือ canvas ธรรมดา
        //    บันทึกภาพเป็น PNG data URL ผ่าน onChange ทุกครั้งที่ยกปากกา ไม่ได้แปลงเป็นข้อความในตัวเอง
        //    (ปุ่ม "แปลงเป็นข้อความ" อยู่ที่ผู้เรียกใช้แต่ละจุดแทน เพราะแต่ละจุดจัดการผลลัพธ์ต่างกัน) ──
        function HandwritingCanvas({ value, onChange, onReady, height }) {
            const canvasRef = useRef(null);
            const drawingRef = useRef(false);
            const lastPointRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const dpr = Math.min(window.devicePixelRatio || 1, 2); // กัน PNG บวมเกินไปบนจอ DPR สูง
                const w = canvas.clientWidth, h = canvas.clientHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.4;
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
                if (value) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0, w, h);
                    img.src = value;
                }
                if (onReady) onReady(canvas);
            }, []);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };
            const start = (e) => {
                e.preventDefault();
                canvasRef.current.setPointerCapture(e.pointerId);
                drawingRef.current = true;
                lastPointRef.current = getPos(e);
            };
            const move = (e) => {
                if (!drawingRef.current) return;
                e.preventDefault();
                const ctx = canvasRef.current.getContext('2d');
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(lastPointRef.current.x, lastPointRef.current.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                lastPointRef.current = p;
            };
            const finish = () => {
                if (!drawingRef.current) return;
                drawingRef.current = false;
                if (onChange) onChange(canvasRef.current.toDataURL('image/png'));
            };
            const clear = () => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
                if (onChange) onChange('');
            };

            return (
                <div>
                    <canvas ref={canvasRef}
                        style={{ width: '100%', height: (height || 220) + 'px', touchAction: 'none', background: '#fff', borderRadius: '12px', border: '2px solid #e5e7eb', display: 'block' }}
                        onPointerDown={start} onPointerMove={move} onPointerUp={finish} onPointerLeave={finish} onPointerCancel={finish}
                    />
                    <button type="button" onClick={clear} className="mt-1.5 text-xs font-semibold text-gray-400 hover:text-gray-600">ล้างกระดาน</button>
                </div>
            );
        }

        // ── แผนภาพ/แบบฝึกลำดับขีดตัวอักษรจีน ใช้ไลบรารี hanzi-writer (ข้อมูลลำดับขีดจริงจากโปรเจกต์
        //    Make Me a Hanzi ตรวจสอบแล้ว) — ตอนแรกลองสร้างแผนภาพลำดับขีดเองด้วยมือสำหรับ 60 ตัวอักษร

        //    ตรวจสอบแล้วแทน ปลอดภัยกว่าข้อมูลที่เดาเองมาก — มีทั้งโหมดดูภาพเคลื่อนไหวและโหมดลองลากเอง (quiz)
        //    ซึ่งรองรับนิ้ว/สไตลัส/Apple Pencil ผ่าน pointer/touch events อยู่แล้วในตัวไลบรารี
        function StrokeOrderDiagram({ char }) {
            const containerRef = useRef(null);
            const writerRef = useRef(null);
            const [mode, setMode] = useState('view'); // 'view' | 'quiz'
            const [quizMsg, setQuizMsg] = useState('');
            const [libErr, setLibErr] = useState(false);

            useEffect(() => {
                if (!containerRef.current) return;
                if (!window.HanziWriter) { setLibErr(true); return; }
                setLibErr(false);
                containerRef.current.innerHTML = '';
                setQuizMsg('');
                setMode('view');
                writerRef.current = window.HanziWriter.create(containerRef.current, char, {
                    width: 220, height: 220, padding: 14,
                    showOutline: true,
                    strokeColor: '#0f766e',
                    highlightColor: '#facc15',
                    drawingWidth: 34,
                });
            }, [char]);

            const playAnimation = () => {
                setMode('view'); setQuizMsg('');
                writerRef.current && writerRef.current.animateCharacter();
            };
            const startQuiz = () => {
                setMode('quiz');
                setQuizMsg(`ลองลากตามลำดับขีดของ ${char} ดูสิ`);
                writerRef.current && writerRef.current.quiz({
                    onCorrectStroke: (info) => setQuizMsg(`✅ ถูกต้อง (ขีดที่ ${info.strokeNum + 1})`),
                    onMistake: () => setQuizMsg('❌ ยังไม่ตรง ลองดูเส้นจางๆ แล้วลากตามอีกครั้ง'),
                    onComplete: (summary) => setQuizMsg(summary.totalMistakes === 0 ? '🎉 เขียนครบ ถูกทุกขีดเลย!' : `🎉 เขียนครบแล้ว (พลาด ${summary.totalMistakes} ครั้งระหว่างทาง)`),
                });
            };

            if (libErr) return <p className="text-xs text-gray-400 mt-2">โหลดแผนภาพลำดับขีดไม่สำเร็จ (อินเทอร์เน็ตอาจไม่เสถียร) ลองรีเฟรชหน้าใหม่</p>;

            return (
                <div className="mt-3">
                    <div ref={containerRef} className="mx-auto rounded-xl border-2 border-gray-100 bg-white" style={{ width: 220, height: 220 }}></div>
                    <div className="flex items-center justify-center gap-2 mt-2 flex-wrap">
                        <button type="button" onClick={playAnimation}
                            className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition ${mode === 'view' ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>▶ ดูลำดับขีด</button>
                        <button type="button" onClick={startQuiz}
                            className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition ${mode === 'quiz' ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}>✏️ ลองเขียนเอง</button>
                    </div>
                    {quizMsg && <p className="text-xs text-center text-gray-500 mt-2">{quizMsg}</p>}
                </div>
            );
        }

        // ── โหมด 1: ฝึกเขียนตัวอักษรจีน (ตอนนี้มีแค่ lang-cn — ดูตัวอักษร+ราก+จำนวนขีด, ฟังเสียง,
        //    พิมพ์ pinyin ให้ gradeAnswer ตรวจ, แล้ว self-rate ขับเคลื่อน FSRS) ──────────────────
        function ScriptPanel({ srs, recordSrs, awardXp }) {
            const langId = 'lang-cn';
            const queue = useMemo(() => {
                const due = dueVocab(langId, srs);
                return due.length ? due : vocabPool(langId).slice(0, 10);
            }, [srs]);
            const [qIdx, setQIdx] = useState(0);
            const [revealed, setRevealed] = useState(false);
            const [pinyinTyped, setPinyinTyped] = useState('');

            if (!queue.length) return <p className="text-sm text-gray-400">ยังไม่มีตัวอักษรให้ฝึก</p>;
            const item = queue[qIdx % queue.length];
            const c = item.extra;

            const checkPinyin = () => setPinyinResult(gradeAnswer(pinyinTyped, c.pinyin));
            const next = () => { setQIdx(i => i + 1); setRevealed(false); setPinyinTyped(''); setPinyinResult(null); };
            const rate = (rating) => { recordSrs(item.key, rating); if (rating >= 3) awardXp(10); next(); };

            return (
                <div>
                    <div className="text-xs font-bold text-gray-400 uppercase mb-3">{c.set} · ค้างทวน {queue.length} ตัว</div>

                                แตะเพื่อดูคำอ่าน/ความหมาย
                            </button>
                        ) : (
                            <div className="space-y-1">
                                <p className="text-xl font-bold text-gray-800">{c.pinyin}</p>
                                <p className="text-gray-500">{c.meaningTh}</p>
                                {c.radical && <p className="text-xs text-gray-400 mt-2">ราก: {c.radical} ({c.radicalMeaningTh}) · {c.strokeCount} ขีด</p>}
                                <button onClick={() => speak(c.char, 'zh')} className="mt-2 inline-flex items-center gap-1 text-xs text-brand font-semibold">
                                    <Volume2 /> ฟังอีกครั้ง
                                </button>
                                <StrokeOrderDiagram char={c.char} />
                            </div>

                    {revealed && (
                        <>
                            <div className="border-t border-gray-100 pt-4 mt-2">
                                <p className="text-sm font-semibold text-gray-700 mb-2">พิมพ์คำอ่าน (pinyin) ของตัวนี้:</p>
                                <div className="flex gap-2">
                                    <input value={pinyinTyped} onChange={e => setPinyinTyped(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && !pinyinResult && checkPinyin()}
                                        disabled={!!pinyinResult} placeholder="เช่น nǐ"
                                        className="flex-1 border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-2.5 text-base disabled:bg-gray-50" />
                                    {!pinyinResult && (
                                        <button onClick={checkPinyin} disabled={!pinyinTyped.trim()}
                                            className="px-4 rounded-xl font-bold bg-gray-900 text-white disabled:bg-gray-200 disabled:text-gray-400">ตรวจ</button>
                                    )}
                                </div>
                                {pinyinResult && (
                                    <p className={`text-sm mt-2 font-semibold ${pinyinResult === 'correct' ? 'text-green-600' : pinyinResult === 'almost' ? 'text-amber-600' : 'text-red-600'}`}>
                                        {pinyinResult === 'correct' ? '✅ ถูกต้อง' : pinyinResult === 'almost' ? '🟡 เกือบถูก' : `❌ ที่ถูกคือ ${c.pinyin}`}
                                    </p>
                                )}
                            </div>

                            <div className="mt-6">
                                <p className="text-xs text-gray-400 mb-2">จำตัวนี้ได้แค่ไหน? (กำหนดว่าจะเจอตัวนี้อีกครั้งเมื่อไหร่)</p>
                                <div className="grid grid-cols-4 gap-2">
                                    <button onClick={() => rate(1)} className="py-2.5 rounded-xl font-bold text-xs bg-red-100 text-red-700">ลืมแล้ว</button>
                                    <button onClick={() => rate(2)} className="py-2.5 rounded-xl font-bold text-xs bg-orange-100 text-orange-700">ยาก</button>
                                    <button onClick={() => rate(3)} className="py-2.5 rounded-xl font-bold text-xs bg-green-100 text-green-700">จำได้ (+10)</button>
                                    <button onClick={() => rate(4)} className="py-2.5 rounded-xl font-bold text-xs bg-teal-100 text-teal-700">ง่ายมาก (+10)</button>
                                </div>
                            </div>
                        </>
                    )}

            );
