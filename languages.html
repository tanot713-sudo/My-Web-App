    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const LANGS = JSON.parse(document.getElementById('lang-data').textContent);
        const LANG_IDS = Object.keys(LANGS);

        const Brain = () => <i data-lucide="brain" className="w-5 h-5"></i>;
        const BookOpen = () => <i data-lucide="book-open" className="w-5 h-5"></i>;
        const Volume2 = () => <i data-lucide="volume-2" className="w-4 h-4"></i>;
        const CheckCircle = () => <i data-lucide="check-circle-2" className="w-5 h-5 text-green-500"></i>;
        const XCircle = () => <i data-lucide="x-circle" className="w-5 h-5 text-red-500"></i>;
        const Languages = () => <i data-lucide="languages" className="w-4 h-4"></i>;

        function speak(text, langCode) {
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = langCode;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function loadXp() {
            try { return JSON.parse(localStorage.getItem('lang-practice:xp') || '0'); } catch { return 0; }
        }
        function saveXp(v) { localStorage.setItem('lang-practice:xp', JSON.stringify(v)); }

        function App() {
            const [langId, setLangId] = useState('lang-en');
            const [category, setCategory] = useState(Object.keys(LANGS['lang-en'].phrases)[0]);
            const [index, setIndex] = useState(0);
            const [typed, setTyped] = useState('');
            const [result, setResult] = useState(null); // 'correct' | 'wrong' | null
            const [xp, setXp] = useState(loadXp());
            const inputRef = useRef(null);

            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { saveXp(xp); }, [xp]);

            const lang = LANGS[langId];
            const categories = Object.keys(lang.phrases);
            const list = lang.phrases[category] || [];
            const current = list[index];

            const selectLang = (id) => {
                setLangId(id);
                setCategory(Object.keys(LANGS[id].phrases)[0]);
                setIndex(0);
                setTyped('');
                setResult(null);
            };

            const selectCategory = (c) => {
                setCategory(c);
                setIndex(0);
                setTyped('');
                setResult(null);
            };

            const checkAnswer = () => {
                if (!typed.trim()) return;
                const ok = typed.trim().toLowerCase() === current.target.trim().toLowerCase();
                setResult(ok ? 'correct' : 'wrong');
                if (ok) setXp(x => x + 20);
            };

            const nextPhrase = () => {
                setIndex(i => (i + 1) % list.length);
                setTyped('');
                setResult(null);
                setTimeout(() => inputRef.current && inputRef.current.focus(), 0);
            };

            return (
                <div className="h-screen w-full flex bg-gray-50 font-sans text-gray-800">

                    <aside className="w-72 bg-white border-r border-gray-200 flex flex-col overflow-y-auto">
                        <div className="p-6 border-b border-gray-200 flex items-center gap-3">
                            <div className="bg-brand text-white p-2 rounded-lg"><BookOpen /></div>
                            <div>
                                <h1 className="font-bold text-lg tracking-tight">Language Practice</h1>
                                <p className="text-xs text-gray-400">ข้อมูลจริงจาก OME</p>
                            </div>
                        </div>

                        <div className="p-4 flex-1">
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">เลือกภาษา ({LANG_IDS.length})</div>
                            <nav className="space-y-1 mb-6">
                                {LANG_IDS.map(id => (
                                    <button
                                        key={id}
                                        onClick={() => selectLang(id)}
                                        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition ${langId === id ? 'bg-brandLight text-brand font-semibold' : 'text-gray-600 hover:bg-gray-50 font-medium'}`}
                                    >
                                        <Languages /> <span>{LANGS[id].title}</span>
                                    </button>
                                ))}
                            </nav>

                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">คะแนนสะสม</div>
                            <div className="flex items-center gap-2 text-sm px-3 py-2.5 rounded-lg bg-amber-50 border border-amber-100 text-amber-700 font-bold">
                                <Brain className="w-4 h-4" /> {xp} XP
                            </div>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">

                        <header className="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
                            <h2 className="font-semibold text-gray-700">ฝึกภาษา{lang.title} — หมวด: {category}</h2>
                            <a href="./index.html" className="text-xs font-semibold text-gray-400 hover:text-gray-700">&larr; กลับ OME</a>
                        </header>

                        <div className="flex-1 flex overflow-hidden">

                            <div className="w-1/2 h-full border-r border-gray-200 bg-gray-100 p-6 overflow-y-auto">
                                <div className="bg-white p-8 rounded-lg shadow-sm border border-gray-200 min-h-full">
                                    <div className="border-b border-gray-200 pb-4 mb-4">
                                        <h3 className="text-xl font-bold text-gray-900 mb-1">วลีสำหรับฝึก — {lang.title}</h3>
                                        <p className="text-sm text-gray-500">คลิกหมวดหมู่เพื่อดูวลีทั้งหมด แล้วลองพิมพ์คำแปลในฝั่งขวา</p>
                                    </div>

                                    <div className="flex flex-wrap gap-2 mb-6">
                                        {categories.map(c => (
                                            <button
                                                key={c}
                                                onClick={() => selectCategory(c)}
                                                className={`px-3 py-1.5 rounded-full text-xs font-semibold border transition ${category === c ? 'bg-brand text-white border-brand' : 'border-gray-200 text-gray-600 hover:border-brand'}`}
                                            >
                                                {c}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="space-y-3">
                                        {list.map((p, i) => (
                                            <div
                                                key={i}
                                                className={`p-4 rounded-xl border flex items-center justify-between gap-3 ${i === index ? 'border-brand bg-brandLight' : 'border-gray-100'}`}
                                            >
                                                <div>
                                                    <div className="font-semibold text-gray-800">{p.target}</div>
                                                    <div className="text-sm text-gray-500">{p.thai}</div>
                                                </div>
                                                <button onClick={() => speak(p.target, lang.code)} className="shrink-0 p-2 rounded-full hover:bg-white text-brand">
                                                    <Volume2 />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            <div className="w-1/2 h-full bg-white p-8 overflow-y-auto">
                                <div className="animate-fade-in">
                                    <div className="flex items-center justify-between mb-6">
                                        <span className="bg-brandLight text-brand text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">พิมพ์คำแปล</span>
                                        <span className="text-sm font-semibold text-gray-500">ข้อ {index + 1} จาก {list.length}</span>
                                    </div>

                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 leading-snug">
                                        แปลประโยคนี้เป็นภาษา{lang.title}:
                                    </h3>
                                    <p className="text-2xl font-bold text-gray-900 mb-6">{current.thai}</p>

                                    <div className="flex items-center gap-3 mb-2">
                                        <input
                                            ref={inputRef}
                                            type="text"
                                            value={typed}
                                            onChange={e => setTyped(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && !result && checkAnswer()}
                                            disabled={result !== null}
                                            placeholder={`พิมพ์คำตอบเป็นภาษา${lang.title}...`}
                                            className="flex-1 border-2 border-gray-200 focus:border-brand outline-none rounded-xl px-4 py-3 text-base disabled:bg-gray-50"
                                        />
                                        <button onClick={() => speak(current.target, lang.code)} className="shrink-0 p-3 rounded-xl border-2 border-gray-200 text-brand hover:border-brand">
                                            <Volume2 />
                                        </button>
                                    </div>

                                    {result && (
                                        <div className={`mt-6 p-5 rounded-xl border ${result === 'correct' ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}>
                                            <h4 className={`font-bold mb-2 flex items-center gap-2 ${result === 'correct' ? 'text-green-700' : 'text-red-700'}`}>
                                                {result === 'correct' ? <CheckCircle /> : <XCircle />}
                                                {result === 'correct' ? 'ถูกต้อง! (+20 XP)' : 'ยังไม่ตรงเป๊ะ'}
                                            </h4>
                                            <p className="text-sm text-gray-700 leading-relaxed">
                                                <strong>คำตอบที่ถูกต้องคือ:</strong> {current.target}
                                            </p>
                                        </div>
                                    )}

                                    {!result ? (
                                        <button
                                            onClick={checkAnswer}
                                            disabled={!typed.trim()}
                                            className={`mt-8 w-full py-3 rounded-xl font-bold transition-all shadow-sm ${typed.trim() ? 'bg-gray-900 text-white hover:bg-black' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                        >
                                            ตรวจคำตอบ
                                        </button>
                                    ) : (
                                        <button onClick={nextPhrase} className="mt-6 w-full py-3 rounded-xl font-bold bg-brand text-white hover:bg-indigo-700 transition-all shadow-sm">
                                            ข้อต่อไป
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
