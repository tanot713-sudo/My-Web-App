a)","quy → quý (ไม่ใช่ qúy)","quan → quán (ไม่ใช่ qúan)"]},{"titleTh":"ข้อยกเว้นที่ 2: พยัญชนะควบ gi","descTh":"g+i=gi ถือเป็นพยัญชนะต้น 1 ตัว ตัว i ในที่นี้ทำหน้าที่เป็นพยัญชนะ ไม่ใช่สระ จึงรับเครื่องหมายวรรณยุกต์ไม่ได้ — วรรณยุกต์ต้องไปอยู่ที่สระตัวถัดไป","examples":["gio → giỏ (ไม่ใช่ gỉo)","gia → giá / già (ไม่ใช่ gía / gìa)"]},{"titleTh":"กรณีพิเศษ: gi + สระที่ขึ้นต้นด้วย i","descTh":"ตามหลักต้องเขียน i ซ้อนกันเป็น gii แต่ภาษาเวียดนามบังคับให้ \"ลดรูป\" เหลือ i เพียงตัวเดียว — นี่คือกรณีเดียวที่ดูเหมือนวรรณยุกต์วางบนตัว i ของ gi แต่แท้จริงคือสระ i อีกตัวที่ซ้อนทับอยู่","examples":["gi + ì → gì (อะไร)","gi + iết → giết (ฆ่า, วรรณยุกต์ตกที่ ê ตามกฎสระพิเศษ)","gi + iêng → giêng (เดือนมกราคม)"]}]}</script>
