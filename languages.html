            { word: '折扣', pinyin: 'zhékòu', thai: 'ส่วนลด' }, { word: '付款', pinyin: 'fùkuǎn', thai: 'ชำระเงิน' },
            { word: '退货', pinyin: 'tuìhuò', thai: 'คืนสินค้า' }, { word: '保修', pinyin: 'bǎoxiū', thai: 'รับประกัน' },
            { word: '电话会议', pinyin: 'diànhuà huìyì', thai: 'ประชุมทางโทรศัพท์' }, { word: '同事', pinyin: 'tóngshì', thai: 'เพื่อนร่วมงาน' },
            { word: '签证', pinyin: 'qiānzhèng', thai: 'วีซ่า' }, { word: '预约', pinyin: 'yùyuē', thai: 'นัดหมาย' },
        ];
        // รวมคลังคำ HSK2-3 (ตรวจสอบแล้ว) เข้ากับคำธุรกิจ (ข้างบน) เป็น pool เดียว — คล้ายสัดส่วนที่
        // BCT ทางการบอกว่าคำศัพท์ทับซ้อนกับ HSK อยู่มาก มีคำเฉพาะธุรกิจเสริมเข้ามา (ตัดคำซ้ำออก)
        function bctPool() {
            const base = [...HSK_VOCAB.hsk2, ...HSK_VOCAB.hsk3];
            const existing = new Set(base.map(w => w.word));
            const extra = BCT_VOCAB.filter(w => !existing.has(w.word));
            return [...base, ...extra];
        }

        // ประโยคบริบทธุรกิจง่ายๆ สำหรับข้อ "เรียงคำ" ของ BCT-A (คิด/ตรวจไวยากรณ์เองทุกประโยค)
        const BCT_A_WRITE_SENTENCES = [
            { chunks: ['我们', '明天', '开会。'], thai: 'พวกเราจะประชุมกันพรุ่งนี้' },
            { chunks: ['请', '把合同', '签好。'], thai: 'กรุณาเซ็นสัญญาให้เรียบร้อย' },
            { chunks: ['这个产品', '很', '受欢迎。'], thai: 'สินค้านี้เป็นที่นิยมมาก' },
            { chunks: ['客户', '想', '降低价格。'], thai: 'ลูกค้าอยากให้ลดราคา' },
            { chunks: ['我', '需要', '一份报告。'], thai: 'ฉันต้องการรายงานหนึ่งฉบับ' },
            { chunks: ['会议', '定在', '下午三点。'], thai: 'การประชุมกำหนดไว้บ่ายสามโมง' },
            { chunks: ['他', '负责', '市场营销。'], thai: 'เขารับผิดชอบด้านการตลาด' },
            { chunks: ['请', '尽快', '回复邮件。'], thai: 'กรุณาตอบอีเมลโดยเร็วที่สุด' },
            { chunks: ['公司', '上个月', '招聘了新员工。'], thai: 'บริษัทรับพนักงานใหม่เมื่อเดือนที่แล้ว' },
            { chunks: ['这份合同', '下周', '到期。'], thai: 'สัญญาฉบับนี้จะหมดอายุสัปดาห์หน้า' },
            { chunks: ['我们', '需要', '提高产品质量。'], thai: 'เราต้องยกระดับคุณภาพสินค้า' },
            { chunks: ['请', '把账单', '发给我。'], thai: 'กรุณาส่งใบแจ้งหนี้มาให้ฉัน' },
        ];
        // โจทย์เขียนแบบเปิด (BCT-B) — จำลอง "เขียนอีเมล/รายงานธุรกิจ" ของข้อสอบจริง ตรวจด้วย AI
        const BCT_B_WRITE_PROMPTS = [
            { context: 'อีเมลแจ้งเลื่อนนัดประชุม', prompt: 'เขียนอีเมลสั้นๆ (2-3 ประโยค) แจ้งลูกค้าว่าจะเลื่อนนัดประชุมออกไปเป็นสัปดาห์หน้า' },
            { context: 'ข้อความแจ้งขาดประชุม', prompt: 'เขียนข้อความสั้นๆ แจ้งเพื่อนร่วมงานว่าจะขาดประชุมวันนี้เพราะติดธุระ' },
            { context: 'รายงานความคืบหน้าโครงการ', prompt: 'เขียนสรุปสั้นๆ (2-3 ประโยค) รายงานความคืบหน้าของโครงการให้หัวหน้า' },
            { context: 'อีเมลขอบคุณลูกค้า', prompt: 'เขียนอีเมลสั้นๆ ขอบคุณลูกค้าที่สั่งซื้อสินค้า' },
            { context: 'สอบถามราคาสินค้า', prompt: 'เขียนข้อความสั้นๆ สอบถามราคาสินค้าจากซัพพลายเออร์' },
            { context: 'แจ้งเลื่อนกำหนดส่งมอบ', prompt: 'เขียนอีเมลสั้นๆ แจ้งขอเลื่อนกำหนดส่งมอบสินค้า' },
        ];
        const BCT_WRITE_SYSTEM_PROMPT = (contextTh) =>
            `คุณเป็นครูสอนภาษาจีนธุรกิจให้คนไทย ผู้เรียนกำลังฝึกเขียน "${contextTh}" เป็นภาษาจีน\n` +
            `ตรวจสิ่งที่ผู้เรียนเขียนมา ตอบเป็นภาษาไทยเสมอ รูปแบบคำตอบต้องมี 3 ส่วนตามลำดับนี้เท่านั้น:\n` +
            `1) "ตัวอย่างที่ปรับปรุงแล้ว:" ตามด้วยข้อความภาษาจีนที่ถูกต้องและเหมาะสมกับบริบทธุรกิจ\n` +
            `2) "จุดที่แก้ไข:" อธิบายเป็นข้อๆ สั้นๆ ว่าแก้ตรงไหน เพราะอะไร (ทั้งไวยากรณ์และความเหมาะสมเชิงธุรกิจ)\n` +
            `3) "คะแนนความเหมาะสม:" ให้คะแนนเป็นตัวเลข 1-5\n` +
            `ถ้าเขียนดีอยู่แล้วให้บอกตรงๆ ว่าไม่ต้องแก้ไข`;
        const BCT_WRITE_REMINDER =
            'ย้ำ: ตรวจข้อความล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น ตอบตามรูปแบบ 3 ส่วนที่กำหนดไว้เป๊ะๆ ห้ามข้ามส่วนไหน ' +
            'และห้ามตอบเป็นภาษาอื่นนอกจากไทย';

        function buildBctExam(level) {
            const pool = bctPool();
            if (level === 'A') {
                return {
                    kind: 'bct', level, passPct: 60,
                    sections: [
                        { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 15, 'listen-tf'), ...genMcFromWord(pool, 15, 'listen-mc')] },
                        { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 15, 'read-mc'), ...genMcReverse(pool, 15)] },
                        { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteOrder(10) },
                    ],
                };
            }
            // level 'B'
            return {
                kind: 'bct', level, passPct: 60,
                sections: [
                    { key: 'listening', title: 'ฟัง (听力)', icon: '🎧', questions: [...genTf(pool, 20, 'listen-tf'), ...genMcFromWord(pool, 30, 'listen-mc')] },
                    { key: 'reading', title: 'อ่าน (阅读)', icon: '📖', questions: [...genMcFromWord(pool, 20, 'read-mc'), ...genMcReverse(pool, 20)] },
                    { key: 'writing', title: 'เขียน (书写)', icon: '✍️', questions: genBctWriteEssay(2) },
                ],
            };
        }
        function genBctWriteOrder(count) {
            const picked = shuffleArr(BCT_A_WRITE_SENTENCES).slice(0, Math.min(count, BCT_A_WRITE_SENTENCES.length));
            return picked.map(s => ({ type: 'write-order', chunks: s.chunks, thai: s.thai, scrambled: shuffleArr(s.chunks) }));
        }
        function genBctWriteEssay(count) {
            const picked = shuffleArr(BCT_B_WRITE_PROMPTS).slice(0, Math.min(count, BCT_B_WRITE_PROMPTS.length));
            return picked.map(p => ({ type: 'write-essay', context: p.context, prompt: p.prompt }));
        }

        // ── ปุ่มตัวเลือกปรนัยใช้ร่วมกันหลายชนิดโจทย์ (listen-mc/read-mc/read-mc-reverse/write-pinyin-char)
        function McChoices({ choices, correct, selected, onPick }) {
            return (
                <div className="grid grid-cols-1 gap-2">
                    {choices.map((c, i) => {
                        const isCorrect = c === correct;
                        const isPicked = c === selected;
                        let cls = 'border-gray-200 hover:border-brand text-gray-700 bg-white';
                        if (selected != null) {
                            if (isCorrect) cls = 'border-green-400 bg-green-50 text-green-700';
                            else if (isPicked) cls = 'border-red-300 bg-red-50 text-red-600';
                        }
                        return (
                            <button key={i} onClick={() => onPick(c)} disabled={selected != null}
                                className={`text-left px-4 py-3 rounded-xl border-2 font-medium text-sm transition ${cls}`}>{c}</button>
                        );
                    })}
                </div>
            );
        }

        // ── ภาพประกอบ TOEIC Part 1 (Photo Description) — ไม่มีคลังรูปถ่ายจริงให้ใช้ในสภาพแวดล้อมนี้
        //    และดึงรูปจากอินเทอร์เน็ตทั่วไป (Pexels/Unsplash/Pixabay/Wikimedia ฯลฯ) ไม่ได้เลย เพราะ
        //    เครือข่ายของสภาพแวดล้อมที่ใช้พัฒนาบล็อกโดเมนโฮสต์รูปภาพ/CDN ทั่วไปไว้ — ใช้ภาพประกอบจาก
        //    unDraw (ใบอนุญาตให้ใช้งานได้อิสระ ไม่ต้องให้เครดิต) แทน ดึงมาผ่าน npm package "undraw-svg"
        //    (โดเมน registry.npmjs.org ใช้งานได้ปกติ) เก็บไฟล์ไว้ในเครื่อง images/toeic/ ดูรายละเอียด
        //    แหล่งที่มาที่ images/toeic/README.md — ผู้เรียนต้องตีความภาพเองเหมือนข้อสอบจริง ไม่มี
        //    label ภาษาไทยบอกใบ้เนื้อหาบนภาพ
        function ToeicPhotoIllustration({ id }) {
            return (
                <img src={`./images/toeic/${id}.svg`} alt=""
                    className="w-full h-40 sm:h-52 object-contain" draggable="false" />
            );
        }

        // ── ข้อสอบ HSK (จำลอง) — โครงสร้าง/จำนวนข้อยึดตามข้อสอบ HSK 2.0 ทางการ (ดูหมายเหตุที่
        //    buildHskExam ด้านบน) เนื้อหาสร้างจากคลังคำศัพท์ HSK_VOCAB ที่ตรวจสอบแล้ว รองรับเฉพาะ
        //    ภาษาจีนตอนนี้ — ถ้า langId ไม่ใช่ lang-cn (เผื่อผู้ใช้สลับภาษาที่แถบข้างระหว่างอยู่โหมดนี้)
        //    ให้ขึ้นข้อความชวนสลับกลับแทนที่จะพังเงียบๆ
        function HskExamView({ langId, setLangId, setXp }) {
            const [examType, setExamType] = useState(null); // 'hsk' | 'bct' — เลือกก่อนเลือกระดับ
            const [level, setLevel] = useState(null); // HSK: 1|2|3, BCT: 'A'|'B'
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true); // หน้าแนะนำก่อนเริ่มแต่ละส่วน
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null); // string | boolean | ขึ้นกับชนิดโจทย์
            const [placedIdx, setPlacedIdx] = useState([]); // สำหรับ write-order เท่านั้น
            const [essayText, setEssayText] = useState(''); // สำหรับ write-essay (BCT-B) เท่านั้น
            const [essayFeedback, setEssayFeedback] = useState('');
            const [essayStatus, setEssayStatus] = useState(''); // '' | 'loading' | 'done' | 'error'
            const [sectionResults, setSectionResults] = useState([]); // [{key,title,correct,total}]
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => {
                setAnswered(false); setUserAnswer(null); setPlacedIdx([]);
                setEssayText(''); setEssayFeedback(''); setEssayStatus('');
            };

            const start = (type, lvl) => {
                const built = type === 'bct' ? buildBctExam(lvl) : buildHskExam(lvl);
                setExamType(type); setLevel(lvl); setExam(built);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            const examLabel = examType === 'bct' ? `BCT (${level})` : `HSK${level}`;

            if (langId !== 'lang-cn') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบ HSK/BCT รองรับเฉพาะภาษาจีนตอนนี้</p>
                            <button onClick={() => setLangId('lang-cn')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาจีน</button>
                        </div>
                    </div>
                );
            }

            // ── ขั้นที่ 1: เลือกประเภทข้อสอบ ──────────────────────────────────────────────
            if (!examType) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบภาษาจีน (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">เลือกประเภทข้อสอบก่อน:</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onClick={() => setExamType('hsk')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">HSK</div>
                                    <div className="text-xs text-gray-500">วัดระดับภาษาจีนทั่วไป ใช้สมัครเรียนต่อ/ยื่นวีซ่าทำงานในจีน — มี 3 ระดับ</div>
                                </button>
                                <button onClick={() => setExamType('bct')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">BCT</div>
                                    <div className="text-xs text-gray-500">ภาษาจีนธุรกิจ (ประชุม/อีเมล/เจรจา) เหมาะกับคนทำงานสายติดต่อธุรกิจกับจีน — มี 2 ระดับ</div>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // ── ขั้นที่ 2: เลือกระดับ ────────────────────────────────────────────────────
            if (!level || !exam) {
                const hskLevels = [
                    { lvl: 1, info: 'ฟัง 20 + อ่าน 20 = 40 ข้อ' },
                    { lvl: 2, info: 'ฟัง 35 + อ่าน 25 = 60 ข้อ' },
                    { lvl: 3, info: 'ฟัง 40 + อ่าน 30 + เขียน 10 = 80 ข้อ' },
                ];
                const bctLevels = [
                    { lvl: 'A', info: 'ระดับต้น · ฟัง 30 + อ่าน 30 + เขียน 10 = 70 ข้อ' },
                    { lvl: 'B', info: 'ระดับกลาง-สูง · ฟัง 50 + อ่าน 40 + เขียนอีเมล 2 ข้อ = 92 ข้อ' },
                ];
                const levels = examType === 'bct' ? bctLevels : hskLevels;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <button onClick={() => setExamType(null)} className="text-xs font-semibold text-gray-400 hover:text-gray-700 mb-3">← เปลี่ยนประเภทข้อสอบ</button>
                            <h2 className="text-xl font-bold text-gray-800 mb-1">{examType === 'bct' ? 'ข้อสอบ BCT (จำลอง)' : 'ข้อสอบ HSK (จำลอง)'}</h2>
                            <p className="text-sm text-gray-500 mb-5">โครงสร้าง/จำนวนข้อยึดตามข้อสอบ{examType === 'bct' ? ' BCT' : ' HSK 2.0'} ทางการจริง เลือกระดับที่จะทดสอบ:</p>
                            <div className={`grid grid-cols-1 ${examType === 'bct' ? 'sm:grid-cols-2' : 'sm:grid-cols-3'} gap-3`}>
                                {levels.map(({ lvl, info }) => (
                                    <button key={lvl} onClick={() => start(examType, lvl)}
                                        className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-center transition bg-white">
                                        <div className="text-2xl font-bold text-brand mb-1">{examType === 'bct' ? `BCT (${lvl})` : `HSK${lvl}`}</div>
                                        <div className="text-xs text-gray-400">{info}</div>
                                    </button>
                                ))}
                            </div>
                            <p className="text-xs text-gray-400 mt-5 leading-relaxed">
                                หมายเหตุ: เป็นแบบทดสอบจำลองที่สร้างจากคลังคำศัพท์ของเว็บนี้เอง ไม่ใช่ข้อสอบทางการที่หลุดออกมา —
                                ข้อสอบจริงมีโจทย์ให้จับคู่รูปภาพหลายข้อ แต่เว็บนี้ไม่มีคลังรูปภาพ จึงแทนที่ด้วยโจทย์จับคู่ความหมายไทยแทน
                                (ทดสอบทักษะเดียวกัน) เกณฑ์ผ่านทางการคือ 60% ทุกระดับ
                                {examType === 'bct' && ' คำศัพท์ธุรกิจที่ใช้เป็นคำที่คิด/ตรวจสอบเองความหมายพื้นฐาน ยังไม่ได้ตรวจไขว้กับพจนานุกรมเหมือนคำ HSK'}
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = () => start(examType, level);
            const backToLevels = () => { setLevel(null); setExam(null); };
            const backToType = () => { setExamType(null); setLevel(null); setExam(null); };

            if (finished) {
                const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = sectionResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลสอบ {examLabel}</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง{pct >= exam.passPct ? ` — ผ่านเกณฑ์ทางการ (≥${exam.passPct}%) 🎉` : ` — ยังไม่ถึงเกณฑ์ทางการ (${exam.passPct}%) ลองฝึกเพิ่ม`}</p>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.correct}/{r.total}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">สอบใหม่ระดับเดิม</button>
                                <button onClick={backToLevels} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">เลือกระดับใหม่</button>
                                <button onClick={backToType} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">เปลี่ยนเป็น{examType === 'bct' ? ' HSK' : ' BCT'}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">{examLabel} · ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

            const q = section.questions[qIdx];

            const finishSection = () => {
                const results = [...sectionResults, { key: section.key, title: section.title, correct: correctInSection, total: section.questions.length }];
                setSectionResults(results);
                if (sectionIdx + 1 >= exam.sections.length) {
                    setFinished(true);
                } else {
                    setSectionIdx(i => i + 1);
                    setShowIntro(true);
                    setQIdx(0);
                    resetPerQuestion();
                    setCorrectInSection(0);
                }
            };

            const nextQuestion = () => {
                if (qIdx + 1 >= section.questions.length) { finishSection(); return; }
                setQIdx(i => i + 1); resetPerQuestion();
            };

            const recordAnswer = (isCorrect, wrongEntry) => {
                setAnswered(true);
                if (isCorrect) { setCorrectInSection(c => c + 1); setXp(x => x + 2); }
                else if (wrongEntry) setAllWrong(w => [...w, wrongEntry]);
            };

            const pickMc = (choice) => {
                if (answered) return;
                setUserAnswer(choice);
                const isCorrect = choice === q.correct;
                recordAnswer(isCorrect, isCorrect ? null : { left: q.word || q.thai, right: q.correct });
            };

            const pickTf = (val) => {
                if (answered) return;
                setUserAnswer(val);
                const isCorrect = val === q.answer;
                recordAnswer(isCorrect, isCorrect ? null : { left: `${q.word} = ${q.shownThai}`, right: q.answer ? 'ถูก' : 'ผิด' });
            };

            const tapChunk = (idx) => {
                if (answered) return;
                setPlacedIdx(p => [...p, idx]);
            };
            const undoChunk = () => { if (!answered) setPlacedIdx(p => p.slice(0, -1)); };
            const submitOrder = () => {
                if (answered || placedIdx.length !== q.chunks.length) return;
                const built = placedIdx.map(i => q.scrambled[i]);
                const isCorrect = built.join('') === q.chunks.join('');
                recordAnswer(isCorrect, isCorrect ? null : { left: q.thai, right: q.chunks.join('') });
            };

            // write-essay (BCT-B เท่านั้น) — ข้อเขียนเปิด ให้ AI ตรวจแบบเดียวกับโหมด "แต่งประโยคอิสระ"
            // ในหน้าฝึกเขียน ไม่ gate ถูก/ผิดตามคำตัดสินของ AI (โมเดลเล็กไม่น่าเชื่อถือพอสำหรับ auto-grade)
            // แค่ให้ครบ flow + XP เมื่อส่งสำเร็จ ไม่นับเข้ารายการ "ข้อที่ตอบผิด" เพราะไม่มีคำตอบเดียวที่ถูก
            const submitEssay = () => {
                if (!essayText.trim() || essayStatus === 'loading') return;
                if (isIOS()) {
                    setEssayStatus('error');
                    setEssayFeedback('ฟีเจอร์ตรวจด้วย AI ยังไม่รองรับ iPhone/iPad ในตอนนี้ — กด "ข้ามข้อนี้" เพื่อไปต่อได้เลย');
                    return;
                }
                setEssayStatus('loading'); setEssayFeedback('');
                const w = getWritingWorker();
                const jobId = 'bctessay-' + Date.now();
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setEssayFeedback(acc); }
                    else if (msg.type === 'done') { cleanup(); setEssayStatus('done'); setAnswered(true); setXp(x => x + 2); }
                    else if (msg.type === 'error') { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                w.postMessage({
                    type: 'chat', jobId, maxNewTokens: 320,
                    messages: [
                        { role: 'system', content: BCT_WRITE_SYSTEM_PROMPT(q.context) },
                        { role: 'user', content: essayText },
                        { role: 'system', content: BCT_WRITE_REMINDER },
                    ],
                });
            };
            const skipEssay = () => { setAnswered(true); };

            const progressLabel = `${section.title} · ข้อ ${qIdx + 1}/${section.questions.length}`;

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-xl mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-4">
                            <span className="text-xs font-bold text-gray-400 uppercase">{examLabel} · {progressLabel}</span>
                            <span className="text-xs font-bold text-brand">ถูก {correctInSection} ข้อ</span>
                        </div>

                        {/* ── listen-tf / listen-mc: มีปุ่มฟังเสียงแทนการโชว์ตัวอักษรจีนตรงๆ (จำลองส่วนฟัง) ── */}
                        {(q.type === 'listen-tf' || q.type === 'listen-mc') && (
                            <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                <p className="text-xs text-gray-400 mb-3">🎧 กดฟังแล้วตอบ</p>
                                <button onClick={() => speak(q.word, 'zh')} className="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-brandLight text-brand font-bold text-sm hover:opacity-80">
                                    <Volume2 /> ฟังเสียง (ฟังซ้ำได้)
                                </button>
                            </div>
                        )}

                        {q.type === 'listen-tf' && (
                            <>
                                <p className="text-center text-gray-700 mb-4">ความหมายคือ <span className="font-bold">"{q.shownThai}"</span> ใช่หรือไม่?</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => pickTf(true)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === true ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === true ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>✅ ถูก</button>
                                    <button onClick={() => pickTf(false)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === false ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === false ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>❌ ผิด</button>
                                </div>
                            </>
                        )}

                        {q.type === 'read-tf' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-4xl font-bold text-gray-900 mb-2">{q.word}</div>
                                    <div className="text-sm text-gray-400">{q.pinyin}</div>
                                </div>
                                <p className="text-center text-gray-700 mb-4">ความหมายคือ <span className="font-bold">"{q.shownThai}"</span> ใช่หรือไม่?</p>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => pickTf(true)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === true ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === true ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>✅ ถูก</button>
                                    <button onClick={() => pickTf(false)} disabled={answered}
                                        className={`py-3 rounded-xl font-bold text-sm border-2 transition ${answered ? (q.answer === false ? 'border-green-400 bg-green-50 text-green-700' : userAnswer === false ? 'border-red-300 bg-red-50 text-red-600' : 'border-gray-200 text-gray-400') : 'border-gray-200 hover:border-brand text-gray-700 bg-white'}`}>❌ ผิด</button>
                                </div>
                            </>
                        )}

                        {q.type === 'listen-mc' && (
                            <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                        )}

                        {q.type === 'read-mc' && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-5xl font-bold text-gray-900 mb-2">{q.word}</div>
                                    <button onClick={() => speak(q.word, 'zh')} className="inline-flex items-center gap-1 text-xs text-brand font-semibold"><Volume2 /> ฟังเสียง</button>
                                </div>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {(q.type === 'read-mc-reverse' || q.type === 'write-pinyin-char') && (
                            <>
                                <div className="bg-white rounded-xl border border-gray-200 p-6 text-center mb-4">
                                    <div className="text-2xl font-bold text-gray-900 mb-1">{q.thai}</div>
                                    {q.type === 'write-pinyin-char' && <div className="text-sm text-gray-400">พินอิน: {q.pinyin}</div>}
                                </div>
                                <p className="text-xs text-gray-400 mb-2">เลือกตัวอักษรจีนที่ถูกต้อง:</p>
                                <McChoices choices={q.choices} correct={q.correct} selected={userAnswer} onPick={pickMc} />
                            </>
                        )}

                        {q.type === 'write-order' && (
                            <>
                                <p className="text-center text-gray-700 mb-1">เรียงคำให้เป็นประโยคที่แปลว่า:</p>
                                <p className="text-center font-bold text-gray-900 mb-4">"{q.thai}"</p>
                                <div className="min-h-[64px] bg-white rounded-xl border-2 border-dashed border-gray-200 p-3 mb-3 flex flex-wrap gap-2 items-center">
                                    {placedIdx.length === 0 && <span className="text-xs text-gray-300">แตะคำด้านล่างเพื่อเรียงประโยคที่นี่</span>}
                                    {placedIdx.map((idx, i) => (
                                        <span key={i} className="px-3 py-1.5 rounded-lg bg-brandLight text-brand font-semibold text-sm">{q.scrambled[idx]}</span>
                                    ))}
                                </div>
                                <div className="flex flex-wrap gap-2 mb-4">
                                    {q.scrambled.map((chunk, idx) => (
                                        !placedIdx.includes(idx) && (
                                            <button key={idx} onClick={() => tapChunk(idx)} disabled={answered}
                                                className="px-3 py-1.5 rounded-lg border-2 border-gray-200 hover:border-brand text-sm font-semibold text-gray-700 bg-white">{chunk}</button>
                                        )
                                    ))}
                                </div>
                                <div className="flex gap-2 mb-2">
                                    <button onClick={undoChunk} disabled={answered || !placedIdx.length} className="px-4 py-2 rounded-xl border-2 border-gray-200 text-gray-500 text-xs font-semibold disabled:opacity-40">ย้อนกลับ 1 คำ</button>
                                    <button onClick={submitOrder} disabled={answered || placedIdx.length !== q.chunks.length}
                                        className="flex-1 py-2 rounded-xl bg-gray-900 text-white text-sm font-bold disabled:bg-gray-200 disabled:text-gray-400">ตรวจคำตอบ</button>
                                </div>
                                {answered && (
                                    <p className={`text-sm text-center font-semibold ${placedIdx.map(i => q.scrambled[i]).join('') === q.chunks.join('') ? 'text-green-600' : 'text-red-600'}`}>
                                        เฉลย: {q.chunks.join('')}
                                    </p>
                                )}
                            </>
                        )}

                        {q.type === 'write-essay' && (
                            <>
                                <p className="text-xs text-gray-400 mb-1">{q.context}</p>
                                <p className="text-gray-700 font-semibold mb-3">{q.prompt}</p>
                                <textarea value={essayText} onChange={e => setEssayText(e.target.value)} rows={4} disabled={answered}
                                    placeholder="เขียนเป็นภาษาจีนตรงนี้..."
                                    className="w-full border-2 border-gray-200 focus:border-brand outline-none rounded-xl p-3 text-sm resize-y disabled:bg-gray-50 mb-3" />
                                {!answered && (
                                    <div className="flex gap-2 mb-3">
                                        <button onClick={submitEssay} disabled={!essayText.trim() || essayStatus === 'loading'}
                                            className="flex-1 py-2.5 rounded-xl bg-gray-900 text-white text-sm font-bold disabled:bg-gray-200 disabled:text-gray-400">
                                            {essayStatus === 'loading' ? 'กำลังตรวจ...' : 'ส่งให้ AI ตรวจ'}
                                        </button>
                                        <button onClick={skipEssay} className="px-4 py-2.5 rounded-xl border-2 border-gray-200 text-gray-500 text-xs font-semibold">ข้ามข้อนี้</button>
                                    </div>
                                )}
                                {essayFeedback && <div className="p-4 rounded-xl bg-white border border-gray-200 text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{essayFeedback}</div>}
                            </>
                        )}

                        {answered && (
                            <button onClick={nextQuestion} className="mt-4 w-full py-3 rounded-xl font-bold bg-gray-900 text-white">
                                {qIdx + 1 >= section.questions.length ? (sectionIdx + 1 >= exam.sections.length ? 'ดูผลสอบ' : 'ไปส่วนต่อไป') : 'ข้อต่อไป'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // ══════════════════════════════════════════════════════════════════════════════════
        // ข้อสอบภาษาอังกฤษ (จำลอง) — IELTS + TOEIC โครงสร้าง/จำนวนข้อยึดตามข้อมูลที่ค้นจากเว็บจริง
        // (ตรวจสอบผ่าน WebSearch ก่อนสร้าง ไม่ได้เดาเอง เหมือนตอนทำ HSK/BCT):
        //   IELTS Academic: Listening 40 ข้อ/4 ส่วน (30 นาที), Reading 40 ข้อ/3 ตอน (60 นาที),
        //   Writing 2 งาน (Task1 บรรยายกราฟ ~150 คำ/20นาที, Task2 เรียงความ ~250 คำ/40นาที),
        //   Speaking 3 ส่วน (11-14 นาที) — ไม่มีเกณฑ์ผ่าน/ตก ให้คะแนนเป็น Band 0-9
        //   *รอบนี้ทำแค่ Listening+Reading+Writing Task2 — Task1 (ต้องมีกราฟ/ภาพ) และ Speaking
        //   (ต้องให้คะแนนการพูด ซึ่งเว็บนี้ยังไม่มีระบบประเมิน) ยังไม่ได้ทำ บอกไว้ตรงๆ ในหน้าเลือกข้อสอบ

            'สรุปข้อมูลจากตารางที่กำหนดให้)\n' +
            'ตรวจสิ่งที่ผู้เรียนเขียนมา ตอบเป็นภาษาไทยเสมอ รูปแบบคำตอบต้องมี 3 ส่วนตามลำดับนี้เท่านั้น:\n' +
            '1) "จุดที่แก้ไข:" อธิบายเป็นข้อๆ สั้นๆ ว่าแก้ตรงไหน (ไวยากรณ์/คำศัพท์/ความครบถ้วนของการสรุปข้อมูล)\n' +
            '2) "ข้อเสนอแนะ:" คำแนะนำสั้นๆ ว่าจะสรุป/เปรียบเทียบตัวเลขให้ดีขึ้นได้อย่างไร (เช่น ใช้คำเปรียบเทียบ highest/lowest)\n' +
            '3) "คะแนนโดยประมาณ (Band):" ให้ช่วงคะแนน Band คร่าวๆ พร้อมบอกว่าเป็นการประมาณเบื้องต้นเท่านั้น\n' +
            'ถ้าเขียนดีอยู่แล้วให้บอกตรงๆ ว่าไม่ต้องแก้ไข';
        const IELTS_TASK1_REMINDER =
            'ย้ำ: ตรวจข้อความล่าสุดที่ผู้เรียนเพิ่งส่งมาเท่านั้น ตอบตามรูปแบบ 3 ส่วนที่กำหนดไว้เป๊ะๆ ห้ามข้ามส่วนไหน ' +
            'และห้ามตอบเป็นภาษาอื่นนอกจากไทย';

        function buildIeltsExam() {
            const pool = vocabPool('lang-en');
            return {
                kind: 'ielts', passPct: null,
                sections: [
                    { key: 'listening', title: 'Listening (4 sections)', icon: '🎧',
                        questions: [...genTf(pool, 10, 'listen-tf'), ...genMcFromWord(pool, 10, 'listen-mc'), ...genTf(pool, 10, 'listen-tf'), ...genMcFromWord(pool, 10, 'listen-mc')] },
                    { key: 'reading', title: 'Reading (3 passages)', icon: '📖',
                        questions: [...genMcFromWord(pool, 20, 'read-mc'), ...genMcReverse(pool, 20)] },
                    { key: 'writing1', title: 'Writing Task 1', icon: '📊', questions: genIeltsTask1(1) },
                    { key: 'writing2', title: 'Writing Task 2', icon: '✍️', questions: genIeltsEssay(1) },
                    { key: 'speaking', title: 'Speaking', icon: '🗣️', ungraded: true, questions: [{ type: 'speaking-practice' }] },
                ],
            };
        }
        // TOEIC เต็มรูปแบบตามโครงสร้างจริง 200 ข้อ (Listening 100 = Part1:6+Part2:25+Part3:39+
        // Part4:30, Reading 100 = Part5:30+Part6:16+Part7:54) — Part1/2/3/4/6/7 ใช้เนื้อหาที่แต่งเอง
        // จริง (บทสนทนา/บทพูด/ข้อความ/บทความสั้นๆ) ไม่ใช่สุ่มจากคำศัพท์แล้ว มีแค่ Part7 ที่ใช้บทความ
        // เดี่ยวล้วนแทนที่จะมีแบบจับคู่ 2-3 บทความเหมือนของจริง (จำนวนข้อรวมเท่าเดิม)
        function buildToeicExam() {
            return {
                kind: 'toeic', passPct: null,
                sections: [
                    { key: 'listening', title: 'Listening (Part 1-4)', icon: '🎧',
                        questions: [...genPhotoMc(6), ...genQrMc(25), ...genDialogueMc(13), ...genTalkMc(10)] },
                    { key: 'reading', title: 'Reading (Part 5-7)', icon: '📖',
                        questions: [...genGrammarMc(TOEIC_GRAMMAR, 30), ...genBlankMc(), ...genPassageMc(18)] },
                ],
            };
        }

        // ── ข้อสอบภาษาอังกฤษ (จำลอง) — โคลนโครงสร้าง state machine มาจาก HskExamView แต่แยกเป็นคนละ
        //    component ตามธรรมเนียม clone-and-adapt ของโปรเจกต์ (ไม่พยายามยัดสองภาษาเข้า component
        //    เดียวกัน เพราะชนิดโจทย์/ตัวแปรภาษาต่างกันเยอะพอที่จะทำให้ HskExamView เดิมเสี่ยงพังได้)
        //    ไม่มีขั้น "เลือกระดับ" เหมือน HSK เพราะ IELTS/TOEIC แต่ละชุดมีแบบเดียว (ไม่มีระดับ 1/2/3)
        function EnExamView({ langId, setLangId, setXp }) {
            const [examType, setExamType] = useState(null); // 'ielts' | 'toeic'
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true);
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null);
            const [essayText, setEssayText] = useState('');
            const [essayFeedback, setEssayFeedback] = useState('');
            const [essayStatus, setEssayStatus] = useState('');
            const [sectionResults, setSectionResults] = useState([]);
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);
            // ── Speaking (ungraded) — อัดเสียง/ฟังย้อนกลับตัวเองแบบง่ายๆ ไม่ถอดเสียง/ไม่ให้คะแนน
            //    (ต่างจาก ShadowingPanel ที่ต้องถอดเสียงเทียบต้นฉบับ ตรงนี้แค่ให้ฟังตัวเองทวนได้) ──
            const [spIsRecording, setSpIsRecording] = useState(false);
            const [spRecordedUrl, setSpRecordedUrl] = useState('');
            const spMediaRef = useRef(null);
            const spChunksRef = useRef([]);
            const spStreamRef = useRef(null);
            const spStartRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    spStreamRef.current = stream;
                    spChunksRef.current = [];
                    const rec = new MediaRecorder(stream);
                    rec.addEventListener('dataavailable', ev => { if (ev.data && ev.data.size) spChunksRef.current.push(ev.data); });
                    spMediaRef.current = rec;
                    rec.start();
                    setSpIsRecording(true);
                } catch (e) { /* ไม่มีสิทธิ์ไมค์ — เงียบไว้ ผู้ใช้ยังอ่าน prompt ได้ปกติ */ }
            };
            const spStopRecording = () => {
                if (!spMediaRef.current) return;
                spMediaRef.current.addEventListener('stop', () => {
                    spStreamRef.current.getTracks().forEach(t => t.stop());
                    const blob = new Blob(spChunksRef.current, { type: spMediaRef.current.mimeType || 'audio/webm' });
                    setSpRecordedUrl(URL.createObjectURL(blob));
                    setSpIsRecording(false);
                }, { once: true });
                spMediaRef.current.stop();
            };

            const resetPerQuestion = () => {
                setAnswered(false); setUserAnswer(null);
                setEssayText(''); setEssayFeedback(''); setEssayStatus('');
                setSpIsRecording(false); setSpRecordedUrl('');
            };
            const start = (type) => {
                const built = type === 'toeic' ? buildToeicExam() : buildIeltsExam();
                setExamType(type); setExam(built);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };
            const examLabel = examType === 'toeic' ? 'TOEIC' : 'IELTS';

            // ── เล่นเสียงอัตโนมัติทันทีที่เข้าโจทย์ฟังข้อใหม่ (ไม่ต้องกดปุ่ม "ฟัง" เอง) — เฉพาะ
            //    ประเภทโจทย์ที่เป็นข้อสอบฟังเป็นหลัก (Part 1-4 ของ TOEIC/IELTS Listening) ปุ่มฟังซ้ำ
            //    เดิมยังอยู่ให้กดฟังซ้ำได้ตามปกติ ต้องอยู่ก่อน early return ทุกอันเพราะเป็น hook ──
            useEffect(() => {
                if (!exam || showIntro || finished) return;
                const sec = exam.sections[sectionIdx];
                const question = sec && sec.questions[qIdx];
                if (!question) return;
                const timers = [];
                const t0 = setTimeout(() => {
                    // ใช้ speakVoice (ไม่ใช่ speak เฉยๆ) — สลับเสียงพูดหลายเสียง/หลายสำเนียงตามที่เครื่อง
                    // ผู้ใช้มี เพื่อจำลองข้อสอบฟังจริงที่ไม่ได้มีแค่ผู้พูดคนเดียวตลอดทั้งชุด
                    if (question.type === 'photo-mc') {
                        question.choices.forEach((c, i) => timers.push(setTimeout(() => speakVoice(c, 'en', question.voiceSlot), i * 2600)));
                    } else if (question.type === 'qr-mc') {
                        speakVoice(question.q, 'en', question.voiceSlot);
                    } else if (question.type === 'dialogue-mc') {
                        question.lines.forEach((ln, i) => timers.push(setTimeout(() => speakVoice(ln, 'en', question.dialogueSlot * 2 + (i % 2)), i * 1800)));
                    } else if (question.type === 'talk-mc') {
                        speakVoice(question.text, 'en', question.voiceSlot);
                    }
                }, 400); // หน่วงสั้นๆ ให้ UI เปลี่ยนหน้าเสร็จก่อนเริ่มพูด
                return () => { clearTimeout(t0); timers.forEach(clearTimeout); };
            }, [exam, sectionIdx, qIdx, showIntro]);

            if (langId !== 'lang-en') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบชุดนี้รองรับเฉพาะภาษาอังกฤษ</p>
                            <button onClick={() => setLangId('lang-en')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาอังกฤษ</button>
                        </div>
                    </div>
                );
            }

            if (!examType) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบภาษาอังกฤษ (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">เลือกประเภทข้อสอบก่อน:</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <button onClick={() => start('ielts')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">IELTS</div>
                                    <div className="text-xs text-gray-500">วัดระดับภาษาอังกฤษทั่วไป ใช้เรียนต่อ/ยื่นวีซ่า — Listening 40 + Reading 40 + Writing Task 1&amp;2 + Speaking (ฝึกพูด ไม่ให้คะแนน)</div>
                                </button>
                                <button onClick={() => start('toeic')} className="p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white">
                                    <div className="text-lg font-bold text-brand mb-1">TOEIC</div>
                                    <div className="text-xs text-gray-500">ภาษาอังกฤษใช้ทำงาน (บริบทออฟฟิศ/ธุรกิจ) — Listening 100 + Reading 100 = 200 ข้อเต็ม ตามโครงสร้างจริง</div>
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 mt-5 leading-relaxed">
                                หมายเหตุ: เป็นแบบทดสอบจำลองที่แต่งเนื้อหาเองทั้งหมด (บทสนทนา/บทพูด/บทความ/โจทย์ไวยากรณ์) ไม่ใช่ข้อสอบทางการที่หลุดออกมา
                                ทั้ง IELTS และ TOEIC ไม่มีเกณฑ์ "ผ่าน/ตก" แบบ HSK (ให้คะแนนเป็น Band 0-9 และสเกล 10-990 ตามลำดับ)
                                เว็บนี้เลยแสดงผลเป็นคะแนนดิบ (ถูกกี่ข้อ) แทน ไม่ได้แปลงเป็น Band/สเกลทางการ<br />
                                <b>IELTS</b>: มีครบ Listening + Reading + Writing Task 1 (สรุปข้อมูลจากตาราง แทนกราฟรูปภาพ) + Task 2
                                + Speaking (โจทย์ฝึกพูด 3 ส่วนแบบข้อสอบจริง อัดเสียงฟังทวนได้ แต่ไม่มีระบบให้คะแนนการพูด)<br />
                                <b>TOEIC</b>: จำนวนข้อครบ 200 ข้อตามโครงสร้างจริงทุก Part (Part1 ภาพ6/Part2 ถาม-ตอบ25/Part3 บทสนทนา39/
                                Part4 บทพูด30/Part5 ไวยากรณ์30/Part6 เติมข้อความ16/Part7 อ่านจับใจความ54) — Part 1-4 (Listening) เสียงเล่น
                                ให้อัตโนมัติทันทีที่เข้าโจทย์ กดฟังซ้ำได้ตลอด และ Part 7 ใช้บทความเดี่ยวล้วนแทนที่จะมีแบบจับคู่ 2-3 บทความเหมือนข้อสอบจริง
                                (จำนวนข้อรวมเท่าของจริงเป๊ะ)
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = () => start(examType);
            const backToType = () => { setExamType(null); setExam(null); };

            if (finished) {
                const gradedResults = sectionResults.filter(r => !r.ungraded);
                const totalCorrect = gradedResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = gradedResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลสอบ {examLabel}</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง (คะแนนดิบ — {examLabel} จริงไม่มีเกณฑ์ผ่าน/ตก ให้คะแนนเป็น{examType === 'toeic' ? 'สเกล 10-990' : ' Band 0-9'} แทน)</p>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.ungraded ? 'ฝึกแล้ว' : `${r.correct}/${r.total}`}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">สอบใหม่ชุดเดิม</button>
                                <button onClick={backToType} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">เปลี่ยนเป็น{examType === 'toeic' ? ' IELTS' : ' TOEIC'}</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">{examLabel} · ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

            const q = section.questions[qIdx];

            const finishSection = () => {
                const results = [...sectionResults, { key: section.key, title: section.title, correct: correctInSection, total: section.questions.length, ungraded: !!section.ungraded }];
                setSectionResults(results);
                if (sectionIdx + 1 >= exam.sections.length) {
                    setFinished(true);
                } else {
                    setSectionIdx(i => i + 1);
                    setShowIntro(true);
                    setQIdx(0);
                    resetPerQuestion();
                    setCorrectInSection(0);
                }
            };
            const nextQuestion = () => {
                if (qIdx + 1 >= section.questions.length) { finishSection(); return; }
                setQIdx(i => i + 1); resetPerQuestion();
            };
            const recordAnswer = (isCorrect, wrongEntry) => {
                setAnswered(true);
                if (isCorrect) { setCorrectInSection(c => c + 1); setXp(x => x + 2); }
                else if (wrongEntry) setAllWrong(w => [...w, wrongEntry]);
            };
            const pickMc = (choice) => {
                if (answered) return;
                setUserAnswer(choice);
                const isCorrect = choice === q.correct;
                let leftLabel = q.word || q.sentence || q.q || q.scene || q.thai;
                if (q.type === 'blank-mc') leftLabel = `Part 6 · ช่องที่ ${q.blankNum}`;
                recordAnswer(isCorrect, isCorrect ? null : { left: leftLabel || 'ข้อนี้', right: q.correct });
            };
            const pickTf = (val) => {
                if (answered) return;
                setUserAnswer(val);
                const isCorrect = val === q.answer;
                recordAnswer(isCorrect, isCorrect ? null : { left: `${q.word} = ${q.shownThai}`, right: q.answer ? 'ถูก' : 'ผิด' });
            };

            const submitEssay = () => {
                if (!essayText.trim() || essayStatus === 'loading') return;
                if (isIOS()) {
                    setEssayStatus('error');
                    setEssayFeedback('ฟีเจอร์ตรวจด้วย AI ยังไม่รองรับ iPhone/iPad ในตอนนี้ — กด "ข้ามข้อนี้" เพื่อไปต่อได้เลย');
                    return;
                }
                const isTask1 = q.type === 'write-essay-table';
                setEssayStatus('loading'); setEssayFeedback('');
                const w = getWritingWorker();
                const jobId = 'ieltsessay-' + Date.now();
                let acc = '';
                function onMsg(e) {
                    const msg = e.data;
                    if (!msg || msg.jobId !== jobId) return;
                    if (msg.type === 'token') { acc += msg.token; setEssayFeedback(acc); }
                    else if (msg.type === 'done') { cleanup(); setEssayStatus('done'); setAnswered(true); setXp(x => x + 2); }
                    else if (msg.type === 'error') { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(msg.message)); }
                }
                function onErr(e) { cleanup(); setEssayStatus('error'); setEssayFeedback(friendlyChatError(e.message || '')); }
                function cleanup() { w.removeEventListener('message', onMsg); w.removeEventListener('error', onErr); }
                w.addEventListener('message', onMsg);
                w.addEventListener('error', onErr);
                const messages = isTask1
                    ? [
                        { role: 'system', content: IELTS_TASK1_SYSTEM_PROMPT },
                        { role: 'system', content: 'ข้อมูลตารางที่โจทย์ให้: ' + q.title + ' — ' + q.rows.map(r => r.join(': ')).join(', ') },
                        { role: 'user', content: essayText },
                        { role: 'system', content: IELTS_TASK1_REMINDER },
                    ]
                    : [
                        { role: 'system', content: IELTS_WRITE_SYSTEM_PROMPT },
                        { role: 'user', content: essayText },
                        { role: 'system', content: IELTS_WRITE_REMINDER },
                    ];
                w.postMessage({ type: 'chat', jobId, maxNewTokens: 400, messages });
            };
            const skipEssay = () => { setAnswered(true); };
            const markSpeakingDone = () => { setAnswered(true); };

            const progressLabel = `${section.title} · ข้อ ${qIdx + 1}/${section.questions.length}`;

            return (
                <div className="flex-1 overflow-y-auto bg-gray-50">
                    <div className="max-w-xl mx-auto p-4 sm:p-6">
                        <div className="flex items-center justify-between mb-4">
                            <span className="text-xs font-bold text-gray-400 uppercase">{examLabel} · {progressLabel}</span>
                            <span className="text-xs font-bold text-brand">ถูก {correctInSection} ข้อ</span>
                        </div>

        // ══════════════════════════════════════════════════════════════════════════════════
        // ข้อสอบ JLPT N5 (จำลอง) — โคลนโครงสร้าง state machine มาจาก EnExamView แต่ตัดส่วนเขียน/พูด
        // ที่ต้องพึ่ง AI ออก (N5 ของจริงไม่มีส่วนเขียน/พูดในข้อสอบอยู่แล้ว มีแค่ 3 วิชา: 文字・語彙,
        // 文法・読解, 聴解) เนื้อหาทั้งหมดแต่งเอง ไม่ใช่ข้อสอบทางการที่หลุดออกมา — คำศัพท์ในหมวด
        // 文字・語彙 ดึงจาก vocab-data ภาษาญี่ปุ่นที่มี reading กำกับแล้ว (อ้างอิง OpenJLPT ตอน Stage 1)
        // ══════════════════════════════════════════════════════════════════════════════════

        function jpVocabPool() {
            const out = [];
            const cats = VOCAB['lang-jp'] || {};
            Object.keys(cats).forEach(cat => {
                (cats[cat] || []).forEach((w, i) => {
                    if (!w.reading) return; // กันไว้เผื่ออนาคตเพิ่มคำที่ยังไม่มี reading (ตอนนี้มีครบทุกคำแล้ว)
                    out.push({ key: `lang-jp::vocab-${cat}::${i}`, word: w.word, reading: w.reading, thai: w.thai });
                });
            });
            return out;
        }
        function genKanjiReadingMc(pool, count) {
            // 問題1 漢字の読み方 (ย่อ) — โชว์คำ ให้เลือกคำอ่าน(ฮิระงะนะ)ที่ถูกต้องจาก 4 ตัวเลือก
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.reading !== item.reading)).slice(0, 3);
                const choices = shuffleArr([item.reading, ...distractors.map(d => d.reading)]);
                return { type: 'kanji-reading-mc', word: item.word, correct: item.reading, choices };
            });
        }
        function genJpWordMeaningMc(pool, count) {
            // 問題2-3 表記・文脈規定 (รวมเป็นข้อเดียว) — โชว์คำ+คำอ่าน ให้เลือกความหมายไทยที่ถูกต้อง
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.word !== item.word)).slice(0, 3);
                const choices = shuffleArr([item.thai, ...distractors.map(d => d.thai)]);
                return { type: 'jp-word-meaning-mc', word: item.word, reading: item.reading, correct: item.thai, choices };
            });
        }
        function genJpMeaningWordMc(pool, count) {
            // 問題4 言い換え類義 (ย้อนทิศทาง) — โชว์ความหมายไทย ให้เลือกคำญี่ปุ่นที่ถูกต้อง
            const picked = shuffleArr(pool).slice(0, Math.min(count, pool.length));
            return picked.map(item => {
                const distractors = shuffleArr(pool.filter(p => p.word !== item.word)).slice(0, 3);
                const choices = shuffleArr([item.word, ...distractors.map(d => d.word)]);
                return { type: 'jp-meaning-word-mc', thai: item.thai, correct: item.word, choices };
            });
        }

        // 文法1 (問題1 文の文法) — 助詞・存在動詞 ตรวจสอบไวยากรณ์แล้วทุกข้อ (ไม่กำกวม มีคำตอบเดียว)
        const JP_GRAMMAR1 = [
            { sentence: "わたし＿がくせいです。", choices: ["は", "を", "に", "で"], correct: "は" },
            { sentence: "きのう　えいが＿みました。", choices: ["を", "が", "へ", "と"], correct: "を" },
            { sentence: "あした　とうきょう＿いきます。", choices: ["に", "を", "で", "の"], correct: "に" },
            { sentence: "としょかん＿ほんを　よみます。", choices: ["で", "に", "を", "へ"], correct: "で" },
            { sentence: "わたしは　やまださん＿はなしました。", choices: ["と", "が", "を", "の"], correct: "と" },
            { sentence: "きょうしつに　がくせいが　５にん＿。", choices: ["います", "あります", "します", "できます"], correct: "います" },
            { sentence: "つくえの　うえに　ほんが　３さつ＿。", choices: ["あります", "います", "します", "できます"], correct: "あります" },
            { sentence: "わたしは　まいあさ　７じ＿おきます。", choices: ["に", "で", "を", "へ"], correct: "に" },
            { sentence: "これは　わたし＿かさです。", choices: ["の", "は", "を", "が"], correct: "の" },
            { sentence: "すみませんが、まど＿あけてください。", choices: ["を", "が", "に", "で"], correct: "を" },
            { sentence: "わたしは　にほんご＿べんきょうしたいです。", choices: ["を", "が", "に", "と"], correct: "を" },
            { sentence: "ここ＿えきまで　どのくらい　かかりますか。", choices: ["から", "まで", "と", "の"], correct: "から" },
            { sentence: "この　もんだいは　あの　もんだい＿むずかしいです。", choices: ["より", "から", "まで", "など"], correct: "より" },
            { sentence: "あさ　６じ＿７じの　あいだに　おきます。", choices: ["から", "まで", "と", "や"], correct: "から" },
            { sentence: "にちようびは　うち＿やすみます。", choices: ["で", "に", "を", "へ"], correct: "で" },
        ];
        // 文法2 — แทน問題2 文の組み立て (ของจริงเป็นแบบเรียงคำ 4 ชิ้นให้เป็นประโยค แต่หน้านี้ยังไม่มี
        // UI drag-and-drop เรียงคำ — ใช้โจทย์เติมคำแบบเดียวกับ文法1 แทน เน้นรูปกริยา ~たい/~ましょう/
        // ~てください/~ないでください/เปรียบเทียบ より — ระบุความแตกต่างนี้ไว้ในหน้าเลือกข้อสอบ)
        const JP_GRAMMAR2 = [
            { sentence: "のどが　かわきました。みずを＿。", choices: ["のみたいです", "のみません", "のみました", "のみましょうか"], correct: "のみたいです" },
            { sentence: "あめが　ふっていますね。かさを＿。", choices: ["もっていきましょう", "もちません", "もちたくないです", "もちました"], correct: "もっていきましょう" },
            { sentence: "すみません、この　かんじの　よみかたを＿。", choices: ["おしえてください", "おしえません", "おしえました", "おしえたいです"], correct: "おしえてください" },
            { sentence: "としょかんの　なかで　おおきい　こえで＿。", choices: ["はなさないでください", "はなしてください", "はなしましょう", "はなしたいです"], correct: "はなさないでください" },
            { sentence: "この　カメラは　あの　カメラ＿かるいです。", choices: ["より", "ほど", "など", "でも"], correct: "より" },
            { sentence: "わたしは　まいにち　しゅくだいを＿。", choices: ["します", "しました", "しません", "しましょう"], correct: "します" },
            { sentence: "えきまで　いっしょに＿か。", choices: ["いきません", "いきます", "いきました", "いきたいです"], correct: "いきません" },
            { sentence: "この　みちは　くらいですから、きを＿。", choices: ["つけてください", "つけません", "つけました", "つけたいです"], correct: "つけてください" },
        ];
        // 文法3 — แทน問題3 文章の文法 (บทความสั้นเติมช่องว่างในบริบท ใช้ renderer blank-mc ร่วมกับ
        // TOEIC Part 6 ได้เลย เพราะโครงสร้าง {text, blankNum, choices, correct} เหมือนกัน)
        const JP_TEXT_GRAMMAR = [
            { text: "わたしは　まいあさ　７じ【1】おきます。あさごはんを　たべて、がっこう【2】いきます。がっこうで　ともだち【3】はなしました。よる　うち【4】かえりました。", blanks: [
                { choices: ["に", "で", "を", "へ"], correct: "に" },
                { choices: ["へ", "を", "で", "と"], correct: "へ" },
                { choices: ["と", "を", "に", "の"], correct: "と" },
                { choices: ["へ", "で", "と", "の"], correct: "へ" },
            ] },
            { text: "きょうは　とても　あついです。のどが　かわきましたから、みずを【1】。テーブルの　うえに　ジュースが　ありますから、いっしょに【2】か。デパートで　あたらしい　ふくを　かいました。とても　きれいですから、あなたも【3】。としょかんの　なかでは　しずかに　して【4】。", blanks: [
                { choices: ["のみたいです", "のみません", "のみました", "のみましょう"], correct: "のみたいです" },
                { choices: ["のみましょう", "のみたいです", "のみません", "のみました"], correct: "のみましょう" },
                { choices: ["みてください", "みません", "みました", "みたいです"], correct: "みてください" },
                { choices: ["ください", "たいです", "ましょう", "ません"], correct: "ください" },
            ] },
        ];
        function genJpBlankMc() {
            const out = [];
            JP_TEXT_GRAMMAR.forEach(t => { t.blanks.forEach((b, i) => out.push({ type: 'blank-mc', text: t.text, blankNum: i + 1, choices: shuffleArr(b.choices), correct: b.correct })); });
            return out;
        }

        // 読解 — แทน問題4-6 (短文/中文/情報検索) — บทความสั้นระดับ N5 บทความละ 2 คำถาม
        const JLPT_READING = [
            { text: "わたしの　かぞくは　よにんです。ちちと　ははと　あにと　わたしです。ちちは　かいしゃいんで、まいあさ　７じに　いえを　でます。ははは　がっこうの　せんせいです。あには　だいがくせいで、まいにち　だいがくで　べんきょうして　います。わたしたちは　にちようびに　いっしょに　ごはんを　たべます。", questions: [
                { q: "わたしの　かぞくは　なんにんですか。", choices: ["よにん", "さんにん", "ごにん", "ふたり"], correct: "よにん" },
                { q: "ちちの　しごとは　なんですか。", choices: ["かいしゃいん", "せんせい", "だいがくせい", "いしゃ"], correct: "かいしゃいん" },
            ] },
            { text: "やまださんへ　きょうは　しごとで　おそく　なります。ばんごはんは　れいぞうこの　なかに　あります。あたためて　たべて　ください。あしたは　はやく　かえりますから、いっしょに　でかけましょう。　―たなか", questions: [
                { q: "たなかさんは　きょう　なぜ　おそく　かえりますか。", choices: ["しごとが　あるから", "びょうきだから", "かいものに　いくから", "りょこうに　いくから"], correct: "しごとが　あるから" },
                { q: "やまださんは　ばんごはんを　どう　しますか。", choices: ["あたためて　たべる", "レストランで　たべる", "じぶんで　つくる", "たべない"], correct: "あたためて　たべる" },
            ] },
            { text: "らいしゅうの　どようびに　ともだちと　やまへ　いきます。てんきよほうでは、どようびは　はれで、にちようびは　あめです。だから、どようびに　やまに　のぼって、にちようびは　うちで　やすみます。やまの　うえは　さむいですから、あたたかい　ふくを　もって　いきます。", questions: [
                { q: "どようびの　てんきは　どうですか。", choices: ["はれ", "あめ", "ゆき", "くもり"], correct: "はれ" },
                { q: "にちようびに　なにを　しますか。", choices: ["うちで　やすむ", "やまに　のぼる", "かいものに　いく", "がっこうへ　いく"], correct: "うちで　やすむ" },
            ] },
            { text: "としょかんの　おしらせ：としょかんは　まいにち　あさ　９じから　よる　６じまで　あいて　います。げつようびは　やすみです。ほんを　かりる　ひとは、がくせいしょうを　もって　きて　ください。いちどに　ごさつまで　かりられます。", questions: [
                { q: "としょかんは　なんようびが　やすみですか。", choices: ["げつようび", "どようび", "にちようび", "かようび"], correct: "げつようび" },
                { q: "ほんを　かりる　とき　なにが　ひつようですか。", choices: ["がくせいしょう", "おかね", "パスポート", "でんわ"], correct: "がくせいしょう" },
            ] },
        ];
        function genJpPassageMc(count) {
            const picked = shuffleArr(JLPT_READING).slice(0, Math.min(count, JLPT_READING.length));
            const out = [];
            picked.forEach(p => { p.questions.forEach(q => out.push({ type: 'passage-mc', text: p.text, q: q.q, choices: shuffleArr(q.choices), correct: q.correct })); });
            return out;
        }

        // 聴解 — แทน問題1-2 (課題理解/ポイント理解) — บทสนทนาสั้น 2 คน + คำถาม 1 ข้อ/บท เล่นเสียง
        // อัตโนมัติ (สลับเสียงพูด A/B ด้วย speakVoice) เหมือน TOEIC dialogue-mc
        const JLPT_DIALOGUES = [
            { lines: [{ speaker: "A", text: "すみません、としょかんは　どこですか。" }, { speaker: "B", text: "としょかんは　えきの　まえに　あります。" }, { speaker: "A", text: "ありがとうございます。" }], q: "としょかんは　どこに　ありますか。", choices: ["えきの　まえ", "がっこうの　なか", "デパートの　うしろ", "こうえんの　となり"], correct: "えきの　まえ" },
            { lines: [{ speaker: "A", text: "きょう　いっしょに　えいがを　みませんか。" }, { speaker: "B", text: "すみません、きょうは　しごとが　あります。あしたは　どうですか。" }, { speaker: "A", text: "いいですね。あしたに　しましょう。" }], q: "ふたりは　いつ　えいがを　みますか。", choices: ["あした", "きょう", "らいしゅう", "どようび"], correct: "あした" },
            { lines: [{ speaker: "A", text: "たなかさん、これから　なにを　しますか。" }, { speaker: "B", text: "としょかんで　ほんを　かりてから、うちへ　かえります。" }, { speaker: "A", text: "そうですか。わたしも　いっしょに　いきます。" }], q: "たなかさんは　としょかんの　あとで　なにを　しますか。", choices: ["うちへ　かえる", "がっこうへ　いく", "かいものに　いく", "レストランへ　いく"], correct: "うちへ　かえる" },
            { lines: [{ speaker: "A", text: "もしもし、いま　どこに　いますか。" }, { speaker: "B", text: "えきに　います。もうすぐ　でんしゃが　きます。" }, { speaker: "A", text: "わかりました。えきで　まって　います。" }], q: "Bさんは　いま　どこに　いますか。", choices: ["えき", "がっこう", "かいしゃ", "うち"], correct: "えき" },
            { lines: [{ speaker: "A", text: "あしたの　てんきは　どうですか。" }, { speaker: "B", text: "てんきよほうでは　あめです。かさを　もって　いって　ください。" }, { speaker: "A", text: "はい、わかりました。" }], q: "あしたの　てんきは　どうですか。", choices: ["あめ", "はれ", "ゆき", "くもり"], correct: "あめ" },
            { lines: [{ speaker: "A", text: "すみません、この　みちで　えきまで　いけますか。" }, { speaker: "B", text: "いいえ、ちがいます。あの　みちを　まっすぐ　いって　ください。" }, { speaker: "A", text: "ありがとうございます。" }], q: "えきまで　どう　いきますか。", choices: ["あの　みちを　まっすぐ　いく", "この　みちを　まっすぐ　いく", "みぎに　まがる", "バスに　のる"], correct: "あの　みちを　まっすぐ　いく" },
        ];
        function genJpDialogueMc(count) {
            const picked = shuffleArr(JLPT_DIALOGUES).slice(0, Math.min(count, JLPT_DIALOGUES.length));
            return picked.map((d, di) => ({ type: 'jp-dialogue-mc', lines: d.lines, q: d.q, choices: shuffleArr(d.choices), correct: d.correct, dialogueSlot: di }));
        }
        // 聴解 — แทน問題3-4 (発話表現/即時応答) — ประโยคเดียวพูดสั้นๆ ให้เลือกคำตอบที่เหมาะสมจาก 3 ตัวเลือก
        const JLPT_RESPONSES = [
            { phrase: "すみません、いま　なんじですか。", choices: ["さんじです。", "はい、そうです。", "ありがとうございます。"], correct: "さんじです。" },
            { phrase: "おげんきですか。", choices: ["げんきです。", "さんじです。", "にほんじんです。"], correct: "げんきです。" },
            { phrase: "この　かばんは　いくらですか。", choices: ["せんえんです。", "がっこうです。", "あしたです。"], correct: "せんえんです。" },
            { phrase: "てつだいましょうか。", choices: ["おねがいします。", "さんじです。", "そうですね。"], correct: "おねがいします。" },
            { phrase: "しつれいですが、おなまえは？", choices: ["たなかです。", "げんきです。", "ここです。"], correct: "たなかです。" },
            { phrase: "コーヒーは　いかがですか。", choices: ["はい、おねがいします。", "いいえ、たなかです。", "そうですか。"], correct: "はい、おねがいします。" },
            { phrase: "しゅくだいを　もう　しましたか。", choices: ["はい、しました。", "はい、いきます。", "いいえ、げんきです。"], correct: "はい、しました。" },
            { phrase: "また　あした　あいましょう。", choices: ["はい、また　あした。", "はい、おねがいします。", "いいえ、けっこうです。"], correct: "はい、また　あした。" },
        ];
        function genJpResponseMc(count) {
            const picked = shuffleArr(JLPT_RESPONSES).slice(0, Math.min(count, JLPT_RESPONSES.length));
            return picked.map((r, ri) => ({ type: 'jp-response-mc', phrase: r.phrase, choices: shuffleArr(r.choices), correct: r.correct, voiceSlot: ri }));
        }

        function buildJlptExam() {
            const pool = jpVocabPool();
            return {
                kind: 'jlpt',
                sections: [
                    { key: 'vocab', title: '文字・語彙 (คำศัพท์-ตัวอักษร)', icon: '📝',
                        questions: [...genKanjiReadingMc(pool, 15), ...genJpWordMeaningMc(pool, 15), ...genJpMeaningWordMc(pool, 10)] },
                    { key: 'grammar', title: '文法 (ไวยากรณ์)', icon: '📐',
                        questions: [...genGrammarMc(JP_GRAMMAR1.concat(JP_GRAMMAR2), 23), ...genJpBlankMc()] },
                    { key: 'reading', title: '読解 (อ่านจับใจความ)', icon: '📖',
                        questions: genJpPassageMc(4) },
                    { key: 'listening', title: '聴解 (ฟัง)', icon: '🎧',
                        questions: [...genJpDialogueMc(6), ...genJpResponseMc(8)] },
                ],
            };
        }

        // ── ข้อสอบภาษาญี่ปุ่น (จำลอง) — โคลนโครงสร้าง state machine มาจาก EnExamView แต่ตัดส่วน
        //    essay/speaking ออก (N5 ไม่มีส่วนเขียน/พูดในข้อสอบจริง) — ไม่มีขั้น "เลือกประเภทข้อสอบ"
        //    เหมือน EnExamView เพราะตอนนี้มีแค่ N5 ชุดเดียว (N4-N1 เป็น follow-up ในอนาคต)
        function JpExamView({ langId, setLangId, setXp }) {
            const [started, setStarted] = useState(false);
            const [exam, setExam] = useState(null);
            const [sectionIdx, setSectionIdx] = useState(0);
            const [showIntro, setShowIntro] = useState(true);
            const [qIdx, setQIdx] = useState(0);
            const [answered, setAnswered] = useState(false);
            const [userAnswer, setUserAnswer] = useState(null);
            const [sectionResults, setSectionResults] = useState([]);
            const [correctInSection, setCorrectInSection] = useState(0);
            const [allWrong, setAllWrong] = useState([]);
            const [finished, setFinished] = useState(false);

            const resetPerQuestion = () => { setAnswered(false); setUserAnswer(null); };
            const start = () => {
                setExam(buildJlptExam());
                setStarted(true);
                setSectionIdx(0); setShowIntro(true);
                resetPerQuestion();
                setSectionResults([]); setCorrectInSection(0); setAllWrong([]); setFinished(false);
            };

            // ── เล่นเสียงอัตโนมัติทันทีที่เข้าโจทย์ฟังข้อใหม่ (聴解 เท่านั้น) — ต้องอยู่ก่อน early
            //    return ทุกอันเพราะเป็น hook ──
            useEffect(() => {
                if (!exam || showIntro || finished) return;
                const sec = exam.sections[sectionIdx];
                const question = sec && sec.questions[qIdx];
                if (!question) return;
                const timers = [];
                const t0 = setTimeout(() => {
                    if (question.type === 'jp-dialogue-mc') {
                        question.lines.forEach((ln, i) => timers.push(setTimeout(() => speakVoice(ln.text, 'ja', question.dialogueSlot * 2 + (i % 2)), i * 1800)));
                    } else if (question.type === 'jp-response-mc') {
                        speakVoice(question.phrase, 'ja', question.voiceSlot);
                    }
                }, 400);
                return () => { clearTimeout(t0); timers.forEach(clearTimeout); };
            }, [exam, sectionIdx, qIdx, showIntro]);

            if (langId !== 'lang-jp') {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-6 text-center">
                            <p className="text-gray-500 mb-4">ข้อสอบชุดนี้รองรับเฉพาะภาษาญี่ปุ่น</p>
                            <button onClick={() => setLangId('lang-jp')} className="px-5 py-2.5 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">สลับไปภาษาญี่ปุ่น</button>
                        </div>
                    </div>
                );
            }

            if (!started) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-1">ข้อสอบ JLPT N5 (จำลอง)</h2>
                            <p className="text-sm text-gray-500 mb-5">วัดระดับภาษาญี่ปุ่นขั้นพื้นฐานที่สุด — 4 วิชาตามโครงสร้างจริง</p>
                            <button onClick={start} className="w-full p-5 rounded-xl border-2 border-gray-200 hover:border-brand text-left transition bg-white mb-5">
                                <div className="text-lg font-bold text-brand mb-1">เริ่มสอบ N5</div>
                                <div className="text-xs text-gray-500">文字・語彙 40 + 文法 31 + 読解 8 + 聴解 14 = 93 ข้อ</div>
                            </button>
                            <p className="text-xs text-gray-400 leading-relaxed text-left">
                                หมายเหตุ: เป็นแบบทดสอบจำลองที่แต่งเนื้อหาเองทั้งหมด ไม่ใช่ข้อสอบทางการที่หลุดออกมา คำศัพท์ในหมวด文字・語彙
                                อ้างอิงจากคลังคำศัพท์ JLPT ที่เปิดเผยสาธารณะ (OpenJLPT, CC BY-SA 4.0) JLPT จริงไม่มีเกณฑ์คะแนนดิบแบบนี้
                                (ให้คะแนนแยกเป็นวิชา + มีเกณฑ์ผ่านขั้นต่ำต่อวิชาด้วย) เว็บนี้เลยแสดงผลเป็นคะแนนดิบ (ถูกกี่ข้อ) แทน<br />
                                <b>ความแตกต่างจากข้อสอบจริง</b>: 文法問題2 (ปกติเป็นแบบเรียงคำ 4 ชิ้นให้เป็นประโยค) แทนที่ด้วยโจทย์เติมคำ
                                แบบเดียวกับ問題1 เพราะหน้านี้ยังไม่มี UI จัดเรียงคำ — 聴解 (ฟัง) แสดงบทพูดเป็นตัวอักษรคู่กับเสียงด้วย
                                (ข้อสอบจริงมีแต่เสียงล้วน ไม่มีตัวอักษรให้อ่าน) เพื่อช่วยผู้เริ่มต้นตามทัน
                            </p>
                        </div>
                    </div>
                );
            }

            const restart = start;
            const backToStart = () => { setStarted(false); setExam(null); };

            if (finished) {
                const totalCorrect = sectionResults.reduce((s, r) => s + r.correct, 0);
                const totalQ = sectionResults.reduce((s, r) => s + r.total, 0);
                const pct = totalQ ? Math.round(totalCorrect / totalQ * 100) : 0;
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <h2 className="text-xl font-bold text-gray-800 mb-2">ผลสอบ JLPT N5</h2>
                            <div className="text-5xl font-bold text-brand my-4">{totalCorrect}/{totalQ}</div>
                            <p className="text-gray-500 mb-4">{pct}% ถูกต้อง (คะแนนดิบ — JLPT จริงให้คะแนนแยกวิชาและมีเกณฑ์ผ่านขั้นต่ำต่อวิชา ไม่ใช่คะแนนรวมแบบนี้)</p>
                            <div className="grid grid-cols-2 gap-2 mb-5">
                                {sectionResults.map(r => (
                                    <div key={r.key} className="bg-white rounded-xl border border-gray-200 p-3">
                                        <div className="text-xs text-gray-400">{r.title}</div>
                                        <div className="text-lg font-bold text-gray-800">{r.correct}/{r.total}</div>
                                    </div>
                                ))}
                            </div>
                            {allWrong.length > 0 && (
                                <div className="text-left bg-white rounded-xl border border-gray-200 p-4 mb-4 max-h-72 overflow-y-auto">
                                    <p className="text-sm font-bold text-gray-700 mb-2 sticky top-0 bg-white">ข้อที่ตอบผิด ({allWrong.length}):</p>
                                    <div className="space-y-1.5">
                                        {allWrong.map((w, i) => (
                                            <div key={i} className="text-sm text-gray-600 flex justify-between gap-3">
                                                <span>{w.left}</span>
                                                <span className="text-gray-800 font-semibold text-right">{w.right}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            <div className="flex gap-2 justify-center flex-wrap">
                                <button onClick={restart} className="px-5 py-2.5 rounded-xl bg-gray-900 text-white font-bold text-sm">สอบใหม่ (สุ่มโจทย์ใหม่)</button>
                                <button onClick={backToStart} className="px-5 py-2.5 rounded-xl border-2 border-gray-200 text-gray-600 font-bold text-sm hover:border-brand">กลับหน้าเลือกสอบ</button>
                            </div>
                        </div>
                    </div>
                );
            }

            const section = exam.sections[sectionIdx];

            if (showIntro) {
                return (
                    <div className="flex-1 overflow-y-auto bg-gray-50">
                        <div className="max-w-xl mx-auto p-4 sm:p-6 text-center">
                            <p className="text-xs font-bold text-gray-400 uppercase mb-2">JLPT N5 · ส่วนที่ {sectionIdx + 1}/{exam.sections.length}</p>
                            <div className="text-5xl mb-3">{section.icon}</div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">{section.title}</h2>
                            <p className="text-gray-500 mb-6">{section.questions.length} ข้อ</p>
                            <button onClick={() => setShowIntro(false)} className="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm hover:opacity-80">เริ่มทำส่วนนี้</button>
                        </div>
                    </div>
                );
            }

        function ListeningPanel({ awardXp, langId }) {
            const passages = langId === 'lang-en' ? LISTENING_PASSAGES_EN : LISTENING_PASSAGES;

            // สลับภาษาระหว่างเปิดเรื่องอยู่ — กลับไปหน้าเลือกเรื่องของภาษาใหม่แทนที่จะค้าง index เรื่อง
            // เก่าซึ่งอาจเกินขอบเขต array ของอีกภาษา (จำนวนเรื่องไม่เท่ากัน)
            useEffect(() => { setPassageIdx(null); }, [langId]);

            if (passageIdx === null) {
