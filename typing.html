<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สอนพิมพ์ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/crumb/สลับภาษา มาจาก theme.css (data-layout="reader") */
.tt-page{max-width:1080px}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.crumb-row .crumb{margin-bottom:0}
.tt-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.tt-head-icon .ome-icon{width:24px;height:24px}
.tt-page .page-head{margin-bottom:var(--ome-sp-4)}

.tt-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tt-tab{flex-shrink:0;height:36px;padding:0 14px;border:1px solid var(--ome-border);border-radius:var(--ome-radius-md);
  background:var(--ome-surface-1);color:var(--ome-text-2);font-size:var(--ome-fs-sm);font-weight:600;white-space:nowrap;cursor:pointer;
  transition:border-color var(--ome-dur-1),color var(--ome-dur-1)}
.tt-tab:hover{border-color:var(--ome-border-strong);color:var(--ome-text-1)}
.tt-tab.active{background:var(--ome-accent);border-color:var(--ome-accent);color:var(--ome-on-accent)}
.tt-track-desc{font-size:var(--ome-fs-sm);color:var(--ome-text-2);margin-top:10px;line-height:1.6}
.tt-track-desc:empty{display:none}

.tt-track-progress{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:320px}
.tt-track-progress-bar{flex:1;height:6px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.tt-track-progress-fill{height:100%;border-radius:inherit;background:var(--ome-accent);transition:width var(--ome-dur-3) var(--ome-ease);width:0%}
.tt-track-progress-label{font-size:11.5px;font-weight:700;color:var(--ome-accent-strong);flex-shrink:0}

.tt-thai-hint{display:none;align-items:center;gap:8px;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);
  padding:9px 14px;margin-top:10px;font-size:var(--ome-fs-sm);font-weight:600}

.tt-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:760px){.tt-layout{grid-template-columns:1fr}}

.tt-lesson-list{display:flex;flex-direction:column;gap:6px}
.tt-lesson{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-md);padding:10px 12px;cursor:pointer;font-size:var(--ome-fs-sm);color:var(--ome-text-1);
  transition:border-color var(--ome-dur-1),background var(--ome-dur-1)}
.tt-lesson:hover{border-color:var(--ome-accent)}
.tt-lesson.active{border-color:var(--ome-accent);background:var(--ome-accent-soft);color:var(--ome-accent-strong);font-weight:600}
.tt-lesson-title{display:inline-flex;align-items:center;gap:6px}
.tt-lesson-title .ome-icon{color:var(--ome-text-2)}
.tt-lesson-best{font-size:11px;color:var(--ome-ok-ink);font-weight:700;flex-shrink:0}
.tt-lesson.locked{opacity:.55;cursor:not-allowed}
.tt-lesson.locked:hover{border-color:var(--ome-border)}
.tt-lock-msg{display:none;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:8px}

.tt-main{position:relative;padding:24px;overflow:hidden}
.tt-stats{display:flex;gap:26px;margin-bottom:18px;flex-wrap:wrap}
.tt-stat{display:flex;flex-direction:column;gap:2px}
.tt-stat b{font-size:22px;font-weight:700;color:var(--ome-accent-strong);font-variant-numeric:tabular-nums}
.tt-stat span{font-size:11.5px;color:var(--ome-text-2);font-weight:600;letter-spacing:.03em}
.tt-stats .tt-stat:first-child b{font-size:30px}

.tt-progress-bar{height:5px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden;margin-bottom:16px}
.tt-progress-fill{height:100%;border-radius:inherit;background:var(--ome-accent);width:0%;transition:width .2s ease-out}

.tt-practice-area{position:relative;background:var(--ome-surface-2);border-radius:var(--ome-radius-lg);padding:22px;cursor:text;min-height:90px;
  border:1px solid var(--ome-border);transition:border-color var(--ome-dur-2)}
.tt-practice-area:focus-within{border-color:var(--ome-accent)}
.tt-practice-text{font-family:var(--ome-font-mono);font-size:18px;line-height:1.9;letter-spacing:.2px;word-break:break-word}
.tt-char{color:var(--ome-text-3);transition:color .1s}
.tt-char.correct{color:var(--ome-text-1)}
.tt-char.wrong{color:var(--ome-err-ink);background:var(--ome-err-soft);border-radius:3px}
.tt-char.cursor{border-left:2px solid var(--ome-accent);animation:tt-blink 1s step-end infinite}
@keyframes tt-blink{50%{border-color:transparent}}
@media (prefers-reduced-motion: reduce){.tt-char.cursor{animation:none}}
.tt-hidden-input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tt-focus-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--ome-surface-2) 85%, transparent);border-radius:var(--ome-radius-lg);font-size:var(--ome-fs-sm);font-weight:600;
  color:var(--ome-text-2);pointer-events:none;backdrop-filter:blur(2px)}
.tt-practice-area.done .tt-focus-hint{display:none}

.tt-keyboard{margin-top:22px;display:flex;flex-direction:column;gap:6px;align-items:center}
.tt-kbrow{display:flex;gap:5px}
.tt-key{width:34px;height:34px;border-radius:var(--ome-radius-md);background:var(--ome-surface-2);border:1px solid var(--ome-border);
  display:flex;align-items:center;justify-content:center;font-size:var(--ome-fs-sm);font-weight:600;color:var(--ome-text-2);
  transition:transform .1s,background .12s,color .12s;box-shadow:0 2px 0 var(--ome-border)}
.tt-key.home{border-bottom:3px solid var(--ome-border-strong)}
.tt-key.pressed{transform:translateY(2px) scale(.94);box-shadow:none}
/* โซนสีนิ้ว — ใช้ selector แบบ class เดี่ยว (ไม่ผูกกับ .tt-key) เพื่อให้ใช้ซ้ำกับชิปคำอธิบายสี (.tt-flegend-chip) ได้ด้วย
   specificity (0,1,0) ต่ำกว่า .tt-key.next (0,2,0) เสมอ ปุ่ม "ถัดไป" จึงทับสีนิ้วด้วยสีเน้นได้ไม่ว่าอยู่โซนไหน
   8 โซน = สีกราฟ 8 สี (CVD-validated) ผสมพื้นการ์ดเป็นพื้นอ่อน — เปลี่ยนตามโหมดสว่าง/มืดเอง */
.f-lp{--z:var(--ome-chart-8)}
.f-lr{--z:var(--ome-chart-2)}
.f-lm{--z:var(--ome-chart-4)}
.f-li{--z:var(--ome-chart-3)}
.f-ri{--z:var(--ome-chart-1)}
.f-rm{--z:var(--ome-chart-7)}
.f-rr{--z:var(--ome-chart-5)}
.f-rp{--z:var(--ome-text-2)}
:is(.f-lp,.f-lr,.f-lm,.f-li,.f-ri,.f-rm,.f-rr,.f-rp){background:color-mix(in srgb, var(--z) 18%, var(--ome-surface-1));color:color-mix(in srgb, var(--z) 70%, var(--ome-text-1))}
.tt-key.next{background:var(--ome-accent);color:var(--ome-on-accent);border-color:var(--ome-accent);transform:scale(1.08)}
.tt-key.tt-space{width:220px}
.tt-key.tt-shift{width:56px;font-size:var(--ome-fs-xs)}
.tt-keyboard.shifted .tt-key:not(.tt-shift):not(.next){font-weight:700}
@media(max-width:760px){.tt-key{width:30px;height:30px}.tt-key.tt-shift{width:50px}.tt-key.tt-space{width:200px}}
@media(max-width:600px){.tt-keyboard{display:none}}

.tt-finger-hint{text-align:center;font-size:var(--ome-fs-xs);font-weight:700;color:var(--ome-accent-strong);min-height:1.4em;margin-top:8px}
.tt-flegend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tt-flegend-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:var(--ome-radius-pill)}
@media(max-width:600px){.tt-flegend{display:none}}

.tt-toolbar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.tt-sprint-btn{height:34px;padding:0 13px;border:1px solid var(--ome-border);border-radius:var(--ome-radius-md);background:var(--ome-surface-1);
  color:var(--ome-text-1);font-size:var(--ome-fs-xs);font-weight:600;cursor:pointer;transition:border-color var(--ome-dur-1),background var(--ome-dur-1)}
.tt-sprint-btn:hover{border-color:var(--ome-accent);color:var(--ome-accent-strong)}
.tt-finger-toggle{display:flex;align-items:center;gap:6px;font-size:var(--ome-fs-xs);color:var(--ome-text-2);cursor:pointer;margin-left:auto}
.tt-finger-toggle input{accent-color:var(--ome-accent)}

.tt-result{display:none;position:absolute;inset:0;background:color-mix(in srgb, var(--ome-surface-1) 78%, transparent);backdrop-filter:blur(6px);
  border-radius:var(--ome-card-r);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:20px;opacity:0;transform:scale(.94);transition:opacity .25s ease-out,transform .25s var(--ome-ease)}
.tt-result.show{opacity:1;transform:scale(1)}
.tt-result h2{font-size:var(--ome-fs-xl);color:var(--ome-accent-strong);margin:0}
.tt-result-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.tt-result-row .tt-stat b{font-size:30px}
.tt-result-actions{display:flex;gap:10px;margin-top:6px}

.tt-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--ome-card-r)}
.tt-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:tt-confetti-fall linear forwards}
@keyframes tt-confetti-fall{to{transform:translateY(220px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.tt-confetti{display:none}}
@media(max-width:600px){.tt-main{padding:16px}}
</style>
</head>
<body data-layout="reader">
<main class="page tt-page" id="typingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbTyping">สอนพิมพ์</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head">
  <span class="tt-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-keyboard"/></svg></span>
  <h1 data-i18n="pageTitle">สอนพิมพ์</h1>
</div>

<div class="tt-tabs" id="trackTabs"></div>
<div class="tt-track-desc" id="trackDesc"></div>
<div class="tt-track-progress" id="trackProgress">
  <div class="tt-track-progress-bar"><div class="tt-track-progress-fill" id="trackProgressFill"></div></div>
  <span class="tt-track-progress-label" id="trackProgressLabel"></span>
</div>
<div class="tt-thai-hint" id="thaiKbWarn" role="status" data-i18n="thaiKbWarn">แป้นพิมพ์ยังไม่ใช่ภาษาไทย (เกษมณี)</div>

<div class="tt-toolbar-row">
  <button class="tt-sprint-btn" id="sprintEnBtn" type="button" data-i18n="sprintEn">ทดสอบจับเวลา 60 วิ (อังกฤษ)</button>
  <button class="tt-sprint-btn" id="sprintThBtn" type="button" data-i18n="sprintTh">ทดสอบจับเวลา 60 วิ (ไทย)</button>
  <label class="tt-finger-toggle"><input type="checkbox" id="fingerColorToggle"><span data-i18n="showFingerColors">แสดงสีโซนนิ้ว</span></label>
</div>

<div class="tt-layout">
  <div>
    <div class="tt-lock-msg" id="lockMsg"></div>
    <div class="tt-lesson-list" id="lessonList"></div>
  </div>

  <div class="tt-main card">
    <div class="tt-stats">
      <div class="tt-stat"><b id="statWpm">0</b><span data-i18n="statsWpm">คำ/นาที</span></div>
      <div class="tt-stat"><b id="statAcc">100%</b><span data-i18n="statsAcc">ความแม่นยำ</span></div>
      <div class="tt-stat"><b id="statTime">0s</b><span id="statTimeLabel" data-i18n="statsTime">เวลา</span></div>
    </div>

    <div class="tt-progress-bar"><div class="tt-progress-fill" id="progressFill"></div></div>

    <div class="tt-practice-area" id="practiceArea">
      <div class="tt-practice-text" id="practiceText"></div>
      <input class="tt-hidden-input" id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="tt-focus-hint" id="focusHint" data-i18n="clickToFocus">คลิกที่นี่เพื่อเริ่มพิมพ์</div>
    </div>

    <div class="tt-finger-hint" id="fingerHint"></div>
    <div class="tt-keyboard" id="virtualKeyboard"></div>
    <div class="tt-flegend" id="fingerLegend"></div>

    <div class="tt-result" id="resultPanel">
      <div class="tt-confetti" id="confettiLayer"></div>
      <h2 id="resultTitleEl" data-i18n="resultTitle">จบบทเรียนแล้ว!</h2>
      <div class="tt-result-row">
        <div class="tt-stat"><b id="resultWpm">0</b><span data-i18n="resultWpm">ความเร็ว</span></div>
        <div class="tt-stat"><b id="resultAcc">100%</b><span data-i18n="resultAcc">ความแม่นยำ</span></div>
        <div class="tt-stat"><b id="resultBest">0</b><span id="resultBestLabel" data-i18n="resultBest">สถิติที่ดีที่สุด</span></div>
      </div>
      <div class="tt-result-actions">
        <button class="btn" id="retryBtn" type="button" data-i18n="btnRetry">ฝึกซ้ำ</button>
        <button class="btn primary" id="nextBtn" type="button" data-i18n="btnNext">บทถัดไป</button>
      </div>
    </div>
  </div>
</div>

</main>
<script src="learn-core.js"></script>
<script src="typing.js"></script>
</body>
</html>
