<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สอนพิมพ์ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --tt:#4F46E5; --tt-dk:#3730A3; --tt-sf:#EEEDFC; --tt2:#EC4899;
  --ok:#17B26A; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
  --sh-lift:0 4px 10px rgba(24,31,54,.06), 0 16px 32px rgba(79,70,229,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}

.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 0;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--tt);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}
.lang-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--line);border:none;border-radius:20px;
  padding:3px;cursor:pointer;font-family:var(--f);flex-shrink:0}
.lang-toggle span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;color:var(--muted);transition:.15s}
.lang-toggle span.active{background:var(--card);color:var(--tt-dk);box-shadow:0 1px 3px rgba(24,31,54,.08)}

.tt-head{display:flex;align-items:flex-start;gap:16px;margin-top:16px}
.tt-head-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--tt),var(--tt2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(79,70,229,.35);
  animation:tt-icon-glow 3.5s ease-in-out infinite}
@keyframes tt-icon-glow{0%,100%{box-shadow:0 8px 22px rgba(79,70,229,.35)}50%{box-shadow:0 8px 26px rgba(236,72,153,.4)}}
.tt-head h1{font-size:clamp(21px,3.6vw,28px);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),var(--tt-dk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.tt-head p{margin-top:4px;color:var(--muted);max-width:64ch;font-size:14px}

.tt-tabs{display:flex;gap:6px;margin-top:22px;overflow-x:auto;padding-bottom:2px}
.tt-tab{font-family:var(--f);font-size:13px;font-weight:600;padding:9px 14px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.18s cubic-bezier(.2,.8,.2,1);flex-shrink:0}
.tt-tab:hover{border-color:var(--tt);color:var(--tt-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(79,70,229,.14)}
.tt-tab.active{background:linear-gradient(135deg,var(--tt),var(--tt2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(79,70,229,.32)}
.tt-track-desc{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.6}

.tt-track-progress{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:320px}
.tt-track-progress-bar{flex:1;height:6px;border-radius:20px;background:var(--line);overflow:hidden}
.tt-track-progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--tt),var(--tt2));
  transition:width .35s cubic-bezier(.2,.8,.2,1);width:0%}
.tt-track-progress-label{font-size:11.5px;font-weight:700;color:var(--tt-dk);flex-shrink:0}

.tt-thai-hint{display:none;align-items:center;gap:8px;background:#FFF7E6;color:#8A5B00;border-radius:11px;
  padding:9px 14px;margin-top:10px;font-size:13px;font-weight:600}
[data-theme="dark"] .tt-thai-hint{background:#3A2E10;color:#F5C36B}

.tt-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:760px){.tt-layout{grid-template-columns:1fr}}

.tt-lesson-list{display:flex;flex-direction:column;gap:6px}
.tt-lesson{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--f);
  text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;
  cursor:pointer;font-size:13px;color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.tt-lesson:hover{border-color:var(--tt);transform:translateX(3px);box-shadow:0 4px 10px rgba(79,70,229,.1)}
.tt-lesson.active{border-color:transparent;background:linear-gradient(135deg,var(--tt-sf),var(--card));
  color:var(--tt-dk);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--tt)}
.tt-lesson-best{font-size:11px;color:var(--ok);font-weight:700;flex-shrink:0}

.tt-main{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-lift);padding:24px;position:relative;
  overflow:hidden}
.tt-stats{display:flex;gap:26px;margin-bottom:18px;flex-wrap:wrap}
.tt-stat{display:flex;flex-direction:column;gap:2px}
.tt-stat b{font-size:22px;font-weight:800;color:var(--tt-dk);font-variant-numeric:tabular-nums}
.tt-stat span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tt-stats .tt-stat:first-child b{font-size:30px;background:linear-gradient(90deg,var(--tt),var(--tt2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.tt-progress-bar{height:5px;border-radius:20px;background:var(--line);overflow:hidden;margin-bottom:16px}
.tt-progress-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--tt),var(--tt2));
  width:0%;transition:width .2s ease-out}

.tt-practice-area{position:relative;background:var(--bg);border-radius:12px;padding:22px;cursor:text;min-height:90px;
  border:1.5px solid var(--line);transition:border-color .2s}
.tt-practice-area:focus-within{border-color:var(--tt)}
.tt-practice-text{font-family:var(--mono);font-size:18px;line-height:1.9;letter-spacing:.2px;word-break:break-word}
.tt-char{color:#B9BFCF;transition:color .1s}
.tt-char.correct{color:var(--ink)}
.tt-char.wrong{color:var(--err);background:#FFE3E3;border-radius:3px}
[data-theme="dark"] .tt-char.wrong{background:#3A1F22}
.tt-char.cursor{border-left:2px solid var(--tt);animation:tt-blink 1s step-end infinite}
@keyframes tt-blink{50%{border-color:transparent}}
.tt-hidden-input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.tt-focus-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(246,247,251,.85);border-radius:12px;font-size:13.5px;font-weight:600;color:var(--muted);
  pointer-events:none;backdrop-filter:blur(2px)}
[data-theme="dark"] .tt-focus-hint{background:rgba(15,18,26,.85)}
.tt-practice-area.done .tt-focus-hint{display:none}

.tt-keyboard{margin-top:22px;display:flex;flex-direction:column;gap:6px;align-items:center}
.tt-kbrow{display:flex;gap:5px}
.tt-key{width:34px;height:34px;border-radius:8px;background:var(--bg);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);
  transition:transform .1s, box-shadow .1s, background .12s, color .12s;
  box-shadow:0 2px 0 rgba(24,31,54,.06)}
.tt-key.home{border-bottom:3px solid #C9CEDC}
.tt-key.pressed{transform:translateY(2px) scale(.94);box-shadow:0 0 0 rgba(24,31,54,0)}
/* โซนสีนิ้ว — ใช้ selector แบบ class เดี่ยว (ไม่ผูกกับ .tt-key) เพื่อให้ใช้ซ้ำกับชิปคำอธิบายสี
   (.tt-flegend-chip) ได้ด้วย — specificity (0,1,0) ต่ำกว่า .tt-key.next (0,2,0) เสมอ จึงมั่นใจได้ว่า
   ปุ่ม "ถัดไป" จะทับสีนิ้วด้วยสีเน้น --tt เข้มเสมอไม่ว่าจะอยู่โซนนิ้วไหน (ไม่ต้องพึ่งลำดับใน source) */
.f-lp{background:#FEE2E2;color:#B91C1C}
.f-lr{background:#FFEDD5;color:#C2410C}
.f-lm{background:#FEF9C3;color:#A16207}
.f-li{background:#DCFCE7;color:#15803D}
.f-ri{background:#DBEAFE;color:#1D4ED8}
.f-rm{background:#EDE9FE;color:#6D28D9}
.f-rr{background:#FCE7F3;color:#BE185D}
.f-rp{background:#E7E5E4;color:#57534E}
[data-theme="dark"] .f-lp{background:#4A1F1F;color:#FCA5A5}
[data-theme="dark"] .f-lr{background:#4A2E15;color:#FDBA74}
[data-theme="dark"] .f-lm{background:#4A3D15;color:#FDE68A}
[data-theme="dark"] .f-li{background:#173A24;color:#86EFAC}
[data-theme="dark"] .f-ri{background:#17264A;color:#93C5FD}
[data-theme="dark"] .f-rm{background:#2E1F4A;color:#C4B5FD}
[data-theme="dark"] .f-rr{background:#3A1F30;color:#F9A8D4}
[data-theme="dark"] .f-rp{background:#38332E;color:#D6D3D1}
.tt-key.next{background:var(--tt);color:#fff;border-color:var(--tt);transform:scale(1.08)}
.tt-key.tt-space{width:220px}
@media(max-width:600px){.tt-keyboard{display:none}}

.tt-finger-hint{text-align:center;font-size:12.5px;font-weight:700;color:var(--tt-dk);min-height:1.4em;margin-top:8px}
.tt-flegend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tt-flegend-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px}
@media(max-width:600px){.tt-flegend{display:none}}

.tt-toolbar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.tt-sprint-btn{font-family:var(--f);font-size:12.5px;font-weight:600;padding:8px 13px;border:1.5px solid var(--line);
  border-radius:10px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.tt-sprint-btn:hover{border-color:var(--tt);color:var(--tt-dk);transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(79,70,229,.14)}
.tt-finger-toggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;margin-left:auto}
.tt-finger-toggle input{accent-color:var(--tt)}
.tt-lock-msg{display:none;background:#FFF3E0;color:#9A5A00;border-radius:10px;padding:8px 12px;font-size:12.5px;
  font-weight:600;margin-bottom:8px}
[data-theme="dark"] .tt-lock-msg{background:#3A2C10;color:#F5C36B}
.tt-lesson.locked{opacity:.55;cursor:not-allowed}
.tt-lesson.locked:hover{border-color:var(--line)}

.tt-result{display:none;position:absolute;inset:0;background:rgba(255,255,255,.7);backdrop-filter:blur(6px);
  border-radius:var(--r);flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:20px;opacity:0;transform:scale(.94);transition:opacity .25s ease-out, transform .25s cubic-bezier(.2,.8,.2,1)}
[data-theme="dark"] .tt-result{background:rgba(18,21,28,.72)}
.tt-result.show{opacity:1;transform:scale(1)}
.tt-result h2{font-size:22px;font-weight:800;background:linear-gradient(90deg,var(--tt),var(--tt2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tt-result-row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.tt-result-row .tt-stat b{font-size:30px}
.tt-result-actions{display:flex;gap:10px;margin-top:6px}
.btn{font-family:var(--f);font-size:14px;font-weight:600;padding:10px 18px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.btn:hover{border-color:var(--tt);color:var(--tt-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(79,70,229,.14)}
.btn.primary{background:linear-gradient(135deg,var(--tt),var(--tt2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(79,70,229,.32)}
.btn.primary:hover{filter:brightness(1.08);color:#fff}

.tt-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--r)}
.tt-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;
  animation:tt-confetti-fall linear forwards}
@keyframes tt-confetti-fall{to{transform:translateY(220px) rotate(360deg);opacity:0}}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.tt-main{padding:16px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap" id="typingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="documents.html" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbTyping">สอนพิมพ์</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="tt-head">
  <div class="tt-head-icon">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
      <rect x="1.5" y="5" width="21" height="14" rx="3.5" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.9)" stroke-width="1.4"/>
      <rect x="4.4" y="7.8" width="2.9" height="2.7" rx="0.9" fill="#fff"/>
      <rect x="8.1" y="7.8" width="2.9" height="2.7" rx="0.9" fill="#fff" opacity=".92"/>
      <rect x="11.8" y="7.8" width="2.9" height="2.7" rx="0.9" fill="#fff" opacity=".8"/>
      <rect x="15.5" y="7.8" width="2.9" height="2.7" rx="0.9" fill="#fff" opacity=".92"/>
      <rect x="6.25" y="11.5" width="2.9" height="2.7" rx="0.9" fill="#fff" opacity=".85"/>
      <rect x="9.95" y="11.5" width="2.9" height="2.7" rx="0.9" fill="#fff"/>
      <rect x="13.65" y="11.5" width="2.9" height="2.7" rx="0.9" fill="#fff" opacity=".85"/>
      <rect x="6" y="15.2" width="12" height="2.5" rx="1.25" fill="#fff" opacity=".95"/>
    </svg>
  </div>
  <div>
    <h1 data-i18n="pageTitle">สอนพิมพ์</h1>
    <p data-i18n="pageDesc"></p>
  </div>
</div>

<div class="tt-tabs" id="trackTabs"></div>
<div class="tt-track-desc" id="trackDesc"></div>
<div class="tt-track-progress" id="trackProgress">
  <div class="tt-track-progress-bar"><div class="tt-track-progress-fill" id="trackProgressFill"></div></div>
  <span class="tt-track-progress-label" id="trackProgressLabel"></span>
</div>
<div class="tt-thai-hint" id="thaiKbHint" data-i18n="thaiKbHint">⚠️ อย่าลืมสลับคีย์บอร์ดเป็นภาษาไทยก่อนเริ่มพิมพ์</div>

<div class="tt-toolbar-row">
  <button class="tt-sprint-btn" id="sprintEnBtn" type="button" data-i18n="sprintEn">ทดสอบจับเวลา 60 วิ (อังกฤษ)</button>
  <button class="tt-sprint-btn" id="sprintThBtn" type="button" data-i18n="sprintTh">ทดสอบจับเวลา 60 วิ (ไทย)</button>
  <label class="tt-finger-toggle"><input type="checkbox" id="fingerColorToggle"><span data-i18n="showFingerColors">แสดงสีโซนนิ้ว</span></label>
</div>

<div class="tt-layout">
  <div>
    <div class="tt-lock-msg" id="lockMsg"></div>
    <div class="tt-lesson-list" id="lessonList"></div>
  </div>

  <div class="tt-main">
    <div class="tt-stats">
      <div class="tt-stat"><b id="statWpm">0</b><span data-i18n="statsWpm">คำ/นาที</span></div>
      <div class="tt-stat"><b id="statAcc">100%</b><span data-i18n="statsAcc">ความแม่นยำ</span></div>
      <div class="tt-stat"><b id="statTime">0s</b><span id="statTimeLabel" data-i18n="statsTime">เวลา</span></div>
    </div>

    <div class="tt-progress-bar"><div class="tt-progress-fill" id="progressFill"></div></div>

    <div class="tt-practice-area" id="practiceArea">
      <div class="tt-practice-text" id="practiceText"></div>
      <input class="tt-hidden-input" id="hiddenInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="tt-focus-hint" id="focusHint" data-i18n="clickToFocus">คลิกที่นี่เพื่อเริ่มพิมพ์</div>
    </div>

    <div class="tt-finger-hint" id="fingerHint"></div>
    <div class="tt-keyboard" id="virtualKeyboard"></div>
    <div class="tt-flegend" id="fingerLegend"></div>

    <div class="tt-result" id="resultPanel">
      <div class="tt-confetti" id="confettiLayer"></div>
      <h2 id="resultTitleEl" data-i18n="resultTitle">จบบทเรียนแล้ว!</h2>
      <div class="tt-result-row">
        <div class="tt-stat"><b id="resultWpm">0</b><span data-i18n="resultWpm">ความเร็ว</span></div>
        <div class="tt-stat"><b id="resultAcc">100%</b><span data-i18n="resultAcc">ความแม่นยำ</span></div>
        <div class="tt-stat"><b id="resultBest">0</b><span id="resultBestLabel" data-i18n="resultBest">สถิติที่ดีที่สุด</span></div>
      </div>
      <div class="tt-result-actions">
        <button class="btn" id="retryBtn" type="button" data-i18n="btnRetry">ฝึกซ้ำ</button>
        <button class="btn primary" id="nextBtn" type="button" data-i18n="btnNext">บทถัดไป</button>
      </div>
    </div>
  </div>
</div>

</div>
<script src="typing.js"></script>
</body>
</html>
