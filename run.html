<style>
code{background:var(--ome-surface-2);padding:2px 6px;border-radius:var(--ome-radius-sm)}
.card > .card-head{margin-bottom:0}
.status{text-align:center;font-size:var(--ome-fs-sm);color:var(--ome-text-2);margin:0}
.status:empty,.drop-hint:empty,.drive-status:empty{display:none}

/* แถบสถานะขั้นตอน */
.line{position:relative;padding:8px 0 0}
.track,.track-fill{position:absolute;top:20px;height:4px;border-radius:var(--ome-radius-sm)}
.track{left:7%;right:7%;background:var(--ome-surface-2);border:1px solid var(--ome-border)}
.track-fill{left:7%;width:0;background:linear-gradient(90deg,var(--ome-info),var(--ome-accent));transition:width var(--ome-dur-3) var(--ome-ease)}
.stations{display:flex;justify-content:space-between;position:relative}
.stn{flex:1;text-align:center}
.stn .dot{width:16px;height:16px;border-radius:50%;background:var(--ome-surface-1);border:3px solid var(--ome-border-strong);
  margin:4px auto 10px;transition:all var(--ome-dur-2);position:relative;z-index:2}
.stn.on .dot{border-color:var(--ome-accent);box-shadow:0 0 0 6px var(--ome-accent-soft)}
.stn.on .dot::after{content:'';position:absolute;inset:2px;border-radius:50%;background:var(--ome-accent);animation:pulse 1.3s ease-in-out infinite}
.stn.done .dot{border-color:var(--ome-ok);background:var(--ome-ok)}
.stn.fail .dot{border-color:var(--ome-err);background:var(--ome-err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stn-label{font-size:11.5px;color:var(--ome-text-2)}
.stn.on .stn-label,.stn.done .stn-label{color:var(--ome-text-1);font-weight:600}
@media(prefers-reduced-motion:reduce){.stn.on .dot::after{animation:none}.track-fill{transition:none}}
@media(max-width:600px){.stn-label{font-size:10px}.track,.track-fill{left:9%;right:9%}}

/* ช่องวางไฟล์ */
.drop{border:2px dashed var(--ome-border-strong);border-radius:var(--ome-radius-lg);padding:40px 24px;text-align:center;
  cursor:pointer;transition:var(--ome-dur-2);background:var(--ome-surface-2)}
.drop:hover,.drop.over{border-color:var(--ome-accent);background:var(--ome-accent-soft)}
.drop:focus-visible{outline:3px solid var(--ome-accent);outline-offset:3px}
.drop.has{border-style:solid;border-color:var(--ome-ok);background:var(--ome-ok-soft)}
.drop .ome-icon{width:40px;height:40px;color:var(--ome-accent-strong);margin-bottom:10px}
.drop-main{font-weight:600;font-size:var(--ome-fs-md)}
.drop-hint{font-size:var(--ome-fs-sm);color:var(--ome-text-2);margin-top:6px}
.file-name{color:var(--ome-accent-strong);word-break:break-all;font-weight:500}

/* บันทึกการทำงาน (เทอร์มินัลสีเข้มทั้งสองโหมด) */
.log{font-family:var(--ome-font-mono);font-size:12.5px;line-height:1.7;background:#1B2030;color:#C2CBDD;
  padding:18px 20px;border-radius:var(--ome-radius-lg);max-height:320px;overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.log:empty::before{content:'รอเริ่มทำงาน…';color:#5D6884}
.log .ok{color:#5EE0A4}.log .warn{color:#F5C35C}.log .err{color:#FF8A87}.log .dim{color:#7C87A3}

.result{display:none}.result.show{display:block}
.drive-row{padding-top:var(--ome-sp-4);border-top:1px solid var(--ome-border)}
.drive-status{font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.drive-status.ok{color:var(--ome-ok-ink);font-weight:600}
.drive-status.err{color:var(--ome-err-ink);font-weight:600}
.list-row .lead{font-size:10px;font-weight:700}
.list-row .grow > span{display:block}
.list-row .title{word-break:break-all;white-space:normal}
.table tr.flag td{background:var(--ome-err-soft);color:var(--ome-err-ink)}
.table tr.flag td:nth-child(5){font-weight:700}
.note{border-radius:var(--ome-radius-lg);padding:15px 18px;font-size:var(--ome-fs-sm);
  background:var(--ome-warn-soft);color:var(--ome-warn-ink);border:1px solid var(--ome-warn)}
.note.err{background:var(--ome-err-soft);color:var(--ome-err-ink);border-color:var(--ome-err)}
.note strong{display:block;margin-bottom:4px;font-weight:600}
</style>
</head>

        <span id="driveBtnLabel">บันทึกไฟล์ขึ้น Google Drive</span>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initDrive()"></script>
<script>
// ฐาน path — ทำงานได้ทั้ง /My-Web-App/ และ root
const BASE = location.pathname.replace(/[^/]*$/, '');

// หา tools.json โดยลองหลายชื่อโฟลเดอร์ — ไม่ผูกกับชื่อ tools/ หรือ tool/
const TOOL_DIRS = ['tools/', 'tool/', 'assets/tools/', ''];
let TOOLBASE = null;
async function loadManifest(){
  const tried = [];
  for (const d of TOOL_DIRS){
    const url = BASE + d + 'tools.json?v=' + Date.now();
    tried.push(url);
    try{
      const r = await fetch(url);
      if (r.ok){ TOOLBASE = BASE + d; return await r.json(); }
    }catch(e){ /* ลองตัวถัดไป */ }
  }
  throw new Error('ไม่พบ tools.json — ลองแล้วที่: ' + tried.join(' , '));
}

const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const HOME = '/home/pyodide';
const NOCACHE = '?v=' + Date.now();   // กันเบราว์เซอร์/CDN ใช้ไฟล์เก่า
const $ = id => document.getElementById(id);
const logEl = $('log');
let pyodide = null, tool = null, ready = false, inBytes = null, inName = null;

function log(msg, cls){
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = msg + '\n';
  logEl.appendChild(s); logEl.scrollTop = logEl.scrollHeight;
}
const pyline = t => log(t,
  /❌|⛔|Error|Traceback/.test(t) ? 'err' :
  /⚠️/.test(t) ? 'warn' :
  /✅|🖼️/.test(t) ? 'ok' : '');
function stage(n, state){
  document.querySelectorAll('.stn').forEach(el=>{
    const i = +el.dataset.s;
    el.classList.remove('on','done','fail');
    if (i < n) el.classList.add('done'); else if (i === n) el.classList.add(state || 'on');
  });
  $('fill').style.width = (n/5*88) + '%';
}
const setStatus = t => $('status').textContent = t;
function fail(title, msg){
  const n = document.createElement('div');
  n.className = 'note err';
  n.innerHTML = '<strong>' + esc(title) + '</strong>' + esc(msg);
  $('result').classList.add('show'); $('files').innerHTML = '';
  $('files').appendChild(n);
}

async function boot(){
  const id = new URLSearchParams(location.search).get('tool');
  try{
    const cfg = await loadManifest();
    tool = cfg.tools.find(t => t.id === id) || cfg.tools[0];
    if (!tool) throw new Error('ไม่พบเครื่องมือ');
  }catch(e){
    $('title').textContent = 'ไม่พบเครื่องมือ';
    $('desc').hidden = false;
    $('desc').innerHTML = 'ตรวจว่ามีไฟล์ <code>tools.json</code> และมีรายการ id นี้อยู่ — ' + esc(e.message);
    setStatus('หยุดทำงาน'); stage(0,'fail'); return;
  }

  driveExtrasAllowed = (tool.id === 'est-cost');
  applyDriveVisibility();

  document.title = tool.name + ' | AMR Asia';
  $('title').textContent = tool.name;
  $('file').accept = tool.accept || '';
  if (tool.hasCheck) $('check').hidden = false;

  try{
    stage(0);
    log('โหลด Python runtime (ครั้งแรกใช้เวลาสักครู่)…', 'dim');
    pyodide = await loadPyodide({indexURL: PYODIDE});
    pyodide.setStdout({batched: pyline});
    pyodide.setStderr({batched: t => log(t,'err')});

    if (tool.packages && tool.packages.length){
      await pyodide.loadPackage('micropip');
      const mp = pyodide.pyimport('micropip');
      for (const p of tool.packages){
        try{
          log('ติดตั้ง ' + p + '…', 'dim');
          await mp.install(p);
        }catch(e){
          log('ติดตั้ง ' + p + ' ไม่สำเร็จ: ' + (e.message || e), 'warn');
        }
      }
    }

    stage(1); setStatus('กำลังโหลดสูตรคำนวณ…');
    // ไฟล์ที่ขาดไม่ได้ — โมดูล Python และ template
    for (const f of [...(tool.modules||[]), ...(tool.assets||[])]){
      const r = await fetch(TOOLBASE + tool.dir + f + NOCACHE);
      if (!r.ok) throw new Error('โหลด ' + f + ' ไม่ได้ (HTTP ' + r.status + ') — ตรวจว่าไฟล์อยู่ใน ' + TOOLBASE + tool.dir);
      pyodide.FS.writeFile(HOME + '/' + f, new Uint8Array(await r.arrayBuffer()));
    }
    // ไฟล์เสริม (เช่น ฟอนต์) — ขาดได้ แค่เตือน ไม่หยุดทำงาน
    for (const f of (tool.optionalAssets||[])){
      try{
        const r = await fetch(TOOLBASE + tool.dir + f + NOCACHE);
        if (r.ok) pyodide.FS.writeFile(HOME + '/' + f, new Uint8Array(await r.arrayBuffer()));
        else log('ไม่มีไฟล์เสริม ' + f + ' — ทำงานต่อได้ แต่ข้อความไทยในภาพอาจไม่สวย', 'warn');
      }catch(e){ log('ข้ามไฟล์เสริม ' + f, 'dim'); }
    }
    await pyodide.runPythonAsync(
      'import sys, os\nos.chdir("' + HOME + '")\nsys.path.insert(0, "' + HOME + '")\nimport tool_run\n');

    ready = true; stage(1,'done');
    setStatus('พร้อมใช้งาน — เลือกไฟล์ข้อมูล');
    log('พร้อมใช้งาน', 'ok');
    enable();
  }catch(e){
    stage(0,'fail'); setStatus('เตรียมระบบไม่สำเร็จ');
    log(String(e.message || e), 'err');
    fail('เตรียมระบบไม่สำเร็จ', String(e.message || e));
  }
}
function enable(){
  if (ready && inBytes){ $('run').disabled = false; $('check').disabled = false; }
}

const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', ()=>fileInput.click());
drop.addEventListener('keydown', e=>{
  if (e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); }});
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) take(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) take(e.target.files[0]); });

async function take(f){
  const ext = (tool.accept || '').toLowerCase();
  if (ext && !f.name.toLowerCase().endsWith(ext)){
    $('dropHint').textContent = 'ต้องเป็นไฟล์ ' + ext + ' เท่านั้น'; return;
  }
  inName = f.name; inBytes = new Uint8Array(await f.arrayBuffer());
  drop.classList.add('has');
  $('dropMain').innerHTML = '<span class="file-name">' + esc(f.name) + '</span>';
  $('dropHint').textContent = (f.size/1024).toFixed(0) + ' KB';
  enable();
  updateCmpBtnState();
}

$('check').addEventListener('click', async ()=>{
  logEl.innerHTML = '';
  pyodide.FS.writeFile(HOME + '/' + inName, inBytes);
  log('ตรวจ ' + inName, 'dim');
  try{
    await pyodide.runPythonAsync(
      'import importlib, tool_run\nimportlib.reload(tool_run)\n' +
      'e, w = tool_run.check(' + JSON.stringify(inName) + ')\n' +
      'for x in w: print(" " + x)\n' +
      'for x in e: print(" " + x)\n' +
      'if not e and not w: print("ข้อมูลครบถ้วน")\n');
  }catch(e){ log(String(e), 'err'); }
});

$('run').addEventListener('click', async ()=>{
  $('run').disabled = true; $('check').disabled = true;
  logEl.innerHTML = ''; $('result').classList.remove('show'); $('files').innerHTML = '';
  try{
    pyodide.FS.writeFile(HOME + '/' + inName, inBytes);
    stage(2); setStatus('กำลังอ่านข้อมูล…');
    await new Promise(r=>setTimeout(r,40));
    stage(3); setStatus('กำลังคำนวณ…');
    await new Promise(r=>setTimeout(r,40));

    const res = await pyodide.runPythonAsync(
      'import importlib, shutil, os, tool_run\n' +
      'importlib.reload(tool_run)\n' +
      'shutil.rmtree("' + HOME + '/out", ignore_errors=True)\n' +
      'os.makedirs("' + HOME + '/out", exist_ok=True)\n' +
      'tool_run.run(' + JSON.stringify(inName) + ', "' + HOME + '/out")\n');

    stage(4); setStatus('กำลังเขียนไฟล์…');
    const paths = res.toJs(); res.destroy();
    if (!paths || !paths.length) throw new Error('ไม่มีไฟล์ผลลัพธ์ — ดูรายละเอียดในบันทึกการทำงาน');

    const list = document.createElement('div');
    list.className = 'list';
    $('files').appendChild(list);
    const TYPE = {xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                  svg:'image/svg+xml', pdf:'application/pdf', docx:
                  'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
    pendingUpload = [{ name: inName, blob: new Blob([inBytes], {type: TYPE.xlsx}), kind: 'estcost_input' }];
    paths.forEach((p,i)=>{
      const data = pyodide.FS.readFile(p);
      const name = p.split('/').pop();
      const ext = name.split('.').pop().toLowerCase();
      const blob = new Blob([data], {type: TYPE[ext] || 'application/octet-stream'});
      pendingUpload.push({ name, blob, kind: 'estcost_output' });
      const a = document.createElement('a');
      a.className = 'list-row'; a.href = URL.createObjectURL(blob); a.download = name;
      a.innerHTML = '<span class="lead">' + esc(ext.toUpperCase()) + '</span>' +
        '<span class="grow"><span class="title">' + esc(name) + '</span>' +
        '<span class="meta">' + (data.length/1024).toFixed(0) + ' KB' +
        (i===0 ? ' · ไฟล์หลัก' : '') + '</span></span>';
      list.appendChild(a);
      if (i===0) setTimeout(()=>a.click(), 350);
    });
    stage(5,'done'); $('fill').style.width='88%';
    setStatus('สร้างเอกสารเสร็จแล้ว'); $('result').classList.add('show');
    driveSetStatus('');
  }catch(e){
    stage(3,'fail'); setStatus('สร้างเอกสารไม่สำเร็จ');
    log(String(e.message || e), 'err');
    fail('สร้างเอกสารไม่สำเร็จ', 'ดูรายละเอียดในบันทึกการทำงานด้านบน แล้วแก้ไฟล์ข้อมูลก่อนลองใหม่');
  }finally{ $('run').disabled = false; $('check').disabled = false; }
});

// ── Google Drive (ไม่บังคับ) ───────────────────────────────────────────────
// วิธีเปิดใช้งาน:
//   1) https://console.cloud.google.com/ → สร้างหรือเลือกโปรเจกต์
//   2) APIs & Services → Library → เปิดใช้ "Google Drive API"
//   3) APIs & Services → OAuth consent screen → ตั้งค่าเบื้องต้น
//      (เลือก External ได้ถ้ายังไม่ verify — เพิ่มอีเมลตัวเองเป็น Test user ก็ใช้งานได้)
//   4) APIs & Services → Credentials → Create Credentials → OAuth client ID → Web application
//      ใส่ Authorized JavaScript origins = https://tanot713-sudo.github.io
//   5) คัดลอก Client ID (ลงท้ายด้วย .apps.googleusercontent.com) มาใส่ค่าด้านล่างนี้
//   ถ้าไม่ใส่ค่า ปุ่ม "บันทึกขึ้น Google Drive" จะซ่อนไปเอง ไม่กระทบการใช้งานส่วนอื่น
const DRIVE_CLIENT_ID = '497048581273-akpavakt6m34lhqbjf1irg3m8vl6u27u.apps.googleusercontent.com';
const DRIVE_FOLDER_NAME = 'AMR_EstCost';    // โฟลเดอร์ปลายทางใน Drive (สร้างอัตโนมัติถ้ายังไม่มี)
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

let driveTokenClient = null, driveAccessToken = null, driveFolderId = null, driveAuthPurpose = null;
let pendingUpload = [];   // [{name, blob, kind}] — เติมทุกครั้งที่สร้างเอกสารเสร็จ (ไฟล์ input + output)

function driveSetStatus(text, cls){
  const el = $('driveStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'drive-status' + (cls ? ' ' + cls : '');
}
function cmpSetStatus(text, cls){
  const el = $('cmpStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'drive-status' + (cls ? ' ' + cls : '');
}
function updateCmpBtnState(){
  const btn = $('cmpBtn');
  if (btn) btn.disabled = !inBytes;
}

// การ์ดเทียบข้อมูลเก่า/ประวัติ ผูกกับโฟลเดอร์ est-cost — โชว์เฉพาะเมื่อ (1) ตั้งค่า Drive แล้ว
// และ (2) เครื่องมือปัจจุบันคือ est-cost (เครื่องมืออื่นยังใช้ปุ่มบันทึกขึ้น Drive ได้ตามปกติ)
let driveReady = false, driveExtrasAllowed = null;
function applyDriveVisibility(){
  if (!driveReady) return;
  $('driveRow').hidden = false;
  const show = driveExtrasAllowed === true;
  $('cmpCard').hidden = !show;
  $('histCard').hidden = !show;
  if (show) updateCmpBtnState();
}

function initDrive(){
  if (!DRIVE_CLIENT_ID){
    // ยังไม่ได้ตั้งค่า Client ID — ซ่อนปุ่มไปเลย ไม่รบกวนคนที่ยังไม่ใช้ฟีเจอร์นี้
    return;
  }
  driveReady = true;
  applyDriveVisibility();
  if (!window.google || !google.accounts || !google.accounts.oauth2){
    driveSetStatus('โหลด Google Identity Services ไม่สำเร็จ', 'err');
    $('driveBtn').disabled = true;
    return;
  }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      const purpose = driveAuthPurpose; driveAuthPurpose = null;
      if (resp.error){
        (purpose === 'compare' ? cmpSetStatus : purpose === 'history' ? histSetStatus : driveSetStatus)('เชื่อมต่อไม่สำเร็จ: ' + resp.error, 'err');
        return;
      }
      driveAccessToken = resp.access_token;
      if (purpose === 'compare') await runCompare();
      else if (purpose === 'history') await renderHistory();
      else await uploadPendingToDrive();
    },
  });
}

async function ensureDriveFolder(){
  if (driveFolderId) return driveFolderId;
  const q = encodeURIComponent(
    `name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const listRes = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
    { headers: { Authorization: 'Bearer ' + driveAccessToken } });
  if (!listRes.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + listRes.status + ')');
  const listData = await listRes.json();
  if (listData.files && listData.files.length){
    driveFolderId = listData.files[0].id;
    return driveFolderId;
  }
  const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + driveAccessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
  const createData = await createRes.json();
  driveFolderId = createData.id;
  return driveFolderId;
}

async function uploadFileToDrive(name, blob, folderId, kind){
  const metadata = { name, parents: [folderId] };
  if (kind) metadata.properties = { kind };
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
  form.append('file', blob);
  const res = await fetch(
    'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',
    { method: 'POST', headers: { Authorization: 'Bearer ' + driveAccessToken }, body: form });
  if (!res.ok) throw new Error('อัปโหลด ' + name + ' ไม่สำเร็จ (HTTP ' + res.status + ')');
  return res.json();
}

async function uploadPendingToDrive(){
  if (!pendingUpload.length){
    driveSetStatus('ยังไม่มีไฟล์ให้บันทึก — สร้างเอกสารก่อน', 'err');
    return;
  }
  $('driveBtn').disabled = true;
  driveSetStatus('กำลังเชื่อมต่อโฟลเดอร์…', '');
  try{
    const folderId = await ensureDriveFolder();
    let done = 0;
    for (const item of pendingUpload){
      driveSetStatus(`กำลังอัปโหลด (${done + 1}/${pendingUpload.length}) ${item.name}…`, '');
      await uploadFileToDrive(item.name, item.blob, folderId, item.kind);
      done++;
    }
    driveSetStatus(`บันทึกขึ้น Google Drive แล้ว ${done} ไฟล์ (โฟลเดอร์ "${DRIVE_FOLDER_NAME}")`, 'ok');
  }catch(e){
    driveSetStatus('' + (e.message || e), 'err');
  }finally{
    $('driveBtn').disabled = false;
  }
}

$('driveBtn')?.addEventListener('click', () => {
  if (!driveTokenClient){ driveSetStatus('ยังไม่ได้ตั้งค่า Google Drive สำหรับเครื่องมือนี้', 'err'); return; }
  if (!pendingUpload.length){ driveSetStatus('ยังไม่มีไฟล์ให้บันทึก — สร้างเอกสารก่อน', 'err'); return; }
  driveAuthPurpose = 'upload';
  driveTokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
});

// ── เทียบกับข้อมูลเก่า (ใช้ไฟล์ input เก่าที่เคยบันทึกขึ้นโฟลเดอร์ Drive เดียวกัน) ──────
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function listHistoryInputFiles(folderId){
  const q = encodeURIComponent(
    `'${folderId}' in parents and trashed=false and properties has { key='kind' and value='estcost_input' }`);
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=20`,
    { headers: { Authorization: 'Bearer ' + driveAccessToken } });
  if (!res.ok) throw new Error('ค้นหาไฟล์เก่าไม่สำเร็จ (HTTP ' + res.status + ')');
  const data = await res.json();
  return data.files || [];
}

async function downloadDriveFileBytes(fileId){
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
    { headers: { Authorization: 'Bearer ' + driveAccessToken } });
  if (!res.ok) throw new Error('ดาวน์โหลดไฟล์เก่าไม่สำเร็จ (HTTP ' + res.status + ')');
  return new Uint8Array(await res.arrayBuffer());
}

function renderCompare(rows, fileCount){
  if (!rows || !rows.length){
    cmpSetStatus(`เทียบกับไฟล์เก่า ${fileCount} ไฟล์แล้ว — ไม่พบรหัสอุปกรณ์ที่ตรงกันในประวัติ`, '');
    $('cmpResult').innerHTML = '';
    return;
  }
  const flagged = rows.filter(r => r.flag).length;
  cmpSetStatus(
    `เทียบกับไฟล์เก่า ${fileCount} ไฟล์ — พบอุปกรณ์ที่มีประวัติ ${rows.length} รายการ` +
    (flagged ? `, ผิดปกติ ${flagged} รายการ (ต่างจากค่าเฉลี่ยเก่าเกิน 25%)` : ', ไม่พบความผิดปกติ'),
    flagged ? 'err' : 'ok');
  let html = '<div class="table-wrap"><table class="table"><thead><tr>' +
    '<th>รหัส</th><th>ชื่ออุปกรณ์</th><th>ชม./ปี (ไฟล์นี้)</th><th>ชม./ปี เฉลี่ยเก่า</th><th>ต่าง</th><th>จำนวนไฟล์เก่า</th>' +
    '</tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr class="${r.flag ? 'flag' : ''}">` +
      `<td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="num">${r.current_hours}</td>` +
      `<td class="num">${r.history_avg_hours}</td><td class="num">${r.deviation_pct > 0 ? '+' : ''}${r.deviation_pct}%</td>` +
      `<td class="num">${r.history_n}</td></tr>`;
  });
  html += '</tbody></table></div>';
  $('cmpResult').innerHTML = html;
}

async function runCompare(){
  if (!inBytes){ cmpSetStatus('เลือกไฟล์ข้อมูลก่อน', 'err'); return; }
  if (!ready){ cmpSetStatus('ระบบยังไม่พร้อม รอสักครู่แล้วลองใหม่', 'err'); return; }
  $('cmpBtn').disabled = true;
  $('cmpResult').innerHTML = '';
  cmpSetStatus('กำลังค้นหาไฟล์เก่าใน Google Drive…', '');
  try{
    const folderId = await ensureDriveFolder();
    const files = await listHistoryInputFiles(folderId);
    if (!files.length){
      cmpSetStatus('ยังไม่มีไฟล์ข้อมูลเก่าใน Drive ให้เทียบ (จะมีข้อมูลหลังบันทึกไฟล์ input ขึ้น Drive ในครั้งต่อๆ ไป)', '');
      return;
    }
    pyodide.FS.writeFile(HOME + '/' + inName, inBytes);
    const histArgs = [];
    for (let n = 0; n < files.length; n++){
      const f = files[n];
      cmpSetStatus(`กำลังโหลดไฟล์เก่า (${n + 1}/${files.length}) ${f.name}…`, '');
      const bytes = await downloadDriveFileBytes(f.id);
      const fsPath = HOME + '/hist_' + n + '.xlsx';
      pyodide.FS.writeFile(fsPath, bytes);
      histArgs.push([f.name, fsPath]);
    }
    cmpSetStatus('กำลังเปรียบเทียบ…', '');
    const res = await pyodide.runPythonAsync(
      'import importlib, tool_run\nimportlib.reload(tool_run)\n' +
      'tool_run.compare(' + JSON.stringify(inName) + ', ' + JSON.stringify(histArgs) + ')\n');
    const rows = res.toJs({dict_converter: Object.fromEntries});
    res.destroy();
    renderCompare(rows, files.length);
  }catch(e){
    cmpSetStatus('' + (e.message || e), 'err');
  }finally{
    $('cmpBtn').disabled = false;
  }
}

$('cmpBtn')?.addEventListener('click', () => {
  if (!inBytes){ cmpSetStatus('เลือกไฟล์ข้อมูลก่อน', 'err'); return; }
  if (!driveTokenClient){ cmpSetStatus('ยังไม่ได้ตั้งค่า Google Drive สำหรับเครื่องมือนี้', 'err'); return; }
  if (driveAccessToken){ runCompare(); return; }
  driveAuthPurpose = 'compare';
  driveTokenClient.requestAccessToken({ prompt: 'consent' });
});

// ── ประวัติการรันจาก Google Drive ──────────────────────────────────────────
let histFiles = [];

function histSetStatus(text, cls){
  const el = $('histStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'drive-status' + (cls ? ' ' + cls : '');
}

async function fetchHistoryFiles(){
  const folderId = await ensureDriveFolder();
  const q = encodeURIComponent(
    `'${folderId}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`);
  const res = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=30&fields=files(id,name,modifiedTime,properties)`,
    { headers: { Authorization: 'Bearer ' + driveAccessToken } });
  if (!res.ok) throw new Error('โหลดประวัติไม่สำเร็จ (HTTP ' + res.status + ')');
  return (await res.json()).files || [];
}

async function renderHistory(){
  $('histBtn').disabled = true;
  histSetStatus('กำลังโหลดประวัติ…', '');
  try{
    histFiles = await fetchHistoryFiles();
    if (!histFiles.length){
      histSetStatus('ยังไม่มีไฟล์ในโฟลเดอร์ "' + DRIVE_FOLDER_NAME + '" — บันทึกผลการรันขึ้น Drive ก่อน แล้วประวัติจะโผล่ที่นี่', '');
      $('histList').innerHTML = '';
      return;
    }
    histSetStatus(`ไฟล์ล่าสุด ${histFiles.length} รายการในโฟลเดอร์ "${DRIVE_FOLDER_NAME}"`, 'ok');
    let html = '<div class="table-wrap"><table class="table"><thead><tr><th>ไฟล์</th><th>ชนิด</th><th>บันทึกเมื่อ</th><th></th></tr></thead><tbody>';
    histFiles.forEach((f, i) => {
      const kind = f.properties && f.properties.kind;
      const badge = kind === 'estcost_input' ? 'ไฟล์ข้อมูล' : kind === 'estcost_output' ? 'ผลลัพธ์' : '—';
      html += `<tr><td>${esc(f.name)}</td><td>${badge}</td>` +
        `<td>${new Date(f.modifiedTime).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })}</td><td>` +
        `<button class="hist-act btn sm" data-act="dl" data-i="${i}">ดาวน์โหลด</button>` +
        (kind === 'estcost_input' ? ` <button class="hist-act btn sm" data-act="use" data-i="${i}">ใช้เป็นไฟล์ตั้งต้น</button>` : '') +
        `</td></tr>`;
    });
    html += '</tbody></table></div>';
    $('histList').innerHTML = html;
  }catch(e){
    histSetStatus('' + (e.message || e), 'err');
  }finally{
    $('histBtn').disabled = false;
  }
}

$('histBtn')?.addEventListener('click', () => {
  if (!driveTokenClient){ histSetStatus('ยังไม่ได้ตั้งค่า Google Drive สำหรับเครื่องมือนี้', 'err'); return; }
  if (driveAccessToken){ renderHistory(); return; }
  driveAuthPurpose = 'history';
  driveTokenClient.requestAccessToken({ prompt: 'consent' });
});

$('histList')?.addEventListener('click', async (ev) => {
  const btn = ev.target.closest('.hist-act');
  if (!btn) return;
  const f = histFiles[+btn.dataset.i];
  if (!f) return;
  btn.disabled = true;
  try{
    const bytes = await downloadDriveFileBytes(f.id);
    if (btn.dataset.act === 'dl'){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([bytes]));
      a.download = f.name;
      a.click();
    }else{
      inName = f.name; inBytes = bytes;
      drop.classList.add('has');
      $('dropMain').innerHTML = '<span class="file-name">' + esc(f.name) + '</span>';
      $('dropHint').textContent = (bytes.length / 1024).toFixed(0) + ' KB · จาก Google Drive';
      enable();
      updateCmpBtnState();
      histSetStatus('ตั้ง "' + f.name + '" เป็นไฟล์ข้อมูลแล้ว', 'ok');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }catch(e){
    histSetStatus('' + (e.message || e), 'err');
  }finally{
    btn.disabled = false;
  }
});

boot();
</script>
