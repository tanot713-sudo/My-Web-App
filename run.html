<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องมืองานเอกสาร | AMR Asia</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --brand:#12A594; --brand-dk:#0B7F72; --brand-sf:#E7F6F4;
  --violet:#6C63D9; --amber:#F5A524; --rose:#EC5E8A; --sky:#3B9BEA;
  --ok:#17B26A; --warn:#E08700; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto}

.crumb{padding:24px 0 0;font-size:13px;color:var(--muted)}
.crumb a{color:var(--brand);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}

/* ── หัวเรื่องแบบไล่สี ── */
.hero{margin-top:18px;border-radius:22px;padding:34px 34px 30px;
  background:linear-gradient(120deg,#EAF4FF 0%,#F1EDFF 42%,#FFEDF4 100%);
  position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.45)}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--brand-dk);font-weight:600;margin-bottom:8px}
h1{font-size:clamp(24px,4.4vw,34px);font-weight:700;letter-spacing:-.01em;line-height:1.3;position:relative}
.sub{margin-top:10px;color:#5A6479;max-width:56ch;font-size:14.5px;position:relative}

/* ── แถบสถานะ ── */
.line{margin:26px 0 4px;position:relative;padding:20px 0 2px}
.track,.track-fill{position:absolute;top:32px;height:4px;border-radius:3px}
.track{left:7%;right:7%;background:#E4E8F2}
.track-fill{left:7%;width:0;background:linear-gradient(90deg,var(--sky),var(--brand));
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.stations{display:flex;justify-content:space-between;position:relative}
.stn{flex:1;text-align:center}
.dot{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #DDE2EE;
  margin:4px auto 10px;transition:all .3s ease;position:relative;z-index:2}
.stn.on .dot{border-color:var(--brand);box-shadow:0 0 0 6px var(--brand-sf)}
.stn.on .dot::after{content:'';position:absolute;inset:2px;border-radius:50%;
  background:var(--brand);animation:pulse 1.3s ease-in-out infinite}
.stn.done .dot{border-color:var(--ok);background:var(--ok)}
.stn.fail .dot{border-color:var(--err);background:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stn-label{font-size:11.5px;color:var(--muted);font-weight:400}
.stn.on .stn-label,.stn.done .stn-label{color:var(--ink);font-weight:600}
@media(prefers-reduced-motion:reduce){.stn.on .dot::after{animation:none}.track-fill{transition:none}}
.status{text-align:center;font-size:13.5px;color:var(--muted);margin-top:2px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:26px;margin-top:18px}
.card h2{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.card h2 .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:#fff;font-size:13px;flex-shrink:0}

/* ── ช่องวางไฟล์ ── */
.drop{border:2px dashed #D7DCEA;border-radius:14px;padding:40px 24px;text-align:center;
  cursor:pointer;transition:.2s;background:#FBFCFF}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-sf)}
.drop:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.drop.has{border-style:solid;border-color:var(--ok);background:#F1FBF6}
.drop-icon{color:var(--brand);margin-bottom:10px}
.drop-main{font-weight:600;font-size:16px}
.drop-hint{font-size:13px;color:var(--muted);margin-top:6px}
.file-name{font-size:14.5px;color:var(--brand-dk);word-break:break-all;font-weight:500}

.btn{font-family:var(--f);font-size:15px;font-weight:600;padding:13px 26px;border:none;
  border-radius:12px;cursor:pointer;background:var(--brand);color:#fff;transition:.18s;
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(18,165,148,.28)}
.btn:hover:not(:disabled){background:var(--brand-dk);transform:translateY(-1px)}
.btn:disabled{background:#C3CAD9;box-shadow:none;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--bg);border-color:#D2D8E6}
.btn-row{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}

.log{font-family:ui-monospace,'Cascadia Code',Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:#1B2030;color:#C2CBDD;padding:18px 20px;border-radius:12px;max-height:320px;
  overflow-y:auto;white-space:pre-wrap;word-break:break-word}
.log:empty::before{content:'รอเริ่มทำงาน…';color:#5D6884}
.log .ok{color:#5EE0A4}.log .warn{color:#F5C35C}.log .err{color:#FF8A87}.log .dim{color:#7C87A3}

.result{display:none}.result.show{display:block}
.dl{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1.5px solid var(--line);
  border-radius:12px;margin-bottom:9px;text-decoration:none;color:var(--ink);transition:.18s}
.dl:hover{border-color:var(--brand);background:var(--brand-sf);transform:translateX(2px)}
.dl:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.dl-ico{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--ok);color:#fff;
  display:grid;place-items:center;font-size:10px;font-weight:600}
.dl-ico.svg{background:var(--violet)}.dl-ico.png{background:var(--sky)}
.dl-name{font-weight:600;font-size:14.5px;word-break:break-all}
.dl-meta{font-size:12px;color:var(--muted)}

.note{border-radius:12px;background:#FFF8EC;padding:15px 18px;font-size:13.5px;
  color:#6B4A0F;margin-top:16px;border:1px solid #FBE7C2}
.note.err{background:#FFF1F1;color:#9B2C2C;border-color:#F8D4D4}
.note strong{display:block;margin-bottom:4px;font-weight:600}
.note ul{margin:6px 0 0 18px}.note li{margin-bottom:3px}
footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
code{font-size:.9em;background:#EFF2F8;padding:2px 6px;border-radius:6px}
@media(max-width:600px){
  body{padding:0 14px 60px}.card{padding:20px}.hero{padding:26px 22px}
  .stn-label{font-size:10px}.track,.track-fill{left:9%;right:9%}
}
</style>
</head>
<body>
<div class="wrap">

<nav class="crumb"><a href="./">หน้าแรก</a><span class="sep">/</span><a href="documents.html">งานเอกสาร</a><span class="sep">/</span><span id="crumbName">…</span></nav>

<div class="hero">
  <div class="eyebrow" id="scope">AMR Asia</div>
  <h1 id="title">กำลังโหลด…</h1>
  <p class="sub" id="desc"></p>
</div>

<div class="line" aria-hidden="true">
  <div class="track"></div><div class="track-fill" id="fill"></div>
  <div class="stations">
    <div class="stn" data-s="0"><div class="dot"></div><div class="stn-label">เตรียมระบบ</div></div>
    <div class="stn" data-s="1"><div class="dot"></div><div class="stn-label">โหลดสูตร</div></div>
    <div class="stn" data-s="2"><div class="dot"></div><div class="stn-label">อ่านข้อมูล</div></div>
    <div class="stn" data-s="3"><div class="dot"></div><div class="stn-label">คำนวณ</div></div>
    <div class="stn" data-s="4"><div class="dot"></div><div class="stn-label">เขียนไฟล์</div></div>
    <div class="stn" data-s="5"><div class="dot"></div><div class="stn-label">เสร็จ</div></div>
  </div>
</div>
<p class="status" id="status" role="status" aria-live="polite">กำลังเตรียมระบบ…</p>

<div class="card">
  <h2><span class="ic" style="background:var(--sky)">1</span>ไฟล์ข้อมูล</h2>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="เลือกไฟล์ข้อมูล">
    <div class="drop-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/>
        <path d="M3 15v3a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-3"/>
      </svg>
    </div>
    <div class="drop-main" id="dropMain">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</div>
    <div class="drop-hint" id="dropHint"></div>
  </div>
  <input type="file" id="file" hidden>
  <div class="btn-row">
    <button class="btn" id="run" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span id="runLabel">สร้างเอกสาร</span>
    </button>
    <button class="btn ghost" id="check" disabled hidden>ตรวจข้อมูลก่อน</button>
  </div>
</div>

<div class="card"><h2><span class="ic" style="background:var(--violet)">2</span>บันทึกการทำงาน</h2><div class="log" id="log"></div></div>

<div class="card result" id="result">
  <h2><span class="ic" style="background:var(--ok)">3</span>ไฟล์ที่ได้</h2>
  <div id="files"></div>
  <div class="note" id="notes" hidden></div>
</div>

<footer>ทำงานในเบราว์เซอร์ของคุณทั้งหมด — ไฟล์ไม่ถูกส่งขึ้นเซิร์ฟเวอร์ใด</footer>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// ฐาน path — ทำงานได้ทั้ง /My-Web-App/ และ root
const BASE = location.pathname.replace(/[^/]*$/, '');

// หา tools.json โดยลองหลายชื่อโฟลเดอร์ — ไม่ผูกกับชื่อ tools/ หรือ tool/
const TOOL_DIRS = ['tools/', 'tool/', 'assets/tools/', ''];
let TOOLBASE = null;
async function loadManifest(){
  const tried = [];
  for (const d of TOOL_DIRS){
    const url = BASE + d + 'tools.json';
    tried.push(url);
    try{
      const r = await fetch(url);
      if (r.ok){ TOOLBASE = BASE + d; return await r.json(); }
    }catch(e){ /* ลองตัวถัดไป */ }
  }
  throw new Error('ไม่พบ tools.json — ลองแล้วที่: ' + tried.join(' , '));
}

const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const HOME = '/home/pyodide';
const NOCACHE = '?v=' + Date.now();   // กันเบราว์เซอร์/CDN ใช้ไฟล์เก่า
const $ = id => document.getElementById(id);
const logEl = $('log');
let pyodide = null, tool = null, ready = false, inBytes = null, inName = null;

function log(msg, cls){
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = msg + '\n';
  logEl.appendChild(s); logEl.scrollTop = logEl.scrollHeight;
}
const pyline = t => log(t,
  /❌|⛔|Error|Traceback/.test(t) ? 'err' :
  /⚠️/.test(t) ? 'warn' :
  /✅|🖼️/.test(t) ? 'ok' : '');
function stage(n, state){
  document.querySelectorAll('.stn').forEach(el=>{
    const i = +el.dataset.s;
    el.classList.remove('on','done','fail');
    if (i < n) el.classList.add('done'); else if (i === n) el.classList.add(state || 'on');
  });
  $('fill').style.width = (n/5*88) + '%';
}
const setStatus = t => $('status').textContent = t;
function fail(title, msg){
  const n = document.createElement('div');
  n.className = 'note err';
  n.innerHTML = '<strong>' + title + '</strong>' + msg;
  $('result').classList.add('show'); $('files').innerHTML = '';
  $('files').appendChild(n); $('notes').hidden = true;
}

async function boot(){
  const id = new URLSearchParams(location.search).get('tool');
  try{
    const cfg = await loadManifest();
    tool = cfg.tools.find(t => t.id === id) || cfg.tools[0];
    if (!tool) throw new Error('ไม่พบเครื่องมือ');
  }catch(e){
    $('title').textContent = 'ไม่พบเครื่องมือ';
    $('desc').innerHTML = 'ตรวจว่ามีไฟล์ <code>tools.json</code> และมีรายการ id นี้อยู่ — ' + e.message;
    setStatus('หยุดทำงาน'); stage(0,'fail'); return;
  }

  document.title = tool.name + ' | AMR Asia';
  $('crumbName').textContent = tool.name;
  $('title').textContent = tool.name;
  $('desc').textContent = tool.desc || '';
  $('scope').textContent = 'AMR Asia · ' + (tool.scope || 'งานเอกสาร');
  $('dropHint').innerHTML = 'ไฟล์ <code>' + (tool.inputName || tool.accept) + '</code>' +
    (tool.inputHint ? ' — ' + tool.inputHint : '');
  $('file').accept = tool.accept || '';
  if (tool.hasCheck) $('check').hidden = false;
  if (tool.notes && tool.notes.length){
    $('notes').hidden = false;
    $('notes').innerHTML = '<strong>ตรวจก่อนนำไปใช้</strong><ul>' +
      tool.notes.map(n => '<li>' + n + '</li>').join('') + '</ul>';
  }

  try{
    stage(0);
    log('โหลด Python runtime (ครั้งแรกใช้เวลาสักครู่)…', 'dim');
    pyodide = await loadPyodide({indexURL: PYODIDE});
    pyodide.setStdout({batched: pyline});
    pyodide.setStderr({batched: t => log(t,'err')});

    if (tool.packages && tool.packages.length){
      log('ติดตั้ง ' + tool.packages.join(', ') + '…', 'dim');
      await pyodide.loadPackage('micropip');
      const mp = pyodide.pyimport('micropip');
      for (const p of tool.packages) await mp.install(p);
    }

    stage(1); setStatus('กำลังโหลดสูตรคำนวณ…');
    for (const f of [...(tool.modules||[]), ...(tool.assets||[])]){
      const r = await fetch(TOOLBASE + tool.dir + f + NOCACHE);
      if (!r.ok) throw new Error('โหลด ' + f + ' ไม่ได้ (HTTP ' + r.status + ') — ตรวจว่าไฟล์อยู่ใน ' + tool.dir);
      pyodide.FS.writeFile(HOME + '/' + f, new Uint8Array(await r.arrayBuffer()));
    }
    await pyodide.runPythonAsync(
      'import sys, os\nos.chdir("' + HOME + '")\nsys.path.insert(0, "' + HOME + '")\nimport tool_run\n');

    ready = true; stage(1,'done');
    setStatus('พร้อมใช้งาน — เลือกไฟล์ข้อมูล');
    log('พร้อมใช้งาน', 'ok');
    enable();
  }catch(e){
    stage(0,'fail'); setStatus('เตรียมระบบไม่สำเร็จ');
    log(String(e.message || e), 'err');
    fail('เตรียมระบบไม่สำเร็จ', String(e.message || e));
  }
}
function enable(){
  if (ready && inBytes){ $('run').disabled = false; $('check').disabled = false; }
}

const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', ()=>fileInput.click());
drop.addEventListener('keydown', e=>{
  if (e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); }});
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev, e=>{e.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', e=>{ if(e.dataTransfer.files[0]) take(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) take(e.target.files[0]); });

async function take(f){
  const ext = (tool.accept || '').toLowerCase();
  if (ext && !f.name.toLowerCase().endsWith(ext)){
    $('dropHint').textContent = 'ต้องเป็นไฟล์ ' + ext + ' เท่านั้น'; return;
  }
  inName = f.name; inBytes = new Uint8Array(await f.arrayBuffer());
  drop.classList.add('has');
  $('dropMain').innerHTML = '<span class="file-name">' + f.name + '</span>';
  $('dropHint').textContent = (f.size/1024).toFixed(0) + ' KB — คลิกเพื่อเปลี่ยนไฟล์';
  enable();
}

$('check').addEventListener('click', async ()=>{
  logEl.innerHTML = '';
  pyodide.FS.writeFile(HOME + '/' + inName, inBytes);
  log('ตรวจ ' + inName, 'dim');
  try{
    await pyodide.runPythonAsync(
      'import importlib, tool_run\nimportlib.reload(tool_run)\n' +
      'e, w = tool_run.check(' + JSON.stringify(inName) + ')\n' +
      'for x in w: print("⚠️ " + x)\n' +
      'for x in e: print("❌ " + x)\n' +
      'if not e and not w: print("✅ ข้อมูลครบถ้วน")\n');
  }catch(e){ log(String(e), 'err'); }
});

$('run').addEventListener('click', async ()=>{
  $('run').disabled = true; $('check').disabled = true;
  logEl.innerHTML = ''; $('result').classList.remove('show'); $('files').innerHTML = '';
  try{
    pyodide.FS.writeFile(HOME + '/' + inName, inBytes);
    stage(2); setStatus('กำลังอ่านข้อมูล…');
    await new Promise(r=>setTimeout(r,40));
    stage(3); setStatus('กำลังคำนวณ…');
    await new Promise(r=>setTimeout(r,40));

    const res = await pyodide.runPythonAsync(
      'import importlib, shutil, os, tool_run\n' +
      'importlib.reload(tool_run)\n' +
      'shutil.rmtree("' + HOME + '/out", ignore_errors=True)\n' +
      'os.makedirs("' + HOME + '/out", exist_ok=True)\n' +
      'tool_run.run(' + JSON.stringify(inName) + ', "' + HOME + '/out")\n');

    stage(4); setStatus('กำลังเขียนไฟล์…');
    const paths = res.toJs(); res.destroy();
    if (!paths || !paths.length) throw new Error('ไม่มีไฟล์ผลลัพธ์ — ดูรายละเอียดในบันทึกการทำงาน');

    const TYPE = {xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                  svg:'image/svg+xml', pdf:'application/pdf', docx:
                  'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
    paths.forEach((p,i)=>{
      const data = pyodide.FS.readFile(p);
      const name = p.split('/').pop();
      const ext = name.split('.').pop().toLowerCase();
      const blob = new Blob([data], {type: TYPE[ext] || 'application/octet-stream'});
      const a = document.createElement('a');
      a.className = 'dl'; a.href = URL.createObjectURL(blob); a.download = name;
      a.innerHTML = '<span class="dl-ico' + (ext==='svg'?' svg':ext==='png'?' png':'') + '">' + ext.toUpperCase() + '</span>' +
        '<span><span class="dl-name">' + name + '</span><br>' +
        '<span class="dl-meta">' + (data.length/1024).toFixed(0) + ' KB' +
        (i===0 ? ' · ไฟล์หลัก' : '') + '</span></span>';
      $('files').appendChild(a);
      if (i===0) setTimeout(()=>a.click(), 350);
    });
    stage(5,'done'); $('fill').style.width='88%';
    setStatus('สร้างเอกสารเสร็จแล้ว'); $('result').classList.add('show');
  }catch(e){
    stage(3,'fail'); setStatus('สร้างเอกสารไม่สำเร็จ');
    log(String(e.message || e), 'err');
    fail('สร้างเอกสารไม่สำเร็จ', 'ดูรายละเอียดในบันทึกการทำงานด้านบน แล้วแก้ไฟล์ข้อมูลก่อนลองใหม่');
  }finally{ $('run').disabled = false; $('check').disabled = false; }
});

boot();
</script>
</body>
</html>
