<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="health.title">สุขภาพ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="chart-theme.js" defer></script>
<script src="health-calc.js" defer></script>
<script src="tanot-push.js" defer></script>
<script src="health.js" defer></script>
<style>
.hl-page .card > .card-head{margin-bottom:var(--ome-sp-3)}
.hl-page .kpi .row{justify-content:space-between;min-height:22px}
.hl-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ome-sp-3)}
.hl-form .wide{grid-column:1 / -1}
.hl-form .actions{display:flex;gap:8px;flex-wrap:wrap}
.hl-form .actions .grow{flex:1}
.hl-chart svg{display:block;width:100%;height:auto}
.hl-chart .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--ome-fs-xs);color:var(--ome-text-2);margin-top:6px}
.hl-chart .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.hl-list .list-row .meta{white-space:normal}
.hl-list .vbadges{margin-top:4px}
.hl-list .list-row.done .title{color:var(--ome-text-2);text-decoration:line-through}
.hl-list .num{font-variant-numeric:tabular-nums}
.hl-labs{display:flex;flex-direction:column;gap:8px}
.hl-lab{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.hl-lab .input{min-width:0;font-size:var(--ome-fs-sm)}
@media (max-width:640px){
  .hl-lab{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hl-lab .nm{grid-column:1 / -1}
  .hl-lab .rm{grid-column:4;justify-self:end}
}
.hl-times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hl-time{display:inline-flex;align-items:center;gap:4px}
.hl-time .input{width:auto}
.hl-work{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:var(--ome-sp-4)}
@media (max-width:820px){.hl-work{grid-template-columns:1fr}}
.hl-bar{height:8px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden;margin:var(--ome-sp-2) 0 var(--ome-sp-3)}
.hl-bar span{display:block;height:100%;width:0;background:var(--ome-accent);border-radius:inherit}
.hl-ranges{display:grid;grid-template-columns:minmax(0,1fr) 90px 90px;gap:8px;align-items:center}
.hl-ranges input{min-width:0}
[hidden]{display:none !important}
</style>
</head>
<body data-layout="dashboard">
<main class="page hl-page">
  <div class="page-head">
    <h1 data-i18n="health.h1">สุขภาพ</h1>
    <button class="btn icon" type="button" id="setBtn" aria-label="ตั้งค่า" data-i18n-attr="aria-label:health.settings"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-settings"/></svg></button>
  </div>

  <div class="grid">
    <div class="kpi-grid span-12" id="kpis"></div>

    <section class="card span-4" aria-labelledby="hVital">
      <div class="card-head"><h2 id="hVital">บันทึกสัญญาณชีพ</h2></div>
      <form class="hl-form" id="vForm" novalidate>
        <div class="field wide"><label for="vAt" data-i18n="health.vAt">วันเวลา</label><input id="vAt" type="datetime-local"></div>
        <div class="field"><label for="vWeight" data-i18n="health.vWeight">น้ำหนัก (กก.)</label><input id="vWeight" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field"><label for="vWaist" data-i18n="health.vWaist">รอบเอว (ซม.)</label><input id="vWaist" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field"><label for="vSys" data-i18n="health.vSys">ความดันตัวบน</label><input id="vSys" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field"><label for="vDia" data-i18n="health.vDia">ความดันตัวล่าง</label><input id="vDia" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field"><label for="vHr" data-i18n="health.vHr">ชีพจร (ครั้ง/นาที)</label><input id="vHr" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field"><label for="vGlu" data-i18n="health.vGlu">น้ำตาล (mg/dL)</label><input id="vGlu" type="number" inputmode="decimal" step="any" min="0"></div>
        <div class="field wide"><label for="vNote" data-i18n="health.note">บันทึก</label><input id="vNote" type="text" maxlength="200" autocomplete="off"></div>
        <p class="form-msg wide" id="vMsg" role="alert"></p>
        <div class="actions wide">
          <button class="btn primary grow" type="submit" id="vSave"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-save"/></svg><span>บันทึก</span></button>
          <button class="btn" type="button" id="vCancel" hidden data-i18n="health.cancel">ยกเลิก</button>
          <button class="btn danger" type="button" id="vDel" hidden data-i18n="health.del">ลบ</button>
        </div>
      </form>
    </section>

    <section class="card span-8" aria-labelledby="hTrend">
      <div class="card-head"><h2 id="hTrend" data-i18n="health.hTrend">แนวโน้ม</h2><select id="trendSel" class="select" aria-label="ค่าที่แสดง" data-i18n-attr="aria-label:health.metricShown" style="width:auto;max-width:60%"></select></div>
      <div class="hl-chart" id="chart"></div>
    </section>

    <section class="card span-6" aria-labelledby="hMeds">
      <div class="card-head"><h2 id="hMeds" data-i18n="health.hMeds">ยา/อาหารเสริม</h2><button class="btn sm" type="button" id="medAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="health.add">เพิ่ม</span></button></div>
      <div class="hl-list" id="medToday"></div>
      <div class="hl-list" id="medList"></div>
    </section>

    <section class="card span-6" aria-labelledby="hHist">
      <div class="card-head"><h2 id="hHist" data-i18n="health.hHist">ประวัติบันทึก</h2></div>
      <div class="hl-list" id="vList"></div>
    </section>

    <section class="card span-12" aria-labelledby="hWork">
      <div class="card-head"><h2 id="hWork" data-i18n="health.hWork">ออกกำลังกาย</h2><a class="btn sm" href="sports.html#logCard"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="health.save">บันทึก</span></a></div>
      <div class="hl-work">
        <div>
          <div class="row" style="justify-content:space-between"><div class="kpi-value" id="wkValue">—</div><span id="wkBadge"></span></div>
          <div class="hl-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="wkBar"><span id="wkFill"></span></div>
          <div class="hl-chart" id="wkChart"></div>
        </div>
        <div class="hl-list" id="wkList"></div>
      </div>
    </section>

    <section class="card span-12" aria-labelledby="hChk">
      <div class="card-head"><h2 id="hChk" data-i18n="health.hChk">ผลตรวจสุขภาพประจำปี</h2><button class="btn sm" type="button" id="chkAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="health.chkAdd">เพิ่มผลตรวจ</span></button></div>
      <div class="hl-list" id="chkList"></div>
    </section>
  </div>
</main>

<dialog class="dialog dialog-form" id="chkDlg" aria-labelledby="chkTitle">
  <form method="dialog" id="chkForm" novalidate>
    <div class="dialog-head"><h2 id="chkTitle">ผลตรวจสุขภาพ</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="cDate" data-i18n="health.cDate">วันที่ตรวจ</label><input id="cDate" type="date"></div>
        <div class="field"><label for="cPlace" data-i18n="health.cPlace">สถานที่</label><input id="cPlace" type="text" maxlength="80" autocomplete="off"></div>
      </div>
      <div class="field">
        <label data-i18n="health.labs">รายการผลแล็บ</label>
        <div class="hl-labs" id="labRows"></div>
        <div class="row">
          <select id="labPreset" class="select" aria-label="เพิ่มรายการที่พบบ่อย" data-i18n-attr="aria-label:health.labPreset" style="width:auto"></select>
          <button class="btn sm" type="button" id="labAdd"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="health.blankRow">แถวว่าง</span></button>
        </div>
      </div>
      <div class="field"><label for="cNote" data-i18n="health.note">บันทึก</label><textarea id="cNote" rows="2" maxlength="300"></textarea></div>
      <div class="field" id="cFilesRow" hidden>
        <label data-i18n="health.resultFiles">ไฟล์ผลตรวจ</label>
        <div class="file-list" id="cFiles"></div>
        <div class="row"><button class="btn sm" type="button" id="cAttach"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-upload"/></svg><span data-i18n="health.attach">แนบไฟล์</span></button></div>
        <input type="file" id="cFileInput" accept="application/pdf,image/*" multiple hidden>
      </div>
      <p class="form-msg" id="cMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="cDel" style="margin-right:auto" data-i18n="health.del">ลบ</button>
      <button class="btn" type="button" id="cCancel" data-i18n="health.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-i18n="health.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog dialog-form" id="medDlg" aria-labelledby="medTitle">
  <form method="dialog" id="medForm" novalidate>
    <div class="dialog-head"><h2 id="medTitle">ยา/อาหารเสริม</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="mName" data-i18n="health.mName">ชื่อ</label><input id="mName" type="text" maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="mDose" data-i18n="health.mDose">ขนาด</label><input id="mDose" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div class="field">
        <label data-i18n="health.mTimes">เวลาที่ต้องกิน</label>
        <div class="hl-times" id="mTimes"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="mStart" data-i18n="health.mStart">วันเริ่ม</label><input id="mStart" type="date"></div>
        <div class="field"><label for="mEnd" data-i18n="health.mEnd">วันสิ้นสุด</label><input id="mEnd" type="date"></div>
      </div>
      <div class="field"><label for="mNote" data-i18n="health.note">บันทึก</label><textarea id="mNote" rows="2" maxlength="200"></textarea></div>
      <p class="form-msg" id="mMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="mDel" style="margin-right:auto" data-i18n="health.del">ลบ</button>
      <button class="btn" type="button" id="mCancel" data-i18n="health.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-i18n="health.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog dialog-form" id="setDlg" aria-labelledby="setTitle">
  <form method="dialog" id="setForm" novalidate>
    <div class="dialog-head"><h2 id="setTitle" data-i18n="health.settings">ตั้งค่า</h2></div>
    <div class="dialog-body">
      <label class="check"><input type="checkbox" id="sHide"><span data-i18n="health.sHide">ซ่อนชื่อยาในแจ้งเตือน</span></label>
      <div class="field"><label for="sGoal" data-i18n="health.sGoal">เป้าออกกำลังกายต่อสัปดาห์ (นาที)</label><input id="sGoal" type="number" inputmode="numeric" min="10" step="1"></div>
      <div class="field">
        <label data-i18n="health.ranges">ช่วงปกติ (ต่ำสุด – สูงสุด)</label>
        <div class="hl-ranges" id="rangeRows"></div>
      </div>
    </div>
    <div class="dialog-foot">
      <button class="btn" type="button" id="sReset" style="margin-right:auto" data-i18n="health.resetDefaults">คืนค่าเริ่มต้น</button>
      <button class="btn" type="button" id="sCancel" data-i18n="health.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-i18n="health.save">บันทึก</button>
    </div>
  </form>
</dialog>
</body>
</html>
