<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดเทรด | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- Google Identity Services — สำหรับสำรองพอร์ต/สมุดเทรดขึ้น Google Drive (ไม่บังคับ) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.kpi-grid{margin-bottom:var(--ome-sp-4)}
.pl-up{color:var(--ome-ok-ink)}.pl-dn{color:var(--ome-err-ink)}
.empty{padding:8px 0;font-size:var(--ome-fs-sm)}
</style>
</head>
<body data-layout="tool" data-invest-key="thai-stock">

<nav class="subnav">
  <div class="subnav-groups" id="ivGroups">
    <button data-href="invest.html" type="button" data-i18n="navOverview">ภาพรวม</button>
    <button data-href="invest-portfolio.html" type="button" data-i18n="navMyPortfolio">พอร์ตของฉัน</button>
    <button class="on" data-href="invest-thai-stock.html" type="button" data-i18n="navMarket">ตลาด &amp; สินทรัพย์</button>
    <button data-href="invest.html" type="button" data-i18n="navLottery">สลาก &amp; พันธบัตร</button>
    <button data-href="invest.html" type="button" data-i18n="navNews">ข่าว &amp; ธุรกิจ</button>
  </div>
</nav>

<main class="page">
  <nav class="crumb"><a href="invest.html" data-i18n="crumbHome">การลงทุน</a><span>›</span><a href="invest-thai-stock.html" data-i18n="crumbThaiStock">หุ้นไทย</a><span>›</span><b data-i18n="crumbHere">สมุดเทรด</b></nav>

  <div class="page-head"><h1 data-i18n="pageTitle">สมุดเทรด + สถิติ</h1></div>

  <div class="stack">
  <div class="card">
    <div class="stack">
      <div id="jStats" class="kpi-grid" style="display:none"></div>
      <div class="frow">
        <div class="field"><label for="jSym" data-i18n="jSymLabel">หุ้น</label><input id="jSym" placeholder="PTT" spellcheck="false"></div>
        <div class="field"><label for="jEntry" data-i18n="jEntryLabel">ราคาเข้า</label><input id="jEntry" inputmode="decimal" placeholder="34.75"></div>
        <div class="field"><label for="jExit" data-i18n="jExitLabel">ราคาออก</label><input id="jExit" inputmode="decimal" placeholder="36.30"></div>
        <div class="field"><label for="jShares" data-i18n="jSharesLabel">จำนวนหุ้น</label><input id="jShares" inputmode="numeric" placeholder="300"></div>
      </div>
      <div><button class="btn primary" id="jAdd" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="jAddBtn">บันทึกไม้</span></button></div>
      <div id="jBox"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2 data-i18n="driveTitle">สำรองพอร์ต + สมุดเทรดขึ้น Google Drive</h2></div>
    <div class="row">
      <button class="btn" id="driveConnectBtn" type="button" data-i18n="driveConnectBtn">เชื่อมต่อ Google Drive</button>
      <span class="status" id="driveStatusTxt" style="margin:0"></span>
    </div>
  </div>
  </div>

</main>

<script src="invest-drivesync.js" defer></script>
<script src="invest-trade-journal.js" defer></script>
</body>
</html>
