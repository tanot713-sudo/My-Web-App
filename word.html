<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เอกสาร | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Kanit:wght@300;400;500;600;700&family=Chonburi&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style id="pageSizeStyle"></style>
<style>
/* ── กรอบหน้า (layout=app): หัว/ไฟล์/ริบบิ้นอยู่บน, กระดาษ + แผงข้างเลื่อนแยก, แถบสถานะอยู่ล่าง ── */
.wd-app{position:relative}
.wd-top{flex-shrink:0;display:flex;flex-direction:column;gap:var(--ome-sp-2);padding:var(--ome-sp-3) var(--ome-sp-4) 0;background:var(--ome-surface-0)}
.wd-head{margin:0;gap:var(--ome-sp-3)}
.wd-head-icon{width:22px;height:22px;color:var(--ome-accent-strong)}
.wd-spacer{flex:1}
.wd-lang-select{width:auto;max-width:150px;height:30px;font-size:var(--ome-fs-xs);padding:0 8px}
.wd-filebar .btn .ome-icon{width:15px;height:15px}

/* ── ริบบิ้น ── */
.wd-tabs{margin-top:var(--ome-sp-1)}
.wd-ribbon{padding:6px;overflow-x:auto}
.wd-ribbon-panel{display:none;align-items:stretch;min-width:min-content;flex:0 0 auto}
.wd-ribbon-panel.active{display:flex}
.wd-rgroup{display:flex;align-items:center;gap:4px;padding:2px 10px;border-right:1px solid var(--ome-border);flex-shrink:0}
.wd-rgroup:last-child{border-right:0}
.wd-rgroup.col{flex-direction:column;align-items:flex-start;gap:4px}
.wd-rgroup-row{display:flex;align-items:center;gap:4px}
.wd-ribbon .btn.sm{padding:0 9px}
.wd-ribbon .btn.sm.icon{width:30px;padding:0}
.wd-ribbon .btn .ome-icon{width:16px;height:16px}
.wd-ribbon .select{width:auto;height:30px;padding:0 8px;font-size:var(--ome-fs-xs)}
.wd-ribbon .font-select{width:150px}
.wd-ribbon .size-select{width:62px}
.wd-ribbon .style-select{width:118px}
.wd-lbl{font-size:var(--ome-fs-xs);color:var(--ome-text-2);min-width:68px}
.wd-color{position:relative;cursor:pointer}
.wd-color input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.wd-color .swatch{position:absolute;left:7px;right:7px;bottom:3px;height:3px;border-radius:2px;pointer-events:none}
.wd-color:focus-within{outline:2px solid var(--ome-accent);outline-offset:1px}
.wd-status{margin:0;min-height:1.2em}
.wd-status.err{color:var(--ome-err-ink)}
.wd-status .spinner{margin-right:8px;vertical-align:-2px}

/* ── พื้นที่ทำงาน: กระดาษ | จุดที่พบ (+ หน้าต่างนำทาง) ── */
.wd-body{display:block;padding:var(--ome-sp-3) var(--ome-sp-4) var(--ome-sp-4)}
.wd-body > * + *{margin-top:var(--ome-sp-3)}
@media(min-width:1301px){
  .wd-app{overflow:hidden}
  .wd-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--ome-sp-4);padding-bottom:0}
  .wd-body > * + *{margin-top:0}
  .wd-body.nav-open{grid-template-columns:250px minmax(0,1fr) 300px}
  .wd-page-wrap,.wd-side,.wd-nav{min-height:0;max-height:100%}
  .wd-page-wrap,.wd-side{overflow:auto}
}
/* จอกลางๆ (≤1300px): กระดาษเต็มความกว้างก่อน แผงข้างไหลลงล่าง ทั้งหน้าเลื่อนรวมกัน */
@media(max-width:1300px){
  .wd-app{overflow-y:auto;overflow-x:hidden}
  .wd-body{flex-shrink:0}
}

/* ── หน้าต่างนำทาง (Navigation Pane) ── */
.wd-nav{display:flex;flex-direction:column;background:var(--ome-surface-1);border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-1);overflow:hidden}
.wd-nav[hidden]{display:none}
@media(max-width:1300px){
  .wd-nav{position:fixed;top:var(--ome-nav-h,52px);left:0;bottom:0;width:min(84vw,330px);border-radius:0;border-width:0 1px 0 0;z-index:var(--ome-z-drawer);box-shadow:var(--ome-shadow-3)}
}
.wd-nav-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0 14px}
.wd-nav-head h2{margin:0;font-size:var(--ome-fs-base)}
.wd-nav-search{padding:10px 12px}
.wd-nav-search .input{height:34px}
.wd-nav > .tabs{padding:0 12px}
.wd-nav > .tabs .tab{flex:1;height:36px;padding:0 4px;font-size:var(--ome-fs-xs)}
.wd-nav-list{overflow-y:auto;padding:8px 6px 14px;flex:1}
.wd-nav-list[hidden]{display:none}
.wd-nav-item{display:block;width:100%;text-align:left;font:inherit;font-size:var(--ome-fs-sm);color:var(--ome-text-1);background:none;border:0;cursor:pointer;
  padding:6px 10px;border-radius:var(--ome-radius-sm);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd-nav-item:hover{background:var(--ome-surface-2)}
.wd-nav-item.active{background:var(--ome-accent-soft);color:var(--ome-accent-strong);font-weight:600}
.wd-nav-lv1{font-weight:600}
.wd-nav-lv2{padding-left:26px}
.wd-nav-lv3{padding-left:42px;font-size:var(--ome-fs-xs)}
.wd-nav-lv4{padding-left:58px;font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.wd-nav-empty{color:var(--ome-text-2);font-size:var(--ome-fs-xs);text-align:center;padding:26px 14px}
.wd-nav-backdrop{position:fixed;inset:0;background:rgba(11,18,35,.42);z-index:calc(var(--ome-z-drawer) - 1)}
.wd-nav-backdrop[hidden]{display:none}
@media(min-width:1301px){.wd-nav-backdrop{display:none!important}}

/* โต๊ะวางกระดาษ — สีพื้นโชว์ช่องว่างระหว่างหน้า */
.wd-page-wrap{background:var(--ome-surface-2);border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);padding:16px 8px;overflow-x:auto}
/* ── โหมดหน้ากระดาษจริง (WYSIWYG): แตกเป็นหน้าทีละแผ่น เห็นขอบหน้า หัว-ท้ายซ้ำทุกหน้า ── */
.wd-page-scale{margin:0 auto;transform-origin:top left}
.wd-page{position:relative;margin:0;background:transparent;font-family:'TH Sarabun New','Sarabun',sans-serif}
.wd-pagebg{position:absolute;inset:0;z-index:0;pointer-events:none}
.wd-pf{position:absolute;left:0;right:0;background:var(--ome-surface-1);border-radius:2px;box-shadow:var(--ome-shadow-2)}
[data-theme="dark"] .wd-pf{outline:1px solid var(--ome-border)}
.wd-pf-band{position:absolute;left:0;right:0;color:var(--ome-text-1);font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:'TH Sarabun New','Sarabun',sans-serif}
.wd-pf-num{position:absolute;left:0;right:0;text-align:center;color:var(--ome-text-2);font-size:12.5px}
.wd-doc-header,.wd-doc-footer{position:absolute;z-index:2;font-size:15px;color:var(--ome-text-1);outline:none;border:1px dashed transparent;border-radius:6px;
  transition:background var(--ome-dur-1),border-color var(--ome-dur-1);font-family:'TH Sarabun New','Sarabun',sans-serif;overflow:hidden}
.wd-doc-header:hover,.wd-doc-footer:hover{background:var(--ome-surface-2);border-color:var(--ome-border)}
.wd-doc-header:focus,.wd-doc-footer:focus{background:var(--ome-surface-2);border-color:var(--ome-info)}
.wd-doc-header:empty::before,.wd-doc-footer:empty::before{content:attr(data-ph);color:var(--ome-text-3);pointer-events:none;font-size:12px}
/* ตัวหนังสือลอยอยู่ชั้นบนสุด พื้นหลังโปร่งใสให้เห็นแผ่นกระดาษด้านหลัง ระยะขอบมาจาก margin ที่เลือก (JS กำหนด) */
.wd-editor{position:relative;z-index:1;background:transparent;min-height:560px;font-size:17px;line-height:1.9;outline:none;color:var(--ome-text-1);font-family:'TH Sarabun New','Sarabun',sans-serif}
.wd-auto-gap{display:block;height:0;pointer-events:none;-webkit-user-select:none;user-select:none}
.wd-editor:focus-visible{outline:none}
.wd-editor :where(h1){font-size:26px;font-weight:700;margin:.6em 0 .3em;letter-spacing:-.01em}
.wd-editor :where(h2){font-size:21px;font-weight:700;margin:.6em 0 .3em}
.wd-editor :where(h3){font-size:17.5px;font-weight:700;margin:.6em 0 .3em}
.wd-editor :where(h4){font-size:15.5px;font-weight:700;margin:.6em 0 .3em;color:var(--ome-info-ink)}
.wd-editor :where(p){margin:.35em 0}
.wd-editor .wd-title{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:.2em 0 .1em;line-height:1.2}
.wd-editor .wd-subtitle{font-size:19px;font-weight:400;color:var(--ome-text-2);margin:0 0 .5em;letter-spacing:.01em}
.wd-editor .wd-nospace{margin:0}
.wd-editor .wd-intense{border-left-width:0;text-align:center;font-style:italic;font-weight:600;color:var(--ome-info-ink);
  border-top:1.5px solid var(--ome-info);border-bottom:1.5px solid var(--ome-info);padding:10px 20px}
.wd-editor :where(ul,ol){margin:.35em 0 .35em 1.4em}
.wd-editor :where(blockquote){margin:.5em 0;padding:4px 16px;border-left:3px solid var(--ome-info);color:var(--ome-text-2)}
.wd-editor .wd-find-hit{background:#FFE08A;color:#111;border-radius:2px}
.wd-editor .wd-find-hit.current{background:#F5A524;color:#fff}
.wd-editor :where(a){color:var(--ome-info-ink);text-decoration:underline}
.wd-editor :where(mark){background:#FFF3B0}
.wd-editor :where(table){border-collapse:collapse;margin:.5em 0;width:100%}
.wd-editor :where(td,th){border:1px solid var(--ome-border);padding:7px 10px;min-width:40px}
.wd-editor :where(hr){border:none;border-top:1.5px solid var(--ome-border);margin:1em 0}
.wd-editor img{max-width:100%;border-radius:6px}
.wd-editor .wd-pagebreak{height:0;border-top:2px dashed var(--ome-border-strong);margin:18px 0;position:relative}
.wd-editor .wd-pagebreak::after{content:"↕ ขึ้นหน้าใหม่";position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  background:var(--ome-surface-1);padding:0 8px;font-size:10px;color:var(--ome-text-2)}
.wd-editor .wd-secbreak{height:0;border-top:2px dashed var(--ome-info);margin:20px 0;position:relative;-webkit-user-select:none;user-select:none}
.wd-editor .wd-secbreak::after{content:attr(data-label);position:absolute;top:-9px;left:50%;transform:translateX(-50%);
  white-space:nowrap;background:var(--ome-info-soft);color:var(--ome-info-ink);padding:1px 10px;font-size:10px;font-weight:700;border-radius:8px}
.wd-editor .wd-fnref{color:var(--ome-info-ink);font-weight:700;cursor:pointer}
.wd-editor .wd-toc{border:1px solid var(--ome-border);border-radius:10px;padding:14px 18px;margin:10px 0;background:var(--ome-surface-2)}
.wd-editor .wd-toc-title{font-weight:700;font-size:15px;margin-bottom:8px}
.wd-editor .wd-toc a{display:block;text-decoration:none;color:var(--ome-text-1);padding:2px 0;font-size:14px}
.wd-editor .wd-toc a:hover{color:var(--ome-info-ink)}
.wd-editor .wd-toc a.lvl2{padding-left:18px;font-size:13.5px}
.wd-editor .wd-toc a.lvl3{padding-left:36px;font-size:13px;color:var(--ome-text-2)}
/* บล็อกแรกที่ ensureEditorHasBlocks() (word.js) แทรกไว้ตอนเอกสารว่างสนิท จัดตำแหน่งผ่าน applyBlockWidth() เหมือนย่อหน้าจริง
   (กฎ :empty เก็บไว้เป็น fallback เผื่อ ensureEditorHasBlocks() ยังไม่ทันรัน) */
.wd-editor>div:only-child:has(>br:only-child)::before{content:attr(data-ph);color:var(--ome-text-3);pointer-events:none}
.wd-editor:empty::before{content:attr(data-placeholder);color:var(--ome-text-3);pointer-events:none;
  display:block;max-width:var(--wd-content-w,100%);margin-left:auto;margin-right:auto}

.wd-footnotes{margin:6px;padding:14px 18px;border-top:2px solid var(--ome-border);display:none}
.wd-footnotes.show{display:block}
.wd-footnotes-title{font-size:11px;font-weight:700;color:var(--ome-text-2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.wd-fn-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin-bottom:6px;line-height:1.6}
.wd-fn-item .num{font-weight:700;color:var(--ome-info-ink);flex-shrink:0}
.wd-fn-item .txt{flex:1;min-width:0}
.wd-fn-item .del{background:none;border:0;color:var(--ome-text-2);cursor:pointer;flex-shrink:0;padding:2px;border-radius:5px}
.wd-fn-item .del:hover{color:var(--ome-err);background:var(--ome-err-soft)}

/* ── แถบสถานะล่าง ── */
.wd-statusbar{flex-shrink:0;display:flex;align-items:center;gap:var(--ome-sp-4);justify-content:flex-end;flex-wrap:wrap;
  padding:6px 76px calc(6px + env(safe-area-inset-bottom,0px)) var(--ome-sp-4);background:var(--ome-surface-1);border-top:1px solid var(--ome-border);
  font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.wd-statusbar .dot{width:6px;height:6px;border-radius:50%;background:var(--ome-ok);flex-shrink:0}
@media(max-width:1300px){.wd-statusbar{position:sticky;bottom:0;margin-top:auto;z-index:var(--ome-z-sticky)}}

/* ── แผงจุดที่พบ ── */
.wd-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--ome-sp-2)}
.wd-side-head h2{margin:0;font-size:var(--ome-fs-base);display:flex;align-items:center;gap:8px}
.wd-fixall{width:100%;margin-bottom:var(--ome-sp-2)}
.wd-fixall[hidden]{display:none}
.wd-issue{background:var(--ome-surface-1);border:1px solid var(--ome-border);border-radius:var(--ome-radius-md);padding:12px 14px;margin-bottom:var(--ome-sp-2);cursor:pointer;
  transition:border-color var(--ome-dur-1)}
.wd-issue:hover{border-color:var(--ome-err)}
.wd-issue .badge{margin-bottom:6px}
.wd-issue .quote{color:var(--ome-err-ink);font-weight:700;font-size:var(--ome-fs-sm)}
.wd-issue .msg{font-size:var(--ome-fs-xs);color:var(--ome-text-2);margin-top:3px;line-height:1.5}
.wd-issue .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.wd-issue .chip{height:28px;font-size:var(--ome-fs-xs)}
.wd-side-empty[hidden]{display:none}
.wd-side-empty .ome-icon{color:var(--ome-ok)}

/* ── dialog ── */
.dialog .field + .field,.dialog .frow + .wd-check,.dialog .field + .wd-check,.dialog .wd-check + .status{margin-top:var(--ome-sp-3)}
.dialog .frow{display:flex;gap:var(--ome-sp-3)}
.dialog.wide{width:min(440px,calc(100vw - 32px))}
.dialog p{margin:0}
.wd-check{display:flex;align-items:center;gap:8px;font-size:var(--ome-fs-sm)}
.wd-check input{width:auto;height:auto}
.dialog-foot{flex-wrap:wrap}
#wordCountDetails strong{font-size:var(--ome-fs-md)}
.wd-sym-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;max-height:260px;overflow-y:auto}
.wd-sym-grid button{font:inherit;font-size:18px;padding:6px 0;border:1px solid var(--ome-border);border-radius:var(--ome-radius-sm);
  background:var(--ome-surface-1);color:var(--ome-text-1);cursor:pointer}
.wd-sym-grid button:hover{background:var(--ome-accent-soft);border-color:var(--ome-accent)}
.wd-sym-grid + .wd-sym-grid{margin-top:var(--ome-sp-2)}

/* ── ตอนสร้างไฟล์ PDF เอง (html2canvas): หน้าต่อกันสนิท ซ่อนหัว-ท้ายที่แก้ไขได้ แล้วใช้หัว-ท้ายที่สะท้อนทุกหน้าแทน ── */
body.wd-cap{height:auto;overflow:visible;display:block}
.wd-cap .wd-app,.wd-cap .wd-body,.wd-cap .wd-page-wrap{display:block;overflow:visible;height:auto;max-height:none}
.wd-page.wd-capturing{--ome-surface-1:#fff;--ome-surface-2:#F6F7FB;--ome-text-1:#1F2430;--ome-text-2:#727C93;--ome-text-3:#A7AEC0;--ome-border:#EAEDF5;--ome-border-strong:#C7CEE0;--ome-info:#3B9BEA;--ome-info-ink:#1E7DC4;--ome-info-soft:#E8F3FC}
.wd-page.wd-capturing .wd-pf{box-shadow:none!important;border-radius:0!important;outline:none!important}
.wd-page.wd-capturing .wd-doc-header,.wd-page.wd-capturing .wd-doc-footer,
.wd-page.wd-capturing .wd-footnotes:empty{display:none!important}
.wd-page.wd-capturing .wd-find-hit{background:none!important;color:inherit!important}

@media print{
  body{background:#fff;height:auto;overflow:visible;display:block}
  .wd-app{display:block;overflow:visible}
  .wd-top,.wd-side,.wd-nav,.wd-nav-backdrop,.wd-statusbar,.ome-nav,.dialog{display:none!important}
  .wd-body{display:block;margin:0;padding:0;overflow:visible}
  .wd-page-wrap{box-shadow:none;border:0;padding:0;overflow:visible;background:#fff}
  .wd-page{max-width:none!important;margin:0}
  .wd-doc-header,.wd-doc-footer{border:none!important;background:none!important;padding:6px clamp(20px,5vw,64px)!important;color:#000;opacity:1!important}
  .wd-doc-header:empty,.wd-doc-footer:empty,.wd-doc-header.wd-hf-empty,.wd-doc-footer.wd-hf-empty{display:none!important}
  .wd-doc-header:empty::before,.wd-doc-footer:empty::before{content:none!important}
  .wd-editor .wd-pagebreak{break-after:page;border:none;height:0;margin:0}
  .wd-editor .wd-pagebreak::after{display:none}
  .wd-editor .wd-find-hit{background:none!important;color:inherit!important}
}

/* ── มือถือ: ปุ่มกดง่ายขึ้น ริบบิ้นไหลเรียงตัดบรรทัดอัตโนมัติ ── */
@media screen and (max-width:640px){
  .wd-top{padding:var(--ome-sp-2) 10px 0}
  .wd-body{padding:var(--ome-sp-2) 10px var(--ome-sp-3)}
  .wd-filebar{padding:6px;gap:6px}
  .wd-ribbon{overflow-x:visible;padding:8px}
  .wd-ribbon-panel.active{display:flex;flex:1 1 100%;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
  .wd-rgroup,.wd-rgroup.col,.wd-rgroup-row{display:contents}
  .wd-ribbon .btn.sm{height:42px;border-color:var(--ome-border)}
  .wd-ribbon .btn.sm.icon{width:42px}
  .wd-ribbon .select{height:42px;font-size:var(--ome-fs-sm)}
  .wd-ribbon .font-select{flex:1 1 44%;min-width:0;width:auto}
  .wd-ribbon .style-select{flex:1 1 42%;min-width:0;width:auto}
  .wd-ribbon .select{max-width:100%}
  .wd-ribbon .size-select{width:74px}
  .wd-lbl{min-width:0}
  .wd-tabs .tab{padding:0 12px;font-size:var(--ome-fs-xs)}
  .wd-page-wrap{overflow-x:hidden;padding:12px 4px}
  .dialog-foot .btn{flex:1 1 calc(50% - 4px)}
  .wd-sym-grid{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body data-layout="app" data-doctitle-key="docTitle">
<main class="page wd-app">
<div class="wd-top">
  <div class="page-head wd-head">
    <svg class="ome-icon wd-head-icon" aria-hidden="true"><use href="icons.svg#i-file-text"/></svg>
    <h1 data-i18n="pageTitle">เอกสาร</h1>
    <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
      <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
    </button>
  </div>
