<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="ex.title">ดึงข้อความออกจากเอกสาร | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/สถานะ มาจาก theme.css (data-layout="tool") */
.ex-page{max-width:780px}
.ex-page .card > * + *{margin-top:var(--ome-sp-3)}
.ex-page .card > h2{display:flex;align-items:center;gap:8px;margin:0;font-size:var(--ome-fs-md)}
.ex-page .status{margin-top:var(--ome-sp-2)}
.ex-page .check{display:flex;align-items:center;gap:6px;cursor:pointer}
.ex-page .check input{width:auto;flex:none;accent-color:var(--ome-accent)}
.ex-page .char-count{font-size:var(--ome-fs-xs);color:var(--ome-text-2);text-align:right;margin-top:4px}
.dl-row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body data-layout="tool">

<main class="page ex-page">
<nav class="crumb"><a href="area.html?a=work" data-i18n="ex.crumb">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="ex.h1">ดึงข้อความออกจากเอกสาร</span></nav>
<div class="page-head"><h1 data-i18n="ex.h1">ดึงข้อความออกจากเอกสาร</h1></div>

<div class="stack">
<div class="card">
  <h2><svg class="ome-icon"><use href="icons.svg#i-upload"/></svg><span data-i18n="ex.attach">แนบไฟล์</span></h2>
  <div class="dropzone" id="drop" role="button" tabindex="0">
    <svg class="ome-icon"><use href="icons.svg#i-file-text"/></svg>
    <div class="dropzone-main" id="dropMain" data-i18n="ex.dropMain">แตะเพื่อเลือกไฟล์ หรือลากไฟล์มาวางตรงนี้</div>
    <div class="dropzone-sub" id="dropSub"></div>
  </div>
  <input type="file" id="fileInput" accept=".txt,.docx,.xlsx,.xls,.csv,.pptx,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
  <label class="mini check">
    <input type="checkbox" id="ocrChk" checked>
    <span data-i18n="ex.ocr">ใช้ OCR อ่านหน้า/รูปที่เป็นภาพสแกน</span>
  </label>
  <label class="mini check">
    <input type="checkbox" id="accChk">
    <span data-i18n="ex.accurate">โหมดแม่นยำ (ช้ากว่า)</span>
  </label>
  <div class="row" id="engRow" style="display:none;margin-top:var(--ome-sp-2)">
    <span class="mini" data-i18n="ex.engLabel">อ่านภาพสแกนด้วย</span>
    <div class="lang-toggle" id="engToggle">
      <span data-oe="free" data-i18n="ex.engFree" class="active">ฟรี (OCR)</span>
      <span data-oe="vision" data-i18n="ex.engVision">Claude Vision</span>
    </div>
  </div>
  <div class="status" id="readStatus"></div>
</div>

<div class="card" id="resultCard" style="display:none">
  <h2><svg class="ome-icon"><use href="icons.svg#i-file-text"/></svg><span data-i18n="ex.result">ข้อความที่ดึงได้</span></h2>
  <textarea class="textarea" id="resultText" rows="12" data-i18n-attr="placeholder:ex.resultPh,aria-label:ex.result" aria-label="ข้อความที่ดึงได้" placeholder="ข้อความที่ดึงได้จะขึ้นตรงนี้"></textarea>
  <div class="char-count" id="charCount"></div>
  <div class="dl-row">
    <button class="btn primary sm" id="copyBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-copy"/></svg><span data-i18n="ex.copy">คัดลอกข้อความ</span></button>
    <button class="btn sm" id="downloadTxtBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-download"/></svg><span data-i18n="ex.dlTxt">ดาวน์โหลด .txt</span></button>
    <button class="btn sm" id="splitPdfBtn" type="button" style="display:none"><svg class="ome-icon"><use href="icons.svg#i-download"/></svg><span data-i18n="ex.split">แยกหน้า PDF (.zip)</span></button>
  </div>
  <div class="status" id="actionStatus"></div>
</div>
</div>

</main>

<!-- ไลบรารีอ่านไฟล์แนบ (เหมือนหน้า "แปลงเสียง ↔ ข้อความ"/"ตรวจสอบเอกสาร") -->
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
window.pdfjsLib = pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
</script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<!-- ใช้เฉพาะตอนกด "แยกหน้า PDF" (สร้างไฟล์ PDF รายหน้าใหม่) — คนละหน้าที่กับ pdfjsLib ที่ใช้แค่อ่าน -->
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="ai-client.js"></script>
<script src="ocr-vision.js"></script>
<script src="file-reader.js"></script>
<script src="extract-text.js" defer></script>
</body>
</html>
