        // สร้างรายการบทเรียนทั้งหมดจากข้อมูลจริงของ Tanot (กฎหมาย 16 หัวข้อ, ธุรกิจ 12 หัวข้อ, วิศวกรรม 13 หัวข้อ)
        //
        // ★ วิธีเพิ่มเนื้อหาให้หัวข้อกฎหมาย/วิศวกรรม: แก้ JSON ใน <script id="course-data"> ด้านบน
        //   เปลี่ยนรายการจาก  {"id": "civil-law", "title": "กฎหมายแพ่ง"}

        //   ใส่แค่บางส่วนก็ได้ — มี overview/keyConcepts จะขึ้นในแท็บ "สรุปเนื้อหา" ทันที
        //   ถ้ามี quiz หัวข้อนั้นจะกลายเป็นแบบฝึกมีเฉลย และเข้าระบบทบทวนเว้นช่วง + สอบรวมอัตโนมัติ
        const enrich = t => ({

        function reflectionPrompts(title) {

        function loadXp() {

        function saveNotes(v) { localStorage.setItem('lbe:notes', JSON.stringify(v)); }

        function mergeNotes(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const na = a && a[k], nb = b && b[k];
                if (!na) { out[k] = nb; return; }
                if (!nb) { out[k] = na; return; }
                out[k] = (na.updatedAt || 0) >= (nb.updatedAt || 0) ? na : nb;
            });
            return out;
        }

        const ANNOUNCEMENTS = [
            { date: 'วันนี้', text: 'ใหม่! ระบบทบทวนแบบเว้นช่วง (spaced repetition) — ข้อที่ตอบผิดจะวนกลับมาถามซ้ำในจังหวะที่ช่วยให้จำได้ยาว ดูการ์ด "ทบทวนวันนี้" ด้านล่าง' },
            { date: 'ใหม่', text: 'โหมดสอบรวม — สุ่มข้อสอบข้ามหลายหัวข้อ จับเวลา และเก็บสถิติคะแนนไว้ดูพัฒนาการ' },
            { date: 'เคล็ดลับ', text: 'โน้ตรองรับ Markdown แล้ว: # หัวข้อ, **ตัวหนา**, *เอียง*, ==ไฮไลต์==, - รายการ — กด "ดูตัวอย่าง" ในแท็บโน้ตเพื่อดูผลลัพธ์' },
        ];

        // ── คลังข้อสอบรวม (เฉพาะข้อที่มีเฉลย) ใช้ทั้งโหมดทบทวนและสอบรวม ─────────
        const QUESTION_BANK = [];
        SUBJECTS.forEach(s => s.topics.forEach(t => {
            if (t.kind !== 'quiz') return;
            t.data.quiz.forEach((q, i) => QUESTION_BANK.push({
                qKey: `${s.id}:${t.id}:${i}`, subjId: s.id, topicId: t.id, topicTitle: t.title,
                q: q.q, refAnswer: q.options[q.answer],
            }));
        }));
        const QUESTION_BY_KEY = Object.fromEntries(QUESTION_BANK.map(q => [q.qKey, q]));

        // ── Spaced repetition: ตอบถูกเลื่อนรอบ 1→3→7→14→30 วัน, ตอบผิดถอยกลับ 1 วัน ──
        const SRS_STEPS = [1, 3, 7, 14, 30];
        const DAY_MS = 86400000;
        function nextSrs(prev, correct) {
            let interval;
            if (!correct) interval = 1;
            else {
                const i = SRS_STEPS.indexOf(prev ? prev.interval : -1);
                interval = SRS_STEPS[Math.min(i + 1, SRS_STEPS.length - 1)];
            }
            return { interval, due: Date.now() + interval * DAY_MS };
        }

        function loadSrs() {
            try { return JSON.parse(localStorage.getItem('lbe:srs') || '{}'); } catch { return {}; }
        }
        function saveSrs(v) { localStorage.setItem('lbe:srs', JSON.stringify(v)); }
        function mergeSrs(a, b) {
            const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
            const out = {};
            keys.forEach(k => {
                const va = a && a[k], vb = b && b[k];
                out[k] = !va ? vb : !vb ? va : ((va.due || 0) >= (vb.due || 0) ? va : vb);
            });
            return out;
        }

        function loadExams() {
            try { return JSON.parse(localStorage.getItem('lbe:exams') || '[]'); } catch { return []; }
        }
        function saveExams(v) { localStorage.setItem('lbe:exams', JSON.stringify(v)); }
        function mergeExams(a, b) {
            const seen = {};
            [...(a || []), ...(b || [])].forEach(e => { if (e && e.date) seen[e.date] = e; });
            return Object.values(seen).sort((x, y) => y.date.localeCompare(x.date)).slice(0, 50);
        }

        function shuffled(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ── Markdown-lite สำหรับโน้ต (escape ก่อนเสมอ กัน XSS) ─────────────────
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function mdToHtml(src) {
            const inline = t => t
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/==([^=]+)==/g, '<mark>$1</mark>');
            let html = '', inUl = false, inOl = false;
            const closeLists = () => {
                if (inUl) { html += '</ul>'; inUl = false; }
                if (inOl) { html += '</ol>'; inOl = false; }
            };
            escapeHtml(src || '').split('\n').forEach(raw => {
                const l = raw.trimEnd();
                if (/^###\s/.test(l)) { closeLists(); html += '<h4>' + inline(l.slice(4)) + '</h4>'; }
                else if (/^##\s/.test(l)) { closeLists(); html += '<h3>' + inline(l.slice(3)) + '</h3>'; }
                else if (/^#\s/.test(l)) { closeLists(); html += '<h2>' + inline(l.slice(2)) + '</h2>'; }
                else if (/^[-*]\s/.test(l)) {
                    if (!inUl) { closeLists(); html += '<ul>'; inUl = true; }
                    html += '<li>' + inline(l.slice(2)) + '</li>';
                }
                else if (/^\d+\.\s/.test(l)) {
                    if (!inOl) { closeLists(); html += '<ol>'; inOl = true; }
                    html += '<li>' + inline(l.replace(/^\d+\.\s/, '')) + '</li>';
                }
                else if (l === '') closeLists();
                else { closeLists(); html += '<p>' + inline(l) + '</p>'; }
            });
            closeLists();
            return html;
        }

        // ── Google Drive sync (ไม่บังคับ) — ซิงก์ XP/ความคืบหน้าข้ามอุปกรณ์ ──────────
        const DRIVE_CLIENT_ID = '497048581273-akpavakt6m34lhqbjf1irg3m8vl6u27u.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const DRIVE_FOLDER_NAME = 'OME_Progress';
        const DRIVE_FILE_NAME = 'lbe-progress.json';

        const DriveSync = {
            tokenClient: null,
            accessToken: null,
            folderId: null,
            ensureAuth() {
                return new Promise((resolve, reject) => {
                    if (!window.google || !google.accounts || !google.accounts.oauth2) {
                        reject(new Error('โหลด Google Identity Services ไม่สำเร็จ ลองรีเฟรชหน้าใหม่'));
                        return;
                    }
                    if (!this.tokenClient) {
                        this.tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: DRIVE_CLIENT_ID,
                            scope: DRIVE_SCOPE,
                            callback: (resp) => {
                                if (resp.error) { reject(new Error(resp.error)); return; }
                                this.accessToken = resp.access_token;
                                resolve(this.accessToken);
                            },
                        });
                    }
                    this.tokenClient.requestAccessToken({ prompt: this.accessToken ? '' : 'consent' });
                });
            },
            async ensureFolder() {
                if (this.folderId) return this.folderId;
                const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                if (data.files && data.files.length) { this.folderId = data.files[0].id; return this.folderId; }
                const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
                });
                if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
                const createData = await createRes.json();
                this.folderId = createData.id;
                return this.folderId;
            },
            async findFile(name, folderId) {
                const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาไฟล์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },
            async downloadFile(fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
            async uploadFile(name, folderId, existingId, obj) {
                const form = new FormData();
                const metadata = existingId ? {} : { name, parents: [folderId] };
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
                const url = existingId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const res = await fetch(url, { method: existingId ? 'PATCH' : 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken }, body: form });
                if (!res.ok) throw new Error('บันทึกขึ้น Drive ไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
        };

        function App() {
            // เปิดหมวดตรงจาก URL hash ได้ เช่น #law / #business / #engineering (ลิงก์มาจากเมนูแอปหลัก)
            const hashSubject = ['law', 'business', 'engineering'].includes(location.hash.slice(1))
                ? location.hash.slice(1) : null;
            const initialSubject = hashSubject || 'business';
            const [view, setView] = useState(hashSubject ? 'classwork' : 'stream'); // 'stream' | 'classwork'
            const [activeSubject, setActiveSubject] = useState(initialSubject);
            const [activeTopicId, setActiveTopicId] = useState(SUBJECTS.find(s => s.id === initialSubject).topics[0].id);
            const [activeTab, setActiveTab] = useState('quiz');
            const [openGroups, setOpenGroups] = useState({ law: initialSubject === 'law', business: initialSubject === 'business', engineering: initialSubject === 'engineering' });
            const [qIndex, setQIndex] = useState(0);
            const [answerText, setAnswerText] = useState('');
            const [revealed, setRevealed] = useState(false);
            const [selfMark, setSelfMark] = useState(null); // 'correct' | 'wrong'
            const [xp, setXp] = useState(loadXp());
            const [written, setWritten] = useState(loadWritten());
            const [completed, setCompleted] = useState(loadCompleted());
            const [notes, setNotes] = useState(loadNotes());
            const [srs, setSrs] = useState(loadSrs());
            const [exams, setExams] = useState(loadExams());
            const [syncing, setSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');
            const [mobileNavOpen, setMobileNavOpen] = useState(false);

            // เซสชันทบทวน (spaced repetition)
            const [revList, setRevList] = useState([]);       // qKey[]
            const [revIndex, setRevIndex] = useState(0);
            const [revAnswer, setRevAnswer] = useState('');
            const [revRevealed, setRevRevealed] = useState(false);

            // เซสชันสอบรวม
            const [examList, setExamList] = useState([]);     // question objects
            const [examIndex, setExamIndex] = useState(0);
            const [examAnswer, setExamAnswer] = useState('');
            const [examRevealed, setExamRevealed] = useState(false);
            const [examScore, setExamScore] = useState(0);
            const [examStart, setExamStart] = useState(null);

            // โน้ต: โหมดพรีวิว + ค้นหาในหน้ารวมโน้ต
            const [notePreview, setNotePreview] = useState(false);
            const [notesQuery, setNotesQuery] = useState('');

            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { saveXp(xp); }, [xp]);
            useEffect(() => { saveWritten(written); }, [written]);
            useEffect(() => { saveCompleted(completed); }, [completed]);
            useEffect(() => { saveNotes(notes); }, [notes]);
            useEffect(() => { saveSrs(srs); }, [srs]);
            useEffect(() => { saveExams(exams); }, [exams]);

            const dueKeys = Object.keys(srs).filter(k => QUESTION_BY_KEY[k] && srs[k].due <= Date.now());

            const startReview = () => {
                setRevList(shuffled(dueKeys));
                setRevIndex(0); setRevAnswer(''); setRevRevealed(false);
                setView('review');
            };
            const markReview = (correct) => {
                const key = revList[revIndex];
                setSrs(s => ({ ...s, [key]: nextSrs(s[key], correct) }));
                if (correct) setXp(x => x + 30);
                setRevIndex(i => i + 1); setRevAnswer(''); setRevRevealed(false);
            };

            const startExam = (n) => {
                setExamList(shuffled(QUESTION_BANK).slice(0, n));
                setExamIndex(0); setExamAnswer(''); setExamRevealed(false);
                setExamScore(0); setExamStart(Date.now());
                setView('exam');
            };
            const markExam = (correct) => {
                const q = examList[examIndex];
                setSrs(s => ({ ...s, [q.qKey]: nextSrs(s[q.qKey], correct) }));
                if (correct) { setExamScore(sc => sc + 1); setXp(x => x + 20); }
                const isLast = examIndex + 1 >= examList.length;
                if (isLast) {
                    const finalScore = examScore + (correct ? 1 : 0);
                    setExams(ex => mergeExams(ex, [{
                        date: new Date().toISOString(), score: finalScore,
                        total: examList.length, sec: Math.round((Date.now() - examStart) / 1000),
                    }]));
                }
                setExamIndex(i => i + 1); setExamAnswer(''); setExamRevealed(false);
            };

            const syncNow = async () => {
                setSyncing(true);
                setSyncStatus('กำลังเชื่อมต่อ Google...');
                try {
                    await DriveSync.ensureAuth();
                    setSyncStatus('กำลังซิงก์...');
                    const folderId = await DriveSync.ensureFolder();
                    const existing = await DriveSync.findFile(DRIVE_FILE_NAME, folderId);
                    const remote = existing ? await DriveSync.downloadFile(existing.id) : null;

                    const mergedXp = Math.max(xp, remote?.xp || 0);
                    const mergedCompleted = { ...(remote?.completed || {}), ...completed };
                    const mergedWritten = { ...(remote?.written || {}), ...written };
                    const mergedNotes = mergeNotes(remote?.notes, notes);
                    const mergedSrs = mergeSrs(remote?.srs, srs);
                    const mergedExams = mergeExams(remote?.exams, exams);

                    setXp(mergedXp);
                    setCompleted(mergedCompleted);
                    setWritten(mergedWritten);
                    setNotes(mergedNotes);
                    setSrs(mergedSrs);
                    setExams(mergedExams);

                    await DriveSync.uploadFile(DRIVE_FILE_NAME, folderId, existing?.id,
                        { xp: mergedXp, completed: mergedCompleted, written: mergedWritten, notes: mergedNotes,
                          srs: mergedSrs, exams: mergedExams, savedAt: new Date().toISOString() });
                    setSyncStatus('✅ ซิงก์สำเร็จ');
                } catch (e) {
                    setSyncStatus('❌ ' + (e.message || e));
                } finally {
                    setSyncing(false);
                }
            };

            const subject = SUBJECTS.find(s => s.id === activeSubject);
            const topic = subject.topics.find(t => t.id === activeTopicId) || subject.topics[0];

            const questions = useMemo(() => {
                if (topic.kind === 'quiz') {
                    return topic.data.quiz.map(q => ({ q: q.q, refAnswer: q.options[q.answer], hasKey: true }));
                }
                return reflectionPrompts(topic.title).map(q => ({ q, refAnswer: null, hasKey: false }));
            }, [topic]);

            const level = Math.floor(xp / 250) + 1;

            const noteKey = `${activeSubject}:${topic.id}`;
            const noteText = (notes[noteKey] && notes[noteKey].text) || '';
            const updateNote = (text) => setNotes(n => ({ ...n, [noteKey]: { text, updatedAt: Date.now() } }));

            const allTopics = useMemo(() => SUBJECTS.flatMap(s => s.topics.map(t => ({ subjId: s.id, subjLabel: s.label, ...t }))), []);
            const topicByKey = useMemo(() => Object.fromEntries(allTopics.map(t => [`${t.subjId}:${t.id}`, t])), []);
            const totalTopics = allTopics.length;
            const completedCount = allTopics.filter(t => completed[`${t.subjId}:${t.id}`]).length;
            const todoTopics = allTopics.filter(t => !completed[`${t.subjId}:${t.id}`]);
            const subjectStats = SUBJECTS.map(s => ({
                ...s,
                done: s.topics.filter(t => completed[`${s.id}:${t.id}`]).length,
                total: s.topics.length,
            }));

            const selectTopic = (subjId, topicId) => {
                setActiveSubject(subjId);
                setActiveTopicId(topicId);
                setActiveTab('quiz');
                setQIndex(0);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
                setView('classwork');
                setMobileNavOpen(false);
            };

            const openSubject = (subjId) => {
                setActiveSubject(subjId);
                setOpenGroups(g => ({ ...g, [subjId]: true }));
                setView('classwork');
            };

            const submitAnswer = () => {
                if (!answerText.trim()) return;
                setRevealed(true);
                const key = `${topic.id}:${qIndex}`;
                setWritten(w => ({ ...w, [key]: answerText.trim() }));
                if (!questions[qIndex].hasKey) setXp(x => x + 50);
            };

            const markSelf = (correct) => {
                setSelfMark(correct ? 'correct' : 'wrong');
                if (correct) setXp(x => x + 100);
                // เข้าคิวทบทวนแบบเว้นช่วง (เฉพาะข้อที่มีเฉลย)
                if (topic.kind === 'quiz') {
                    const key = `${activeSubject}:${topic.id}:${qIndex}`;
                    setSrs(s => ({ ...s, [key]: nextSrs(s[key], correct) }));
                }
            };

            const nextQuestion = () => {
                setQIndex(i => i + 1);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
            };

            const restartTopic = () => {
                setQIndex(0);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
            };

            const isDone = qIndex >= questions.length;

            useEffect(() => {
                if (!isDone) return;
                const key = `${activeSubject}:${topic.id}`;
                if (!completed[key]) setCompleted(c => ({ ...c, [key]: true }));
            }, [isDone, activeSubject, topic.id]);

            return (
                <div className="h-[calc(100vh-48px)] w-full flex flex-col bg-slate-50 font-sans">

                    <header className="min-h-[64px] bg-white border-b border-slate-200 flex items-center flex-wrap gap-y-2 justify-between px-4 sm:px-6 py-2 shrink-0 z-10">
                        <div className="flex items-center gap-2">
                            <button onClick={() => setMobileNavOpen(true)} className="md:hidden -ml-1 p-1.5 text-slate-500 hover:text-slate-800" aria-label="เปิดเมนูหัวข้อ">

                        <aside className={`fixed md:static inset-y-0 left-0 z-40 w-80 bg-white border-r border-slate-200 overflow-y-auto flex flex-col shrink-0 p-4 transform transition-transform duration-200 md:translate-x-0 ${mobileNavOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                            <div className="flex items-center justify-between mb-3 md:hidden">
                                <span className="text-sm font-bold text-slate-700">หัวข้อทั้งหมด</span>
                                <button onClick={() => setMobileNavOpen(false)} className="p-1 text-slate-400 hover:text-slate-700" aria-label="ปิดเมนู"><CloseIcon /></button>
                            </div>
                            {SUBJECTS.map(s => (
                                <div key={s.id} className="mb-2">
                                    <button
                                        onClick={() => setOpenGroups(g => ({ ...g, [s.id]: !g[s.id] }))}
                                        className="w-full flex items-center justify-between px-2 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider hover:text-slate-700"
                                    >
                                        <span className="flex items-center gap-2"><s.icon /> {s.label} <span className="text-slate-300 font-normal normal-case">({s.topics.length})</span></span>
                                        <span className={`transition-transform ${openGroups[s.id] ? 'rotate-180' : ''}`}><ChevronDown /></span>
                                    </button>
                                    {openGroups[s.id] && (
                                        <div className="space-y-1 mt-1">
                                            {s.topics.map(t => {
                                                const active = activeSubject === s.id && activeTopicId === t.id;
                                                return (
                                                    <button
                                                        key={t.id}
                                                        onClick={() => selectTopic(s.id, t.id)}
                                                        className={`w-full text-left p-2.5 rounded-xl border flex gap-2 text-sm ${active ? 'bg-blue-50 border-blue-100 text-secondary font-semibold shadow-sm' : 'border-transparent text-slate-600 hover:bg-slate-50'}`}
                                                    >
                                                        {active ? <Play className="shrink-0 mt-0.5" /> : (completed[`${s.id}:${t.id}`] ? <Check className="shrink-0 mt-0.5" /> : <Clock className="shrink-0 mt-1 text-slate-300" />)}
                                                        <span className="leading-tight">{t.title}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 flex justify-center">
                            <div className="w-full max-w-3xl">

                                <div className="w-full aspect-video bg-slate-900 rounded-2xl shadow-lg relative mb-6">
                                    <div className="absolute inset-0 flex items-center justify-center">
                                        <Play className="text-white w-12 h-12 opacity-50" />
                                    </div>
                                    <div className="absolute bottom-3 left-4 text-slate-400 text-xs">วิดีโอประกอบบทเรียน (เร็วๆ นี้)</div>
                                </div>

                                <div className="flex gap-4 border-b border-slate-200 mb-6">
                                    <button
                                        onClick={() => setActiveTab('summary')}
                                        className={`pb-3 px-2 text-sm font-semibold transition-colors ${activeTab === 'summary' ? 'text-secondary border-b-2 border-secondary' : 'text-slate-400 hover:text-slate-700'}`}
                                    >
                                        สรุปเนื้อหา
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('quiz')}
                                        className={`pb-3 px-2 text-sm font-semibold flex items-center gap-2 transition-colors ${activeTab === 'quiz' ? 'text-secondary border-b-2 border-secondary' : 'text-slate-400 hover:text-slate-700'}`}
                                    >
                                        <Target /> แบบฝึกเขียนตอบ <span className="bg-accent text-white text-[10px] px-1.5 py-0.5 rounded-full">เขียนเอง ไม่ใช่ตัวเลือก</span>
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('notes')}
                                        className={`pb-3 px-2 text-sm font-semibold flex items-center gap-2 transition-colors ${activeTab === 'notes' ? 'text-secondary border-b-2 border-secondary' : 'text-slate-400 hover:text-slate-700'}`}
                                    >
                                        <NotebookIcon /> โน้ตของฉัน {noteText && <span className="w-1.5 h-1.5 rounded-full bg-secondary"></span>}
                                    </button>
                                </div>

                                {activeTab === 'notes' ? (
                                    <div className="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-100">
                                        <div className="flex items-center justify-between gap-3 flex-wrap mb-1">
                                            <h3 className="text-xl font-bold flex items-center gap-2"><NotebookIcon /> โน้ตของฉัน — {topic.title}</h3>
                                            <div className="flex rounded-lg border border-slate-200 overflow-hidden text-xs font-semibold">
                                                <button onClick={() => setNotePreview(false)}
                                                    className={`px-3 py-1.5 ${!notePreview ? 'bg-secondary text-white' : 'text-slate-500 hover:bg-slate-50'}`}>แก้ไข</button>
                                                <button onClick={() => setNotePreview(true)}
                                                    className={`px-3 py-1.5 ${notePreview ? 'bg-secondary text-white' : 'text-slate-500 hover:bg-slate-50'}`}>ดูตัวอย่าง</button>
                                            </div>
                                        </div>
                                        <p className="text-xs text-slate-400 mb-4">
                                            {notes[noteKey] ? `บันทึกล่าสุด ${new Date(notes[noteKey].updatedAt).toLocaleString('th-TH')}` : 'ยังไม่มีโน้ตสำหรับหัวข้อนี้ — พิมพ์ด้านล่างได้เลย บันทึกอัตโนมัติ'}
                                            {' · รองรับ Markdown: '}<code># หัวข้อ</code> <code>**หนา**</code> <code>*เอียง*</code> <code>==ไฮไลต์==</code> <code>- รายการ</code>
                                        </p>
                                        {notePreview ? (
                                            <div className="md-preview border-2 border-slate-100 rounded-xl p-4 min-h-[200px] text-slate-700"
                                                dangerouslySetInnerHTML={{ __html: noteText.trim() ? mdToHtml(noteText) : '<p style="opacity:.4">ยังไม่มีเนื้อหา — กลับไปแท็บแก้ไขเพื่อพิมพ์โน้ต</p>' }} />
                                        ) : (
                                            <textarea
                                                value={noteText}
                                                onChange={e => updateNote(e.target.value)}
                                                rows={10}
                                                placeholder={"จดสรุป คำจำกัดความ หรือประเด็นที่อยากจำไว้สำหรับหัวข้อนี้...\n\n# หัวข้อใหญ่\n## หัวข้อรอง\n- ประเด็นที่ 1 มี **คำสำคัญ** และ ==จุดที่ต้องจำ==\n- ประเด็นที่ 2"}
                                                className="w-full border-2 border-slate-200 focus:border-secondary outline-none rounded-xl p-4 text-sm text-slate-700 resize-y font-sans leading-relaxed"
                                            />
                                        )}
                                    </div>
                                ) : activeTab === 'summary' ? (
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Bookmark /> {topic.title}</h3>
                                        {(topic.data && (topic.data.overview || (topic.data.keyConcepts || []).length)) ? (
                                            <>
                                                {topic.data.overview && <p className="text-slate-600 mb-4">{topic.data.overview}</p>}
                                                {(topic.data.keyConcepts || []).length > 0 && (
                                                    <>
                                                        <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">ประเด็นสำคัญ</h4>
                                                        <ul className="space-y-2">
                                                            {topic.data.keyConcepts.map((k, i) => (
                                                                <li key={i} className="flex items-start gap-2 text-sm text-slate-700">
                                                                    <span className="text-secondary mt-1">&bull;</span> {k}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </>
                                                )}
                                            </>
                                        ) : (
                                            <p className="text-slate-600 leading-relaxed">
                                                หัวข้อนี้ยังไม่มีเนื้อหาสรุปแบบมีโครงสร้างในระบบ — ใช้แท็บ "แบบฝึกเขียนตอบ"
                                                เพื่อฝึกอธิบายหลักการของ "{topic.title}" ด้วยตัวเองแทนได้เลย
                                                (เพิ่มเนื้อหาได้โดยแก้ข้อมูลใน course-data ของไฟล์นี้ — ดูตัวอย่างรูปแบบในคอมเมนต์ของโค้ด)
                                            </p>
                                        )}
                                    </div>
                                ) : (
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">

                                        {!isDone ? (
                                            <>
                                                <div className="flex justify-between items-center mb-6">
                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">คำถามที่ {qIndex + 1} จาก {questions.length}</span>
                                                    {questions[qIndex].hasKey && (
                                                        <span className="text-xs font-bold bg-blue-50 text-secondary px-3 py-1 rounded-full">มีคำตอบอ้างอิงให้เทียบ</span>
                                                    )}
                                                </div>

                                                <h3 className="text-xl font-bold text-slate-800 mb-6 leading-tight">
                                                    {questions[qIndex].q}
                                                </h3>

                                                <textarea
                                                    value={answerText}
                                                    onChange={e => setAnswerText(e.target.value)}
                                                    disabled={revealed}
                                                    rows={5}
                                                    placeholder="พิมพ์คำตอบของคุณที่นี่..."
                                                    className="w-full border-2 border-slate-200 focus:border-secondary outline-none rounded-xl p-4 text-sm text-slate-700 resize-none disabled:bg-slate-50"
                                                />

                                                <div className="mt-6">
                                                    {!revealed ? (
                                                        <button
                                                            onClick={submitAnswer}
                                                            disabled={!answerText.trim()}
                                                            className={`w-full py-3 rounded-xl font-bold text-sm transition-all ${answerText.trim() ? 'bg-primary text-white hover:bg-slate-800 shadow-md' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                                                        >
                                                            ส่งคำตอบ
                                                        </button>
                                                    ) : (
                                                        <div className="animate-fade-in-up">
                                                            {questions[qIndex].hasKey ? (
                                                                <div className="p-4 rounded-xl mb-4 border bg-blue-50 border-blue-100">
                                                                    <h4 className="font-bold mb-1 text-secondary">คำตอบอ้างอิง</h4>
                                                                    <p className="text-sm text-slate-700 leading-relaxed mb-4">{questions[qIndex].refAnswer}</p>
                                                                    {selfMark === null ? (
                                                                        <div className="flex gap-3">
                                                                            <p className="text-xs text-slate-500 self-center mr-2">เทียบกับคำตอบคุณเองแล้ว ตรงไหม?</p>
                                                                            <button onClick={() => markSelf(true)} className="px-4 py-2 rounded-lg bg-success text-white text-xs font-bold">ตอบถูก (+100 XP)</button>
                                                                            <button onClick={() => markSelf(false)} className="px-4 py-2 rounded-lg bg-slate-200 text-slate-600 text-xs font-bold">ยังไม่ถูก</button>
                                                                        </div>
                                                                    ) : (
                                                                        <p className={`text-sm font-semibold ${selfMark === 'correct' ? 'text-success' : 'text-slate-500'}`}>
                                                                            {selfMark === 'correct' ? '🎉 บันทึกว่าตอบถูกแล้ว' : '💡 ไม่เป็นไร ลองทบทวนประเด็นสำคัญด้านบนอีกครั้ง'}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                            ) : (
                                                                <div className="p-4 rounded-xl mb-4 border bg-emerald-50 border-emerald-200">
                                                                    <h4 className="font-bold text-emerald-700 mb-1">✅ บันทึกคำตอบแล้ว (+50 XP)</h4>
                                                                    <p className="text-sm text-slate-600">หัวข้อนี้ยังไม่มีคำตอบอ้างอิงในระบบ ลองนำคำตอบไปทบทวนกับเอกสาร/ผู้เชี่ยวชาญเพิ่มเติมได้</p>
                                                                </div>
                                                            )}
                                                            {(questions[qIndex].hasKey ? selfMark !== null : true) && (
                                                                <button
                                                                    onClick={nextQuestion}
                                                                    className="w-full py-3 bg-secondary text-white rounded-xl font-bold text-sm hover:bg-blue-600 shadow-md transition-all"
                                                                >
                                                                    {qIndex < questions.length - 1 ? 'ข้อต่อไป' : 'ดูสรุปผล'}
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </>
                                        ) : (
                                            <div className="text-center py-12">
                                                <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                                    <Trophy className="w-12 h-12 text-accent" />
                                                </div>
                                                <h2 className="text-2xl font-bold text-slate-800 mb-2">เขียนตอบครบทุกข้อแล้ว!</h2>
                                                <p className="text-slate-500 mb-8">หัวข้อ "{topic.title}" — {questions.length} ข้อ</p>
                                                <button
                                                    onClick={restartTopic}
                                                    className="px-6 py-3 border-2 border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 transition-colors"
                                                >
                                                    ทำแบบฝึกอีกครั้ง
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
