                    }
                    if (!this.tokenClient) {
                        this.tokenClient = google.accounts.oauth2.initTokenClient({
                            client_id: DRIVE_CLIENT_ID,
                            scope: DRIVE_SCOPE,
                            callback: (resp) => {
                                if (resp.error) { reject(new Error(resp.error)); return; }
                                this.accessToken = resp.access_token;
                                resolve(this.accessToken);
                            },
                        });
                    }
                    this.tokenClient.requestAccessToken({ prompt: this.accessToken ? '' : 'consent' });
                });
            },
            async ensureFolder() {
                if (this.folderId) return this.folderId;
                const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาโฟลเดอร์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                if (data.files && data.files.length) { this.folderId = data.files[0].id; return this.folderId; }
                const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
                    method: 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
                });
                if (!createRes.ok) throw new Error('สร้างโฟลเดอร์ไม่สำเร็จ (HTTP ' + createRes.status + ')');
                const createData = await createRes.json();
                this.folderId = createData.id;
                return this.folderId;
            },
            async findFile(name, folderId) {
                const q = encodeURIComponent(`name='${name}' and '${folderId}' in parents and trashed=false`);
                const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ค้นหาไฟล์ไม่สำเร็จ (HTTP ' + res.status + ')');
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },
            async downloadFile(fileId) {
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: 'Bearer ' + this.accessToken } });
                if (!res.ok) throw new Error('ดาวน์โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
            async uploadFile(name, folderId, existingId, obj) {
                const form = new FormData();
                const metadata = existingId ? {} : { name, parents: [folderId] };
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', new Blob([JSON.stringify(obj)], { type: 'application/json' }));
                const url = existingId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
                    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
                const res = await fetch(url, { method: existingId ? 'PATCH' : 'POST',
                    headers: { Authorization: 'Bearer ' + this.accessToken }, body: form });
                if (!res.ok) throw new Error('บันทึกขึ้น Drive ไม่สำเร็จ (HTTP ' + res.status + ')');
                return res.json();
            },
        };

        function App() {
            const [view, setView] = useState('stream'); // 'stream' | 'classwork'
            const [activeSubject, setActiveSubject] = useState('business');
            const [activeTopicId, setActiveTopicId] = useState(SUBJECTS[1].topics[0].id);
            const [activeTab, setActiveTab] = useState('quiz');
            const [openGroups, setOpenGroups] = useState({ law: false, business: true, engineering: false });
            const [qIndex, setQIndex] = useState(0);
            const [answerText, setAnswerText] = useState('');
            const [revealed, setRevealed] = useState(false);
            const [selfMark, setSelfMark] = useState(null); // 'correct' | 'wrong'
            const [xp, setXp] = useState(loadXp());
            const [written, setWritten] = useState(loadWritten());
            const [completed, setCompleted] = useState(loadCompleted());
            const [notes, setNotes] = useState(loadNotes());
            const [syncing, setSyncing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('');
            const [mobileNavOpen, setMobileNavOpen] = useState(false);

            useEffect(() => { lucide.createIcons(); });
            useEffect(() => { saveXp(xp); }, [xp]);
            useEffect(() => { saveWritten(written); }, [written]);
            useEffect(() => { saveCompleted(completed); }, [completed]);
            useEffect(() => { saveNotes(notes); }, [notes]);

            const syncNow = async () => {
                setSyncing(true);
                setSyncStatus('กำลังเชื่อมต่อ Google...');
                try {
                    await DriveSync.ensureAuth();
                    setSyncStatus('กำลังซิงก์...');
                    const folderId = await DriveSync.ensureFolder();
                    const existing = await DriveSync.findFile(DRIVE_FILE_NAME, folderId);
                    const remote = existing ? await DriveSync.downloadFile(existing.id) : null;

                    const mergedXp = Math.max(xp, remote?.xp || 0);
                    const mergedCompleted = { ...(remote?.completed || {}), ...completed };
                    const mergedWritten = { ...(remote?.written || {}), ...written };
                    const mergedNotes = mergeNotes(remote?.notes, notes);

                    setXp(mergedXp);
                    setCompleted(mergedCompleted);
                    setWritten(mergedWritten);
                    setNotes(mergedNotes);

                    await DriveSync.uploadFile(DRIVE_FILE_NAME, folderId, existing?.id,
                        { xp: mergedXp, completed: mergedCompleted, written: mergedWritten, notes: mergedNotes, savedAt: new Date().toISOString() });
                    setSyncStatus('✅ ซิงก์สำเร็จ');
                } catch (e) {
                    setSyncStatus('❌ ' + (e.message || e));
                } finally {
                    setSyncing(false);
                }
            };

            const subject = SUBJECTS.find(s => s.id === activeSubject);
            const topic = subject.topics.find(t => t.id === activeTopicId) || subject.topics[0];

            const questions = useMemo(() => {
                if (topic.kind === 'quiz') {
                    return topic.data.quiz.map(q => ({ q: q.q, refAnswer: q.options[q.answer], hasKey: true }));
                }
                return reflectionPrompts(topic.title).map(q => ({ q, refAnswer: null, hasKey: false }));
            }, [topic]);

            const level = Math.floor(xp / 250) + 1;

            const noteKey = `${activeSubject}:${topic.id}`;
            const noteText = (notes[noteKey] && notes[noteKey].text) || '';
            const updateNote = (text) => setNotes(n => ({ ...n, [noteKey]: { text, updatedAt: Date.now() } }));

            const allTopics = useMemo(() => SUBJECTS.flatMap(s => s.topics.map(t => ({ subjId: s.id, subjLabel: s.label, ...t }))), []);
            const totalTopics = allTopics.length;
            const completedCount = allTopics.filter(t => completed[`${t.subjId}:${t.id}`]).length;
            const todoTopics = allTopics.filter(t => !completed[`${t.subjId}:${t.id}`]);
            const subjectStats = SUBJECTS.map(s => ({
                ...s,
                done: s.topics.filter(t => completed[`${s.id}:${t.id}`]).length,
                total: s.topics.length,
            }));

            const selectTopic = (subjId, topicId) => {
                setActiveSubject(subjId);
                setActiveTopicId(topicId);
                setActiveTab('quiz');
                setQIndex(0);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
                setView('classwork');
                setMobileNavOpen(false);
            };

            const openSubject = (subjId) => {
                setActiveSubject(subjId);
                setOpenGroups(g => ({ ...g, [subjId]: true }));
                setView('classwork');
            };

            const submitAnswer = () => {
                if (!answerText.trim()) return;
                setRevealed(true);
                const key = `${topic.id}:${qIndex}`;
                setWritten(w => ({ ...w, [key]: answerText.trim() }));
                if (!questions[qIndex].hasKey) setXp(x => x + 50);
            };

            const markSelf = (correct) => {
                setSelfMark(correct ? 'correct' : 'wrong');
                if (correct) setXp(x => x + 100);
            };

            const nextQuestion = () => {
                setQIndex(i => i + 1);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
            };

            const restartTopic = () => {
                setQIndex(0);
                setAnswerText('');
                setRevealed(false);
                setSelfMark(null);
            };

            const isDone = qIndex >= questions.length;

            useEffect(() => {
                if (!isDone) return;
                const key = `${activeSubject}:${topic.id}`;
                if (!completed[key]) setCompleted(c => ({ ...c, [key]: true }));
            }, [isDone, activeSubject, topic.id]);

            return (
                <div className="h-screen w-full flex flex-col bg-slate-50 font-sans">

                    <header className="min-h-[64px] bg-white border-b border-slate-200 flex items-center flex-wrap gap-y-2 justify-between px-4 sm:px-6 py-2 shrink-0 z-10">

                                <Menu />

                                <div className="mt-6 flex items-center gap-4 flex-wrap">

                                        <Trophy /><span className="text-sm font-bold">Level {level}</span>

                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                {subjectStats.map(s => (

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-white rounded-xl border border-slate-200 p-5">
                                    <h3 className="font-bold text-slate-800 mb-4 flex items-center gap-2"><Target /> งานที่ยังไม่เสร็จ</h3>
                                    {todoTopics.length === 0 ? (

                                        <div className="space-y-1">

                                                </button>

                                        </div>

                                </div>
                                <div className="bg-white rounded-xl border border-slate-200 p-5">

                        <aside className={`fixed md:static inset-y-0 left-0 z-40 w-80 bg-white border-r border-slate-200 overflow-y-auto flex flex-col shrink-0 p-4 transform transition-transform duration-200 md:translate-x-0 ${mobileNavOpen ? 'translate-x-0' : '-translate-x-full'}`}>

                            {SUBJECTS.map(s => (

                                    {openGroups[s.id] && (

                                                        <span className="leading-tight">{t.title}</span>

                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 sm:p-6 flex justify-center">
                            <div className="w-full max-w-3xl">

                                <div className="w-full aspect-video bg-slate-900 rounded-2xl shadow-lg relative mb-6">

                                <div className="flex gap-4 border-b border-slate-200 mb-6">
                                    <button
                                        onClick={() => setActiveTab('summary')}

                                    >

                                    </button>

                                        onClick={() => setActiveTab('quiz')}
                                        className={`pb-3 px-2 text-sm font-semibold flex items-center gap-2 transition-colors ${activeTab === 'quiz' ? 'text-secondary border-b-2 border-secondary' : 'text-slate-400 hover:text-slate-700'}`}
                                    >
                                        <Target /> แบบฝึกเขียนตอบ <span className="bg-accent text-white text-[10px] px-1.5 py-0.5 rounded-full">เขียนเอง ไม่ใช่ตัวเลือก</span>

                                    <button
                                        onClick={() => setActiveTab('notes')}

                                    </button>

                                {activeTab === 'notes' ? (

                                        <h3 className="text-xl font-bold mb-1 flex items-center gap-2"><NotebookIcon /> โน้ตของฉัน — {topic.title}</h3>
                                        <p className="text-xs text-slate-400 mb-4">
                                            {notes[noteKey] ? `บันทึกล่าสุด ${new Date(notes[noteKey].updatedAt).toLocaleString('th-TH')}` : 'ยังไม่มีโน้ตสำหรับหัวข้อนี้ — พิมพ์ด้านล่างได้เลย บันทึกอัตโนมัติ'}
                                        </p>
                                        <textarea
                                            value={noteText}
                                            onChange={e => updateNote(e.target.value)}
                                            rows={10}
                                            placeholder="จดสรุป คำจำกัดความ หรือประเด็นที่อยากจำไว้สำหรับหัวข้อนี้... (เหมือนสมุดโน้ตส่วนตัว)"
                                            className="w-full border-2 border-slate-200 focus:border-secondary outline-none rounded-xl p-4 text-sm text-slate-700 resize-y font-sans leading-relaxed"
                                        />
                                    </div>
                                ) : activeTab === 'summary' ? (
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="text-xl font-bold mb-4 flex items-center gap-2"><Bookmark /> {topic.title}</h3>
                                        {topic.kind === 'quiz' ? (
                                            <>
                                                <p className="text-slate-600 mb-4">{topic.data.overview}</p>
                                                <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">ประเด็นสำคัญ</h4>
                                                <ul className="space-y-2">
                                                    {topic.data.keyConcepts.map((k, i) => (
                                                        <li key={i} className="flex items-start gap-2 text-sm text-slate-700">
                                                            <span className="text-secondary mt-1">&bull;</span> {k}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </>
                                        ) : (
                                            <p className="text-slate-600 leading-relaxed">
                                                หัวข้อนี้ยังไม่มีเนื้อหาสรุปแบบมีโครงสร้างในระบบ — ใช้แท็บ "แบบฝึกเขียนตอบ"
                                                เพื่อฝึกอธิบายหลักการของ "{topic.title}" ด้วยตัวเองแทนได้เลย
                                            </p>

                                    </div>
                                ) : (
                                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden">

                                            <>
                                                <div className="flex justify-between items-center mb-6">
                                                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">คำถามที่ {qIndex + 1} จาก {questions.length}</span>

                                                        <span className="text-xs font-bold bg-blue-50 text-secondary px-3 py-1 rounded-full">มีคำตอบอ้างอิงให้เทียบ</span>

                                                    disabled={revealed}
                                                    rows={5}
                                                    placeholder="พิมพ์คำตอบของคุณที่นี่..."
                                                    className="w-full border-2 border-slate-200 focus:border-secondary outline-none rounded-xl p-4 text-sm text-slate-700 resize-none disabled:bg-slate-50"
                                                />

                                                <div className="mt-6">
                                                    {!revealed ? (
                                                        <button
                                                            onClick={submitAnswer}
                                                            disabled={!answerText.trim()}
                                                            className={`w-full py-3 rounded-xl font-bold text-sm transition-all ${answerText.trim() ? 'bg-primary text-white hover:bg-slate-800 shadow-md' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                                                        >
                                                            ส่งคำตอบ
                                                        </button>
                                                    ) : (
                                                        <div className="animate-fade-in-up">
                                                            {questions[qIndex].hasKey ? (
                                                                <div className="p-4 rounded-xl mb-4 border bg-blue-50 border-blue-100">
                                                                    <h4 className="font-bold mb-1 text-secondary">คำตอบอ้างอิง</h4>
                                                                    <p className="text-sm text-slate-700 leading-relaxed mb-4">{questions[qIndex].refAnswer}</p>
                                                                    {selfMark === null ? (
                                                                        <div className="flex gap-3">
                                                                            <p className="text-xs text-slate-500 self-center mr-2">เทียบกับคำตอบคุณเองแล้ว ตรงไหม?</p>
                                                                            <button onClick={() => markSelf(true)} className="px-4 py-2 rounded-lg bg-success text-white text-xs font-bold">ตอบถูก (+100 XP)</button>
                                                                            <button onClick={() => markSelf(false)} className="px-4 py-2 rounded-lg bg-slate-200 text-slate-600 text-xs font-bold">ยังไม่ถูก</button>
                                                                        </div>
                                                                    ) : (
                                                                        <p className={`text-sm font-semibold ${selfMark === 'correct' ? 'text-success' : 'text-slate-500'}`}>
                                                                            {selfMark === 'correct' ? '🎉 บันทึกว่าตอบถูกแล้ว' : '💡 ไม่เป็นไร ลองทบทวนประเด็นสำคัญด้านบนอีกครั้ง'}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                            ) : (
                                                                <div className="p-4 rounded-xl mb-4 border bg-emerald-50 border-emerald-200">
                                                                    <h4 className="font-bold text-emerald-700 mb-1">✅ บันทึกคำตอบแล้ว (+50 XP)</h4>
                                                                    <p className="text-sm text-slate-600">หัวข้อนี้ยังไม่มีคำตอบอ้างอิงในระบบ ลองนำคำตอบไปทบทวนกับเอกสาร/ผู้เชี่ยวชาญเพิ่มเติมได้</p>
                                                                </div>
                                                            )}
                                                            {(questions[qIndex].hasKey ? selfMark !== null : true) && (
                                                                <button
                                                                    onClick={nextQuestion}
                                                                    className="w-full py-3 bg-secondary text-white rounded-xl font-bold text-sm hover:bg-blue-600 shadow-md transition-all"
                                                                >
                                                                    {qIndex < questions.length - 1 ? 'ข้อต่อไป' : 'ดูสรุปผล'}
                                                                </button>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </>
                                        ) : (
                                            <div className="text-center py-12">
                                                <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                                    <Trophy className="w-12 h-12 text-accent" />
                                                </div>
                                                <h2 className="text-2xl font-bold text-slate-800 mb-2">เขียนตอบครบทุกข้อแล้ว!</h2>
                                                <p className="text-slate-500 mb-8">หัวข้อ "{topic.title}" — {questions.length} ข้อ</p>
                                                <button
                                                    onClick={restartTopic}
                                                    className="px-6 py-3 border-2 border-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-50 transition-colors"
                                                >
                                                    ทำแบบฝึกอีกครั้ง
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </main>
                    </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
