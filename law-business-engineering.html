<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องเรียน | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12A594">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body.ome-tool-page{font-family:var(--ome-f);background:var(--bg,#F6F7FB);color:var(--ink,#1F2430);
  line-height:1.7;font-size:15px;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:60px auto 0;text-align:center}
h1{font-size:20px;font-weight:700;margin-bottom:10px}
p{color:var(--muted,#727C93);font-size:14px;margin-bottom:22px}
.links{display:flex;flex-direction:column;gap:10px}
.links a{display:block;background:var(--card,#fff);border-radius:12px;box-shadow:0 1px 2px rgba(24,31,54,.05),0 8px 24px rgba(24,31,54,.06);
  padding:16px;text-decoration:none;color:var(--ink,#1F2430);font-weight:600}
.links a:hover{outline:1.5px solid var(--brand,#12A594)}
</style>
<script>
/* หน้านี้ถูกแทนที่ด้วย classroom-law.html / classroom-business.html / classroom-engineering.html
   (แยกเป็นไฟล์จริงแยกวิชา — ไม่แชร์ XP/สอบรวมข้ามวิชากันแล้ว)
   คงไฟล์นี้ไว้เป็น redirect เฉยๆ เพราะแอปเก่า (app.html) มีลิงก์ฝังตรงมาที่
   law-business-engineering.html#law / #business / #engineering อยู่ (แก้ bundle เดิมไม่ได้) */
(function () {
  'use strict';
  var MAP = { law: 'classroom-law.html', business: 'classroom-business.html', engineering: 'classroom-engineering.html' };
  var target = MAP[location.hash.slice(1)];
  if (target) location.replace(target);
})();
</script>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap">
  <h1>ห้องเรียน</h1>
  <p>เลือกวิชาที่ต้องการเรียน — แยกไฟล์กันแล้วเพื่อไม่ให้ XP/สอบรวมของแต่ละวิชาปนกัน</p>
  <div class="links">
    <a href="classroom-law.html">⚖️ ความรู้กฎหมาย</a>
    <a href="classroom-business.html">💼 ธุรกิจและการบริหาร</a>
    <a href="classroom-engineering.html">🔧 วิศวกรรม</a>
  </div>
</div>
</body>
</html>
