<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรียนดนตรี | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/crumb/สลับภาษา มาจาก theme.css (data-layout="reader") */
.mx-page{max-width:1160px}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.crumb-row .crumb{margin-bottom:0}
.mx-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.mx-head-icon .ome-icon{width:24px;height:24px}
.mx-page .page-head{margin-bottom:var(--ome-sp-4)}

/* ── แถบเกม: เลเวล/XP/สตรีค/เหรียญตรา ── */
.mx-gamebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:var(--ome-sp-4)}
.mx-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.mx-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ome-accent);color:var(--ome-on-accent);
  font-weight:700;font-size:var(--ome-fs-base);display:flex;align-items:center;justify-content:center}
.mx-level-info{flex:1;min-width:0}
.mx-level-title{font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:4px}
.mx-xp-track{height:6px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.mx-xp-fill{height:100%;width:0;background:var(--ome-accent);border-radius:inherit;transition:width var(--ome-dur-3) var(--ome-ease)}
.mx-streak-chip{display:flex;align-items:center;gap:5px;font-size:var(--ome-fs-base);font-weight:700;color:var(--ome-warn-ink);
  background:var(--ome-warn-soft);padding:6px 12px;border-radius:var(--ome-radius-pill);flex-shrink:0}
.mx-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1px solid var(--ome-border)}
.mx-badge{width:30px;height:30px;border-radius:var(--ome-radius-md);display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--ome-surface-2);border:1px solid var(--ome-border);opacity:.35;filter:grayscale(1);cursor:default}
.mx-badge.earned{opacity:1;filter:none;background:var(--ome-accent-soft);border-color:var(--ome-accent)}
@media(max-width:600px){.mx-gamebar{flex-direction:column;align-items:stretch}
  .mx-level-chip{flex:none}
  .mx-streak-chip{align-self:flex-start}
  .mx-badge-row{justify-content:center;border-left:0;padding-left:0;padding-top:10px;border-top:1px solid var(--ome-border)}}

.mx-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:var(--ome-z-toast);pointer-events:none;max-width:calc(100vw - 40px)}
.mx-toast{background:var(--ome-surface-1);border:1px solid var(--ome-accent);border-radius:var(--ome-radius-md);padding:10px 16px;font-size:var(--ome-fs-sm);
  font-weight:600;box-shadow:var(--ome-shadow-3);display:flex;align-items:center;gap:8px;max-width:280px;animation:mx-toast-in var(--ome-dur-3) var(--ome-ease)}
@keyframes mx-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.mx-toast.leaving{animation:mx-toast-out .3s ease forwards}
@keyframes mx-toast-out{to{transform:translateY(8px);opacity:0}}

.mx-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--ome-card-r);z-index:5}
.mx-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:mx-confetti-fall linear forwards}
@keyframes mx-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.mx-confetti{display:none}.mx-toast{animation:none}}

/* ── เมนูเลือกบทเรียน (แผงเลื่อนลง จัดกลุ่มตามหมวด) ── */
.mx-track-menu{position:relative;margin-bottom:var(--ome-sp-4)}
.mx-track-menu-btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;border:1px solid var(--ome-border);
  border-radius:var(--ome-radius-md);background:var(--ome-surface-1);color:var(--ome-text-1);font-size:var(--ome-fs-sm);font-weight:600;cursor:pointer;
  transition:border-color var(--ome-dur-1),background var(--ome-dur-1)}
.mx-track-menu-btn:hover{border-color:var(--ome-border-strong);background:var(--ome-surface-2)}
.mx-track-menu-btn.open{border-color:var(--ome-accent);background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.mx-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.mx-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:transform var(--ome-dur-2) var(--ome-ease),opacity var(--ome-dur-2)}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(2){opacity:0}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}
.mx-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:var(--ome-z-popover);min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-3);padding:10px}
.mx-track-menu-panel.open{display:block}
.mx-track-group-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ome-text-2);padding:10px 10px 6px}
.mx-track-menu-item{display:block;width:100%;text-align:left;font-size:var(--ome-fs-sm);font-weight:600;padding:9px 12px;border:0;
  border-radius:var(--ome-radius-md);background:transparent;color:var(--ome-text-1);cursor:pointer}
.mx-track-menu-item:hover{background:var(--ome-surface-2)}
.mx-track-menu-item.active{background:var(--ome-accent);color:var(--ome-on-accent)}

/* ── แถบข้างรายการบทเรียน + พื้นที่เนื้อหา ── */
.mx-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.mx-layout{grid-template-columns:1fr}}
@media(min-width:821px){.mx-sidebar{position:sticky;top:calc(var(--ome-nav-h) + 16px);max-height:calc(100vh - var(--ome-nav-h) - 32px);overflow-y:auto}}
.mx-item-list{display:flex;flex-direction:column;gap:6px}
.mx-item{display:flex;align-items:center;gap:8px;text-align:left;background:var(--ome-surface-1);border:1px solid var(--ome-border);
  border-radius:var(--ome-radius-md);padding:10px 12px;cursor:pointer;font-size:var(--ome-fs-sm);color:var(--ome-text-1);
  transition:border-color var(--ome-dur-1),background var(--ome-dur-1)}
.mx-item .ome-icon{color:var(--ome-text-2)}
.mx-item:hover{border-color:var(--ome-accent)}
.mx-item.active{border-color:var(--ome-accent);background:var(--ome-accent-soft);color:var(--ome-accent-strong);font-weight:600}
.mx-item.active .ome-icon{color:inherit}
.mx-item.locked{opacity:.55;cursor:not-allowed}
.mx-item.locked:hover{border-color:var(--ome-border)}
.mx-lock-msg{display:none;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:8px}
.mx-main{position:relative;padding:22px}
.mx-item-heading{font-size:var(--ome-fs-lg);font-weight:700;margin-bottom:8px;color:var(--ome-accent-strong)}
.mx-instructions{margin-bottom:14px}
.mx-instructions p{margin:0 0 10px}
.mx-instructions p:last-child{margin-bottom:0}
.mx-staff-wrap{background:var(--ome-surface-2);border-radius:var(--ome-radius-md);padding:20px 12px;margin-bottom:16px}
.mx-quiz-prompt{font-size:var(--ome-fs-base);font-weight:600;text-align:center;margin-bottom:4px}
.mx-answer-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mx-answer-btn{font-size:var(--ome-fs-md);font-weight:700;width:44px;height:44px;border-radius:var(--ome-radius-md);
  border:1px solid var(--ome-border);background:var(--ome-surface-1);color:var(--ome-text-1);cursor:pointer;
  transition:border-color var(--ome-dur-1),background var(--ome-dur-1)}
.mx-answer-btn:hover:not(:disabled){border-color:var(--ome-accent);color:var(--ome-accent-strong)}
.mx-answer-btn:disabled{opacity:.5;cursor:default}
.mx-answer-btn.wide{width:auto;height:auto;padding:12px 16px;font-size:var(--ome-fs-sm)}
.mx-answer-btn.correct{background:var(--ome-ok-soft);border-color:var(--ome-ok);color:var(--ome-ok-ink)}
.mx-answer-btn.wrong{background:var(--ome-err-soft);border-color:var(--ome-err);color:var(--ome-err-ink);animation:mx-shake .35s}
@keyframes mx-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.mx-answer-btn.wrong{animation:none}}
.mx-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.mx-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:var(--ome-radius-md);font-size:var(--ome-fs-sm);font-weight:600}
.mx-result-banner.pass{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.mx-result-banner.fail{background:var(--ome-warn-soft);color:var(--ome-warn-ink)}
@media(max-width:600px){.mx-main{padding:16px}}
</style>
</head>
<body data-layout="reader">
<script src="auth-gate.js"></script>
<main class="page mx-page" id="musicRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbMusic">เรียนดนตรี</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head">
  <span class="mx-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-music"/></svg></span>
  <h1 data-i18n="pageTitle">เรียนดนตรี</h1>
</div>

<div class="mx-gamebar card" id="gameBar">
  <div class="mx-level-chip">
    <div class="mx-level-num" id="levelNum">1</div>
    <div class="mx-level-info">
      <div class="mx-level-title" id="levelTitleEl">—</div>
      <div class="mx-xp-track"><div class="mx-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="mx-streak-chip" id="streakChip"><span id="streakCount">0</span></div>
  <div class="mx-badge-row" id="badgeRow"></div>
</div>

<div class="mx-track-menu">
  <button class="mx-track-menu-btn" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="mx-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="mx-track-menu-panel" id="trackMenuPanel" role="menu"></div>
</div>

<div class="mx-layout">
  <div class="mx-sidebar">
    <div class="mx-lock-msg" id="lockMsg"></div>
    <div class="mx-item-list" id="itemList"></div>
  </div>

  <div class="mx-main card">
    <div class="mx-confetti" id="confettiLayer"></div>
    <div class="mx-item-heading" id="itemHeading"></div>
    <div class="mx-instructions prose" id="instructionsBox"></div>

    <div class="mx-staff-wrap" id="staffWrap" style="display:none">
      <div class="mx-quiz-prompt" id="quizPrompt"></div>
      <div id="staffSvgHolder"></div>
      <div class="mx-answer-row" id="answerRow"></div>
    </div>

    <div class="mx-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="mx-result-banner" id="resultBanner"></div>
  </div>
</div>

<div class="mx-toast-wrap" id="toastWrap"></div>
</main>
<script src="music.js"></script>
</body>
</html>
