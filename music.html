<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรียนดนตรี | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7C3AED">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --mx:#7C3AED; --mx-dk:#5B21B6; --mx-sf:#F1EAFE; --mx2:#DB2777;
  --ok:#17B26A; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
}
[data-theme="dark"] body.ome-tool-page{--mx-sf:#2A1F42}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto}

.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 0;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--mx);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}
.lang-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--line);border:none;border-radius:20px;
  padding:3px;cursor:pointer;font-family:var(--f);flex-shrink:0}
.lang-toggle span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;color:var(--muted);transition:.15s}
.lang-toggle span.active{background:var(--card);color:var(--mx-dk);box-shadow:0 1px 3px rgba(24,31,54,.08)}

.mx-head{display:flex;align-items:flex-start;gap:16px;margin-top:16px}
.mx-head-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--mx),var(--mx2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(124,58,237,.35);
  animation:mx-icon-glow 3.5s ease-in-out infinite;font-size:26px}
@keyframes mx-icon-glow{0%,100%{box-shadow:0 8px 22px rgba(124,58,237,.35)}50%{box-shadow:0 8px 26px rgba(219,39,119,.4)}}
.mx-head h1{font-size:clamp(21px,3.6vw,28px);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),var(--mx-dk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}

/* ── แถบเกม: เลเวล/XP/สตรีค/เหรียญตรา — เหมือนหน้าการเขียนโค้ด ให้ประสบการณ์เว็บสอดคล้องกัน ── */
.mx-gamebar{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(24,31,54,.05);flex-wrap:wrap}
.mx-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.mx-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--mx),var(--mx2));
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(124,58,237,.3)}
.mx-level-info{flex:1;min-width:0}
.mx-level-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.mx-xp-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.mx-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mx),var(--mx2));border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.mx-streak-chip{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:#B45309;background:#FFF3E0;
  padding:6px 12px;border-radius:20px;flex-shrink:0}
[data-theme="dark"] .mx-streak-chip{background:#3A2C10;color:#F5C36B}
.mx-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1.5px solid var(--line)}
.mx-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--bg);border:1.5px solid var(--line);opacity:.35;filter:grayscale(1);transition:.2s;cursor:default}
.mx-badge.earned{opacity:1;filter:none;background:linear-gradient(135deg,var(--mx-sf),var(--card));border-color:var(--mx);
  box-shadow:0 2px 6px rgba(124,58,237,.2)}
@media(max-width:600px){.mx-gamebar{flex-direction:column;align-items:stretch}
  .mx-badge-row{justify-content:center;border-left:none;padding-left:0;padding-top:10px;border-top:1.5px solid var(--line)}}

.mx-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}
.mx-toast{background:var(--card);border:1.5px solid var(--mx);border-radius:12px;padding:10px 16px;font-size:13.5px;
  font-weight:700;color:var(--ink);box-shadow:0 8px 24px rgba(24,31,54,.16);display:flex;align-items:center;gap:8px;
  animation:mx-toast-in .35s cubic-bezier(.2,.8,.2,1);max-width:280px}
@keyframes mx-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.mx-toast.leaving{animation:mx-toast-out .3s ease forwards}
@keyframes mx-toast-out{to{transform:translateY(8px);opacity:0}}

.mx-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--r);z-index:5}
.mx-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:mx-confetti-fall linear forwards}
@keyframes mx-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}

/* ── เมนูเลือกบทเรียนแบบ hamburger panel — จัดกลุ่มตามหมวด รองรับการขยายบทเรียนเพิ่มในอนาคต ── */
.mx-track-menu{position:relative;margin-top:22px}
.mx-track-menu-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f);font-size:13.5px;font-weight:700;
  padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  cursor:pointer;transition:.18s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(24,31,54,.05)}
.mx-track-menu-btn:hover{border-color:var(--mx);color:var(--mx-dk);box-shadow:0 6px 14px rgba(124,58,237,.14)}
.mx-track-menu-btn.open{border-color:var(--mx);background:linear-gradient(135deg,var(--mx-sf),var(--card));color:var(--mx-dk)}
.mx-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.mx-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:.25s cubic-bezier(.2,.8,.2,1)}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(2){opacity:0}
.mx-track-menu-btn.open .mx-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}

.mx-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,31,54,.16);padding:10px}
.mx-track-menu-panel.open{display:block;animation:mx-panel-in .18s cubic-bezier(.2,.8,.2,1)}
@keyframes mx-panel-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.mx-track-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:10px 10px 6px}
.mx-track-menu-item{display:block;width:100%;text-align:left;font-family:var(--f);font-size:13.5px;font-weight:600;
  padding:9px 12px;border:none;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;transition:.15s}
.mx-track-menu-item:hover{background:var(--mx-sf);color:var(--mx-dk)}
.mx-track-menu-item.active{background:linear-gradient(135deg,var(--mx),var(--mx2));color:#fff;font-weight:700}

.mx-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:820px){.mx-layout{grid-template-columns:1fr}}
@media(min-width:821px){.mx-sidebar{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}}

.mx-item-list{display:flex;flex-direction:column;gap:6px}
.mx-item{display:flex;align-items:center;gap:8px;font-family:var(--f);text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink);
  transition:.18s cubic-bezier(.2,.8,.2,1)}
.mx-item:hover{border-color:var(--mx);transform:translateX(3px);box-shadow:0 4px 10px rgba(124,58,237,.1)}
.mx-item.active{border-color:transparent;background:linear-gradient(135deg,var(--mx-sf),var(--card));
  color:var(--mx-dk);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--mx)}
.mx-item.locked{opacity:.55;cursor:not-allowed}
.mx-item.locked:hover{border-color:var(--line);transform:none;box-shadow:none}
.mx-lock-msg{display:none;background:#FFF3E0;color:#9A5A00;border-radius:10px;padding:8px 12px;font-size:12.5px;
  font-weight:600;margin-bottom:8px}
[data-theme="dark"] .mx-lock-msg{background:#3A2C10;color:#F5C36B}

.mx-main{background:var(--card);border-radius:var(--r);box-shadow:0 4px 10px rgba(24,31,54,.06),0 16px 32px rgba(124,58,237,.1);
  padding:22px;position:relative}
.mx-item-heading{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--mx-dk)}
.mx-instructions{font-size:13.5px;color:var(--ink);line-height:1.8;margin-bottom:14px}
.mx-instructions p{margin-bottom:10px}
.mx-instructions p:last-child{margin-bottom:0}

.mx-staff-wrap{background:var(--bg);border-radius:12px;padding:20px 12px;margin-bottom:16px;color:var(--ink)}
.mx-quiz-prompt{font-size:14px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:4px}

.mx-answer-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mx-answer-btn{font-family:var(--f);font-size:16px;font-weight:800;width:44px;height:44px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  transition:.15s cubic-bezier(.2,.8,.2,1)}
.mx-answer-btn:hover:not(:disabled){border-color:var(--mx);color:var(--mx-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(124,58,237,.14)}
.mx-answer-btn:disabled{opacity:.5;cursor:default}
.mx-answer-btn.wide{width:auto;height:auto;padding:12px 16px;font-size:13.5px;font-weight:700;border-radius:12px}
.mx-answer-btn.correct{background:#E7F9F0;border-color:var(--ok);color:#0F7A4E}
.mx-answer-btn.wrong{background:#FFE9EF;border-color:var(--err);color:#B3325A;animation:mx-shake .35s}
[data-theme="dark"] .mx-answer-btn.correct{background:#12301F;color:#5EDCA0}
[data-theme="dark"] .mx-answer-btn.wrong{background:#3A1F26;color:#F5A9BE}
@keyframes mx-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.mx-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:14px;font-weight:600;padding:10px 18px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.btn:hover:not(:disabled){border-color:var(--mx);color:var(--mx-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(124,58,237,.14)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--mx),var(--mx2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(124,58,237,.32)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}

.mx-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:700}
.mx-result-banner.pass{background:#E7F9F0;color:#0F7A4E}
.mx-result-banner.fail{background:#FFF3E0;color:#9A5A00}
[data-theme="dark"] .mx-result-banner.pass{background:#12301F;color:#5EDCA0}
[data-theme="dark"] .mx-result-banner.fail{background:#3A2C10;color:#F5C36B}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.mx-main{padding:16px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap" id="musicRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="documents.html" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbMusic">เรียนดนตรี</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="mx-head">
  <div class="mx-head-icon">🎼</div>
  <div>
    <h1 data-i18n="pageTitle">เรียนดนตรี</h1>
  </div>
</div>

<div class="mx-gamebar" id="gameBar">
  <div class="mx-level-chip">
    <div class="mx-level-num" id="levelNum">1</div>
    <div class="mx-level-info">
      <div class="mx-level-title" id="levelTitleEl">—</div>
      <div class="mx-xp-track"><div class="mx-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="mx-streak-chip" id="streakChip">🔥 <span id="streakCount">0</span></div>
  <div class="mx-badge-row" id="badgeRow"></div>
</div>

<div class="mx-track-menu">
  <button class="mx-track-menu-btn" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="mx-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="mx-track-menu-panel" id="trackMenuPanel" role="menu"></div>
</div>

<div class="mx-layout">
  <div class="mx-sidebar">
    <div class="mx-lock-msg" id="lockMsg"></div>
    <div class="mx-item-list" id="itemList"></div>
  </div>

  <div class="mx-main">
    <div class="mx-confetti" id="confettiLayer"></div>
    <div class="mx-item-heading" id="itemHeading"></div>
    <div class="mx-instructions" id="instructionsBox"></div>

    <div class="mx-staff-wrap" id="staffWrap" style="display:none">
      <div class="mx-quiz-prompt" id="quizPrompt"></div>
      <div id="staffSvgHolder"></div>
      <div class="mx-answer-row" id="answerRow"></div>
    </div>

    <div class="mx-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">✓ เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="mx-result-banner" id="resultBanner"></div>
  </div>
</div>

<div class="mx-toast-wrap" id="toastWrap"></div>
</div>
<script src="music.js"></script>
</body>
</html>
