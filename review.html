<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทบทวนวันนี้ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/KPI/segmented/list มาจาก theme.css (data-layout="reader") */
.rv-page{max-width:880px}
.rv-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.rv-head-icon .ome-icon{width:24px;height:24px}
.rv-page .page-head{margin-bottom:var(--ome-sp-4)}
.rv-page > * + *{margin-top:var(--ome-sp-4)}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi-value small{font-size:var(--ome-fs-sm);font-weight:600;color:var(--ome-text-2)}
.kpi .flame{width:20px;height:20px;color:var(--ome-warn);vertical-align:-2px}
.bar{height:8px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--ome-accent)}
.bar.ok > i{background:var(--ome-ok)}

.rv-days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.rv-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--ome-text-3)}
.rv-day i{display:block;width:100%;max-width:26px;aspect-ratio:1;border-radius:6px;background:var(--ome-surface-2);border:1px solid var(--ome-border)}
.rv-day.on i{background:var(--ome-accent);border-color:var(--ome-accent)}
.rv-day.goal i{background:var(--ome-ok);border-color:var(--ome-ok)}
.rv-day.today span{color:var(--ome-text-1);font-weight:700}

.rv-filter{display:flex;gap:6px;flex-wrap:wrap}
.rv-filter:not(:empty){margin-bottom:12px}
.rv-card{position:relative;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px 20px;
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);background:var(--ome-surface-0);cursor:pointer;text-align:center}
.rv-card:focus-visible{outline:2px solid var(--ome-accent);outline-offset:2px}
.rv-card .src{position:absolute;top:10px;left:12px}
.rv-card .q{font-size:22px;font-weight:700;color:var(--ome-text-1);line-height:1.45;overflow-wrap:anywhere}
.rv-card .a{display:none;padding-top:12px;border-top:1px dashed var(--ome-border);font-size:var(--ome-fs-md);line-height:1.7;color:var(--ome-text-1);
  white-space:pre-wrap;overflow-wrap:anywhere;text-align:left}
.rv-card.show .a{display:block}
.rv-rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rv-rate .btn{flex-direction:column;height:auto;min-height:48px;padding:6px 4px;gap:0;line-height:1.25}
.rv-rate .btn small{font-size:11px;font-weight:500;color:var(--ome-text-2)}
.rv-rate .again{border-color:var(--ome-err);color:var(--ome-err-ink)}
.rv-rate .hard{border-color:var(--ome-warn);color:var(--ome-warn-ink)}
.rv-rate .good{border-color:var(--ome-info);color:var(--ome-info-ink)}
.rv-rate .easy{border-color:var(--ome-ok);color:var(--ome-ok-ink)}
.rv-progress{margin-top:8px;font-size:var(--ome-fs-xs);color:var(--ome-text-2);text-align:center}
.rv-more{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.list-row :is(.title,.meta){display:block}
.list-row .val{font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0}
@media (max-width:480px){
  .rv-card .q{font-size:19px}
  .rv-day span{font-size:9px}
}
</style>
</head>
<body data-layout="reader">
<script src="auth-gate.js"></script>
<main class="page rv-page" id="rvRoot">
<div class="page-head">
  <span class="rv-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-refresh-cw"/></svg></span>
  <h1>ทบทวนวันนี้</h1>
</div>

<div class="kpi-grid" id="rvKpis"></div>

<div class="rv-days" id="rvDays" aria-label="14 วันล่าสุด"></div>

<section class="card" aria-labelledby="hDeck">
  <div class="card-head"><h2 id="hDeck">การ์ด</h2></div>
  <div class="rv-filter" id="rvFilter" role="group" aria-label="ที่มา"></div>
  <div id="rvArea"></div>
</section>

<section class="card" aria-labelledby="hSrc">
  <div class="card-head"><h2 id="hSrc">XP ตามที่มา</h2></div>
  <div class="list" id="rvSources"></div>
</section>

<section class="card" aria-labelledby="hSet">
  <div class="card-head"><h2 id="hSet">ตั้งค่า</h2></div>
  <div class="frow">
    <div class="field"><label for="rvGoal">เป้า XP ต่อวัน</label><select id="rvGoal"></select></div>
    <div class="field"><label for="rvRest">วันพักต่อสัปดาห์</label><select id="rvRest"></select></div>
  </div>
</section>
</main>
<script src="fsrs.js"></script>
<script src="learn-core.js"></script>
<script src="review.js"></script>
</body>
</html>
