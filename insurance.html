<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="insurance.title">ประกัน | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="insurance-calc.js" defer></script>
<script src="tanot-push.js" defer></script>
<script src="insurance.js" defer></script>
<style>
.ins-page{max-width:1080px}
.ins-page .stack > .card > .card-head{margin-bottom:var(--ome-sp-3)}
.ins-page .kpi-value{font-size:var(--ome-fs-xl)}
.ins-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ins-filter .segmented{max-width:100%;overflow-x:auto;scrollbar-width:none}
.ins-filter .segmented > button{white-space:nowrap;flex-shrink:0}
.ins-list .list-row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-tax .table :is(th,td){padding:10px 8px}
@media (min-width:641px){.ins-tax .table :is(th,td){padding:10px 14px}}
@media (max-width:640px){.ins-tax .table .cap{display:none}}
.ins-tax .table .tot td{font-weight:700;background:var(--ome-surface-2)}
[hidden]{display:none !important}
</style>
</head>
<body data-layout="tool">
<main class="page ins-page">
  <div class="page-head">
    <h1 data-i18n="insurance.h1">ประกัน</h1>
    <button class="btn primary" type="button" id="addBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="insurance.addPol">เพิ่มกรมธรรม์</span></button>
  </div>

  <div class="stack">
    <div class="kpi-grid" id="kpis"></div>

    <section class="card" aria-labelledby="hList">
      <div class="card-head">
        <h2 id="hList" data-i18n="insurance.hList">ทะเบียนกรมธรรม์</h2>
      </div>
      <div class="ins-filter">
        <div class="segmented" id="typeFilter" role="group" aria-label="ประเภท" data-i18n-attr="aria-label:insurance.type"></div>
      </div>
      <div class="ins-list" id="listBody"></div>
    </section>

    <section class="card ins-tax" aria-labelledby="hTax">
      <div class="card-head">
        <h2 id="hTax" data-i18n="insurance.hTax">เบี้ยลดหย่อนภาษี</h2>
        <select id="taxYear" class="select" aria-label="ปีภาษี" data-i18n-attr="aria-label:insurance.taxYear" style="width:auto"></select>
      </div>
      <div id="taxBody"></div>
    </section>
  </div>
</main>

<dialog class="dialog dialog-form" id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="form" novalidate>
    <div class="dialog-head"><h2 id="dlgTitle">กรมธรรม์</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="fType" data-i18n="insurance.type">ประเภท</label><select id="fType"></select></div>
        <div class="field"><label for="fInsurer" data-i18n="insurance.insurer">บริษัทประกัน</label><input id="fInsurer" type="text" maxlength="80" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="fName" data-i18n="insurance.planName">ชื่อแผน</label><input id="fName" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="fPolicyNo" data-i18n="insurance.policyNo">เลขกรมธรรม์</label><input id="fPolicyNo" type="text" maxlength="60" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="fInsured" data-i18n="insurance.insured">ผู้เอาประกัน / ทะเบียนรถ / ที่ตั้ง</label><input id="fInsured" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="fSum" data-i18n="insurance.sum">ทุนประกัน (บาท)</label><input id="fSum" type="number" inputmode="decimal" min="0" step="any"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="fPremium" data-i18n="insurance.premium">เบี้ยต่องวด (บาท)</label><input id="fPremium" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="fFreq" data-i18n="insurance.freq">การจ่าย</label><select id="fFreq"></select></div>
      </div>
      <div class="frow">
        <div class="field"><label for="fStart" data-i18n="insurance.start">วันเริ่มคุ้มครอง</label><input id="fStart" type="date"></div>
        <div class="field"><label for="fRenew" data-i18n="insurance.renew">วันต่ออายุ / ครบกำหนดจ่าย</label><input id="fRenew" type="date"></div>
        <div class="field"><label for="fEnd" data-i18n="insurance.end">วันสิ้นสุด</label><input id="fEnd" type="date"></div>
      </div>
      <div class="frow" id="taxRow">
        <div class="field"><label for="fTaxCat" data-i18n="insurance.taxCat">ลดหย่อนภาษี</label><select id="fTaxCat"></select></div>
      </div>
      <label class="check" id="longRow"><input type="checkbox" id="fLong" checked><span data-i18n="insurance.long">สัญญา 10 ปีขึ้นไป</span></label>
      <div class="field"><label for="fNote" data-i18n="insurance.note">บันทึก</label><textarea id="fNote" rows="2" maxlength="500"></textarea></div>
      <div class="field" id="filesRow" hidden>
        <label data-i18n="insurance.files">ไฟล์กรมธรรม์</label>
        <div class="file-list" id="fileList"></div>
        <div class="row"><button class="btn sm" type="button" id="attachBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-upload"/></svg><span data-i18n="insurance.attach">แนบไฟล์</span></button></div>
        <input type="file" id="fileInput" accept="application/pdf,image/*" multiple hidden>
      </div>
      <p class="form-msg" id="msg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="delBtn" style="margin-right:auto" data-i18n="insurance.del">ลบ</button>
      <button class="btn" type="button" id="cancelBtn" data-i18n="insurance.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" id="saveBtn" data-i18n="insurance.save">บันทึก</button>
    </div>
  </form>
</dialog>
</body>
</html>
