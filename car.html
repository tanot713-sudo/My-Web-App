<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="car.title">บันทึกรถ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="car-calc.js" defer></script>
<script src="tanot-push.js" defer></script>
<script src="car.js" defer></script>
<style>
.car-page{max-width:1080px}
.car-page .stack > .card > .card-head{margin-bottom:var(--ome-sp-3)}
.car-page .kpi-value{font-size:var(--ome-fs-xl)}
.car-vehicle{display:flex;flex-direction:column;gap:var(--ome-sp-3)}
.car-vhead{display:flex;align-items:center;gap:var(--ome-sp-3);flex-wrap:wrap}
.car-vhead .grow{flex:1;min-width:0}
.car-vhead .title{font-weight:700;font-size:var(--ome-fs-lg)}
.car-vhead .meta,.car-dl .meta{color:var(--ome-text-2);font-size:var(--ome-fs-sm)}
.car-vhead .end{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.car-svc .list-row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none !important}
</style>
</head>
<body data-layout="tool">
<main class="page car-page">
  <div class="page-head">
    <h1 data-i18n="car.h1">บันทึกรถ</h1>
    <button class="btn primary" type="button" id="addBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="car.addCar">เพิ่มรถ</span></button>
  </div>

  <div class="stack">
    <div class="kpi-grid" id="kpis"></div>
    <div class="stack" id="vehicles"></div>
  </div>
</main>

<dialog class="dialog dialog-form" id="vdlg" aria-labelledby="vTitle">
  <form method="dialog" id="vform" novalidate>
    <div class="dialog-head"><h2 id="vTitle">รถ</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="vType" data-i18n="car.type">ประเภท</label><select id="vType" class="select"><option value="car" data-i18n="car.typeCar">รถยนต์</option><option value="motorcycle" data-i18n="car.typeMoto">รถจักรยานยนต์</option></select></div>
        <div class="field"><label for="vPlate" data-i18n="car.plate">ทะเบียน</label><input id="vPlate" type="text" maxlength="20" autocomplete="off"></div>
        <div class="field"><label for="vProv" data-i18n="car.prov">จังหวัด</label><input id="vProv" type="text" maxlength="40" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="vMake" data-i18n="car.make">ยี่ห้อ</label><input id="vMake" type="text" maxlength="40" autocomplete="off"></div>
        <div class="field"><label for="vModel" data-i18n="car.model">รุ่น</label><input id="vModel" type="text" maxlength="60" autocomplete="off"></div>
        <div class="field"><label for="vYear" data-i18n="car.year">ปีจดทะเบียน (ค.ศ.)</label><input id="vYear" type="number" inputmode="numeric" min="1950" max="2100" step="1"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="vOdo" data-i18n="car.odo">เลขไมล์ล่าสุด (กม.)</label><input id="vOdo" type="number" inputmode="numeric" min="0" step="any"></div>
        <div class="field"><label for="vOdoAt" data-i18n="car.odoAt">วันที่อ่านเลขไมล์</label><input id="vOdoAt" type="date"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="vAct" data-i18n="car.act">พ.ร.บ. หมดอายุ</label><input id="vAct" type="date"></div>
        <div class="field"><label for="vTax" data-i18n="car.tax">ภาษีรถครบกำหนด</label><input id="vTax" type="date"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="vIns" data-i18n="car.ins">ประกันภาคสมัครใจ หมดอายุ</label><input id="vIns" type="date"></div>
        <div class="field" id="vPolRow" hidden><label for="vPol" data-i18n="car.pol">กรมธรรม์ในหน้าประกัน</label><select id="vPol"></select></div>
      </div>
      <div class="frow">
        <div class="field"><label for="vInspect" data-i18n="car.inspect">ใบตรวจสภาพ (ตรอ.) หมดอายุ</label><input id="vInspect" type="date"></div>
      </div>
      <div class="field"><label for="vNote" data-i18n="car.note">บันทึก</label><textarea id="vNote" rows="2" maxlength="500"></textarea></div>
      <div class="field" id="vFilesRow" hidden>
        <label data-i18n="car.regBook">เล่มทะเบียน / ใบเสร็จ</label>
        <div class="file-list" id="vFileList"></div>
        <div class="row"><button class="btn sm" type="button" id="vAttach"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-upload"/></svg><span data-i18n="car.attach">แนบไฟล์</span></button></div>
        <input type="file" id="vFileInput" accept="application/pdf,image/*" multiple hidden>
      </div>
      <p class="form-msg" id="vMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="vDel" style="margin-right:auto" data-i18n="car.del">ลบ</button>
      <button class="btn" type="button" id="vCancel" data-i18n="car.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" id="vSave" data-i18n="car.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog dialog-form" id="sdlg" aria-labelledby="sTitle">
  <form method="dialog" id="sform" novalidate>
    <div class="dialog-head"><h2 id="sTitle" data-i18n="car.svcTitle">เข้าศูนย์ / ซ่อมบำรุง</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="sDate" data-i18n="car.date">วันที่</label><input id="sDate" type="date"></div>
        <div class="field"><label for="sOdo" data-i18n="car.sOdo">เลขไมล์ (กม.)</label><input id="sOdo" type="number" inputmode="numeric" min="0" step="any"></div>
      </div>
      <div class="field"><label for="sItems" data-i18n="car.items">รายการ</label><textarea id="sItems" rows="3" maxlength="600"></textarea></div>
      <div class="frow">
        <div class="field"><label for="sCost" data-i18n="car.cost">ค่าใช้จ่าย (บาท)</label><input id="sCost" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="sCat" data-i18n="car.cat">หมวดรายจ่าย</label><select id="sCat"></select></div>
      </div>
      <div class="frow">
        <div class="field"><label for="sNextKm" data-i18n="car.nextKm">นัดครั้งถัดไป ที่เลขไมล์</label><input id="sNextKm" type="number" inputmode="numeric" min="0" step="any"></div>
        <div class="field"><label for="sNextDate" data-i18n="car.nextDate">หรือวันที่</label><input id="sNextDate" type="date"></div>
      </div>
      <p class="form-msg" id="sMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="sDel" style="margin-right:auto" data-i18n="car.del">ลบ</button>
      <button class="btn" type="button" id="sCancel" data-i18n="car.cancel">ยกเลิก</button>
      <button class="btn" type="button" id="sBudget" data-i18n="car.toBudget">บันทึกเป็นรายจ่าย</button>
      <button class="btn primary" type="submit" id="sSave" data-i18n="car.save">บันทึก</button>
    </div>
  </form>
</dialog>
</body>
</html>
