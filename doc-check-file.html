<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจสอบเอกสารจากไฟล์ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/badge/chip/tabs/toolbar/dropzone/lang-toggle มาจาก theme.css (data-layout="tool") */
.dc-page{max-width:1080px}
.dc-page .crumb{margin-bottom:0}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.dc-page .tabs{width:fit-content;max-width:100%;margin-bottom:var(--ome-sp-4)}
.dc-page a.tab{display:inline-flex;align-items:center;gap:6px;text-decoration:none}


.dc-toolbar{display:none;margin-top:var(--ome-sp-4);padding:10px 12px}
.dc-file-chip{height:auto;padding:0 0 0 10px;gap:4px;max-width:260px;font-size:var(--ome-fs-xs)}
.dc-file-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-file-chip button{color:inherit;flex-shrink:0}
.dc-toolbar .select{width:auto}
.dc-spacer{flex:1}

.dc-status{display:flex;align-items:center;gap:9px;margin-top:var(--ome-sp-3);font-size:var(--ome-fs-sm);color:var(--ome-accent-strong);font-weight:500;min-height:20px}
.dc-status.err{color:var(--ome-err-ink)}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--ome-accent-soft);border-top-color:var(--ome-accent);
  animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

.dc-workspace{display:none;grid-template-columns:minmax(0,1fr) 320px;gap:var(--ome-sp-4);margin-top:var(--ome-sp-4);align-items:start}
@media(max-width:820px){.dc-workspace{grid-template-columns:minmax(0,1fr)}}
.dc-pager{display:flex;align-items:center;gap:10px;margin-bottom:var(--ome-sp-3)}
.dc-pager .page-ind{font-size:var(--ome-fs-sm);color:var(--ome-text-2);font-weight:500}
.dc-viewer{padding:var(--ome-sp-5)}
.dc-text{white-space:pre-wrap;line-height:2;font-size:15.5px;margin:0}
.err-mark{background:transparent;color:inherit;cursor:pointer;border-radius:3px;border-bottom:2.5px solid var(--ome-err);padding-bottom:1px;
  transition:background var(--ome-dur-1)}
.err-mark:hover{background:var(--ome-err-soft)}
.err-mark.active{background:var(--ome-err-fill);color:var(--ome-on-err)}

.dc-side{position:sticky;top:calc(var(--ome-nav-h,48px) + 16px)}
.dc-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--ome-sp-3)}
.dc-side-head h2{display:flex;align-items:center;gap:8px;margin:0;font-size:var(--ome-fs-base)}
.dc-count.zero{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.dc-fixall{width:100%;margin-bottom:var(--ome-sp-3)}
.dc-issue{padding:12px 14px;margin-bottom:9px;cursor:pointer;border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);
  background:var(--ome-surface-1);transition:border-color var(--ome-dur-1)}
.dc-issue:hover{border-color:var(--ome-err)}
.dc-issue.active{border-color:var(--ome-err);background:var(--ome-err-soft)}
.dc-issue .badge{margin-bottom:7px}
.dc-issue .quote{color:var(--ome-err-ink);font-weight:700;font-size:var(--ome-fs-sm)}
.dc-issue .msg{font-size:var(--ome-fs-xs);color:var(--ome-text-2);margin-top:3px;line-height:1.5}
.dc-issue .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.dc-side-empty{display:none;text-align:center;color:var(--ome-text-2);font-size:var(--ome-fs-sm);padding:30px 12px}
.dc-side-empty .ome-icon{display:block;width:30px;height:30px;margin:0 auto 8px;color:var(--ome-ok)}
.dc-empty-state{text-align:center;color:var(--ome-text-2);font-size:var(--ome-fs-sm);padding:10px 20px 0}
@media(max-width:600px){.dc-viewer{padding:var(--ome-sp-4)}}
</style>
</head>
<body data-layout="tool" data-doctitle-key="docTitleFile">
<main class="page dc-page">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbDocCheck">ตรวจสอบเอกสาร</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" data-i18n-skip data-i18n-attr="aria-label:lang.toggle" aria-label="สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head"><h1 data-i18n="pageTitleFile">ตรวจสอบเอกสาร: แนบไฟล์</h1></div>

<nav class="tabs" id="modeTabs">
  <a class="tab" href="doc-check.html">
    <svg class="ome-icon"><use href="icons.svg#i-pencil"/></svg>
    <span data-i18n="modeTabType">พิมพ์ข้อความเอง</span>
  </a>
  <a class="tab on" href="doc-check-file.html">
    <svg class="ome-icon"><use href="icons.svg#i-upload"/></svg>
    <span data-i18n="modeTabFile">แนบไฟล์</span>
  </a>
</nav>

<div class="dropzone" id="dropZone" tabindex="0" role="button" data-i18n-aria-label="dropZoneAriaLabel" aria-label="แนบไฟล์เอกสาร">
  <svg class="ome-icon"><use href="icons.svg#i-upload"/></svg>
  <div class="dropzone-main" data-i18n="dropMain">ลากไฟล์มาวาง หรือคลิกเพื่อเลือกไฟล์</div>
</div>
<input type="file" id="fileInput" accept=".txt,.docx,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">

<div class="row" style="margin-top:var(--ome-sp-3)">
  <span class="mini" data-i18n="ocrEngineLabel">อ่านรูปภาพด้วย</span>
  <div class="lang-toggle" id="ocrEngineToggle">
    <span data-oe="tesseract" data-i18n="ocrEngineTesseract" class="active">ฟรี (ไทย/อังกฤษ)</span>
    <span data-oe="vision" data-i18n="ocrEngineVision">Claude Vision (แม่นยำกว่า ทุกภาษา)</span>
  </div>
</div>

<div class="toolbar dc-toolbar" id="toolbar">
  <div class="badge accent dc-file-chip">
    <svg class="ome-icon"><use href="icons.svg#i-file-text"/></svg>
    <span id="fileChipName"></span>
    <button class="btn ghost sm icon" id="replaceFileBtn" type="button" data-i18n-title="replaceFileBtnTitleFile" data-i18n-aria-label="replaceFileBtnTitleFile" title="เปลี่ยนไฟล์" aria-label="เปลี่ยนไฟล์">
      <svg class="ome-icon"><use href="icons.svg#i-x"/></svg>
    </button>
  </div>
  <select class="select" id="langSelect" aria-label="Language"></select>
  <button class="btn primary" id="runBtn" type="button">
    <svg class="ome-icon"><use href="icons.svg#i-search"/></svg>
    <span data-i18n="runBtn">ตรวจคำผิด</span>
  </button>
  <div class="dc-spacer"></div>
  <button class="btn icon" id="speakBtn" type="button" data-i18n-title="speakBtnTitle" data-i18n-aria-label="speakBtnTitle" title="อ่านออกเสียงหน้านี้" aria-label="อ่านออกเสียงหน้านี้"></button>
  <button class="btn icon" id="downloadBtn" type="button" data-i18n-title="downloadBtnTitle" data-i18n-aria-label="downloadBtnTitle" title="ดาวน์โหลดไฟล์ที่แก้ไข" aria-label="ดาวน์โหลดไฟล์ที่แก้ไข">
    <svg class="ome-icon"><use href="icons.svg#i-download"/></svg>
  </button>
</div>

<div class="dc-status" id="statusMsg"></div>

<div class="dc-workspace" id="workspace">
  <div>
    <div class="dc-pager">
      <button class="btn" id="prevBtn" type="button">
        <svg class="ome-icon"><use href="icons.svg#i-chevron-left"/></svg>
        <span data-i18n="prevBtn">หน้าก่อน</span>
      </button>
      <span class="page-ind" id="pageIndicator"></span>
      <button class="btn" id="nextBtn" type="button">
        <span data-i18n="nextBtn">หน้าถัดไป</span>
        <svg class="ome-icon"><use href="icons.svg#i-chevron-right"/></svg>
      </button>
    </div>
    <div class="card dc-viewer"><p class="dc-text" id="docText"></p></div>
  </div>

  <aside class="dc-side">
    <div class="dc-side-head">
      <h2>
        <svg class="ome-icon"><use href="icons.svg#i-triangle-alert"/></svg>
        <span data-i18n="issuesFoundHeading">จุดที่พบ</span>
      </h2>
      <span class="badge err dc-count" id="issueCount">0</span>
    </div>
    <button class="btn dc-fixall" id="applyFixBtn" type="button" style="display:none">
      <svg class="ome-icon"><use href="icons.svg#i-check"/></svg>
      <span data-i18n="applyFixBtn">แก้ไขทั้งหมดในหน้านี้</span>
    </button>
    <div id="issueList"></div>
    <div class="dc-side-empty" id="issueEmpty">
      <svg class="ome-icon"><use href="icons.svg#i-circle-check"/></svg>
      <span data-i18n="issueEmptyText">ไม่พบจุดที่ควรแก้ในหน้านี้</span>
    </div>
  </aside>
</div>

<div class="dc-empty-state" id="emptyState" data-i18n="emptyStateFile">ยังไม่ได้แนบไฟล์ — เริ่มจากกล่องด้านบน</div>

</main>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
window.pdfjsLib = pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
window.dispatchEvent(new Event('pdfjs-ready'));
</script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="doc-check.js"></script>
</body>
</html>
