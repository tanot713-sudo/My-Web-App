<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="today.title">Tanot — วันนี้</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="invest-calc.js" defer></script>
<script src="insurance-calc.js" defer></script>
<script src="mnt-calc.js" defer></script>
<script src="health-calc.js" defer></script>
<script src="receipts-calc.js" defer></script>
<script src="car-calc.js" defer></script>
<script src="learn-core.js" defer></script>
<script src="index.js" defer></script>
<style>
.head-text{flex:1;min-width:0}
.head-text .muted{margin:0;font-size:var(--ome-fs-sm)}
.head-text h1{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--ome-sp-4)}
.card-body{display:flex;flex-direction:column;align-items:flex-start;gap:var(--ome-sp-3)}
.card-body > :is(.bar,.cat-row,.sub,.big,.alloc,.alloc-legend,.list,.links){align-self:stretch}
.big{font-size:var(--ome-fs-3xl);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-size:var(--ome-fs-sm);font-weight:500;color:var(--ome-text-2)}
.sub{font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.bar{height:8px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--ome-accent)}
.bar.warn > i{background:var(--ome-warn)}
.bar.err > i{background:var(--ome-err)}
.bar.ok > i{background:var(--ome-ok)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;font-size:var(--ome-fs-sm)}
.cat-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .val{font-variant-numeric:tabular-nums;color:var(--ome-text-2)}
.cat-row .bar{grid-column:1 / -1;height:6px}
.stat{display:flex;align-items:center;gap:var(--ome-sp-3)}
.stat .ome-icon{width:28px;height:28px}
.stat .flame{color:var(--ome-warn)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{text-decoration:none}
.right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.right .price{font-weight:600}
.alloc{display:flex;height:10px;border-radius:var(--ome-radius-pill);overflow:hidden;background:var(--ome-surface-2)}
.alloc > i{display:block;height:100%;min-width:2px}
.alloc-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.alloc-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.up{color:var(--ome-ok-ink)}
.down{color:var(--ome-err-ink)}
.card .list{border:0;border-radius:0;background:transparent;margin:0 calc(var(--ome-card-pad) * -1) calc(var(--ome-card-pad) * -1)}
</style>
</head>
<body data-layout="dashboard">
<main class="page">
  <header class="page-head">
    <div class="head-text">
      <p class="muted" id="dateLine"></p>
      <h1 id="greet">สวัสดี</h1>
    </div>
  </header>

  <div class="quick">
    <button class="btn primary" type="button" id="qaExpense"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="today.qExpense">รายจ่าย</span></button>
    <button class="btn" type="button" id="qaIncome"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="today.qIncome">รายรับ</span></button>
    <a class="btn" href="word.html"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-text"/></svg>Word</a>
    <a class="btn" href="excel.html"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-spreadsheet"/></svg>Excel</a>
    <button class="btn" type="button" id="qaSearch"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg><span data-i18n="today.qSearch">ค้นหา</span></button>
    <button class="btn ghost" type="button" id="qaMenu"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-menu"/></svg><span data-i18n="today.qMenu">เมนูทั้งหมด</span></button>
  </div>

  <div class="grid">
    <section class="card span-6" aria-labelledby="hSpend">
      <div class="card-head"><h2 id="hSpend" data-i18n="today.hSpend">ใช้จ่ายเดือนนี้</h2><a class="btn ghost sm" href="budget.html" data-i18n="today.lBudget">รายรับรายจ่าย</a></div>
      <div class="card-body" id="spendBody"></div>
    </section>

    <section class="card span-3" aria-labelledby="hReview">
      <div class="card-head"><h2 id="hReview" data-i18n="today.hReview">ทบทวนวันนี้</h2></div>
      <div class="card-body" id="reviewBody"></div>
    </section>

    <section class="card span-3" aria-labelledby="hStreak">
      <div class="card-head"><h2 id="hStreak" data-i18n="today.hStreak">ติดต่อกัน</h2></div>
      <div class="card-body" id="streakBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hStock">
      <div class="card-head"><h2 id="hStock" data-i18n="today.hStock">สินทรัพย์ลงทุน</h2><a class="btn ghost sm" href="invest.html" data-i18n="today.lInvest">การลงทุน</a></div>
      <div class="card-body" id="investBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hFiles">
      <div class="card-head"><h2 id="hFiles" data-i18n="today.hFiles">ไฟล์ล่าสุด</h2></div>
      <div id="filesBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hIns">
      <div class="card-head"><h2 id="hIns" data-i18n="today.hIns">ต่ออายุประกัน</h2><a class="btn ghost sm" href="insurance.html" data-i18n="today.lIns">ประกัน</a></div>
      <div id="insBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hMnt">
      <div class="card-head"><h2 id="hMnt" data-i18n="today.hMnt">งานบำรุงรักษา</h2><a class="btn ghost sm" href="maintenance.html" data-i18n="today.lMnt">บำรุงรักษา</a></div>
      <div class="card-body" id="mntBody"></div>
    </section>
    <section class="card span-6" aria-labelledby="hHealth">
      <div class="card-head"><h2 id="hHealth" data-i18n="today.hHealth">สุขภาพ</h2><a class="btn ghost sm" href="health.html" data-i18n="today.hHealth">สุขภาพ</a></div>
      <div class="card-body" id="healthBody"></div>
    </section>
    <section class="card span-6" aria-labelledby="hWar" id="warCard" hidden>
      <div class="card-head"><h2 id="hWar" data-i18n="today.hWar">ประกันสินค้าใกล้หมด</h2><a class="btn ghost sm" href="receipts.html" data-i18n="today.lWar">คลังใบเสร็จ</a></div>
      <div class="card-body" id="warBody"></div>
    </section>
    <section class="card span-6" aria-labelledby="hCar" id="carCard" hidden>
      <div class="card-head"><h2 id="hCar" data-i18n="today.hCar">รถ</h2><a class="btn ghost sm" href="car.html" data-i18n="today.lCar">บันทึกรถ</a></div>
      <div class="card-body" id="carBody"></div>
    </section>
  </div>
</main>
</body>
</html>
