<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanot — วันนี้</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="insurance-calc.js" defer></script>
<script src="mnt-calc.js" defer></script>
<script src="learn-core.js" defer></script>
<script src="index.js" defer></script>
<style>
.head-text{flex:1;min-width:0}
.head-text .muted{margin:0;font-size:var(--ome-fs-sm)}
.head-text h1{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--ome-sp-4)}
.card-body{display:flex;flex-direction:column;align-items:flex-start;gap:var(--ome-sp-3)}
.card-body > :is(.bar,.cat-row,.sub,.big){align-self:stretch}
.big{font-size:var(--ome-fs-3xl);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.big small{font-size:var(--ome-fs-sm);font-weight:500;color:var(--ome-text-2)}
.sub{font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.bar{height:8px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--ome-accent)}
.bar.warn > i{background:var(--ome-warn)}
.bar.err > i{background:var(--ome-err)}
.bar.ok > i{background:var(--ome-ok)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;font-size:var(--ome-fs-sm)}
.cat-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .val{font-variant-numeric:tabular-nums;color:var(--ome-text-2)}
.cat-row .bar{grid-column:1 / -1;height:6px}
.stat{display:flex;align-items:center;gap:var(--ome-sp-3)}
.stat .ome-icon{width:28px;height:28px}
.stat .flame{color:var(--ome-warn)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{text-decoration:none}
.right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.right .price{font-weight:600}
.up{color:var(--ome-ok-ink)}
.down{color:var(--ome-err-ink)}
.card .list{border:0;border-radius:0;background:transparent;margin:0 calc(var(--ome-card-pad) * -1) calc(var(--ome-card-pad) * -1)}
</style>
</head>
<body data-layout="dashboard">
<script src="auth-gate.js"></script>
<main class="page">
  <header class="page-head">
    <div class="head-text">
      <p class="muted" id="dateLine"></p>
      <h1 id="greet">สวัสดี</h1>
    </div>
  </header>

  <div class="quick">
    <button class="btn primary" type="button" id="qaExpense"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>รายจ่าย</button>
    <button class="btn" type="button" id="qaIncome"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg>รายรับ</button>
    <a class="btn" href="word.html"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-text"/></svg>Word</a>
    <a class="btn" href="excel.html"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-file-spreadsheet"/></svg>Excel</a>
    <button class="btn" type="button" id="qaSearch"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg>ค้นหา</button>
    <button class="btn ghost" type="button" id="qaMenu"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-menu"/></svg>เมนูทั้งหมด</button>
  </div>

  <div class="grid">
    <section class="card span-6" aria-labelledby="hSpend">
      <div class="card-head"><h2 id="hSpend">ใช้จ่ายเดือนนี้</h2><a class="btn ghost sm" href="budget.html">รายรับรายจ่าย</a></div>
      <div class="card-body" id="spendBody"></div>
    </section>

    <section class="card span-3" aria-labelledby="hReview">
      <div class="card-head"><h2 id="hReview">ทบทวนวันนี้</h2></div>
      <div class="card-body" id="reviewBody"></div>
    </section>

    <section class="card span-3" aria-labelledby="hStreak">
      <div class="card-head"><h2 id="hStreak">ติดต่อกัน</h2></div>
      <div class="card-body" id="streakBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hStock">
      <div class="card-head"><h2 id="hStock">หุ้นที่ติดตาม</h2><a class="btn ghost sm" href="invest.html">การลงทุน</a></div>
      <div id="stockBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hFiles">
      <div class="card-head"><h2 id="hFiles">ไฟล์ล่าสุด</h2></div>
      <div id="filesBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hIns">
      <div class="card-head"><h2 id="hIns">ต่ออายุประกัน</h2><a class="btn ghost sm" href="insurance.html">ประกัน</a></div>
      <div id="insBody"></div>
    </section>

    <section class="card span-6" aria-labelledby="hMnt">
      <div class="card-head"><h2 id="hMnt">งานบำรุงรักษา</h2><a class="btn ghost sm" href="maintenance.html">บำรุงรักษา</a></div>
      <div class="card-body" id="mntBody"></div>
    </section>
  </div>
</main>
</body>
</html>
