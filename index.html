<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanot — หน้าหลัก</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12A594">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ome-f);background:var(--bg,#F6F7FB);color:var(--ink,#1F2430);
  line-height:1.7;font-size:15px;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
:root{--bg:#F6F7FB;--card:#FFFFFF;--ink:#1F2430;--muted:#727C93;--line:#EAEDF5;
  --brand:var(--ome-brand);--brand-dk:var(--ome-brand-dk);--brand-sf:var(--ome-brand-sf);
  --violet:#6C63D9;--amber:#F5A524;--rose:#EC5E8A;--sky:#3B9BEA;--ok:#17B26A;--err:#E5484D;
  --f:'Prompt',system-ui,sans-serif;--r:16px;
  --sh:0 1px 2px rgba(24,31,54,.05),0 8px 24px rgba(24,31,54,.06)}
.wrap{max-width:880px;margin:0 auto}

.hero{margin-top:22px;border-radius:22px;padding:32px 34px 28px;
  background:linear-gradient(120deg,#EAF4FF 0%,#E9FBF7 45%,#FFF4E8 100%);
  position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,.5)}
.eyebrow{font-size:12.5px;color:var(--brand-dk);font-weight:600;margin-bottom:6px;position:relative}
h1{font-size:clamp(23px,4.4vw,32px);font-weight:700;line-height:1.3;position:relative}
.sub{margin-top:8px;color:#5A6479;font-size:14px;position:relative}

/* นาฬิกา Nixie Tube — เวลาไทย 24 ชม. มุมขวาบนของการ์ดทักทาย */
.nixie{position:absolute;top:16px;right:16px;z-index:1;display:flex;align-items:center;gap:2px;
  background:#1A1512;border-radius:12px;padding:9px 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 0 0 1px rgba(255,255,255,.06)}
.nixie .nx-d{font-family:'Courier New',monospace;font-size:23px;font-weight:700;color:#FFB347;
  width:17px;text-align:center;text-shadow:0 0 6px rgba(255,150,40,.9),0 0 14px rgba(255,110,20,.6)}
.nixie .nx-sep{font-family:'Courier New',monospace;font-size:20px;font-weight:700;color:#FF9C3D;
  opacity:.7;padding:0 1px;text-shadow:0 0 6px rgba(255,150,40,.7)}
@media(max-width:600px){
  .nixie{top:12px;right:12px;padding:7px 9px}
  .nixie .nx-d{font-size:18px;width:14px}
  .nixie .nx-sep{font-size:16px}
  .eyebrow{max-width:calc(100% - 145px)}
}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.hero{padding:24px 20px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap">

<div class="hero">
  <div class="nixie" id="nixieClock" aria-hidden="true">
    <span class="nx-d">0</span><span class="nx-d">0</span><span class="nx-sep">:</span>
    <span class="nx-d">0</span><span class="nx-d">0</span><span class="nx-sep">:</span>
    <span class="nx-d">0</span><span class="nx-d">0</span>
  </div>
  <div class="eyebrow" id="dateLine">Tanot</div>
  <h1 id="greet">สวัสดี 👋</h1>
  <p class="sub">วันนี้อยากทำอะไรดี — เลือกจากเมนู ☰ ด้านบนซ้ายได้เลย</p>
</div>

</div>

<script>
(function () {
  'use strict';
  var h = new Date().getHours();
  var greet = h < 12 ? 'สวัสดีตอนเช้า ☀️' : h < 17 ? 'สวัสดีตอนบ่าย 👋' : 'สวัสดีตอนเย็น 🌙';
  document.getElementById('greet').textContent = greet;
  document.getElementById('dateLine').textContent = new Date().toLocaleDateString('th-TH',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  var fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Bangkok', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  var nxDigits = document.querySelectorAll('#nixieClock .nx-d');
  function updateNixie() {
    var hh = '00', mm = '00', ss = '00';
    fmt.formatToParts(new Date()).forEach(function (p) {
      if (p.type === 'hour') hh = p.value === '24' ? '00' : p.value;
      else if (p.type === 'minute') mm = p.value;
      else if (p.type === 'second') ss = p.value;
    });
    var digits = (hh + mm + ss).split('');
    for (var i = 0; i < nxDigits.length; i++) nxDigits[i].textContent = digits[i];
  }
  updateNixie();
  setInterval(updateNixie, 1000);
})();
</script>
</body>
</html>
