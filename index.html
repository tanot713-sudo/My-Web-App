<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="today.title">Tanot — วันนี้</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="invest-calc.js" defer></script>
<script src="insurance-calc.js" defer></script>
<script src="mnt-calc.js" defer></script>
<script src="health-calc.js" defer></script>
<script src="receipts-calc.js" defer></script>
<script src="car-calc.js" defer></script>
<script src="cooking-plan-calc.js" defer></script>
<script src="learn-core.js" defer></script>
<script src="home-calc.js" defer></script>
<script src="index.js" defer></script>
<style>
/* หัวหน้า: ชื่อวัน (h1) ซ้าย · ปุ่มด่วนขวาในแถวเดียวกัน (จอแคบตัดลงบรรทัดใหม่) */
.page-head{align-items:center;row-gap:var(--ome-sp-3)}
.head-text{min-width:0}
.head-text h1{margin:0}
.quick{display:flex;flex-wrap:wrap;gap:var(--ome-sp-2);margin-left:auto}
/* กล่องแรก: จำนวนเรื่องที่ต้องทำ (ตัวเลขใหญ่สุดของหน้า ชิดขวาของหัวกล่อง) + finding สดตามความเร่งใต้หัวกล่อง */
.todo-n{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap;margin-left:auto}
.todo-n[hidden]{display:none}
.todo-n .n{font-size:var(--ome-fs-3xl);font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.todo-n small{font-size:var(--ome-fs-sm);font-weight:600;color:var(--ome-text-2)}
.todo-find{margin:0;min-width:0;font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.todo-find > span{white-space:nowrap}
.todo-find b{font-weight:600;font-variant-numeric:tabular-nums}
.todo-find .err{color:var(--ome-err-ink)}
.todo-find .warn{color:var(--ome-warn-ink)}
@media (min-width:900px){.todo-list.cols-2 > .todo-row:nth-child(2){border-top:0}}
/* กราฟมูลค่าพอร์ตเตี้ยลงให้การ์ดคู่ (เงิน | ลงทุน) สมดุล — การ์ดเงินไม่มีช่องว่างกลาง */
#investBody .spark{height:52px}
/* งบรวม = แถวแรกของรายการหมวด ตัวหนากว่าหมวด */
#spendBody .meter-row.total .name{font-weight:700}
/* แท่งออกกำลังกาย 8 สัปดาห์: สัปดาห์นี้สีข้อมูล ที่ผ่านมาเทา เส้นเป้าประ 1px + ป้ายท้ายเส้น · แท่งเหลี่ยมเริ่มที่ 0 */
.wk-bars{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:68px;margin-top:var(--ome-sp-2);
  border-bottom:1px solid var(--ome-border-strong)}
.wk-bars > i{display:block;min-height:0;background:var(--ome-text-3)}
.wk-bars > i.cur{background:var(--ome-chart-1)}
.wk-bars .goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--ome-text-2);pointer-events:none}
.wk-bars .goal small{position:absolute;right:0;bottom:2px;padding:0 4px;font-size:var(--ome-fs-xs);line-height:1.3;color:var(--ome-text-2);background:var(--ome-surface-1)}
.wk-bars .goal.start small{right:auto;left:0}
.home-big{font-size:var(--ome-fs-2xl);font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub .n{white-space:nowrap}
.sub{font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.up{color:var(--ome-ok-ink)}
.down{color:var(--ome-err-ink)}
.ome-icon.flame{color:var(--ome-warn)}
.home-foot .row{gap:var(--ome-sp-2)}
/* โหมดมืด: เงาระดับ 1 (rgba .45) อ่านเป็นกล่องลอย — การ์ดหน้าแรกใช้เส้นขอบอย่างเดียว */
[data-theme="dark"] #homeGrid > .card{box-shadow:none}
/* มือถือ: กระชับระยะ (หน้ายาวเกินไป) — ค่าเฉพาะหน้านี้ */
@media (max-width:700px){
  .page{padding-top:var(--ome-sp-4)}
  .page-head{margin-bottom:var(--ome-sp-3)}
  .quick{gap:var(--ome-sp-2);flex-basis:100%;margin-left:0}
  .quick > *{padding:0 10px;gap:6px}
  .quick #qaSearch{padding:0;width:40px}
  .quick #qaSearch .lbl,.quick #qaReview .ic{display:none}
  /* "ไม่อยู่บนหน้าแรก": ป้าย + ปุ่มจัดหน้าแรกบรรทัดบน · ลิงก์ลงบรรทัดถัดไป */
  .home-foot .row{row-gap:var(--ome-sp-2)}
  .home-foot #hMore{order:1}
  .home-foot .spacer{order:2}
  .home-foot #qaLayout{order:3}
  .home-foot #moreLinks{order:4;flex-basis:100%}
  #homeGrid{gap:var(--ome-sp-3)}
  #homeGrid .card.fill{padding:14px;gap:var(--ome-sp-2)}
  #homeGrid .card-fill-body{gap:var(--ome-sp-2)}
  #investBody .spark{height:44px}
  .wk-bars{display:none}
  @media (max-width:380px){.quick > *{padding:0 8px}}
}
.home-foot .lead-label{font-size:var(--ome-fs-base);color:var(--ome-text-2);font-weight:600}
</style>
</head>
<body data-layout="dashboard">
<main class="page">
  <header class="page-head">
    <div class="head-text"><h1 id="todayTitle">วันนี้</h1></div>
    <div class="quick">
      <button class="btn primary" type="button" id="qaExpense"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="today.qExpense">รายจ่าย</span></button>
      <button class="btn" type="button" id="qaIncome"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="today.qIncome">รายรับ</span></button>
      <a class="btn" href="review.html" id="qaReview"><svg class="ome-icon ic" aria-hidden="true"><use href="icons.svg#i-refresh-cw"/></svg><span data-i18n="today.qReview">ทบทวน</span><span class="badge accent" id="qaReviewN" hidden>0</span></a>
      <button class="btn" type="button" id="qaSearch" data-i18n-attr="aria-label:today.qSearch" aria-label="ค้นหา"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg><span class="lbl" data-i18n="today.qSearch">ค้นหา</span></button>
    </div>
  </header>

  <div class="grid" id="homeGrid">
    <section class="card fill span-12" id="boxTodo" data-box="todo" aria-labelledby="hTodo">
      <div class="card-head"><h2 id="hTodo" data-i18n="today.hTodo">ต้องทำวันนี้</h2><span class="todo-n" id="todoCount" hidden></span></div>
      <p class="todo-find" id="todoFind" aria-live="polite" hidden></p>
      <div id="todoBody"></div>
    </section>

    <section class="card fill span-6" id="boxMoney" data-box="money" aria-labelledby="hSpend">
      <div class="card-head"><h2 id="hSpend" data-i18n="today.hSpend">เงินเดือนนี้</h2><a class="btn ghost sm" href="budget.html" data-i18n="today.lBudget">รายรับรายจ่าย</a></div>
      <div class="card-fill-body" id="spendBody"></div>
    </section>

    <section class="card fill span-6" id="boxInvest" data-box="invest" aria-labelledby="hStock">
      <div class="card-head"><h2 id="hStock" data-i18n="today.hStock">พอร์ตลงทุน</h2><a class="btn ghost sm" href="invest.html" data-i18n="today.lInvest">การลงทุน</a></div>
      <div class="card-fill-body" id="investBody"></div>
    </section>

    <section class="card fill span-12" id="boxLearn" data-box="learn" aria-labelledby="hLearn">
      <div class="card-head"><h2 id="hLearn" data-i18n="today.hLearn">เรียนต่อ</h2><a class="btn ghost sm" href="area.html?a=edu" data-i18n="today.lLearn">การศึกษา</a></div>
      <div class="card-fill-body" id="learnBody"></div>
    </section>

    <section class="card fill span-6" id="boxHealth" data-box="health" aria-labelledby="hHealth">
      <div class="card-head"><h2 id="hHealth" data-i18n="today.hHealth">สุขภาพ</h2><a class="btn ghost sm" href="health.html" data-i18n="today.lHealth">เปิดหน้าสุขภาพ</a></div>
      <div class="card-fill-body" id="healthBody"></div>
    </section>

    <section class="card fill span-6" id="boxMeals" data-box="meals" aria-labelledby="hMeals">
      <div class="card-head"><h2 id="hMeals" data-i18n="today.hMeals">เมนูวันนี้</h2><a class="btn ghost sm" href="cooking.html" data-i18n="today.lMeals">แผนอาหาร</a></div>
      <div class="card-fill-body" id="mealsBody"></div>
    </section>

    <section class="span-12 home-foot" id="boxMore" aria-labelledby="hMore">
      <div class="row">
        <span class="lead-label" id="hMore" data-i18n="today.hMore">ไม่อยู่บนหน้าแรก</span>
        <span class="row" id="moreLinks"></span>
        <span class="spacer"></span>
        <button class="btn" type="button" id="qaLayout"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-sliders-horizontal"/></svg><span data-i18n="today.qLayout">จัดหน้าแรก</span></button>
      </div>
    </section>
  </div>
</main>

<dialog class="dialog dialog-form" id="layoutDialog" aria-labelledby="layoutTitle">
  <div class="dialog-head"><h2 id="layoutTitle" data-i18n="today.layoutTitle">จัดหน้าแรก</h2></div>
  <div class="dialog-body"><div class="list plain" id="layoutRows"></div></div>
  <div class="dialog-foot">
    <button class="btn ghost" type="button" id="layoutReset" data-i18n="today.layoutReset">คืนค่าเริ่มต้น</button>
    <button class="btn primary" type="button" id="layoutDone" data-i18n="today.layoutDone">เสร็จ</button>
  </div>
</dialog>
</body>
</html>
