<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ย้ายข้อมูลจาก github.io — Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="data-import.js" defer></script>
<script src="migrate.js" defer></script>
<style>
.imp-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--ome-fs-sm);word-break:break-all}
.imp-pv{font-size:var(--ome-fs-sm);color:var(--ome-text-2);word-break:break-all;margin-top:4px}
.imp-pv span{color:var(--ome-text-3)}
.imp-result.ok{color:var(--ome-ok-ink)}
.imp-result.err{color:var(--ome-err-ink)}
#mgStatus:empty{display:none}
</style>
</head>
<body data-layout="tool">
<script src="auth-gate.js"></script>
<main class="page stack">
  <div class="page-head"><h1>ย้ายข้อมูลจาก github.io</h1></div>
  <section class="card stack">
    <div class="row">
      <button type="button" class="btn primary" id="mgOpen">ดึงข้อมูลจาก github.io</button>
      <label class="btn" for="mgFile">นำเข้าจากไฟล์</label>
      <input type="file" id="mgFile" accept="application/json,.json" hidden>
    </div>
    <div id="mgStatus" role="status"></div>
  </section>
  <section class="card stack" id="mgPlan" hidden></section>
</main>
</body>
</html>
