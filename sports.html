<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เรียนกีฬา | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* ══════════════════════════════════════════════════════════════════
   สไตล์ก็อป-แล้วปรับจาก music.html (.mx-*) ให้สถาปัตยกรรม/ประสบการณ์ผู้ใช้เหมือนกันทั้งเว็บ
   เปลี่ยนแค่โทนสี (เขียว-ส้ม แทนม่วง-ชมพู) กับ prefix คลาสเป็น .sp-*
   ══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --sp:#16A34A; --sp-dk:#0F7A38; --sp-sf:#E8F8EE; --sp2:#F97316;
  --ok:#17B26A; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
}
[data-theme="dark"] body.ome-tool-page{--sp-sf:#123321}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto}

.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 0;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--sp);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}
.lang-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--line);border:none;border-radius:20px;
  padding:3px;cursor:pointer;font-family:var(--f);flex-shrink:0}
.lang-toggle span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;color:var(--muted);transition:.15s}
.lang-toggle span.active{background:var(--card);color:var(--sp-dk);box-shadow:0 1px 3px rgba(24,31,54,.08)}

.sp-head{display:flex;align-items:flex-start;gap:16px;margin-top:16px}
.sp-head-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--sp),var(--sp2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(22,163,74,.35);
  animation:sp-icon-glow 3.5s ease-in-out infinite;font-size:26px}
@keyframes sp-icon-glow{0%,100%{box-shadow:0 8px 22px rgba(22,163,74,.35)}50%{box-shadow:0 8px 26px rgba(249,115,22,.4)}}
.sp-head h1{font-size:clamp(21px,3.6vw,28px);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),var(--sp-dk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}

.sp-gamebar{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(24,31,54,.05);flex-wrap:wrap}
.sp-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.sp-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--sp),var(--sp2));
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(22,163,74,.3)}
.sp-level-info{flex:1;min-width:0}
.sp-level-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.sp-xp-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.sp-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--sp),var(--sp2));border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.sp-streak-chip{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:#B45309;background:#FFF3E0;
  padding:6px 12px;border-radius:20px;flex-shrink:0}
[data-theme="dark"] .sp-streak-chip{background:#3A2C10;color:#F5C36B}
.sp-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1.5px solid var(--line)}
.sp-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--bg);border:1.5px solid var(--line);opacity:.35;filter:grayscale(1);transition:.2s;cursor:default}
.sp-badge.earned{opacity:1;filter:none;background:linear-gradient(135deg,var(--sp-sf),var(--card));border-color:var(--sp);
  box-shadow:0 2px 6px rgba(22,163,74,.2)}
@media(max-width:600px){.sp-gamebar{flex-direction:column;align-items:stretch}
  .sp-badge-row{justify-content:center;border-left:none;padding-left:0;padding-top:10px;border-top:1.5px solid var(--line)}}

.sp-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}
.sp-toast{background:var(--card);border:1.5px solid var(--sp);border-radius:12px;padding:10px 16px;font-size:13.5px;
  font-weight:700;color:var(--ink);box-shadow:0 8px 24px rgba(24,31,54,.16);display:flex;align-items:center;gap:8px;
  animation:sp-toast-in .35s cubic-bezier(.2,.8,.2,1);max-width:280px}
@keyframes sp-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.sp-toast.leaving{animation:sp-toast-out .3s ease forwards}
@keyframes sp-toast-out{to{transform:translateY(8px);opacity:0}}

.sp-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--r);z-index:5}
.sp-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:sp-confetti-fall linear forwards}
@keyframes sp-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}

.sp-track-menu{position:relative;margin-top:22px}
.sp-track-menu-btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f);font-size:13.5px;font-weight:700;
  padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  cursor:pointer;transition:.18s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px rgba(24,31,54,.05)}
.sp-track-menu-btn:hover{border-color:var(--sp);color:var(--sp-dk);box-shadow:0 6px 14px rgba(22,163,74,.14)}
.sp-track-menu-btn.open{border-color:var(--sp);background:linear-gradient(135deg,var(--sp-sf),var(--card));color:var(--sp-dk)}
.sp-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.sp-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:.25s cubic-bezier(.2,.8,.2,1)}
.sp-track-menu-btn.open .sp-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.sp-track-menu-btn.open .sp-hamburger-icon span:nth-child(2){opacity:0}
.sp-track-menu-btn.open .sp-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}

.sp-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(24,31,54,.16);padding:10px}
.sp-track-menu-panel.open{display:block;animation:sp-panel-in .18s cubic-bezier(.2,.8,.2,1)}
@keyframes sp-panel-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.sp-track-group-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:10px 10px 6px}
.sp-track-menu-item{display:block;width:100%;text-align:left;font-family:var(--f);font-size:13.5px;font-weight:600;
  padding:9px 12px;border:none;border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;transition:.15s}
.sp-track-menu-item:hover{background:var(--sp-sf);color:var(--sp-dk)}
.sp-track-menu-item.active{background:linear-gradient(135deg,var(--sp),var(--sp2));color:#fff;font-weight:700}

.sp-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:820px){.sp-layout{grid-template-columns:1fr}}
@media(min-width:821px){.sp-sidebar{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto}}

.sp-item-list{display:flex;flex-direction:column;gap:6px}
.sp-item{display:flex;align-items:center;gap:8px;font-family:var(--f);text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink);
  transition:.18s cubic-bezier(.2,.8,.2,1)}
.sp-item:hover{border-color:var(--sp);transform:translateX(3px);box-shadow:0 4px 10px rgba(22,163,74,.1)}
.sp-item.active{border-color:transparent;background:linear-gradient(135deg,var(--sp-sf),var(--card));
  color:var(--sp-dk);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--sp)}
.sp-item.locked{opacity:.55;cursor:not-allowed}
.sp-item.locked:hover{border-color:var(--line);transform:none;box-shadow:none}
.sp-lock-msg{display:none;background:#FFF3E0;color:#9A5A00;border-radius:10px;padding:8px 12px;font-size:12.5px;
  font-weight:600;margin-bottom:8px}
[data-theme="dark"] .sp-lock-msg{background:#3A2C10;color:#F5C36B}

.sp-main{background:var(--card);border-radius:var(--r);box-shadow:0 4px 10px rgba(24,31,54,.06),0 16px 32px rgba(22,163,74,.1);
  padding:22px;position:relative}
.sp-item-heading{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--sp-dk)}
.sp-instructions{font-size:13.5px;color:var(--ink);line-height:1.8;margin-bottom:14px}
.sp-instructions p{margin-bottom:10px}
.sp-instructions p:last-child{margin-bottom:0}

/* ไดอะแกรม SVG เคลื่อนไหวตอนเปิดบทเรียน — แต่ละองค์ประกอบ fade/pop เข้าทีละตัวเรียงลำดับ
   ลูกศร (svgArrow ใน sports.js) มีอนิเมชันลากเส้นเพิ่มเติมผ่าน .sp-arrow-line/.sp-arrow-head */
.sp-instructions svg{overflow:visible}
.sp-instructions svg>*{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.sp-instructions svg>:first-child{animation-name:sp-diagram-fade;animation-duration:.5s}
.sp-instructions svg>circle,.sp-instructions svg>rect,.sp-instructions svg>ellipse,
.sp-instructions svg>path,.sp-instructions svg>polygon:not(.sp-arrow-head),
.sp-instructions svg>line:not(.sp-arrow-line){
  animation-name:sp-diagram-pop;animation-duration:.42s;transform-box:fill-box;transform-origin:center}
.sp-instructions svg>text{animation-name:sp-diagram-rise;animation-duration:.42s}
/* หมายเหตุสำคัญ: ห้ามใส่ opacity ใน keyframe พวกนี้เด็ดขาด — หลายไดอะแกรมตั้งใจใช้
   opacity="0.x" (แบบโปร่งแสง) ผ่าน presentation attribute บนองค์ประกอบ SVG อยู่แล้ว
   (เช่น badge พื้นหลังโปร่งแสงใน svgFactStrip, โซนสีทับสนามใน pressing/shot-zone diagrams)
   ถ้า keyframe ไปตั้งค่า opacity ท้ายอนิเมชันเป็น 1 จะไปทับค่า opacity ที่ตั้งใจไว้ กลาย
   เป็นทึบเต็มที่ ทำให้ข้อความสีเดียวกับพื้นหลังมองไม่เห็น หรือโซนสีบังไดอะแกรมข้างใต้หมด
   จึงใช้แค่ transform (scale/translateY) เข้าตำแหน่งเฉยๆ ไม่แตะ opacity เลย */
@keyframes sp-diagram-fade{from{transform:scale(.96)}to{transform:scale(1)}}
@keyframes sp-diagram-pop{from{transform:scale(.82)}to{transform:scale(1)}}
@keyframes sp-diagram-rise{from{transform:translateY(5px)}to{transform:translateY(0)}}
@keyframes sp-arrow-draw{to{stroke-dashoffset:0}}
.sp-instructions svg>*:nth-child(1){animation-delay:0s}
.sp-instructions svg>*:nth-child(2){animation-delay:.02s}
.sp-instructions svg>*:nth-child(3){animation-delay:.04s}
.sp-instructions svg>*:nth-child(4){animation-delay:.06s}
.sp-instructions svg>*:nth-child(5){animation-delay:.08s}
.sp-instructions svg>*:nth-child(6){animation-delay:.1s}
.sp-instructions svg>*:nth-child(7){animation-delay:.12s}
.sp-instructions svg>*:nth-child(8){animation-delay:.14s}
.sp-instructions svg>*:nth-child(9){animation-delay:.16s}
.sp-instructions svg>*:nth-child(10){animation-delay:.18s}
.sp-instructions svg>*:nth-child(11){animation-delay:.2s}
.sp-instructions svg>*:nth-child(12){animation-delay:.22s}
.sp-instructions svg>*:nth-child(13){animation-delay:.24s}
.sp-instructions svg>*:nth-child(14){animation-delay:.26s}
.sp-instructions svg>*:nth-child(15){animation-delay:.28s}
.sp-instructions svg>*:nth-child(16){animation-delay:.3s}
.sp-instructions svg>*:nth-child(17){animation-delay:.32s}
.sp-instructions svg>*:nth-child(18){animation-delay:.34s}
.sp-instructions svg>*:nth-child(19){animation-delay:.36s}
.sp-instructions svg>*:nth-child(20){animation-delay:.38s}
.sp-instructions svg>*:nth-child(21){animation-delay:.4s}
.sp-instructions svg>*:nth-child(22){animation-delay:.42s}
.sp-instructions svg>*:nth-child(23){animation-delay:.44s}
.sp-instructions svg>*:nth-child(24){animation-delay:.46s}
.sp-instructions svg>*:nth-child(25){animation-delay:.48s}
.sp-instructions svg>*:nth-child(26){animation-delay:.5s}
.sp-instructions svg>*:nth-child(27){animation-delay:.52s}
.sp-instructions svg>*:nth-child(28){animation-delay:.54s}
.sp-instructions svg>*:nth-child(29){animation-delay:.56s}
.sp-instructions svg>*:nth-child(30){animation-delay:.58s}
.sp-instructions svg>*:nth-child(n+31){animation-delay:.6s}
/* ลูกศร (svgArrow) มาทีหลังกฎ nth-child เพื่อให้ delay ของอนิเมชันลากเส้น/หัวลูกศรเอง
   (ไม่ใช่ delay ตามลำดับ) เป็นฝ่ายชนะ specificity เท่ากันแต่มาทีหลังในไฟล์ */
.sp-instructions svg>.sp-arrow-line{stroke-dasharray:300;stroke-dashoffset:300;
  animation:sp-arrow-draw .5s cubic-bezier(.2,.8,.2,1) both}
.sp-instructions svg>.sp-arrow-head{animation:sp-diagram-fade .22s ease .38s both}
@media (prefers-reduced-motion: reduce){
  .sp-instructions svg>*,.sp-instructions svg>.sp-arrow-line,.sp-instructions svg>.sp-arrow-head{
    animation:none!important;transform:none!important;stroke-dashoffset:0!important}
}

.sp-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:14px;font-weight:600;padding:10px 18px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.btn:hover:not(:disabled){border-color:var(--sp);color:var(--sp-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(22,163,74,.14)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--sp),var(--sp2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(22,163,74,.32)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}

.sp-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:700}
.sp-result-banner.pass{background:#E7F9F0;color:#0F7A4E}
.sp-result-banner.fail{background:#FFF3E0;color:#9A5A00}
[data-theme="dark"] .sp-result-banner.pass{background:#12301F;color:#5EDCA0}
[data-theme="dark"] .sp-result-banner.fail{background:#3A2C10;color:#F5C36B}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.sp-main{padding:16px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap" id="sportsRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="documents.html" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbSports">เรียนกีฬา</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="sp-head">
  <div class="sp-head-icon">🏆</div>
  <div>
    <h1 data-i18n="pageTitle">เรียนกีฬา</h1>
  </div>
</div>

<div class="sp-gamebar" id="gameBar">
  <div class="sp-level-chip">
    <div class="sp-level-num" id="levelNum">1</div>
    <div class="sp-level-info">
      <div class="sp-level-title" id="levelTitleEl">—</div>
      <div class="sp-xp-track"><div class="sp-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="sp-streak-chip" id="streakChip">🔥 <span id="streakCount">0</span></div>
  <div class="sp-badge-row" id="badgeRow"></div>
</div>

<div class="sp-track-menu">
  <button class="sp-track-menu-btn" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="sp-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="sp-track-menu-panel" id="trackMenuPanel" role="menu"></div>
</div>

<div class="sp-layout">
  <div class="sp-sidebar">
    <div class="sp-lock-msg" id="lockMsg"></div>
    <div class="sp-item-list" id="itemList"></div>
  </div>

  <div class="sp-main">
    <div class="sp-confetti" id="confettiLayer"></div>
    <div class="sp-item-heading" id="itemHeading"></div>
    <div class="sp-instructions" id="instructionsBox"></div>

    <div class="sp-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">✓ เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="sp-result-banner" id="resultBanner"></div>
  </div>
</div>

<div class="sp-toast-wrap" id="toastWrap"></div>
</div>
<script src="sports.js"></script>
</body>
</html>
