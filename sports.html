<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เรียนกีฬา | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/crumb/สลับภาษา มาจาก theme.css (data-layout="reader") */
.sp-page{max-width:1160px}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.crumb-row .crumb{margin-bottom:0}
.sp-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.sp-head-icon .ome-icon{width:24px;height:24px}
.sp-page .page-head{margin-bottom:var(--ome-sp-4)}

/* ── แถบเกม: เลเวล/XP/สตรีค/เหรียญตรา ── */
.sp-gamebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:var(--ome-sp-4)}
.sp-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.sp-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ome-accent);color:var(--ome-on-accent);
  font-weight:700;font-size:var(--ome-fs-base);display:flex;align-items:center;justify-content:center}
.sp-level-info{flex:1;min-width:0}
.sp-level-title{font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:4px}
.sp-xp-track{height:6px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.sp-xp-fill{height:100%;width:0;background:var(--ome-accent);border-radius:inherit;transition:width var(--ome-dur-3) var(--ome-ease)}
.sp-streak-chip{display:flex;align-items:center;gap:5px;font-size:var(--ome-fs-base);font-weight:700;color:var(--ome-warn-ink);
  background:var(--ome-warn-soft);padding:6px 12px;border-radius:var(--ome-radius-pill);flex-shrink:0}
.sp-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1px solid var(--ome-border)}
.sp-badge{width:30px;height:30px;border-radius:var(--ome-radius-md);display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--ome-surface-2);border:1px solid var(--ome-border);opacity:.35;filter:grayscale(1);cursor:default}
.sp-badge.earned{opacity:1;filter:none;background:var(--ome-accent-soft);border-color:var(--ome-accent)}
@media(max-width:600px){.sp-gamebar{flex-direction:column;align-items:stretch}
  .sp-level-chip{flex:none}
  .sp-streak-chip{align-self:flex-start}
  .sp-badge-row{justify-content:center;border-left:0;padding-left:0;padding-top:10px;border-top:1px solid var(--ome-border)}}

.sp-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:var(--ome-z-toast);pointer-events:none;max-width:calc(100vw - 40px)}
.sp-toast{background:var(--ome-surface-1);border:1px solid var(--ome-accent);border-radius:var(--ome-radius-md);padding:10px 16px;font-size:var(--ome-fs-sm);
  font-weight:600;box-shadow:var(--ome-shadow-3);display:flex;align-items:center;gap:8px;max-width:280px;animation:sp-toast-in var(--ome-dur-3) var(--ome-ease)}
@keyframes sp-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.sp-toast.leaving{animation:sp-toast-out .3s ease forwards}
@keyframes sp-toast-out{to{transform:translateY(8px);opacity:0}}

.sp-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--ome-card-r);z-index:5}
.sp-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:sp-confetti-fall linear forwards}
@keyframes sp-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.sp-confetti{display:none}.sp-toast{animation:none}}

/* ── เมนูเลือกบทเรียน (แผงเลื่อนลง จัดกลุ่มตามหมวด) ── */
.sp-track-menu{position:relative;margin-bottom:var(--ome-sp-4)}
.sp-track-menu-toggle{gap:10px}
.sp-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.sp-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:transform var(--ome-dur-2) var(--ome-ease),opacity var(--ome-dur-2)}
.sp-track-menu-toggle.open .sp-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.sp-track-menu-toggle.open .sp-hamburger-icon span:nth-child(2){opacity:0}
.sp-track-menu-toggle.open .sp-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}
.sp-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:var(--ome-z-popover);min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-3);padding:10px}
.sp-track-menu-panel.open{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.sp-track-group-label{font-size:var(--ome-fs-xs);font-weight:700;letter-spacing:.05em;color:var(--ome-text-2);padding:10px 10px 6px}

/* ── แถบข้างรายการบทเรียน + พื้นที่เนื้อหา ── */
.sp-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.sp-layout{grid-template-columns:1fr}}
@media(min-width:821px){.sp-sidebar{position:sticky;top:calc(var(--ome-nav-h) + 16px);max-height:calc(100vh - var(--ome-nav-h) - 32px);overflow-y:auto}}
.sp-item-list{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.sp-item{gap:8px}
.sp-item .ome-icon{color:var(--ome-text-2)}
.sp-item.active .ome-icon{color:inherit}
.sp-lock-msg{display:none;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:8px}
.sp-main{position:relative;padding:22px}
.sp-item-heading{font-size:var(--ome-fs-lg);font-weight:700;margin-bottom:8px;color:var(--ome-accent-strong)}
.sp-instructions{margin-bottom:14px}
.sp-instructions p{margin:0 0 10px}
.sp-instructions p:last-child{margin-bottom:0}
.sp-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.sp-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:var(--ome-radius-md);font-size:var(--ome-fs-sm);font-weight:600}
.sp-result-banner.pass{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.sp-result-banner.fail{background:var(--ome-warn-soft);color:var(--ome-warn-ink)}
@media(max-width:600px){.sp-main{padding:16px}}

/* ── เฉพาะหน้านี้ ── */
/* ไดอะแกรม SVG เคลื่อนไหวตอนเปิดบทเรียน — ห้ามใส่ opacity ใน keyframe: หลายไดอะแกรมใช้ opacity="0.x" ผ่าน presentation
   attribute อยู่แล้ว ถ้า keyframe ตั้ง opacity ท้ายอนิเมชันเป็น 1 จะทับค่านั้นจนโซนสี/ข้อความโปร่งแสงกลายเป็นทึบ — ใช้แค่ transform */
.sp-instructions svg{overflow:visible}
.sp-instructions svg>*{animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.sp-instructions svg>:first-child{animation-name:sp-diagram-fade;animation-duration:.5s}
.sp-instructions svg>circle,.sp-instructions svg>rect,.sp-instructions svg>ellipse,
.sp-instructions svg>path,.sp-instructions svg>polygon:not(.sp-arrow-head),
.sp-instructions svg>line:not(.sp-arrow-line){
  animation-name:sp-diagram-pop;animation-duration:.42s;transform-box:fill-box;transform-origin:center}
.sp-instructions svg>text{animation-name:sp-diagram-rise;animation-duration:.42s}
@keyframes sp-diagram-fade{from{transform:scale(.96)}to{transform:scale(1)}}
@keyframes sp-diagram-pop{from{transform:scale(.82)}to{transform:scale(1)}}
@keyframes sp-diagram-rise{from{transform:translateY(5px)}to{transform:translateY(0)}}
@keyframes sp-arrow-draw{to{stroke-dashoffset:0}}
.sp-instructions svg>*:nth-child(1){animation-delay:0s}
.sp-instructions svg>*:nth-child(2){animation-delay:.02s}
.sp-instructions svg>*:nth-child(3){animation-delay:.04s}
.sp-instructions svg>*:nth-child(4){animation-delay:.06s}
.sp-instructions svg>*:nth-child(5){animation-delay:.08s}
.sp-instructions svg>*:nth-child(6){animation-delay:.1s}
.sp-instructions svg>*:nth-child(7){animation-delay:.12s}
.sp-instructions svg>*:nth-child(8){animation-delay:.14s}
.sp-instructions svg>*:nth-child(9){animation-delay:.16s}
.sp-instructions svg>*:nth-child(10){animation-delay:.18s}
.sp-instructions svg>*:nth-child(11){animation-delay:.2s}
.sp-instructions svg>*:nth-child(12){animation-delay:.22s}
.sp-instructions svg>*:nth-child(13){animation-delay:.24s}
.sp-instructions svg>*:nth-child(14){animation-delay:.26s}
.sp-instructions svg>*:nth-child(15){animation-delay:.28s}
.sp-instructions svg>*:nth-child(16){animation-delay:.3s}
.sp-instructions svg>*:nth-child(17){animation-delay:.32s}
.sp-instructions svg>*:nth-child(18){animation-delay:.34s}
.sp-instructions svg>*:nth-child(19){animation-delay:.36s}
.sp-instructions svg>*:nth-child(20){animation-delay:.38s}
.sp-instructions svg>*:nth-child(21){animation-delay:.4s}
.sp-instructions svg>*:nth-child(22){animation-delay:.42s}
.sp-instructions svg>*:nth-child(23){animation-delay:.44s}
.sp-instructions svg>*:nth-child(24){animation-delay:.46s}
.sp-instructions svg>*:nth-child(25){animation-delay:.48s}
.sp-instructions svg>*:nth-child(26){animation-delay:.5s}
.sp-instructions svg>*:nth-child(27){animation-delay:.52s}
.sp-instructions svg>*:nth-child(28){animation-delay:.54s}
.sp-instructions svg>*:nth-child(29){animation-delay:.56s}
.sp-instructions svg>*:nth-child(30){animation-delay:.58s}
.sp-instructions svg>*:nth-child(n+31){animation-delay:.6s}
.sp-instructions svg>.sp-arrow-line{stroke-dasharray:300;stroke-dashoffset:300;
  animation:sp-arrow-draw .5s cubic-bezier(.2,.8,.2,1) both}
.sp-instructions svg>.sp-arrow-head{animation:sp-diagram-fade .22s ease .38s both}
@media (prefers-reduced-motion: reduce){
  .sp-instructions svg>*,.sp-instructions svg>.sp-arrow-line,.sp-instructions svg>.sp-arrow-head{
    animation:none!important;transform:none!important;stroke-dashoffset:0!important}
}
.sp-log{margin-top:var(--ome-sp-4)}
.sp-log .card-head{margin-bottom:var(--ome-sp-3)}
.sp-log-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--ome-sp-3);align-items:end}
.sp-log-form .actions{display:flex;gap:8px;flex-wrap:wrap}
.sp-log-msg{color:var(--ome-err-ink);font-size:var(--ome-fs-sm);margin:var(--ome-sp-2) 0 0}
.sp-log-msg:empty{display:none}
.sp-log-list{margin-top:var(--ome-sp-4)}
[hidden]{display:none !important}
</style>
</head>
<body data-layout="reader">
<main class="page sp-page" id="sportsRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbSports">เรียนกีฬา</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" data-i18n-skip data-i18n-attr="aria-label:lang.toggle" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head">
  <span class="sp-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-dumbbell"/></svg></span>
  <h1 data-i18n="pageTitle">เรียนกีฬา</h1>
</div>

<div class="sp-gamebar card" id="gameBar">
  <div class="sp-level-chip">
    <div class="sp-level-num" id="levelNum">1</div>
    <div class="sp-level-info">
      <div class="sp-level-title" id="levelTitleEl">—</div>
      <div class="sp-xp-track"><div class="sp-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="sp-streak-chip" id="streakChip"><span id="streakCount">0</span></div>
  <div class="sp-badge-row" id="badgeRow"></div>
</div>

<div class="sp-track-menu">
  <button class="btn sp-track-menu-toggle" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="sp-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="sp-track-menu-panel" id="trackMenuPanel" role="menu"></div>
</div>

<div class="sp-layout">
  <div class="sp-sidebar">
    <div class="sp-lock-msg" id="lockMsg"></div>
    <div class="sp-item-list" id="itemList"></div>
  </div>

  <div class="sp-main card">
    <div class="sp-confetti" id="confettiLayer"></div>
    <div class="sp-item-heading" id="itemHeading"></div>
    <div class="sp-instructions prose" id="instructionsBox"></div>

    <div class="sp-toolbar">
      <button class="btn primary" id="markReadBtn" type="button" data-i18n="markReadBtn" style="display:none">เข้าใจแล้ว ไปต่อ</button>
    </div>

    <div class="sp-result-banner" id="resultBanner"></div>
  </div>
</div>

<section class="card sp-log" id="logCard" aria-labelledby="logTitle">
  <div class="card-head"><h2 id="logTitle" data-log="logTitle">บันทึกออกกำลังกาย</h2></div>
  <form class="sp-log-form" id="logForm" novalidate>
    <div class="field"><label for="logKind" data-log="logKind">กิจกรรม</label><select id="logKind" class="select"></select></div>
    <div class="field" id="logNameRow" hidden><label for="logName" data-log="logName">ชื่อกิจกรรม</label><input id="logName" type="text" maxlength="40" autocomplete="off"></div>
    <div class="field"><label for="logAt" data-log="logAt">วันเวลา</label><input id="logAt" type="datetime-local"></div>
    <div class="field"><label for="logMin" data-log="logMin">นาที</label><input id="logMin" type="number" inputmode="decimal" step="any" min="0"></div>
    <div class="field" id="logDistRow" hidden><label for="logDist" data-log="logDist">ระยะทาง (กม.)</label><input id="logDist" type="number" inputmode="decimal" step="any" min="0"></div>
    <div class="field"><label for="logKcal" data-log="logKcal">kcal</label><input id="logKcal" type="number" inputmode="decimal" step="any" min="0"></div>
    <div class="actions">
      <button class="btn primary" type="submit" id="logSave"><span data-log="logSave">บันทึก</span></button>
      <button class="btn" type="button" id="logCancel" hidden data-log="logCancel">ยกเลิก</button>
      <button class="btn danger" type="button" id="logDel" hidden data-log="logDel">ลบ</button>
    </div>
  </form>
  <p class="sp-log-msg" id="logMsg" role="alert"></p>
  <div class="sp-log-list" id="logList"></div>
</section>

<div class="sp-toast-wrap" id="toastWrap"></div>
</main>
<script src="learn-core.js"></script>
<script src="health-calc.js"></script>
<script src="sports.js"></script>
<script src="sports-log.js"></script>
</body>
</html>
