<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แปลงเสียง ↔ ข้อความ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/badge/สถานะ/toggle มาจาก theme.css (data-layout="tool") */
.tts-page{max-width:780px}
.tts-page .card > * + *{margin-top:var(--ome-sp-3)}
.tts-page .card > h2{display:flex;align-items:center;gap:8px;margin:0;font-size:var(--ome-fs-md)}
.tts-page .card > .frow + .frow{margin-top:var(--ome-sp-3)}
.tts-page .frow.center{align-items:center}
.tts-page .status{margin-top:var(--ome-sp-2)}
.tts-page .field input[type=range]{height:auto;padding:0;border:0;background:transparent;accent-color:var(--ome-accent)}
.tts-page .field input:focus-visible{outline-offset:2px}
.tts-page .field input[type=file]{height:auto;padding:6px 8px}
.tts-page .check{display:flex;align-items:center;gap:6px;cursor:pointer}
.tts-page .check input{width:auto;flex:none;accent-color:var(--ome-accent)}
.tts-page .char-count{font-size:var(--ome-fs-xs);color:var(--ome-text-2);text-align:right;margin-top:4px}
.tts-page .range-val{margin-left:6px;color:var(--ome-accent-strong);font-weight:700}
.tts-page .textarea[readonly]{background:var(--ome-surface-2)}

.tts-player{display:none;padding:14px;background:var(--ome-surface-2);border-radius:var(--ome-radius-lg)}
.tts-player audio{width:100%;margin-bottom:10px}
.tts-player .dl-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── โหมดถอดเสียง (เบราว์เซอร์/คลาวด์) — ตัวสลับใช้ .lang-toggle กลาง ── */
.asr-engine-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.asr-engine-label{font-size:var(--ome-fs-xs);color:var(--ome-text-2);font-weight:600}
.asr-engine-note{display:none;max-width:60ch}
.asr-neuron-status{font-weight:700}
</style>
</head>
<body data-layout="tool">
<script src="auth-gate.js"></script>

<main class="page tts-page">
<nav class="crumb"><a href="index.html">หน้าหลัก</a><span class="sep">/</span>แปลงข้อความเป็นเสียง</nav>
<div class="page-head"><h1>แปลงเสียง ↔ ข้อความ</h1></div>

<div class="stack">
<div class="card">
  <h2><svg class="ome-icon"><use href="icons.svg#i-file-text"/></svg>ข้อความ</h2>
  <div class="frow center">
    <button class="btn sm" id="importFileBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-upload"/></svg>แนบไฟล์</button>
    <input type="file" id="importFileInput" accept=".txt,.docx,.xlsx,.xls,.csv,.pptx,.pdf,.png,.jpg,.jpeg,.webp,.bmp" style="display:none">
    <label class="mini check">
      <input type="checkbox" id="importOcrChk" checked>
      ใช้ OCR อ่านหน้า/รูปที่เป็นภาพสแกน (ช้ากว่าปกติ)
    </label>
  </div>
  <div class="status" id="importStatus"></div>
  <textarea class="textarea" id="ttsText" rows="6" placeholder="พิมพ์หรือวางข้อความที่นี่ (ไทยหรืออังกฤษก็ได้) หรือกด แนบไฟล์ด้านบน"></textarea>
  <div class="char-count" id="ttsCharCount">0 ตัวอักษร</div>
</div>

<div class="card">
  <h2><svg class="ome-icon"><use href="icons.svg#i-volume-2"/></svg>ฟังทันที (เสียงจากเบราว์เซอร์)</h2>
  <div class="frow">
    <div class="field" style="flex:2 1 220px"><label for="wsVoice">เสียง</label>
      <select id="wsVoice"></select>
    </div>
    <div class="field"><label for="wsRate">ความเร็ว <span class="range-val" id="wsRateVal">1.0x</span></label>
      <input type="range" id="wsRate" min="0.5" max="2" step="0.1" value="1">
    </div>
  </div>
  <div class="frow">
    <button class="btn primary sm" id="wsPlayBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-play"/></svg>เล่น</button>
    <button class="btn sm" id="wsPauseBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-pause"/></svg>หยุดชั่วคราว</button>
    <button class="btn sm" id="wsStopBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-square"/></svg>หยุด</button>
  </div>
  <div class="status" id="wsStatus"></div>
</div>

<div class="card">
  <h2><svg class="ome-icon"><use href="icons.svg#i-headphones"/></svg>สร้างไฟล์เสียงดาวน์โหลดได้ (.wav / .mp3)<span class="badge">เสียง AI (MMS-TTS)</span></h2>
  <div class="frow">
    <div class="field"><label for="dlLang">ภาษา</label>
      <select id="dlLang">
        <option value="th">ไทย</option>
        <option value="en">อังกฤษ</option>
      </select>
    </div>
    <div class="field"><label for="dlVoice">เสียง</label>
      <select id="dlVoice"></select>
    </div>
  </div>
  <div class="frow">
    <button class="btn primary sm" id="dlGenerateBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-sparkles"/></svg>สร้างไฟล์เสียง</button>
  </div>
  <div class="status" id="dlStatus"></div>
  <div class="tts-player" id="dlPlayerWrap">
    <audio id="dlAudio" controls></audio>
    <div class="dl-row">
      <a class="btn sm" id="dlWavLink" download="tts-output.wav"><svg class="ome-icon"><use href="icons.svg#i-download"/></svg>ดาวน์โหลด .wav</a>
      <a class="btn sm" id="dlMp3Link" download="tts-output.mp3"><svg class="ome-icon"><use href="icons.svg#i-download"/></svg>ดาวน์โหลด .mp3</a>
    </div>
  </div>
</div>

<div class="card">
  <h2><svg class="ome-icon"><use href="icons.svg#i-mic"/></svg>เสียง/วิดีโอ → ข้อความ</h2>
  <div class="frow">
    <div class="field"><label for="asrFile">ไฟล์เสียง/วิดีโอ</label>
      <input type="file" id="asrFile" accept="audio/*,video/*">
    </div>
    <div class="field"><label for="asrLang">ภาษา</label>
      <select id="asrLang">
        <option value="auto">ตรวจจับอัตโนมัติ</option>
        <option value="thai">ไทย</option>
        <option value="english">อังกฤษ</option>
      </select>
    </div>
    <div class="field" id="asrModelField"><label for="asrModel">ขนาดโมเดล</label>
      <select id="asrModel">
        <option value="Xenova/whisper-tiny">เล็ก (เร็ว, ~75MB)</option>
        <option value="Xenova/whisper-base">กลาง (แม่นขึ้น, ~145MB)</option>
        <option value="Xenova/whisper-small">ใหญ่ (แม่นขึ้นมาก, ~250MB, โหลด/รันช้ากว่า)</option>
        <option value="Xenova/whisper-medium">ใหญ่มาก (แม่นสุด, ~750MB-1GB, โหลด/รันช้ามาก อาจหนักเกินไปสำหรับมือถือ/เครื่องสเปกต่ำ)</option>
      </select>
    </div>
  </div>
  <div class="asr-engine-row">
    <span class="asr-engine-label">ถอดเสียงด้วย</span>
    <div class="lang-toggle" id="asrEngineToggle">
      <span data-ae="local" class="active">ในเบราว์เซอร์ (ฟรี)</span>
      <span data-ae="cloud">คลาวด์ (แม่นกว่า)</span>
    </div>
  </div>
  <div class="mini asr-engine-note" id="asrEngineNote">
    <div class="asr-neuron-status" id="asrNeuronStatus"></div>
  </div>
  <div class="frow">
    <button class="btn primary sm" id="asrGoBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-mic"/></svg>ถอดเสียงเป็นข้อความ</button>
  </div>
  <div class="status" id="asrStatus"></div>
  <div id="asrResultWrap" style="display:none">
    <div class="stack">
      <textarea class="textarea" id="asrResult" rows="6" readonly></textarea>
      <div class="frow">
        <button class="btn sm" id="asrCopyBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-copy"/></svg>คัดลอกข้อความ</button>
        <button class="btn primary sm" id="meetingSumBtn" type="button"><svg class="ome-icon"><use href="icons.svg#i-sparkles"/></svg>สรุปประชุมด้วย AI</button>
      </div>
      <div class="status" id="meetingSumStatus"></div>
      <div id="meetingSumWrap" style="display:none">
        <div class="stack">
          <textarea class="textarea" id="meetingSumResult" rows="10" readonly></textarea>
          <div class="frow">
            <a class="btn primary sm" id="meetingDocxLink" download="สรุปประชุม.docx"><svg class="ome-icon"><use href="icons.svg#i-download"/></svg>ดาวน์โหลดเป็น Word (.docx)</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>

</main>

<!-- หมายเหตุ: เดิม transformers.web.min.js มี bare module specifier 2 จุด (onnxruntime-common,
     onnxruntime-web/webgpu) ที่ต้องพึ่ง <script type="importmap"> ชี้ไปไฟล์จริงถึงจะ resolve ได้
     — แต่ import map ใช้ได้เฉพาะใน "เอกสาร" หลักเท่านั้น ไม่ไหลตามไปถึง Web Worker ที่แยกออกไป
     (tts-worker.js) ทำให้ import() ฝั่ง Worker resolve bare specifier พวกนี้ไม่ได้ โมดูล error
     ตั้งแต่โหลด แล้วเงียบๆ fallback กลับมารันบล็อกหน้าเว็บเหมือนเดิม (คือสาเหตุที่หน้าเว็บยังค้าง
     แม้ย้ายไปรันใน Worker แล้ว) — แก้ที่ต้นตอโดยแก้ vendor/transformers/transformers.web.min.js
     ให้ import เป็น relative path ตรงๆ (./ort.webgpu.bundle.min.mjs, ./onnxruntime-common/index.js)
     แทน bare specifier ไปเลย เพราะ relative import จะ resolve เทียบกับตำแหน่งไฟล์ที่ import มันเอง
     เสมอไม่ว่าจะรันในเอกสารหลักหรือใน Worker ก็ตาม จึงไม่ต้องพึ่ง import map อีกต่อไป (เอาออกได้เลย) -->
<!-- ไลบรารีอ่านไฟล์แนบ (โหลดจาก CDN แบบเดียวกับหน้า "ตรวจสอบเอกสาร") — file-reader.js
     ใช้แค่ตอนกดแนบไฟล์จริงๆ เท่านั้น ไม่โหลด/รันอะไรถ้าไม่ได้ใช้ฟีเจอร์นี้ -->
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.min.mjs';
window.pdfjsLib = pdfjsLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.7.76/build/pdf.worker.min.mjs';
</script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<!-- สร้างไฟล์ .docx จริงสำหรับดาวน์โหลดสรุปประชุม — ไลบรารีเดียวกับหน้า "พิมพ์และแก้ไขเอกสาร" (word.html) -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="file-reader.js"></script>
<script src="vendor/lamejs/lamejs.iife.js"></script>
<script src="ai-client.js"></script>
<script src="text-to-speech.js" defer></script>
</body>
</html>
