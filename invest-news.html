<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ข่าวหุ้น — รวมข่าวตลาดหุ้นไทย | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.kpi-value.small{font-size:var(--ome-fs-sm);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-list{list-style:none;margin:0;padding:0}
.news-item{padding:13px 0;border-top:1px solid var(--ome-border)}
.news-item:first-child{border-top:none;padding-top:4px}
.news-item a.title{color:var(--ome-text-1);text-decoration:none;font-weight:700;line-height:1.5;display:block}
.news-item a.title:hover{color:var(--ome-accent-strong)}
.news-meta{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.news-meta .src{font-weight:700;color:var(--ome-accent-strong)}
.news-empty,.news-loading{color:var(--ome-text-2);padding:20px 4px;text-align:center}
.news-empty a{font-weight:700}
</style>
</head>
<body data-layout="tool" data-invest-key="news">

<nav class="subnav" id="ivNav"><div class="subnav-sub"><div class="subnav-row" id="ivSubRow"></div></div></nav>

<main class="page">

  <nav class="crumb"><a href="invest.html" data-i18n="navInvest">การลงทุน</a><span>›</span><span data-i18n="pageTitle">ข่าวหุ้น</span></nav>

  <div class="page-head"><h1 data-i18n="pageTitle">ข่าวหุ้น</h1></div>

  <div class="stack">
  <div class="kpi-grid" id="statGrid">
    <div class="kpi"><span class="kpi-label" data-i18n="stCountLbl">พบข่าว</span><span class="kpi-value" id="stCount"><span class="ome-skeleton" style="width:50px"></span></span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="stTopicLbl">หมวดที่เลือก</span><span class="kpi-value small" id="stTopic">—</span></div>
    <div class="kpi"><span class="kpi-label" data-i18n="stUpdatedLbl">อัปเดตล่าสุด</span><span class="kpi-value small" id="stUpdated"><span class="ome-skeleton" style="width:70px"></span></span></div>
  </div>

  <div class="card">
    <div class="stack">
      <div class="chip-row" id="chipRow"></div>
      <div class="row">
        <input class="input" style="flex:1;min-width:200px" type="text" id="qInput" placeholder="ค้นข่าวหุ้น/บริษัทที่สนใจ เช่น PTT, ปันผล, กนง." data-i18n-placeholder="searchPh" inputmode="text">
        <button class="btn primary" id="qBtn" type="button" data-i18n="searchBtn">ค้นหา</button>
      </div>
      <div><a class="btn sm" href="https://www.set.or.th/oppday" target="_blank" rel="noopener"><span data-i18n="oppdayLinkText">Opportunity Day</span><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-external-link"/></svg></a></div>
    </div>
  </div>

  <div class="card">
    <div class="stack">
      <div><span class="badge wrap" id="srcBadge" data-i18n="loadingNewsDefault">กำลังโหลดข่าว…</span></div>
      <div id="newsBody"><div class="news-loading" data-i18n="loadingDefault">กำลังโหลด…</div></div>
    </div>
  </div>
  </div>

</main>

<script src="invest-calc.js" defer></script>
<script src="invest-core.js" defer></script>
<script src="invest-news.js" defer></script>
</body>
</html>
