<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พอร์ตจำลอง — ฝึกลงทุนหุ้นด้วยเงินสมมติ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- Google Identity Services — สำหรับสำรองพอร์ตจำลองขึ้น Google Drive (ไม่บังคับ) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cash-edit-row{display:flex;flex-direction:column;gap:6px}
.cash-edit-row[hidden]{display:none}
.table th:not(:first-child),.table td:not(:first-child){text-align:right}
.table td.up{color:var(--ome-ok-ink);font-weight:700}.table td.dn{color:var(--ome-err-ink);font-weight:700}
.tbl-empty{color:var(--ome-text-2);padding:16px 4px;text-align:center}
.card h2{display:flex;align-items:center;gap:8px;font-size:var(--ome-fs-base);margin-bottom:12px}
.card-head h2{margin:0}
body.embedded .crumb,body.embedded #driveCard{display:none}
</style>
</head>
<body data-layout="tool" data-invest-key="portfolio">
<main class="page">

  <nav class="crumb"><a href="invest.html" data-i18n="navInvest">การลงทุน</a><span>›</span><span data-i18n="pageTitle">พอร์ตจำลอง</span></nav>

  <div class="page-head"><h1 data-i18n="pageTitle">พอร์ตจำลอง</h1></div>

  <div class="stack">
  <!-- สรุปพอร์ต -->
  <div class="card">
    <h2 data-i18n="sumTitle">สรุปพอร์ต</h2>
    <div class="stack">
      <div class="kpi-grid">
        <div class="kpi">
          <div class="lbl-row"><span class="kpi-label" data-i18n="lblCash">เงินสดคงเหลือ</span><button class="btn sm ghost" id="cashEditBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-pencil"/></svg><span data-i18n="editCashBtn">แก้ไข</span></button></div>
          <div class="kpi-value" id="sCash">—</div>
          <div class="cash-edit-row" id="cashEditRow" hidden>
            <input type="number" id="cashEditInput" inputmode="decimal" class="input">
            <div class="row">
              <button class="btn sm primary" id="cashEditSave" type="button" data-i18n="saveBtn">บันทึก</button>
              <button class="btn sm" id="cashEditCancel" type="button" data-i18n="cancelBtn">ยกเลิก</button>
            </div>
          </div>
        </div>
        <div class="kpi"><span class="kpi-label" data-i18n="lblHoldVal">มูลค่าหุ้นที่ถือ</span><span class="kpi-value" id="sHoldVal">—</span></div>
        <div class="kpi"><span class="kpi-label" data-i18n="lblTotal">มูลค่าพอร์ตรวม</span><span class="kpi-value" id="sTotal">—</span></div>
        <div class="kpi"><span class="kpi-label" data-i18n="lblPl">กำไร/ขาดทุนรวม</span><span class="kpi-value" id="sPl">—</span><span class="kpi-delta" id="sPlPct"></span></div>
      </div>
      <div><button class="btn sm" id="resetBtn" type="button" data-i18n="resetBtn">เริ่มพอร์ตใหม่</button></div>
    </div>
  </div>

  <!-- ซื้อ-ขาย -->
  <div class="card">
    <h2 data-i18n="tradeTitle">ซื้อ / ขายหุ้น</h2>
    <div class="stack">
      <div><div class="segmented" id="tradeTabs">
        <button class="on" data-tab="buy" type="button" data-i18n="tabBuy">ซื้อ</button>
        <button data-tab="sell" type="button" data-i18n="tabSell">ขาย</button>
      </div></div>
      <div id="buyPane">
        <div class="frow">
          <div class="field"><label for="buySym" data-i18n="lblSym">ชื่อย่อหุ้น</label><input type="text" id="buySym" placeholder="เช่น PTT" data-i18n-placeholder="phSym" autocomplete="off" spellcheck="false"></div>
          <div class="field"><label for="buyShares" data-i18n="lblShares">จำนวนหุ้น</label><input type="number" id="buyShares" inputmode="numeric" placeholder="เช่น 100" data-i18n-placeholder="phShares"></div>
          <div class="field"><label for="buyDate" data-i18n="lblBuyDate">วันที่ซื้อ (ย้อนหลังได้)</label><input type="date" id="buyDate"></div>
          <button class="btn primary" id="buyBtn" type="button" data-i18n="buyBtn">ดึงราคา + ซื้อ</button>
        </div>
      </div>
      <div id="sellPane" style="display:none">
        <div class="frow">
          <div class="field" style="flex:2 1 180px"><label for="sellSym" data-i18n="lblSellSym">หุ้นที่ถือ</label><select id="sellSym"></select></div>
          <div class="field"><label for="sellShares" data-i18n="lblShares">จำนวนหุ้น</label><input type="number" id="sellShares" inputmode="numeric" placeholder="เช่น 100" data-i18n-placeholder="phShares"></div>
          <button class="btn danger" id="sellBtn" type="button" data-i18n="sellBtn">ดึงราคา + ขาย</button>
        </div>
      </div>
      <div class="status" id="tradeStatus" style="margin:0"></div>
    </div>
  </div>

  <!-- หุ้นที่ถือ -->
  <div class="card">
    <div class="card-head"><h2 data-i18n="holdTitle">หุ้นที่ถือ</h2><button class="btn sm" id="refreshBtn" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-refresh-cw"/></svg><span data-i18n="refreshBtn">รีเฟรชราคา</span></button></div>
    <div class="table-wrap"><table class="table" id="holdTable"></table></div>
    <div id="holdEmpty" class="tbl-empty" data-i18n="holdEmpty">ยังไม่มีหุ้นในพอร์ต</div>
  </div>

  <!-- ประวัติการซื้อขาย -->
  <div class="card">
    <h2 data-i18n="txTitle">ประวัติการซื้อขาย</h2>
    <div class="table-wrap"><table class="table" id="txTable"></table></div>
    <div id="txEmpty" class="tbl-empty" data-i18n="txEmpty">ยังไม่มีรายการ</div>
  </div>

  <!-- สำรองขึ้น Google Drive — ซ่อนในโหมดป๊อปอัพ (OAuth ของ Google ทำงานในกรอบ iframe ไม่ได้ดี) -->
  <div class="card" id="driveCard">
    <h2 data-i18n="driveTitle">สำรองพอร์ตจำลองขึ้น Google Drive</h2>
    <div class="row">
      <button class="btn sm" id="driveConnectBtn" type="button" data-i18n="driveConnectBtn">เชื่อมต่อ Google Drive</button>
      <span class="status" id="driveStatusTxt" style="margin:0"></span>
    </div>
  </div>
  </div>

</main>

<script src="invest-portfolio.js" defer></script>
</body>
</html>
