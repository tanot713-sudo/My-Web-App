<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พอร์ตจำลอง — ฝึกลงทุนหุ้นด้วยเงินสมมติ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#12A594">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- Google Identity Services — สำหรับสำรองพอร์ตจำลองขึ้น Google Drive (ไม่บังคับ) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#F6F7FB;--card:#FFFFFF;--ink:#1F2430;--muted:#727C93;--line:#EAEDF5;
  --brand:var(--ome-brand);--brand-dk:var(--ome-brand-dk);--brand-sf:var(--ome-brand-sf);
  --amber:#F5A524;--ok:#17B26A;--rose:#EC5E8A;--sky:#3B9BEA;--err:#E5484D;--warn:#E08700;--violet:#6C63D9;
  --sh:0 1px 2px rgba(24,31,54,.05),0 8px 24px rgba(24,31,54,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body.ome-tool-page{font-family:var(--ome-f);background:var(--bg);color:var(--ink);
  line-height:1.65;font-size:15px;padding:0 18px 90px;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);padding:16px 0 0}
.crumb a{color:var(--brand-dk);text-decoration:none;font-weight:600}
.crumb .sep{margin:0 7px;color:#C9CEDC}
.head{display:flex;align-items:center;gap:14px;margin:12px 0 6px}
.head-ic{width:50px;height:50px;border-radius:14px;flex-shrink:0;font-size:24px;
  background:linear-gradient(135deg,#6C63D9,#8F88E8);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 18px rgba(108,99,217,.3)}
h1{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.head-sub{font-size:13px;color:var(--muted);margin-top:2px}

.card{background:var(--card);border-radius:var(--ome-card-r);box-shadow:var(--sh);padding:var(--ome-card-pad);margin-top:var(--ome-card-gap)}
.card h2{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mini{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:2px}

.sumrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.sumbox{background:var(--bg);border-radius:13px;padding:14px 15px}
.sumbox .lbl{font-size:12px;color:var(--muted);font-weight:600}
.sumbox .val{font-size:19px;font-weight:800;margin-top:3px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sumbox .val.up{color:var(--ok)}
.sumbox .val.dn{color:var(--err)}
.sumbox .sub{font-size:11.5px;color:var(--muted);margin-top:2px}

.frow{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:110px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input[type=number],input[type=text],input[type=date],select{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;-webkit-appearance:none}
input[type=date]{color-scheme:light}
[data-theme="dark"] input[type=date]{color-scheme:dark}
input:focus,select:focus{outline:none;border-color:var(--brand)}
[data-theme="dark"] input,[data-theme="dark"] select{background:#12151C}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);
  background:var(--card);border-radius:11px;padding:10px 15px;font-family:inherit;font-size:14px;font-weight:700;
  color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-dk)}
.btn.primary{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.primary:hover{background:#129757;color:#fff}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.danger:hover{background:#C93F44;color:#fff}
.btn.sm{padding:7px 11px;font-size:12.5px}
.status{font-size:12.5px;color:var(--muted);margin-top:9px;min-height:1.2em}
.status.err{color:var(--err)}
.status.ok{color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;font-family:inherit;font-size:13.5px;font-weight:700;padding:9px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:11.5px}
td.up{color:var(--ok);font-weight:700}
td.dn{color:var(--err);font-weight:700}
.tbl-wrap{overflow-x:auto}
.tbl-empty{font-size:13px;color:var(--muted);padding:16px 4px;text-align:center}
.sell-btn{background:none;border:1.5px solid var(--err);color:var(--err);border-radius:8px;padding:4px 9px;
  font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.tx-type{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.tx-type.buy{background:#E9F9F0;color:#0B7F52}
.tx-type.sell{background:#FDECEC;color:#B23838}
[data-theme="dark"] .tx-type.buy{background:#14261E;color:#5EDCAB}
[data-theme="dark"] .tx-type.sell{background:#301B1B;color:#F0A0A0}

.drive-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drive-row .status{margin-top:0}

.disc{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.7;text-align:center}
footer{margin-top:22px;text-align:center;font-size:12.5px;color:#9AA3B8}
footer a{color:var(--sky);text-decoration:none;font-weight:600}
@media(max-width:600px){body.ome-tool-page{padding:0 12px 70px}h1{font-size:18px}}

/* ── เปิดในกรอบป๊อปอัพจาก invest.html (?embed=1) — ซ่อน breadcrumb ซ้ำซ้อน ลด padding บนสุด ── */
body.embedded{padding-top:14px}
body.embedded .crumb{display:none}

.sumbox .lbl-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.edit-ic{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:2px;line-height:1}
.edit-ic:hover{color:var(--brand-dk)}
.cash-edit-row{display:flex;gap:6px;align-items:center;margin-top:4px}
.cash-edit-row input{padding:6px 8px;font-size:14px}
</style>
</head>
<body class="ome-tool-page" data-invest-key="portfolio">
<script src="auth-gate.js"></script>
<div class="wrap">

  <nav class="crumb"><a href="invest.html">การลงทุน</a><span class="sep">/</span>พอร์ตจำลอง</nav>

  <div class="head">
    <div>
      <h1>พอร์ตจำลอง</h1>
    </div>
  </div>

  <!-- สรุปพอร์ต -->
  <div class="card">
    <h2>สรุปพอร์ต</h2>
    <div class="sumrow">
      <div class="sumbox">
        <div class="lbl-row"><span class="lbl">เงินสดคงเหลือ</span><button class="edit-ic" id="cashEditBtn" type="button" aria-label="แก้ไขเงินสด">✎ แก้ไข</button></div>
        <div class="val" id="sCash">—</div>
        <div class="cash-edit-row" id="cashEditRow" style="display:none">
          <input type="number" id="cashEditInput" inputmode="decimal" style="width:100%">
          <button class="btn sm primary" id="cashEditSave" type="button">บันทึก</button>
          <button class="btn sm" id="cashEditCancel" type="button">ยกเลิก</button>
        </div>
      </div>
      <div class="sumbox"><div class="lbl">มูลค่าหุ้นที่ถือ</div><div class="val" id="sHoldVal">—</div></div>
      <div class="sumbox"><div class="lbl">มูลค่าพอร์ตรวม</div><div class="val" id="sTotal">—</div><div class="sub" id="sTotalSub"></div></div>
      <div class="sumbox"><div class="lbl">กำไร/ขาดทุนรวม</div><div class="val" id="sPl">—</div><div class="sub" id="sPlPct"></div></div>
    </div>
    <p style="margin-top:10px"><button class="btn sm" id="resetBtn" type="button">เริ่มพอร์ตใหม่</button></p>
  </div>

  <!-- ซื้อ-ขาย -->
  <div class="card">
    <h2>ซื้อ / ขายหุ้น</h2>
    <div class="tabs" id="tradeTabs">
      <button class="on" data-tab="buy" type="button">ซื้อ</button>
      <button data-tab="sell" type="button">ขาย</button>
    </div>
    <div id="buyPane">
      <div class="frow">
        <div class="field"><label>ชื่อย่อหุ้น</label><input type="text" id="buySym" placeholder="เช่น PTT" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label>จำนวนหุ้น</label><input type="number" id="buyShares" inputmode="numeric" placeholder="เช่น 100"></div>
        <div class="field"><label>วันที่ซื้อ (ย้อนหลังได้)</label><input type="date" id="buyDate"></div>
        <button class="btn primary" id="buyBtn" type="button">ดึงราคา + ซื้อ</button>
      </div>
    </div>
    <div id="sellPane" style="display:none">
      <div class="frow">
        <div class="field" style="flex:2 1 180px"><label>หุ้นที่ถือ</label><select id="sellSym"></select></div>
        <div class="field"><label>จำนวนหุ้น</label><input type="number" id="sellShares" inputmode="numeric" placeholder="เช่น 100"></div>
        <button class="btn danger" id="sellBtn" type="button">ดึงราคา + ขาย</button>
      </div>
    </div>
    <div class="status" id="tradeStatus"></div>
  </div>

  <!-- หุ้นที่ถือ -->
  <div class="card">
    <h2>หุ้นที่ถือ <button class="btn sm" id="refreshBtn" type="button" style="margin-left:auto">รีเฟรชราคา</button></h2>
    <div class="tbl-wrap"><table id="holdTable"></table></div>
    <div id="holdEmpty" class="tbl-empty">ยังไม่มีหุ้นในพอร์ต — ลองซื้อจากด้านบนได้เลย</div>
  </div>

  <!-- ประวัติการซื้อขาย -->
  <div class="card">
    <h2>ประวัติการซื้อขาย</h2>
    <div class="tbl-wrap"><table id="txTable"></table></div>
    <div id="txEmpty" class="tbl-empty">ยังไม่มีรายการ</div>
  </div>

  <!-- สำรองขึ้น Google Drive -->
  <div class="card">
    <h2>สำรองพอร์ตจำลองขึ้น Google Drive</h2>
    <div class="drive-row" style="margin-top:10px">
      <button class="btn sm" id="driveConnectBtn" type="button">เชื่อมต่อ Google Drive</button>
      <span class="status" id="driveStatusTxt"></span>
    </div>
  </div>


</div>

<script src="invest-portfolio.js" defer></script>
</body>
</html>
