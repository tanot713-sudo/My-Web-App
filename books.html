<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หนังสือ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="books-calc.js" defer></script>
<script src="learn-core.js" defer></script>
<script src="books.js" defer></script>
<style>
.bk-page{max-width:980px}
.bk-page .page-head{align-items:center}
.bk-page .page-head h1{flex:1;margin:0}
.bk-page > * + *{margin-top:var(--ome-sp-4)}
.bk-page .kpi-value small{font-size:var(--ome-fs-sm);font-weight:600;color:var(--ome-text-2);margin-left:4px}
.bk-bar{height:8px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.bk-bar > i{display:block;height:100%;border-radius:inherit;background:var(--ome-accent)}
.bk-bar.ok > i{background:var(--ome-ok)}
.bk-book{display:flex;gap:var(--ome-sp-3);padding:var(--ome-sp-3) 0}
.bk-book + .bk-book{border-top:1px solid var(--ome-border)}
.bk-cover{position:relative;flex:0 0 64px;width:64px;height:92px;border-radius:var(--ome-radius-sm);background:var(--ome-surface-2);
  border:1px solid var(--ome-border);display:grid;place-items:center;color:var(--ome-text-3);overflow:hidden}
.bk-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bk-cover .ome-icon{width:24px;height:24px}
.bk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bk-title{font-weight:700;font-size:var(--ome-fs-md);overflow-wrap:anywhere}
.bk-meta{color:var(--ome-text-2);font-size:var(--ome-fs-sm);overflow-wrap:anywhere}
.bk-stars{color:var(--ome-warn);letter-spacing:1px}
.bk-review{font-size:var(--ome-fs-sm);white-space:pre-wrap;overflow-wrap:anywhere}
.bk-acts{display:flex;gap:var(--ome-sp-2);flex-wrap:wrap;margin-top:var(--ome-sp-1)}
.bk-chart{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:140px}
.bk-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:var(--ome-fs-xs);color:var(--ome-text-2)}
.bk-col i{display:block;width:100%;max-width:36px;min-height:2px;border-radius:4px 4px 0 0;background:var(--ome-accent)}
.bk-col.cur i{background:var(--ome-ok)}
.bk-col b{font-weight:600;color:var(--ome-text-1)}
.bk-note{padding:var(--ome-sp-3) 0;display:flex;flex-direction:column;gap:6px}
.bk-note + .bk-note{border-top:1px solid var(--ome-border)}
.bk-quote{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--ome-surface-2);border-radius:var(--ome-radius-md);padding:var(--ome-sp-2) var(--ome-sp-3)}
.bk-sr{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.bk-hit{height:auto;width:100%;justify-content:flex-start;text-align:left;gap:10px;padding:6px}
.bk-hit .bk-cover{flex-basis:36px;width:36px;height:52px}
.bk-hit .bk-cover .ome-icon{width:16px;height:16px}
.bk-dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto}
.bk-dialog .dialog-body > * + *{margin-top:var(--ome-sp-3)}
.bk-msg{color:var(--ome-text-2);font-size:var(--ome-fs-sm)}
.bk-msg:empty{display:none}
.bk-msg.err{color:var(--ome-err-ink)}
.bk-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk-tools .grow{flex:1}
[hidden]{display:none !important}
@media (max-width:480px){.bk-cover{flex-basis:52px;width:52px;height:76px}}
</style>
</head>
<body data-layout="reader">
<main class="page bk-page">
  <div class="page-head">
    <h1 data-i18n="bk.title">หนังสือ</h1>
    <button class="btn primary" type="button" id="addBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="bk.add">เพิ่มหนังสือ</span></button>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" type="button" role="tab" data-tab="shelf" aria-selected="true" data-i18n="bk.tabShelf">ชั้นหนังสือ</button>
    <button class="tab" type="button" role="tab" data-tab="stats" aria-selected="false" data-i18n="bk.tabStats">สถิติ</button>
    <button class="tab" type="button" role="tab" data-tab="notes" aria-selected="false" data-i18n="bk.tabNotes">ไฮไลต์</button>
  </div>

  <section id="paneShelf" class="card">
    <div class="bk-tools"><div class="segmented" id="shelfSeg" role="group" aria-label="ชั้น" data-i18n-attr="aria-label:bk.shelfAria"></div></div>
    <div id="shelf"></div>
  </section>

  <section id="paneStats" hidden class="stack">
    <div class="kpi-grid" id="kpis"></div>
    <div class="card">
      <div class="card-head"><h2 data-i18n="bk.wkTitle">หน้าต่อสัปดาห์</h2></div>
      <div class="bk-chart" id="chart" role="img" aria-label="หน้าต่อสัปดาห์ 8 สัปดาห์ล่าสุด" data-i18n-attr="aria-label:bk.wkAria"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2 data-i18n="bk.goalTitle">เป้าหนังสือปีนี้</h2><select id="goalSel" class="select" aria-label="เป้าเล่มต่อปี" data-i18n-attr="aria-label:bk.goalAria"></select></div>
      <div id="goalBox"></div>
    </div>
    <div class="card">
      <div class="card-head"><h2 data-i18n="bk.logTitle">บันทึกการอ่าน</h2></div>
      <div class="list" id="logList"></div>
    </div>
  </section>

  <section id="paneNotes" hidden class="card">
    <div class="bk-tools">
      <select id="noteBook" class="select grow" aria-label="หนังสือ" data-i18n-attr="aria-label:bk.bookAria"></select>
      <button class="btn" type="button" id="addNote"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-highlighter"/></svg><span data-i18n="bk.addNote">เพิ่มไฮไลต์</span></button>
    </div>
    <div id="noteList"></div>
  </section>
</main>

<dialog class="dialog bk-dialog" id="bdlg" aria-labelledby="bTitleH">
  <form method="dialog" id="bform" novalidate>
    <div class="dialog-head"><h2 id="bTitleH" data-i18n="bk.title">หนังสือ</h2></div>
    <div class="dialog-body">
      <div id="searchBox">
        <div class="field"><label for="sQ" data-i18n="bk.searchLbl">ค้นหาหนังสือ (Open Library)</label>
          <div class="row"><input id="sQ" type="search" maxlength="120" autocomplete="off" style="flex:1"><button class="btn" type="button" id="sGo"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg><span data-i18n="bk.search">ค้นหา</span></button></div>
        </div>
        <p class="bk-msg" id="sMsg" role="status"></p>
        <div class="bk-sr" id="sRes"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="bTitle" data-i18n="bk.titleLbl">ชื่อหนังสือ</label><input id="bTitle" type="text" maxlength="200" autocomplete="off"></div>
        <div class="field"><label for="bAuthor" data-i18n="bk.author">ผู้แต่ง</label><input id="bAuthor" type="text" maxlength="200" autocomplete="off"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="bStatus" data-i18n="bk.shelf">ชั้น</label><select id="bStatus" class="select"><option value="want" data-i18n="bk.want">อยากอ่าน</option><option value="reading" data-i18n="bk.reading">กำลังอ่าน</option><option value="done" data-i18n="bk.done">อ่านจบ</option></select></div>
        <div class="field"><label for="bPages" data-i18n="bk.pages">จำนวนหน้า</label><input id="bPages" type="number" inputmode="numeric" min="0" step="1"></div>
        <div class="field"><label for="bCur" data-i18n="bk.readTo">อ่านถึงหน้า</label><input id="bCur" type="number" inputmode="numeric" min="0" step="1"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="bStart" data-i18n="bk.start">วันเริ่ม</label><input id="bStart" type="date"></div>
        <div class="field"><label for="bEnd" data-i18n="bk.end">วันจบ</label><input id="bEnd" type="date"></div>
        <div class="field"><label for="bRating" data-i18n="bk.rating">คะแนน</label><select id="bRating" class="select"></select></div>
      </div>
      <div class="field"><label for="bReview" data-i18n="bk.review">รีวิวสั้น</label><textarea id="bReview" rows="3" maxlength="1000"></textarea></div>
      <p class="bk-msg err" id="bMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="bDel" style="margin-right:auto" data-i18n="bk.del">ลบ</button>
      <button class="btn" type="button" id="bCancel" data-i18n="bk.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" id="bSave" data-i18n="bk.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog bk-dialog" id="ldlg" aria-labelledby="lTitleH">
  <form method="dialog" id="lform" novalidate>
    <div class="dialog-head"><h2 id="lTitleH" data-i18n="bk.logTitle">บันทึกการอ่าน</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="lDate" data-i18n="bk.date">วันที่</label><input id="lDate" type="date"></div>
        <div class="field"><label for="lPages" data-i18n="bk.lPages">อ่านกี่หน้า</label><input id="lPages" type="number" inputmode="numeric" min="0" step="1"></div>
        <div class="field"><label for="lMin" data-i18n="bk.lMin">กี่นาที</label><input id="lMin" type="number" inputmode="numeric" min="0" step="1"></div>
      </div>
      <div class="field"><label for="lTo" data-i18n="bk.readTo">อ่านถึงหน้า</label><input id="lTo" type="number" inputmode="numeric" min="0" step="1"></div>
      <p class="bk-msg err" id="lMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn" type="button" id="lCancel" data-i18n="bk.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-i18n="bk.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog bk-dialog" id="ndlg" aria-labelledby="nTitleH">
  <form method="dialog" id="nform" novalidate>
    <div class="dialog-head"><h2 id="nTitleH" data-i18n="bk.tabNotes">ไฮไลต์</h2></div>
    <div class="dialog-body">
      <div class="frow">
        <div class="field"><label for="nBookSel" data-i18n="bk.bookAria">หนังสือ</label><select id="nBookSel" class="select"></select></div>
        <div class="field"><label for="nPage" data-i18n="bk.page">หน้า</label><input id="nPage" type="number" inputmode="numeric" min="0" step="1"></div>
      </div>
      <div class="field"><label for="nText" data-i18n="bk.nText">ข้อความ / โน้ต</label><textarea id="nText" rows="5" maxlength="2000"></textarea></div>
      <div class="field"><label for="nQ" data-i18n="bk.nQ">คำถามหน้าการ์ด (ไม่บังคับ)</label><input id="nQ" type="text" maxlength="300" autocomplete="off"></div>
      <p class="bk-msg err" id="nMsg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn" type="button" id="nCancel" data-i18n="bk.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" data-i18n="bk.save">บันทึก</button>
    </div>
  </form>
</dialog>
</body>
</html>
