<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไม่พบหน้า | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<script>
// เส้นทางเก่าที่ไม่มีไฟล์จริงบน GitHub Pages
// เครื่องมือเก่า excel-work / word-work → พาไปหน้าตัวใหม่แบบ standalone
// ที่เหลือ → พากลับหน้าหลัก
(function () {
  var MAP = { 'excel-work': 'excel.html', 'word-work': 'word.html' };
  var m = (location.pathname || '').match(/\/(excel-work|word-work)\/?$/);
  location.replace('/My-Web-App/' + (m ? MAP[m[1]] : ''));
})();
</script>
</head>
<body>
<p style="font-family:sans-serif;text-align:center;margin-top:3em">
ไม่พบหน้านี้ — กำลังพากลับ <a href="/My-Web-App/">หน้าหลัก Tanot</a>
</p>
</body>
</html>
