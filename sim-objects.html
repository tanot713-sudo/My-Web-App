<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จำลองสิ่งของ 3D — จัดผัง/วางอุปกรณ์ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<style>
/* กรอบหน้า (layout=app): แถบเครื่องมือ + วิวพอร์ต 3D ยืดเต็มพื้นที่ซ้าย, คลังของ/วัตถุที่เลือกเลื่อนแยกทางขวา — ตัวฉาก 3D (สีพื้น/วัตถุ) ไม่ผูกกับธีม */
.s3-top{flex:0 0 auto;padding:var(--ome-sp-3) var(--ome-sp-4) 0}
.s3-top .page-head{margin-bottom:0}
.s3-head-ic{width:22px;height:22px;color:var(--ome-accent-strong)}
.s3-work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--ome-sp-3);padding:var(--ome-sp-3) var(--ome-sp-4) var(--ome-sp-4)}
.s3-stage{min-height:0;min-width:0;display:flex;flex-direction:column;margin:0;--ome-card-pad:12px}
.s3-aside{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:var(--ome-sp-3)}
.s3-aside > .card{flex-shrink:0;margin:0}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 var(--ome-sp-3);font-size:var(--ome-fs-base)}

.s3-toolbar{display:flex;flex-wrap:wrap;gap:var(--ome-sp-2);justify-content:space-between;align-items:center;margin-bottom:var(--ome-sp-2);flex-shrink:0}
.s3-tb-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.s3-tb-group .btn .ome-icon{width:15px;height:15px}
.s3-check{display:flex;align-items:center;gap:5px;font-size:var(--ome-fs-xs);color:var(--ome-text-2);font-weight:600;cursor:pointer;user-select:none}
.s3-check input{cursor:pointer;accent-color:var(--ome-accent)}
.s3-viewport{position:relative;width:100%;flex:1 1 0;min-height:320px;border-radius:var(--ome-radius-md);overflow:hidden;
  background:#E7ECF4;border:1px solid var(--ome-border);touch-action:none}
.s3-viewport canvas{display:block;width:100%;height:100%}
.s3-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#6B7690;font-size:var(--ome-fs-sm);font-weight:600;text-align:center;padding:20px;pointer-events:none}
.s3-savebar{margin-top:var(--ome-sp-2);min-height:1.3em;font-size:12px;color:var(--ome-accent-strong);font-weight:700;text-align:right;flex-shrink:0}
.s3-csg-hint{display:none;background:var(--ome-accent-soft);color:var(--ome-accent-strong);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:var(--ome-sp-2);text-align:center;flex-shrink:0}

.s3-cat-group-h{font-size:11.5px;font-weight:700;color:var(--ome-text-2);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 6px}
.s3-cat-group-h:first-child{margin-top:0}
.s3-catalog-row{display:flex;flex-wrap:wrap;gap:7px}
.s3-cat-btn{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:8px 4px;
  border-radius:var(--ome-radius-md);border:1px solid var(--ome-border);background:var(--ome-surface-2);cursor:pointer;
  font:inherit;color:var(--ome-text-1);transition:border-color var(--ome-dur-1),color var(--ome-dur-1)}
.s3-cat-btn:hover{border-color:var(--ome-accent);color:var(--ome-accent-strong)}
.s3-cat-btn .ic{display:grid;place-items:center;height:22px}
.s3-cat-btn .ic .ome-icon{width:22px;height:22px}
.s3-cat-btn .lb{font-size:10.5px;font-weight:600;text-align:center;line-height:1.2}

.s3-insp-row{display:flex;align-items:center;justify-content:space-between;gap:var(--ome-sp-2);padding:8px 0;border-bottom:1px solid var(--ome-border);font-size:var(--ome-fs-sm)}
.s3-insp-row:last-child{border-bottom:none}
.s3-insp-row .lbl{color:var(--ome-text-2);font-weight:700;flex-shrink:0}
.s3-nudge{display:flex;gap:4px;flex-wrap:wrap}
.s3-nudge button{width:32px;height:32px;border-radius:var(--ome-radius-sm);border:1px solid var(--ome-border);background:var(--ome-surface-1);
  cursor:pointer;color:var(--ome-text-1);font:inherit;display:inline-grid;place-items:center;padding:0}
.s3-nudge button:hover{border-color:var(--ome-accent);color:var(--ome-accent-strong)}
.s3-nudge button .ome-icon{width:15px;height:15px}
.s3-nudge button[data-scale]{width:auto;padding:0 8px;font-size:11.5px;font-weight:700}
.s3-nudge .btn.sm{width:auto;padding:0 10px}
.s3-color-row{display:flex;gap:7px;flex-wrap:wrap;padding:9px 0 2px}
.s3-swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--ome-border);cursor:pointer;padding:0}
.s3-swatch.active{border-color:var(--ome-text-1);box-shadow:0 0 0 2px var(--ome-surface-1),0 0 0 3.5px var(--ome-text-1)}
.s3-insp-empty{font-size:var(--ome-fs-sm);color:var(--ome-text-2);padding:4px 0}
.s3-insp-row .lbl.mini-note{font-weight:500;line-height:1.6}
.s3-size-val{font-size:var(--ome-fs-xs);font-weight:700}
.s3-size-row{display:flex;gap:6px;align-items:center;padding:6px 0}
.s3-size-row select{font:inherit;font-size:var(--ome-fs-xs);height:32px;padding:0 8px;border-radius:var(--ome-radius-sm);border:1px solid var(--ome-border);background:var(--ome-surface-1);color:var(--ome-text-1)}
.s3-size-row input[type=number]{font:inherit;font-size:var(--ome-fs-sm);height:32px;padding:0 8px;border-radius:var(--ome-radius-sm);border:1px solid var(--ome-border);
  background:var(--ome-surface-1);color:var(--ome-text-1);width:80px;-webkit-appearance:none}
.s3-size-row :is(select,input[type=number]):focus{outline:none;border-color:var(--ome-accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--ome-accent) 22%, transparent)}
.s3-size-row input[type=range]{accent-color:var(--ome-accent)}

.s3-mymodel-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.s3-mymodel-row{position:relative}
.s3-mymodel-del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--ome-border);
  background:var(--ome-surface-1);color:var(--ome-err);cursor:pointer;display:grid;place-items:center;padding:0}
.s3-mymodel-del .ome-icon{width:11px;height:11px}
.s3-upload-btn{width:100%;border-style:dashed}
.s3-upload-status{display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--ome-fs-xs);color:var(--ome-accent-strong);font-weight:600;
  padding:8px 4px 2px;line-height:1.5;text-align:center}
.dialog-body{white-space:pre-line;color:var(--ome-text-2);font-size:var(--ome-fs-sm);line-height:1.6}

/* จอแคบ (≤1000px): ทั้งหน้าเลื่อนเป็นหน้าเดียว คลังของ/วัตถุที่เลือกเรียงใต้วิวพอร์ต */
@media(max-width:1000px){
  .s3-app{overflow-y:auto;overflow-x:hidden}
  .s3-work{display:block;flex:none}
  .s3-stage{display:block}
  .s3-viewport{flex:none;height:min(62vh,520px)}
  .s3-aside{overflow:visible;margin-top:var(--ome-sp-3)}
}
@media(max-width:600px){
  .s3-top{padding:var(--ome-sp-2) 10px 0}
  .s3-work{padding:var(--ome-sp-2) 10px var(--ome-sp-3)}
  .s3-viewport{height:min(58vh,420px)}
}
</style>
</head>
<body data-layout="app">
<main class="page s3-app">
<div class="s3-top">
  <div class="page-head">
    <svg class="ome-icon s3-head-ic" aria-hidden="true"><use href="icons.svg#i-cuboid"/></svg>
    <h1>จำลองสิ่งของ 3D</h1>
  </div>
</div>

<div class="s3-work">
  <div class="card s3-stage">
    <div class="toolbar s3-toolbar">
      <div class="s3-tb-group">
        <button class="btn sm" data-view="persp" type="button">มุม 3D</button>
        <button class="btn sm" data-view="top" type="button">บนลงล่าง</button>
        <button class="btn sm" data-view="front" type="button">ด้านหน้า</button>
        <button class="btn sm" data-view="side" type="button">ด้านข้าง</button>
      </div>
      <div class="s3-tb-group">
        <label class="s3-check"><input type="checkbox" id="s3Snap" checked> Snap 0.5 ม.</label>
        <button class="btn sm" id="s3Shot" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-camera"/></svg>บันทึกภาพ</button>
        <button class="btn sm" id="s3Clear" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-trash-2"/></svg>ล้างทั้งหมด</button>
      </div>
    </div>
    <div class="toolbar s3-toolbar">
      <div class="s3-tb-group">
        <button class="btn sm" id="s3XformToggle" type="button">ลากปรับ</button>
        <button class="btn sm active" type="button" data-xmode="translate"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-move"/></svg>ย้าย</button>
        <button class="btn sm" type="button" data-xmode="rotate"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-rotate-cw"/></svg>หมุน</button>
        <button class="btn sm" type="button" data-xmode="scale"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-scaling"/></svg>สเกล</button>
      </div>
      <div class="s3-tb-group">
        <button class="btn sm" id="s3CsgStart" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-combine"/></svg>ตัด/รวม 2 ชิ้น</button>
        <button class="btn sm" id="s3CsgCancel" type="button">ยกเลิกโหมด</button>
        <button class="btn sm" id="s3ExportAll" type="button"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-download"/></svg>รวม .stl ทั้งผัง</button>
        <span id="s3ArSlot"></span>
      </div>
    </div>
    <div class="s3-csg-hint" id="s3CsgHint"></div>
    <div id="s3Viewport" class="s3-viewport">
      <div class="s3-loading" id="s3Loading">กำลังโหลด 3D…</div>
    </div>
    <div class="s3-savebar" id="s3SaveBar" role="status"></div>
  </div>

  <div class="s3-aside">
    <div class="card" id="s3InspectorCard" style="display:none">
      <h2>วัตถุที่เลือก</h2>
      <div id="s3InspectorBody"></div>
    </div>

    <div class="card">
      <h2>คลังของสำเร็จรูป</h2>
      <div id="s3CatalogProc"></div>
    </div>

    <div class="card">
      <h2>โมเดลของฉัน</h2>
      <div id="s3CatalogModels"></div>
    </div>
  </div>
</div>
</main>

<dialog class="dialog" id="s3Modal" aria-labelledby="s3ModalTitle">
  <div class="dialog-head"><h2 id="s3ModalTitle"></h2></div>
  <div class="dialog-body" id="s3ModalMsg"></div>
  <div class="dialog-foot" id="s3ModalBtns"></div>
</dialog>

<script src="vendor/gsap.min.js"></script>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/jsm/"}}
</script>
<script type="module" src="sim-objects.js"></script>
<script>
/* วิวพอร์ต 3D ยืดตามพื้นที่ที่เหลือ — เมื่อกล่องเปลี่ยนขนาด ให้ sim-objects.js วัดและวาดใหม่ผ่าน resize ปกติ */
(function () {
  var vp = document.getElementById('s3Viewport');
  if (vp && window.ResizeObserver) new ResizeObserver(function () { window.dispatchEvent(new Event('resize')); }).observe(vp);
})();
</script>
</body>
</html>
