name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check ทุกไฟล์ .js ของเราเอง (ยกเว้น vendor/ ที่เป็นไลบรารีนอก)
        run: |
          status=0
          for f in *.js functions/api/*.js; do
            echo "checking $f"
            node --check "$f" || status=1
          done
          exit $status

  tests:
    # Phase 0b — ชุดทดสอบใน tests/ (มี package.json ของตัวเอง ไม่มีที่ root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # repo-guards ต้องเทียบกับ base commit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: repo-guards (bump CACHE / PRECACHE / ขนาดไฟล์ / languages.compiled.js / credits)
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node repo-guards.mjs
      - run: npx playwright install --with-deps chromium
      - name: smoke (ทุกหน้าในเมนู)
        run: npx playwright test smoke.spec.js
      - name: visual (เทียบ baseline)
        run: npx playwright test visual.spec.js
      - name: ai (/api/ai/* + ai-client + วิดเจ็ตแชท/หน้าสรุป บน Workers AI ตัวหลอก)
        run: npx playwright test ai.spec.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, tests]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
