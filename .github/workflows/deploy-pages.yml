name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --check ทุกไฟล์ .js ของเราเอง (ยกเว้น vendor/ ที่เป็นไลบรารีนอก)
        run: |
          status=0
          for f in *.js functions/api/*.js functions/api/*/*.js functions/_lib/*.js workers/scheduler/*.js workers/scheduler/*.mjs; do
            echo "checking $f"
            node --check "$f" || status=1
          done
          exit $status

  tests:
    # Phase 0b — ชุดทดสอบใน tests/ (มี package.json ของตัวเอง ไม่มีที่ root)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # repo-guards ต้องเทียบกับ base commit
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: repo-guards (bump CACHE / PRECACHE / ขนาดไฟล์ / JSX+Tailwind ของหน้า React ที่คอมไพล์แล้ว / credits)
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node repo-guards.mjs
      - run: npx playwright install --with-deps chromium
      - name: smoke (ทุกหน้าในเมนู)
        run: npx playwright test smoke.spec.js
      - name: visual (เทียบ baseline)
        run: npx playwright test visual.spec.js
      - name: ai (/api/ai/* + ai-client + วิดเจ็ตแชท/หน้าสรุป บน Workers AI ตัวหลอก)
        run: npx playwright test ai.spec.js
      - name: electrical (สูตรเครื่องคำนวณไฟฟ้าเทียบตัวอย่างที่รู้คำตอบ + หน้า electrical.html)
        run: npx playwright test electrical.spec.js
      - name: tax (กฎภาษีแยกปี + สูตรลดหย่อน/เพดานกลุ่มเกษียณ/บำนาญ เทียบตัวเลขคิดมือ + หน้า tax.html)
        run: npx playwright test tax.spec.js
      - name: learn (fsrs.js เทียบโค้ดก่อนแยก, ย้าย XP เดิม, วันติดต่อกัน/วันพัก, ทบทวนวันนี้, ซิงก์ XP 2 เครื่อง)
        run: npx playwright test learn.spec.js
      - name: data + pages (ซิงก์ D1, ย้ายข้อมูลจาก github.io, หน้าวันนี้/ค้นหาด่วน, ประกัน + /api/files)
        run: npx playwright test sync.spec.js migrate.spec.js today.spec.js insurance.spec.js
      - name: maintenance (mnt-calc.js known-answer, QR, หน้าบันทึกงานบำรุงรักษา — ออฟไลน์+รูป R2, ซิงก์ 2 เครื่อง, นำเข้า/ส่งออก Excel, report-dashboard)
        run: npx playwright test maintenance.spec.js
      - name: push (Web Push VAPID/aes128gcm, /api/push/*, การแจ้งเตือนจากหน้าประกัน/ภาษี/บำรุงรักษา, scheduler ตามเวลาไทย + สำรอง D1 → R2, sw.js)
        run: npx playwright test push.spec.js
      - name: health (health-calc.js known-answer, สัญญาณชีพ/กราฟ/ผลตรวจ+ไฟล์ R2/ยา+การแจ้งเตือน, การ์ดหน้าวันนี้, ซิงก์ 2 เครื่อง)
        run: npx playwright test health.spec.js
      - name: receipts (receipts-calc.js known-answer, อ่านใบเสร็จฟรี Tesseract+AI ปลอม — ไม่เรียก /api/ocr ถ้าไม่กดปุ่ม Claude, ส่งเข้า budget ไม่ซ้ำ, ประกันสินค้า+reminders, ป้ายภาษี → หน้าภาษี, ไฟล์ R2, ซิงก์ 2 เครื่อง)
        run: npx playwright test receipts.spec.js
      - name: compare (compare-calc.js known-answer — diff ตาราง/ข้อความไทย/คะแนนราคา, หน้าเทียบตาราง xlsx 2 ไฟล์ + ส่งออก, เทียบ docx, ใบเสนอราคา + ไฟล์ R2 + ซิงก์ 2 เครื่อง, 20,000 แถว)
        run: npx playwright test compare.spec.js
      - name: slides (slides-calc.js known-answer — parse โครงเรื่อง/เลือกแบบสไลด์, หน้าสร้างสไลด์ + AI ปลอมไม่เรียก /api/ocr, ส่งออก pptx แกะด้วย jszip, รูป R2 + ลบชุด DELETE, ซิงก์ 2 เครื่อง, ออฟไลน์)
        run: npx playwright test slides.spec.js
      - name: github-redirect (GitHub Pages แบบ redirect ไป pages.dev)
        run: npx playwright test github-redirect.spec.js
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, tests]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # เว็บจริงอยู่ที่ Cloudflare Pages แล้ว — GitHub Pages เหลือแค่ redirect ไป pages.dev (+ migrate-export.html ที่ยังต้องอ่าน storage ของ github.io)
      - name: Build redirect-only site
        run: node .github/scripts/github-pages-redirect.mjs _site
      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
