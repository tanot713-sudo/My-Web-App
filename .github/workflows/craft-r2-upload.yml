# อัปโหลดไลบรารี *Craft ที่เก็บใน R2 ("store": "r2" ใน vendor/craft/manifest.json — ROADMAP แถว 11f)
# กดเองเท่านั้น (Actions → craft-r2-upload → Run workflow → ใส่ชื่อไลบรารี): build จาก libs.<lib>.build ที่ล็อก commit ต้นทาง
# → เทียบ sha256/ขนาดทุกไฟล์กับ manifest ที่ commit แล้ว (ไม่ตรง = ล้ม ไม่อัปโหลด) → wrangler r2 object put ขึ้น tanot-files/craft/<ชื่อโฟลเดอร์>/
# secret: CLOUDFLARE_API_TOKEN (R2 Object Read & Write เฉพาะ bucket tanot-files) + CLOUDFLARE_ACCOUNT_ID — ใน GitHub Secrets เท่านั้น
# runner build ไม่ไหว (แรม/เวลา) = build บนเครื่องเจ้าของแล้วรัน node tools/wasm/craft-r2.mjs upload <lib> (ตรวจแบบเดียวกัน)
name: craft-r2-upload

on:
  workflow_dispatch:
    inputs:
      lib:
        description: 'ชื่อไลบรารีใน vendor/craft/manifest.json (เช่น solidcraft-app)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: craft-r2-${{ github.event.inputs.lib }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LIB: ${{ github.event.inputs.lib }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: อ่านข้อมูล build จาก manifest
        id: info
        run: |
          node -e '
            const lib = process.env.LIB;
            if (!/^[a-z0-9-]+$/.test(lib)) { console.error("ชื่อไลบรารีไม่ถูกต้อง"); process.exit(1); }
            const L = (require("./vendor/craft/manifest.json").libs || {})[lib];
            if (!L || L.store !== "r2") { console.error("ไม่ใช่ไลบรารี store r2"); process.exit(1); }
            if (!/^tools\/wasm\/[a-z0-9-]+\/build\.sh$/.test(L.build || "")) { console.error("build ไม่ถูกต้อง"); process.exit(1); }
            const wbg = (/(\d+\.\d+\.\d+)/.exec(L.wasmBindgen || "") || [])[1] || "";
            const opt = (/version (\d+)/.exec(L.wasmOpt || "") || [])[1] || "";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `build=${L.build}\nwbg=${wbg}\nopt=${opt}\n`);
          '
      - name: ติดตั้ง wasm-bindgen-cli ตาม manifest
        if: steps.info.outputs.wbg != ''
        run: cargo install wasm-bindgen-cli --version "${{ steps.info.outputs.wbg }}" --locked
      - name: ติดตั้ง wasm-opt (binaryen) ตาม manifest
        if: steps.info.outputs.opt != ''
        run: |
          mkdir -p "$RUNNER_TEMP/binaryen"
          npm install --prefix "$RUNNER_TEMP/binaryen" "binaryen@${{ steps.info.outputs.opt }}.0.0"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen/node_modules/binaryen/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: build
        run: bash "${{ steps.info.outputs.build }}"
      - name: เทียบ sha256 กับ manifest ที่ commit แล้ว
        run: node tools/wasm/craft-r2.mjs verify "$LIB"
      - name: อัปโหลดขึ้น R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/wasm/craft-r2.mjs upload "$LIB"
