<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="receipts.title">คลังใบเสร็จ | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<script src="ai-client.js"></script>
<script src="ocr-vision.js"></script>
<script src="receipts-calc.js" defer></script>
<script src="tanot-push.js" defer></script>
<script src="receipts.js" defer></script>
<style>
.rc-page{max-width:1080px}
.rc-page .stack > .card > .card-head{margin-bottom:var(--ome-sp-3)}
.rc-page .kpi-value{font-size:var(--ome-fs-xl)}
.rc-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--ome-sp-3)}
.rc-filter .input{flex:1 1 200px;min-width:0}
.rc-filter .select{width:auto;flex:0 1 auto}
.rc-list .list-row .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rc-read{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:30px}
.rc-read .msg{font-size:var(--ome-fs-sm);color:var(--ome-text-2)}
.rc-read .msg:empty{display:none}
.rc-dialog .field.warn :is(input,select,textarea){border-color:var(--ome-warn);background:var(--ome-warn-soft)}
.rc-dialog .field.warn label .badge{margin-left:6px}
.rc-view{width:min(860px,calc(100vw - 16px));max-height:calc(100dvh - 16px);overflow:auto}
.rc-view .dialog-body{display:flex;flex-direction:column;gap:var(--ome-sp-3)}
.rc-view img{display:block;max-width:100%;height:auto;border-radius:var(--ome-radius-md);margin:0 auto}
[hidden]{display:none !important}
</style>
</head>
<body data-layout="tool">
<main class="page rc-page">
  <div class="page-head">
    <h1 data-i18n="receipts.h1">คลังใบเสร็จ</h1>
    <button class="btn primary" type="button" id="addBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-plus"/></svg><span data-i18n="receipts.addRec">เพิ่มใบเสร็จ</span></button>
  </div>

  <div class="stack">
    <div class="kpi-grid" id="kpis"></div>

    <section class="card" aria-labelledby="hList">
      <div class="card-head">
        <h2 id="hList" data-i18n="receipts.hList">ใบเสร็จ</h2>
      </div>
      <div class="rc-filter">
        <input class="input" type="search" id="fQ" placeholder="ค้นหาร้าน/สินค้า" aria-label="ค้นหา" data-i18n-attr="placeholder:receipts.phSearch,aria-label:receipts.search" autocomplete="off">
        <select class="select" id="fYear" aria-label="ปี" data-i18n-attr="aria-label:receipts.year"></select>
        <select class="select" id="fTag" aria-label="ป้ายภาษี" data-i18n-attr="aria-label:receipts.taxTag"></select>
        <button class="btn sm" type="button" id="fWar" aria-pressed="false" data-i18n="receipts.withWar">มีประกัน</button>
      </div>
      <div class="rc-list" id="listBody"></div>
    </section>
  </div>
</main>

<dialog class="dialog dialog-form rc-dialog" id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog" id="form" novalidate>
    <div class="dialog-head"><h2 id="dlgTitle">ใบเสร็จ</h2></div>
    <div class="dialog-body">
      <div class="rc-pick">
        <button class="btn sm" type="button" id="camBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-camera"/></svg><span data-i18n="receipts.cam">ถ่ายรูป</span></button>
        <button class="btn sm" type="button" id="fileBtn"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-upload"/></svg><span data-i18n="receipts.file">เลือกไฟล์</span></button>
        <button class="btn sm" type="button" id="claudeBtn" hidden disabled><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-sparkles"/></svg><span data-i18n="receipts.readClaude">อ่านด้วย Claude</span></button>
        <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="fileInput" accept="application/pdf,image/*" multiple hidden>
      </div>
      <div class="rc-read" id="readRow" hidden>
        <span class="badge" id="srcBadge" hidden></span>
        <span class="msg" id="readMsg" role="status"></span>
      </div>
      <div class="file-list" id="fileList"></div>

      <div class="frow">
        <div class="field" data-f="store"><label for="fStore" data-i18n="receipts.store">ร้าน</label><input id="fStore" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field" data-f="date"><label for="fDate" data-i18n="receipts.date">วันที่</label><input id="fDate" type="date"></div>
      </div>
      <div class="frow">
        <div class="field" data-f="total"><label for="fTotal" data-i18n="receipts.total">ยอดรวม (บาท)</label><input id="fTotal" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="fVat" data-i18n="receipts.vat">VAT (บาท)</label><input id="fVat" type="number" inputmode="decimal" min="0" step="any"></div>
        <div class="field"><label for="fTaxId" data-i18n="receipts.taxId">เลขผู้เสียภาษีผู้ขาย</label><input id="fTaxId" type="text" inputmode="numeric" maxlength="17" autocomplete="off"></div>
      </div>
      <label class="check"><input type="checkbox" id="fFull"><span data-i18n="receipts.full">ใบกำกับภาษีเต็มรูป / e-Tax</span></label>
      <div class="field"><label for="fItems" data-i18n="receipts.items">รายการสินค้า</label><textarea id="fItems" rows="3" maxlength="3000"></textarea></div>
      <div class="frow">
        <div class="field"><label for="fProduct" data-i18n="receipts.product">สินค้าที่มีประกัน</label><input id="fProduct" type="text" maxlength="120" autocomplete="off"></div>
        <div class="field"><label for="fMonths" data-i18n="receipts.months">ประกัน (เดือน)</label><input id="fMonths" type="number" inputmode="numeric" min="0" max="600" step="1"></div>
        <div class="field"><label for="fEnd" data-i18n="receipts.warEnd">วันหมดประกัน</label><input id="fEnd" type="text" readonly tabindex="-1"></div>
      </div>
      <div class="frow">
        <div class="field"><label for="fTag2" data-i18n="receipts.tag2">ป้ายลดหย่อนภาษี</label><select id="fTag2"></select></div>
        <div class="field"><label for="fCat" data-i18n="receipts.cat">หมวดรายจ่าย</label><select id="fCat"></select></div>
      </div>
      <div class="field"><label for="fNote" data-i18n="receipts.note">บันทึก</label><textarea id="fNote" rows="2" maxlength="500"></textarea></div>
      <p class="form-msg" id="msg" role="alert"></p>
    </div>
    <div class="dialog-foot">
      <button class="btn danger" type="button" id="delBtn" style="margin-right:auto" data-i18n="receipts.del">ลบ</button>
      <button class="btn" type="button" id="budgetBtn" data-i18n="receipts.toBudget">บันทึกเป็นรายจ่าย</button>
      <button class="btn" type="button" id="cancelBtn" data-i18n="receipts.cancel">ยกเลิก</button>
      <button class="btn primary" type="submit" id="saveBtn" data-i18n="receipts.save">บันทึก</button>
    </div>
  </form>
</dialog>

<dialog class="dialog rc-view" id="viewDlg" aria-labelledby="viewTitle">
  <div class="dialog-head"><h2 id="viewTitle">ใบเสร็จ</h2><button class="btn sm icon ghost" type="button" id="viewClose" aria-label="ปิด" data-i18n-attr="aria-label:receipts.close"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-x"/></svg></button></div>
  <div class="dialog-body" id="viewBody"></div>
</dialog>
</body>
</html>
