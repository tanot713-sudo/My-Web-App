<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>การเขียนโค้ด | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="theme-boot.js"></script>
<script src="data-registry.js"></script>
<script src="tanot-data.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- CodeMirror 5 (ตัวแก้ไขโค้ด) — โหลดผ่าน CDN แบบ global script เหมือนที่หน้าอื่นในเว็บนี้โหลด
     tesseract.js/mammoth/docx — ถ้าโหลดไม่สำเร็จ coding.js จะ fallback ไปใช้ <textarea> ธรรมดาแทน
     โดยอัตโนมัติ (ดูฟังก์ชัน initEditor ใน coding.js) ผู้เรียนยังพิมพ์โค้ด/กดรันได้ปกติ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
/* เฉพาะหน้านี้ — ปุ่ม/การ์ด/ช่องกรอก/crumb/สลับภาษา มาจาก theme.css (data-layout="reader") */
.cx-page{max-width:1160px}
.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:var(--ome-sp-3)}
.crumb-row .crumb{margin-bottom:0}
.cx-head-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--ome-radius-lg);flex-shrink:0;
  background:var(--ome-accent-soft);color:var(--ome-accent-strong)}
.cx-head-icon .ome-icon{width:24px;height:24px}
.cx-page .page-head{margin-bottom:var(--ome-sp-4)}

/* ── แถบเกม: เลเวล/XP/สตรีค/เหรียญตรา ── */
.cx-gamebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:var(--ome-sp-4)}
.cx-level-chip{display:flex;align-items:center;gap:10px;flex:0 1 240px;min-width:180px}
.cx-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--ome-accent);color:var(--ome-on-accent);
  font-weight:700;font-size:var(--ome-fs-base);display:flex;align-items:center;justify-content:center}
.cx-level-info{flex:1;min-width:0}
.cx-level-title{font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:4px}
.cx-xp-track{height:6px;border-radius:var(--ome-radius-pill);background:var(--ome-surface-2);overflow:hidden}
.cx-xp-fill{height:100%;width:0;background:var(--ome-accent);border-radius:inherit;transition:width var(--ome-dur-3) var(--ome-ease)}
.cx-streak-chip{display:flex;align-items:center;gap:5px;font-size:var(--ome-fs-base);font-weight:700;color:var(--ome-warn-ink);
  background:var(--ome-warn-soft);padding:6px 12px;border-radius:var(--ome-radius-pill);flex-shrink:0}
.cx-badge-row{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:140px;padding-left:14px;border-left:1px solid var(--ome-border)}
.cx-badge{width:30px;height:30px;border-radius:var(--ome-radius-md);display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--ome-surface-2);border:1px solid var(--ome-border);opacity:.35;filter:grayscale(1);cursor:default}
.cx-badge.earned{opacity:1;filter:none;background:var(--ome-accent-soft);border-color:var(--ome-accent)}
@media(max-width:600px){.cx-gamebar{flex-direction:column;align-items:stretch}
  .cx-level-chip{flex:none}
  .cx-streak-chip{align-self:flex-start}
  .cx-badge-row{justify-content:center;border-left:0;padding-left:0;padding-top:10px;border-top:1px solid var(--ome-border)}}

.cx-toast-wrap{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:8px;z-index:var(--ome-z-toast);pointer-events:none;max-width:calc(100vw - 40px)}
.cx-toast{background:var(--ome-surface-1);border:1px solid var(--ome-accent);border-radius:var(--ome-radius-md);padding:10px 16px;font-size:var(--ome-fs-sm);
  font-weight:600;box-shadow:var(--ome-shadow-3);display:flex;align-items:center;gap:8px;max-width:280px;animation:cx-toast-in var(--ome-dur-3) var(--ome-ease)}
@keyframes cx-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.cx-toast.leaving{animation:cx-toast-out .3s ease forwards}
@keyframes cx-toast-out{to{transform:translateY(8px);opacity:0}}

.cx-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--ome-card-r);z-index:5}
.cx-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:cx-confetti-fall linear forwards}
@keyframes cx-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.cx-confetti{display:none}.cx-toast{animation:none}}

/* ── เมนูเลือกบทเรียน (แผงเลื่อนลง จัดกลุ่มตามหมวด) ── */
.cx-track-menu{position:relative;margin-bottom:var(--ome-sp-4)}
.cx-track-menu-toggle{gap:10px}
.cx-hamburger-icon{display:flex;flex-direction:column;gap:3.5px;width:18px;flex-shrink:0}
.cx-hamburger-icon span{display:block;height:2.3px;border-radius:2px;background:currentColor;transition:transform var(--ome-dur-2) var(--ome-ease),opacity var(--ome-dur-2)}
.cx-track-menu-toggle.open .cx-hamburger-icon span:nth-child(1){transform:translateY(5.8px) rotate(45deg)}
.cx-track-menu-toggle.open .cx-hamburger-icon span:nth-child(2){opacity:0}
.cx-track-menu-toggle.open .cx-hamburger-icon span:nth-child(3){transform:translateY(-5.8px) rotate(-45deg)}
.cx-track-menu-panel{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:var(--ome-z-popover);min-width:280px;
  max-width:min(420px,calc(100vw - 40px));max-height:70vh;overflow-y:auto;background:var(--ome-surface-1);
  border:1px solid var(--ome-border);border-radius:var(--ome-radius-lg);box-shadow:var(--ome-shadow-3);padding:10px}
.cx-track-menu-panel.open{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.cx-track-group-label{font-size:var(--ome-fs-xs);font-weight:700;letter-spacing:.05em;color:var(--ome-text-2);padding:10px 10px 6px}

/* ── แถบข้างรายการบทเรียน + พื้นที่เนื้อหา ── */
.cx-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
@media(max-width:820px){.cx-layout{grid-template-columns:1fr}}
@media(min-width:821px){.cx-sidebar{position:sticky;top:calc(var(--ome-nav-h) + 16px);max-height:calc(100vh - var(--ome-nav-h) - 32px);overflow-y:auto}}
.cx-item-list{display:flex;flex-direction:column;gap:var(--ome-sp-2)}
.cx-item{gap:8px}
.cx-item .ome-icon{color:var(--ome-text-2)}
.cx-item.active .ome-icon{color:inherit}
.cx-lock-msg{display:none;background:var(--ome-warn-soft);color:var(--ome-warn-ink);border-radius:var(--ome-radius-md);padding:8px 12px;
  font-size:var(--ome-fs-xs);font-weight:600;margin-bottom:8px}
.cx-main{position:relative;padding:22px}
.cx-item-heading{font-size:var(--ome-fs-lg);font-weight:700;margin-bottom:8px;color:var(--ome-accent-strong)}
.cx-instructions{margin-bottom:14px}
.cx-instructions p{margin:0 0 10px}
.cx-instructions p:last-child{margin-bottom:0}
.cx-toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.cx-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:var(--ome-radius-md);font-size:var(--ome-fs-sm);font-weight:600}
.cx-result-banner.pass{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.cx-result-banner.fail{background:var(--ome-warn-soft);color:var(--ome-warn-ink)}
@media(max-width:600px){.cx-main{padding:16px}}

/* ── เฉพาะหน้านี้ ── */
.cx-instructions{white-space:pre-line}
.cx-editor-wrap .CodeMirror{border:1px solid var(--ome-border-strong);border-radius:var(--ome-radius-md);overflow:hidden}
.cx-editor-wrap .CodeMirror{height:220px;font-family:var(--ome-font-mono);font-size:13.5px;background:var(--ome-surface-1);color:var(--ome-text-1)}
.cx-editor-wrap .CodeMirror-gutters{background:var(--ome-surface-2);border-color:var(--ome-border)}
#codeTextarea{height:220px;font-family:var(--ome-font-mono);font-size:13.5px;padding:12px}
.cx-output-section{margin-top:16px}
.cx-output-label{font-size:var(--ome-fs-xs);font-weight:700;color:var(--ome-text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.cx-output-panel{background:var(--ome-surface-2);border-radius:var(--ome-radius-md);padding:12px 14px;min-height:60px;font-family:var(--ome-font-mono);
  font-size:var(--ome-fs-sm);line-height:1.7}
.cx-output-empty{color:var(--ome-text-2);font-style:italic}
.cx-output-line{white-space:pre-wrap;word-break:break-word}
.cx-output-line.err{color:var(--ome-err);font-weight:600}
.cx-html-preview-wrap{display:none;margin-top:16px}
#htmlPreview{width:100%;height:160px;border:1px solid var(--ome-border);border-radius:var(--ome-radius-md);background:white}
.cx-tests-panel{display:none;margin-top:14px}
.cx-test-row{font-size:var(--ome-fs-sm);padding:7px 10px;border-radius:var(--ome-radius-md);margin-bottom:5px;font-weight:600}
.cx-test-row{display:flex;align-items:center;gap:8px}
.cx-test-row.pass{background:var(--ome-ok-soft);color:var(--ome-ok-ink)}
.cx-test-row.fail{background:var(--ome-err-soft);color:var(--ome-err-ink)}
</style>
</head>
<body data-layout="reader">
<main class="page cx-page" id="codingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="area.html?a=work" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbCoding">การเขียนโค้ด</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" data-i18n-skip data-i18n-attr="aria-label:lang.toggle" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="page-head">
  <span class="cx-head-icon"><svg class="ome-icon" aria-hidden="true"><use href="icons.svg#i-code"/></svg></span>
  <h1 data-i18n="pageTitle">การเขียนโค้ด</h1>
</div>

<div class="cx-gamebar card" id="gameBar">
  <div class="cx-level-chip">
    <div class="cx-level-num" id="levelNum">1</div>
    <div class="cx-level-info">
      <div class="cx-level-title" id="levelTitleEl">—</div>
      <div class="cx-xp-track"><div class="cx-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="cx-streak-chip" id="streakChip"><span id="streakCount">0</span></div>
  <div class="cx-badge-row" id="badgeRow"></div>
</div>

<div class="cx-track-menu">
  <button class="btn cx-track-menu-toggle" id="trackMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="cx-hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span id="currentTrackLabel"></span>
  </button>
  <div class="cx-track-menu-panel" id="trackMenuPanel" role="menu"></div>
</div>

<div class="cx-layout">
  <div class="cx-sidebar">
    <div class="cx-lock-msg" id="lockMsg"></div>
    <div class="cx-item-list" id="itemList"></div>
  </div>

  <div class="cx-main card">
    <div class="cx-confetti" id="confettiLayer"></div>
    <div class="cx-item-heading" id="itemHeading"></div>
    <div class="cx-instructions prose" id="instructionsBox" data-i18n-skip></div>

    <div class="cx-editor-wrap" id="editorWrap">
      <textarea id="codeTextarea" class="textarea" spellcheck="false"></textarea>
    </div>

    <div class="cx-toolbar">
      <button class="btn primary" id="runBtn" type="button" data-i18n="runBtn">รัน</button>
      <button class="btn" id="openFullBtn" type="button" style="display:none" data-i18n="openFullBtn">เปิดดูเต็มจอ</button>
    </div>

    <div class="cx-html-preview-wrap" id="htmlPreviewWrap">
      <div class="cx-output-label" data-i18n="previewLabel">พรีวิว</div>
      <iframe id="htmlPreview" sandbox="allow-scripts" title="HTML preview"></iframe>
    </div>

    <div class="cx-output-section" id="outputPanel">
      <div class="cx-output-label" id="outputLabelEl" data-i18n="outputLabel">ผลลัพธ์ (console.log)</div>
      <div class="cx-output-panel" id="outputLog"></div>
    </div>

    <div class="cx-tests-panel" id="testsPanel">
      <div class="cx-output-label" data-i18n="testsLabel">ผลตรวจ</div>
      <div id="testsList"></div>
    </div>

    <div class="cx-result-banner" id="resultBanner"></div>
  </div>
</div>


<div class="cx-toast-wrap" id="toastWrap"></div>
</main>
<script src="learn-core.js"></script>
<script src="coding.js"></script>
</body>
</html>
