<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>การเขียนโค้ด | Tanot</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="shell.js" defer></script>
<!-- CodeMirror 5 (ตัวแก้ไขโค้ด) — โหลดผ่าน CDN แบบ global script เหมือนที่หน้าอื่นในเว็บนี้โหลด
     tesseract.js/mammoth/docx — ถ้าโหลดไม่สำเร็จ coding.js จะ fallback ไปใช้ <textarea> ธรรมดาแทน
     โดยอัตโนมัติ (ดูฟังก์ชัน initEditor ใน coding.js) ผู้เรียนยังพิมพ์โค้ด/กดรันได้ปกติ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css">
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
:root{
  --bg:#F6F7FB; --card:#FFFFFF; --ink:#1F2430; --muted:#727C93; --line:#EAEDF5;
  --cx:#2563EB; --cx-dk:#1E40AF; --cx-sf:#E8EFFE; --cx2:#06B6D4;
  --ok:#17B26A; --err:#E5484D;
  --f:'Prompt',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --r:16px; --sh:0 1px 2px rgba(24,31,54,.05), 0 8px 24px rgba(24,31,54,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);
  line-height:1.7;font-size:15px;font-weight:400;padding:0 20px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto}

.crumb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 0;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{color:var(--cx);text-decoration:none;font-weight:500}
.crumb a:hover{text-decoration:underline}
.crumb span.sep{margin:0 8px;color:#C9CEDC}
.lang-toggle{display:inline-flex;align-items:center;gap:2px;background:var(--line);border:none;border-radius:20px;
  padding:3px;cursor:pointer;font-family:var(--f);flex-shrink:0}
.lang-toggle span{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;color:var(--muted);transition:.15s}
.lang-toggle span.active{background:var(--card);color:var(--cx-dk);box-shadow:0 1px 3px rgba(24,31,54,.08)}

.cx-head{display:flex;align-items:flex-start;gap:16px;margin-top:16px}
.cx-head-icon{width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--cx),var(--cx2));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(37,99,235,.35);
  animation:cx-icon-glow 3.5s ease-in-out infinite}
@keyframes cx-icon-glow{0%,100%{box-shadow:0 8px 22px rgba(37,99,235,.35)}50%{box-shadow:0 8px 26px rgba(6,182,212,.4)}}
.cx-head h1{font-size:clamp(21px,3.6vw,28px);font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--ink),var(--cx-dk));-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}

/* ── Gamification bar: เลเวล/XP/สตรีค/เหรียญตรา — ให้ความรู้สึกเหมือนเล่นเกมตอนฝึกโค้ด ── */
.cx-gamebar{display:flex;align-items:center;gap:14px;margin-top:18px;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;padding:12px 16px;box-shadow:0 2px 8px rgba(24,31,54,.05);flex-wrap:wrap}
.cx-level-chip{display:flex;align-items:center;gap:10px;flex:1;min-width:180px}
.cx-level-num{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--cx),var(--cx2));
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(37,99,235,.3)}
.cx-level-info{flex:1;min-width:0}
.cx-level-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
.cx-xp-track{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.cx-xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cx),var(--cx2));border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cx-streak-chip{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:#B45309;background:#FFF3E0;
  padding:6px 12px;border-radius:20px;flex-shrink:0}
[data-theme="dark"] .cx-streak-chip{background:#3A2C10;color:#F5C36B}
.cx-badge-row{display:flex;gap:5px;flex-wrap:wrap}
.cx-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:var(--bg);border:1.5px solid var(--line);opacity:.35;filter:grayscale(1);transition:.2s;cursor:default}
.cx-badge.earned{opacity:1;filter:none;background:linear-gradient(135deg,var(--cx-sf),var(--card));border-color:var(--cx);
  box-shadow:0 2px 6px rgba(37,99,235,.2)}
@media(max-width:600px){.cx-gamebar{flex-direction:column;align-items:stretch}.cx-badge-row{justify-content:center}}

.cx-toast-wrap{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column-reverse;gap:8px;z-index:200;pointer-events:none;max-width:calc(100vw - 40px)}
.cx-toast{background:var(--card);border:1.5px solid var(--cx);border-radius:12px;padding:10px 16px;font-size:13.5px;
  font-weight:700;color:var(--ink);box-shadow:0 8px 24px rgba(24,31,54,.16);display:flex;align-items:center;gap:8px;
  animation:cx-toast-in .35s cubic-bezier(.2,.8,.2,1);max-width:280px}
@keyframes cx-toast-in{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.cx-toast.leaving{animation:cx-toast-out .3s ease forwards}
@keyframes cx-toast-out{to{transform:translateY(8px);opacity:0}}

.cx-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:var(--r);z-index:5}
.cx-confetti-piece{position:absolute;top:-10px;width:8px;height:8px;border-radius:2px;animation:cx-confetti-fall linear forwards}
@keyframes cx-confetti-fall{to{transform:translateY(260px) rotate(360deg);opacity:0}}

.cx-tabs{display:flex;gap:6px;margin-top:22px;overflow-x:auto;padding-bottom:2px}
.cx-tab{font-family:var(--f);font-size:13px;font-weight:600;padding:9px 14px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.18s cubic-bezier(.2,.8,.2,1);flex-shrink:0}
.cx-tab:hover{border-color:var(--cx);color:var(--cx-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(37,99,235,.14)}
.cx-tab.active{background:linear-gradient(135deg,var(--cx),var(--cx2));color:#fff;border-color:transparent;
  box-shadow:0 6px 16px rgba(37,99,235,.32)}

.cx-layout{display:grid;grid-template-columns:220px 1fr;gap:18px;margin-top:16px;align-items:start}
@media(max-width:820px){.cx-layout{grid-template-columns:1fr}}

.cx-item-list{display:flex;flex-direction:column;gap:6px}
.cx-item{display:flex;align-items:center;gap:8px;font-family:var(--f);text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;color:var(--ink);
  transition:.18s cubic-bezier(.2,.8,.2,1)}
.cx-item:hover{border-color:var(--cx);transform:translateX(3px);box-shadow:0 4px 10px rgba(37,99,235,.1)}
.cx-item.active{border-color:transparent;background:linear-gradient(135deg,var(--cx-sf),var(--card));
  color:var(--cx-dk);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--cx)}
.cx-item.locked{opacity:.55;cursor:not-allowed}
.cx-item.locked:hover{border-color:var(--line);transform:none;box-shadow:none}
.cx-lock-msg{display:none;background:#FFF3E0;color:#9A5A00;border-radius:10px;padding:8px 12px;font-size:12.5px;
  font-weight:600;margin-bottom:8px}
[data-theme="dark"] .cx-lock-msg{background:#3A2C10;color:#F5C36B}

.cx-main{background:var(--card);border-radius:var(--r);box-shadow:0 4px 10px rgba(24,31,54,.06),0 16px 32px rgba(37,99,235,.1);
  padding:22px;position:relative}
.cx-item-heading{font-size:17px;font-weight:800;margin-bottom:8px;color:var(--cx-dk)}
.cx-instructions{font-size:13.5px;color:var(--muted);line-height:1.7;white-space:pre-line;margin-bottom:14px;
  background:var(--bg);border-radius:10px;padding:12px 14px}

.cx-editor-wrap{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.cx-editor-wrap .CodeMirror{height:220px;font-family:var(--mono);font-size:13.5px;background:var(--card);color:var(--ink)}
[data-theme="dark"] .cx-editor-wrap .CodeMirror{background:#171C28}
.cx-editor-wrap .CodeMirror-gutters{background:var(--bg);border-color:var(--line)}
#codeTextarea{width:100%;height:220px;font-family:var(--mono);font-size:13.5px;padding:12px;border:none;
  background:var(--card);color:var(--ink);resize:vertical}

.cx-toolbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:14px;font-weight:600;padding:10px 18px;border:1.5px solid var(--line);
  border-radius:11px;cursor:pointer;background:var(--card);color:var(--ink);transition:.18s cubic-bezier(.2,.8,.2,1)}
.btn:hover:not(:disabled){border-color:var(--cx);color:var(--cx-dk);transform:translateY(-2px);box-shadow:0 6px 14px rgba(37,99,235,.14)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:linear-gradient(135deg,var(--cx),var(--cx2));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(37,99,235,.32)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}

.cx-output-section{margin-top:16px}
.cx-output-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.cx-output-panel{background:var(--bg);border-radius:10px;padding:12px 14px;min-height:60px;font-family:var(--mono);
  font-size:13px;line-height:1.7}
.cx-output-empty{color:var(--muted);font-style:italic}
.cx-output-line{white-space:pre-wrap;word-break:break-word}
.cx-output-line.err{color:var(--err);font-weight:600}

.cx-html-preview-wrap{display:none;margin-top:16px}
#htmlPreview{width:100%;height:220px;border:1.5px solid var(--line);border-radius:10px;background:#fff}

.cx-tests-panel{display:none;margin-top:14px}
.cx-test-row{font-size:13px;padding:7px 10px;border-radius:8px;margin-bottom:5px;font-weight:600}
.cx-test-row.pass{background:#E7F9F0;color:#0F7A4E}
.cx-test-row.fail{background:#FFE9EF;color:#B3325A}
[data-theme="dark"] .cx-test-row.pass{background:#12301F;color:#5EDCA0}
[data-theme="dark"] .cx-test-row.fail{background:#3A1F26;color:#F5A9BE}

.cx-result-banner{display:none;margin-top:14px;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:700}
.cx-result-banner.pass{background:#E7F9F0;color:#0F7A4E}
.cx-result-banner.fail{background:#FFF3E0;color:#9A5A00}
[data-theme="dark"] .cx-result-banner.pass{background:#12301F;color:#5EDCA0}
[data-theme="dark"] .cx-result-banner.fail{background:#3A2C10;color:#F5C36B}

footer{margin-top:36px;text-align:center;font-size:12.5px;color:#9AA3B8}
@media(max-width:600px){body{padding:0 14px 60px}.cx-main{padding:16px}}
</style>
</head>
<body class="ome-tool-page">
<script src="auth-gate.js"></script>
<div class="wrap" id="codingRoot">
<div class="crumb-row">
  <nav class="crumb"><a href="documents.html" data-i18n="crumbResp">งานที่รับผิดชอบ</a><span class="sep">/</span><span data-i18n="crumbCoding">การเขียนโค้ด</span></nav>
  <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language / สลับภาษา">
    <span class="lt-th active" data-lt="th">ไทย</span><span class="lt-en" data-lt="en">EN</span>
  </button>
</div>

<div class="cx-head">
  <div class="cx-head-icon">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M9 6L4 12L9 18" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 6L20 12L15 18" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.3 4.6L10.7 19.4" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/>
    </svg>
  </div>
  <div>
    <h1 data-i18n="pageTitle">การเขียนโค้ด</h1>
  </div>
</div>

<div class="cx-gamebar" id="gameBar">
  <div class="cx-level-chip">
    <div class="cx-level-num" id="levelNum">1</div>
    <div class="cx-level-info">
      <div class="cx-level-title" id="levelTitleEl">—</div>
      <div class="cx-xp-track"><div class="cx-xp-fill" id="xpFill"></div></div>
    </div>
  </div>
  <div class="cx-streak-chip" id="streakChip">🔥 <span id="streakCount">0</span></div>
  <div class="cx-badge-row" id="badgeRow"></div>
</div>

<div class="cx-tabs" id="trackTabs"></div>

<div class="cx-layout">
  <div>
    <div class="cx-lock-msg" id="lockMsg"></div>
    <div class="cx-item-list" id="itemList"></div>
  </div>

  <div class="cx-main">
    <div class="cx-confetti" id="confettiLayer"></div>
    <div class="cx-item-heading" id="itemHeading"></div>
    <div class="cx-instructions" id="instructionsBox"></div>

    <div class="cx-editor-wrap" id="editorWrap">
      <textarea id="codeTextarea" spellcheck="false"></textarea>
    </div>

    <div class="cx-toolbar">
      <button class="btn primary" id="runBtn" type="button" data-i18n="runBtn">▶ รัน</button>
      <button class="btn" id="openFullBtn" type="button" style="display:none" data-i18n="openFullBtn">🔗 เปิดดูเต็มจอ</button>
    </div>

    <div class="cx-html-preview-wrap" id="htmlPreviewWrap">
      <div class="cx-output-label" data-i18n="previewLabel">พรีวิว</div>
      <iframe id="htmlPreview" sandbox="allow-scripts" title="HTML preview"></iframe>
    </div>

    <div class="cx-output-section" id="outputPanel">
      <div class="cx-output-label" id="outputLabelEl" data-i18n="outputLabel">ผลลัพธ์ (console.log)</div>
      <div class="cx-output-panel" id="outputLog"></div>
    </div>

    <div class="cx-tests-panel" id="testsPanel">
      <div class="cx-output-label" data-i18n="testsLabel">ผลตรวจ</div>
      <div id="testsList"></div>
    </div>

    <div class="cx-result-banner" id="resultBanner"></div>
  </div>
</div>


<div class="cx-toast-wrap" id="toastWrap"></div>
</div>
<script src="coding.js"></script>
</body>
</html>
